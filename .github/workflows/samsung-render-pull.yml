name: Update Samsung CA - from Render
on:
  workflow_dispatch:
  schedule:
    - cron: '8 2,8,14,20 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pull Samsung from Render
        run: |
          echo "Waking Render..."
          curl -L -s "https://motel.onrender.com/" -o /tmp/wake --max-time 60 || true
          sleep 10
          
          echo "Fetching m3u8 + xml..."
          curl -L -s -A "Mozilla/5.0" "https://motel.onrender.com/samsung-ca.m3u8" -o samsung-ca.m3u8 --max-time 90
          curl -L -s -A "Mozilla/5.0" "https://motel.onrender.com/samsung-ca.xml" -o samsung-ca.xml --max-time 90
          
          M3U=$(grep -c "#EXTINF" samsung-ca.m3u8 || echo 0)
          XML_SIZE=$(wc -c < samsung-ca.xml || echo 0)
          
          echo "M3U: $M3U channels"
          echo "XML: $XML_SIZE bytes"
          
          if [ "$M3U" -lt 10 ]; then
            echo "M3U too small, abort"
            exit 1
          fi
          
          ls -lh samsung-ca.*
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add samsung-ca.m3u8 samsung-ca.xml -f
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "samsung ca $M3U ch from Render"
          git push
