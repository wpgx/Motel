name: Update Samsung CA - from Render
on:
  workflow_dispatch:
  schedule:
    - cron: '8 2,8,14,20 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pull Samsung from Render
        run: |
          BASE="https://motel-r45n.onrender.com"

          echo "Fetching XML..."
          curl -L -A "Mozilla/5.0" "$BASE/samsung-ca.xml" --max-time 120 -o samsung-ca.xml
          echo "XML: $(grep -c "<channel" samsung-ca.xml) channels"

          echo "Fetching playlist.m3u8 (contains Samsung)..."
          curl -L -A "Mozilla/5.0" "$BASE/playlist.m3u8" --max-time 120 -o /tmp/playlist.m3u8
          
          # Filter playlist to only Samsung CA if possible, or take whole file as samsung-ca
          # Your playlist.m3u8 IS the Samsung CA if that's all you run on Render
          cp /tmp/playlist.m3u8 samsung-ca.m3u8
          
          M3U=$(grep -c "#EXTINF" samsung-ca.m3u8 || echo 0)
          echo "M3U $M3U channels"
          head -n 3 samsung-ca.m3u8

          if [ "$M3U" -lt 10 ]; then
            echo "Still too small - checking /samsung-ca.m3u directly"
            curl -L -A "Mozilla/5.0" "$BASE/samsung-ca.m3u" --max-time 120 -o samsung-ca.m3u8 || true
            M3U=$(grep -c "#EXTINF" samsung-ca.m3u8 || echo 0)
          fi

          ls -lh samsung-ca.*

          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add samsung-ca.m3u8 samsung-ca.xml -f
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "samsung ca $M3U ch from playlist"
          git push
