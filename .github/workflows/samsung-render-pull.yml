name: Update Samsung CA - from Render
on:
  workflow_dispatch:
  schedule:
    - cron: '8 2,8,14,20 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pull Samsung from Render
        run: |
          BASE="https://motel-r45n.onrender.com"
          
          echo "Waking..."
          curl -L -s "$BASE/" --max-time 90 -o /dev/null || true
          sleep 30

          echo "Downloading M3U8..."
          curl -L -A "Mozilla/5.0" "$BASE/samsung-ca.m3u8" --max-time 120 -o /tmp/samsung.m3u8 -w "%{http_code}\n"
          cat /tmp/samsung.m3u8 | head -c 200
          echo ""

          if grep -q '"detail"' /tmp/samsung.m3u8; then
            echo "Got JSON Not Found - Render still waking, retrying..."
            sleep 30
            curl -L -A "Mozilla/5.0" "$BASE/samsung-ca.m3u8" --max-time 120 -o /tmp/samsung.m3u8
          fi

          if grep -q "#EXTM3U" /tmp/samsung.m3u8; then
            mv /tmp/samsung.m3u8 samsung-ca.m3u8
            echo "M3U OK: $(grep -c "#EXTINF" samsung-ca.m3u8) ch"
          else
            echo "M3U failed"
            cat /tmp/samsung.m3u8
            exit 1
          fi

          echo "Downloading XML..."
          curl -L -A "Mozilla/5.0" "$BASE/samsung-ca.xml" --max-time 120 -o samsung-ca.xml
          ls -lh samsung-ca.*

          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add samsung-ca.m3u8 samsung-ca.xml -f
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "samsung ca $(grep -c "#EXTINF" samsung-ca.m3u8) ch"
          git push
