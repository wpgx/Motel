name: Update Samsung CA - from Render
on:
  workflow_dispatch:
  schedule:
    - cron: '10 2,5,8,11,14,17,20,23 * * *'  # 8:10am, 11:10am, 2:10pm, 5:10pm, 8:10pm, 11:10pm, 2:10am, 5:10am CSTT

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Wake Render + wait for guide build
        run: |
          BASE="https://motel-r45n.onrender.com"
          curl -L -A "Mozilla/5.0" "$BASE/" --max-time 30 || true
          echo "Woke Render, waiting 60s for it to build fresh guide..."
          sleep 60

      - name: Pull Samsung from Render
        run: |
          BASE="https://motel-r45n.onrender.com"

          echo "Fetching XML..."
          curl -L -A "Mozilla/5.0" "$BASE/samsung-ca.xml" --max-time 180 -o samsung-ca.xml
          echo "XML: $(grep -c "<programme" samsung-ca.xml) programs / $(grep -c "<channel" samsung-ca.xml) channels"

          echo "Fetching playlist..."
          curl -L -A "Mozilla/5.0" "$BASE/playlist.m3u8" --max-time 120 -o /tmp/playlist.m3u8
          cp /tmp/playlist.m3u8 samsung-ca.m3u8
          
          M3U=$(grep -c "#EXTINF" samsung-ca.m3u8 || echo 0)
          echo "M3U $M3U channels"

          # FAIL if guide too short (means chunk loop not running on Render yet)
          PROG=$(grep -c "<programme" samsung-ca.xml || echo 0)
          if [ "$PROG" -lt 500 ]; then
            echo "Guide too short ($PROG programs) - keeping old file"
            git checkout -- samsung-ca.xml || true
          fi

          ls -lh samsung-ca.*

          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add samsung-ca.m3u8 samsung-ca.xml -f
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "samsung ca $M3U ch / $PROG prog"
          git push
