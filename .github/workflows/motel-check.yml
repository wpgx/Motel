name: motel-check
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python checker_1.py
      - run: |
          git config user.name "auto"
          git config user.email "auto@auto.com"
          git add -f final_60.m3u full_ca_us.m3u
          git diff --staged --quiet || (git commit -m "auto update final_60 + full_ca_us" && git push)
