name: motel-check
on:
  workflow_dispatch:
  schedule:
    - cron: '30 */3 * * *'

concurrency:
  group: motel-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python checker_1.py
      - name: Commit
        run: |
          git config user.name "auto"
          git config user.email "auto@auto.com"
          git add -f final_60.m3u final_60.m3u8 final_60.xml
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "auto update final_60"
          git push
