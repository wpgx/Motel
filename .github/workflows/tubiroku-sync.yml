name: tubiroku-sync
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Grab from Cloudflare
        run: |
          curl -L -o tubiroku.m3u https://tubiroku.donxman.workers.dev/all
          curl -L -o tubiroku.xml https://tubiroku.donxman.workers.dev/epg.xml
          wc -l tubiroku.m3u tubiroku.xml

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sync tubiroku"
          file_pattern: "tubiroku.m3u tubiroku.xml"
