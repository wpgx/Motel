name: Build DCMASTER
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build DCMASTER CA ONLY from abusaeeidx
        run: |
          pip install requests -q
          python3 << 'PY'
          import requests, re, os
          headers={'User-Agent':'Mozilla/5.0'}

          # 1. Your motel Pluto = dctv.m3u8 = 192
          base=open("dctv.m3u8", encoding="utf-8", errors="ignore").read().splitlines()
          print(f"DCTV base: {len([x for x in base if '#EXTINF' in x])}")

          # 2. Use YOUR link + Plex from same repo - these are NOT blocked
          urls=[
            "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/SamsungTVPlus-All.m3u",
            "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/Plex-All.m3u"
          ]
          all_text=""
          for u in urls:
              r=requests.get(u, headers=headers, timeout=60)
              print(f"{u} -> {r.status_code} bytes:{len(r.text)} INF:{r.text.count('#EXTINF')}")
              all_text+=r.text+"\n"

          # 3. Filter Canada ONLY from the ALL files
          # The ALL file marks Canada with: group-title="Canada" or tvg-country="CA" or |CA| or " Canada "
          ca_lines=[]
          cur=""
          ca_count=0
          for line in all_text.splitlines():
              if line.startswith("#EXTINF"):
                  low=line.lower()
                  # KEEP ONLY CANADA
                  is_ca = ("canada" in low) or ('tvg-country="ca"' in low) or ('tvg-country="us;ca"' in low) or ('group-title="canada"' in low) or ('"ca"' in low and "canada" in low) or (' ca |' in low) or ('| ca' in low)
                  # Also Samsung marks CA as "CA - " in title
                  if " ca -" in low or low.strip().endswith(" ca") or 'ca"' in low:
                      is_ca=True
                  # For safety, also check if line has "ca" but not usa/uk
                  # Let's be broad: if canada in line, keep
                  if "canada" in low:
                      is_ca=True
                  # The abusaeeidx files actually have country code in the line, check
                  if not is_ca:
                      # skip non-CA
                      cur=""
                      continue
                  cur=line
                  ca_count+=1
              else:
                  if cur and "http" in line:
                      ca_lines.append(cur)
                      ca_lines.append(line.strip())
                      cur=""

          print(f"Filtered Canada from ALL: {len([x for x in ca_lines if '#EXTINF' in x])} channels")

          # 4. Merge DCTV + filtered CA, dedup
          out=["#EXTM3U"]
          seen=set()
          for l in base:
              if l.startswith("#EXTINF"):
                  seen.add(l.split(",")[-1].lower().strip())
                  out.append(l)
              elif "http" in l:
                  out.append(l.strip())

          added=0
          for i in range(0,len(ca_lines),2):
              if i+1>=len(ca_lines): break
              inf=ca_lines[i]
              url=ca_lines[i+1]
              name=inf.split(",")[-1].lower().strip()
              if name in seen: continue
              seen.add(name)
              out.append(inf)
              out.append(url)
              added+=1

          # renumber
          final=[]
          c=1
          for x in out:
              if x.startswith("#EXTINF"):
                  x=re.sub(r'tvg-chno="[^"]*"', '', x)
                  x=x.replace("#EXTINF:", f'#EXTINF: tvg-chno="{c}" ')
                  c+=1
              final.append(x)

          open("dcmaster.m3u8","w",encoding="utf-8").write("\n".join(final))
          import shutil
          if os.path.exists("dctv.xml"):
              shutil.copy("dctv.xml","dcmaster.xml")
          print(f"FINAL: {len([x for x in final if '#EXTINF' in x])} = {len([x for x in base if '#EXTINF' in x])} DCTV + {added} Samsung/Plex CA filtered")
          PY

      - name: Push
        run: |
          git config user.name "dc-bot"
          git config user.email "bot@github.com"
          git add dcmaster.m3u8 dcmaster.xml
          git commit -m "DCMASTER CA from abusaeeidx" || echo "no change"
          git push
