name: Build DCMASTER
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Build CANADA ONLY
        run: |
          set +e
          echo "DCTV INF: $(grep -c "#EXTINF" dctv.m3u8)"
          curl -L -s -A "Mozilla/5.0" -o /tmp/s.m3u "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/SamsungTVPlus-All.m3u"
          curl -L -s -A "Mozilla/5.0" -o /tmp/p.m3u "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/Plex-All.m3u"
          curl -L -s -A "Mozilla/5.0" -o /tmp/s.xml "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/SamsungTVPlus-All.xml"
          curl -L -s -A "Mozilla/5.0" -o /tmp/p.xml "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/Plex-All.xml"
          if [ ! -s /tmp/s.xml ]; then curl -L -s -o /tmp/s.xml "https://i.mjh.nz/SamsungTVPlus/all.xml"; fi
          if [ ! -s /tmp/p.xml ]; then curl -L -s -o /tmp/p.xml "https://i.mjh.nz/Plex/all.xml"; fi

