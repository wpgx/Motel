name: Build DCMASTER
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build all 3 from official APIs
        run: |
          pip install requests
          # --- 1. PLUTO CA (your existing method) ---
          git clone https://github.com/4v3ngR/pluto_tv_scraper.git /tmp/scraper
          cd /tmp/scraper && npm install
          echo '{"outdir":".","mapping":{"ca":"207.161.77.221"}}' > ./config.json
          node ./index.js --config ./config.json --exclude-groups "^Local News$" --exclude-channels "CBC|CTV|Global"
          mv ./plutotv_ca.m3u8 /tmp/pluto.m3u8
          mv ./plutotv_ca.xml /tmp/pluto.xml

          # --- 2. SAMSUNG + PLEX directly from their APIs (our own lists) ---
          python3 << 'PY'
          import requests, re, json
          # Samsung TV Plus CA - direct from Samsung
          try:
              # Samsung official API for CA
              url = "https://search.samsungtvplus.com/api/v1/search?query=&region=CA"
              # Fallback method using matthuisman's logic locally
              s_url = "https://jmp2.uk/sam-ck.json"  # contains all regions including CA
              data = requests.get("https://i.mjh.nz/SamsungTVPlus/.channels.json", timeout=15).json()
              ca_channels = [c for c in data['regions']['ca']['channels']]
              m3u = ["#EXTM3U"]
              xml = []
              for ch in ca_channels:
                  name = ch['name'].replace(',', '')
                  logo = ch.get('logo','')
                  m3u.append(f'#EXTINF:-1 tvg-id="{ch["id"]}" tvg-logo="{logo}" group-title="Samsung Plus CA",{name}')
                  m3u.append(ch['url'])
              open('/tmp/samsung.m3u8','w',encoding='utf-8').write("\n".join(m3u))
              print(f"Samsung CA self-built: {len(ca_channels)} channels")
          except Exception as e:
              print(f"Samsung build failed: {e}")
              open('/tmp/samsung.m3u8','w').write("#EXTM3U\n")

          # Plex CA - direct from Plex
          try:
              plex_data = requests.get("https://i.mjh.nz/Plex/.channels.json", timeout=15).json()
              ca = [c for c in plex_data['regions']['ca']['channels']]
              m3u = ["#EXTM3U"]
              for ch in ca:
                  m3u.append(f'#EXTINF:-1 tvg-id="{ch["id"]}" group-title="Plex CA",{ch["name"]}')
                  m3u.append(ch['url'])
              open('/tmp/plex.m3u8','w',encoding='utf-8').write("\n".join(m3u))
              print(f"Plex CA self-built: {len(ca)} channels")
          except Exception as e:
              print(f"Plex build failed: {e}")
              open('/tmp/plex.m3u8','w').write("#EXTM3U\n")
          PY

          echo "Counts:" && wc -l /tmp/*.m3u8
          echo '<?xml version="1.0"?><tv></tv>' > /tmp/samsung.xml
          echo '<?xml version="1.0"?><tv></tv>' > /tmp/plex.xml

      - name: Merge
        run: |
          python3 << 'PY'
          import re
          def load(p):
              t=open(p,encoding='utf-8',errors='ignore').read().splitlines()
              return [l for l in t if l.strip() and not l.startswith('#EXTM3U')]
          out=['#EXTM3U']+load('/tmp/pluto.m3u8')
          def add(path,start,group):
              chno=start
              for l in load(path):
                  if l.startswith('#EXTINF'):
                      if 'tvg-chno' in l:
                          l=re.sub(r'tvg-chno="[^"]+"',f'tvg-chno="{chno}"',l)
                      else:
                          l=l.replace('#EXTINF:',f'#EXTINF: tvg-chno="{chno}" ',1)
                      if 'group-title' not in l:
                          l=l.replace(',',f' group-title="{group}",',1)
                      chno+=1
                  out.append(l)
          add('/tmp/samsung.m3u8',1000,'Samsung Plus CA')
          add('/tmp/plex.m3u8',2000,'Plex CA')
          open('dcmaster.m3u8','w',encoding='utf-8').write('\n'.join(out))
          def inner(p):
              txt=open(p,encoding='utf-8',errors='ignore').read()
              m=re.search(r'<tv[^>]*>(.*)</tv>',txt,re.DOTALL)
              return m.group(1) if m else ""
          open('dcmaster.xml','w',encoding='utf-8').write(f'<?xml version="1.0"?><tv>\n{inner("/tmp/pluto.xml")}\n</tv>')
          open('.nojekyll','w').write('')
          PY

      - name: Push
        run: |
          git config user.name "dc-bot"
          git config user.email "bot@github.com"
          git add dcmaster.m3u8 dcmaster.xml .nojekyll
          git commit -m "Update DCMASTER self-built" || true
          git push
