name: dcmaster
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build DCMASTER - Plex TV ID fix only
        run: |
          python3 << 'PY'
          import os, gzip, re

          def load_m3u(p):
              ch=[]
              for i,l in enumerate(open(p,encoding='utf-8',errors='ignore').read().splitlines()):
                  if l.startswith('#EXTINF'):
                      nxt=open(p,encoding='utf-8',errors='ignore').read().splitlines()[i+1] if i+1 < len(open(p).read().splitlines()) else ''
                      # simpler
              # redo properly
              lines=open(p,encoding='utf-8',errors='ignore').read().splitlines()
              out=[]
              for i,line in enumerate(lines):
                  if line.startswith('#EXTINF') and i+1 < len(lines):
                      u=lines[i+1].strip()
                      if u.startswith('http'): out.append((line,u))
              return out

          def extract_tv(path):
              if not path or not os.path.exists(path): return ''
              if path.endswith('.gz'): t=gzip.open(path,'rt',encoding='utf-8',errors='ignore').read()
              else:
                  with open(path,'rb') as fb: is_gz=fb.read(3)==b'\x1f\x8b\x08'
                  if is_gz: t=gzip.open(path,'rt',encoding='utf-8',errors='ignore').read()
                  else: t=open(path,encoding='utf-8',errors='ignore').read()
              m=re.search(r'<tv[^>]*>(.*)</tv>',t,flags=re.I|re.S)
              return m.group(1) if m else t

          def find_m3u(b):
              for e in ['.m3u8','.m3u']:
                  if os.path.exists(b+e): return b+e
              return None
          def find_xml(b):
              if os.path.exists(b+'.xml'): return b+'.xml'
              if os.path.exists(b+'.xml.gz'): return b+'.xml.gz'
              return None

          merged=[]
          xml_body=''

          # PLEX FIRST - NO PREFIX
          pm=find_m3u('plex-ca')
          px=find_xml('plex-ca')
          if pm: merged.extend(load_m3u(pm))
          if px: xml_body+=extract_tv(px)+'\n'
          print(f"plex: {len(merged)}")

          # DCFULL SECOND - WITH dc- PREFIX FIX
          dm=find_m3u('dcfull')
          dx=find_xml('dcfull')
          if dm:
              raw=load_m3u(dm)
              fixed=[]
              for extinf,url in raw:
                  if 'tvg-id="dc-' not in extinf and 'tvg-id="plex' not in extinf and 'tvg-id="' in extinf:
                      extinf=extinf.replace('tvg-id="','tvg-id="dc-')
                  fixed.append((extinf,url))
              merged.extend(fixed)
              print(f"dcfull: {len(fixed)}")
          if dx:
              xt=extract_tv(dx)
              xt=re.sub(r'<channel id="(?!dc-|plex-)', '<channel id="dc-', xt)
              xt=re.sub(r' channel="(?!dc-|plex-)', ' channel="dc-', xt)
              xt=xt.replace('dc-dc-','dc-')
              xml_body+=xt+'\n'

          # TUBIROKU if exists - no fix
          tm=find_m3u('tubiroku')
          tx=find_xml('tubiroku')
          if tm: merged.extend(load_m3u(tm))
          if tx: xml_body+=extract_tv(tx)+'\n'

          xml_body=re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;|#\d+;|#x[0-9a-fA-F]+;)','&amp;',xml_body)

          m3u_out='#EXTM3U url-tvg="https://motel.deecee.ca/dcmaster.xml"\n' + '\n'.join(f"{a}\n{b}" for a,b in merged) + '\n'
          open('dcmaster.m3u8','w',encoding='utf-8').write(m3u_out)
          open('dcmaster.m3u','w',encoding='utf-8').write(m3u_out)
          open('dcmaster.xml','w',encoding='utf-8').write(f'<?xml version="1.0"?>\n<tv>\n{xml_body}\n</tv>\n')
          print(f"FINAL {len(merged)}")
          PY
      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f dcmaster2.* DCmaster.* *.gz -f || true
          git add dcmaster.m3u8 dcmaster.m3u dcmaster.xml -f
          git diff --cached --quiet || (git commit -m "dcmaster: plex TV ID fix only - xml only" && git push)
