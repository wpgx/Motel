name: dcmaster
on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dcmaster - keep original categories
        run: |
          python3 << 'PY'
          def parse(path):
              try:
                  lines=open(path,encoding='utf-8',errors='ignore').read().splitlines()
              except:
                  return []
              out=[]
              for i,l in enumerate(lines):
                  if l.startswith("#EXTINF"):
                      url = lines[i+1].strip() if i+1 < len(lines) else ""
                      if url.startswith("http"):
                          out.append((l,url))
              return out

          seen=set()
          merged=[]
          for f in ["samsung-ca.m3u","tubiroku.m3u","pluto.m3u"]:
              for extinf,url in parse(f):
                  if url not in seen:
                      seen.add(url)
                      merged.append((extinf,url))

          with open("dcmaster.m3u","w",encoding="utf-8") as o:
              o.write("#EXTM3U\n")
              for e,u in merged:
                  o.write(f"{e}\n{u}\n")

          # xml merge - keep all guides
          import re
          def inner(f):
              try:
                  t=open(f,encoding='utf-8',errors='ignore').read()
                  m=re.search(r'<tv[^>]*>(.*)</tv>', t, re.S)
                  return m.group(1) if m else ""
              except: return ""
          combined = inner("samsung-ca.xml") + inner("tubiroku.xml") + inner("pluto.xml")
          open("dcmaster.xml","w",encoding="utf-8").write(f'<?xml version="1.0" encoding="UTF-8"?><tv>\n{combined}\n</tv>')
          print(f"Total unique: {len(seen)}")
          PY

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build dcmaster"
          file_pattern: "dcmaster.m3u dcmaster.xml"
