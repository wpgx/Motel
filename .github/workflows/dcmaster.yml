name: dcmaster
on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dcmaster.m3u8
        run: |
          python3 << 'PY'
          def parse(path):
              try:
                  lines=open(path,encoding='utf-8',errors='ignore').read().splitlines()
              except:
                  return []
              out=[]
              for i,l in enumerate(lines):
                  if l.startswith("#EXTINF"):
                      url = lines[i+1].strip() if i+1 < len(lines) else ""
                      if url.startswith("http"):
                          out.append((l,url))
              return out

          seen=set()
          merged=[]
          for f in ["dcfull.m3u8","tubiroku.m3u"]:
              for extinf,url in parse(f):
                  if url not in seen:
                      seen.add(url)
                      merged.append((extinf,url))

          with open("dcmaster.m3u8","w",encoding="utf-8") as o:
              o.write("#EXTM3U\n")
              for e,u in merged:
                  o.write(f"{e}\n{u}\n")

          import re
          def inner(f):
              try:
                  t=open(f,encoding='utf-8',errors='ignore').read()
                  m=re.search(r'<tv[^>]*>(.*)</tv>', t, re.S)
                  return m.group(1) if m else ""
              except: return ""
          combined = inner("dcfull.xml") + inner("tubiroku.xml")
