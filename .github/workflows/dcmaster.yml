original dc master

name: dcmaster

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build DCMASTER
        run: |
          python3 << 'PY'
          import os
          import gzip
          import shutil
          import re

          # ============================================================
          # FIND ONE PLAYLIST PER SOURCE
          # Prefer .m3u8, then .m3u.
          # Never load both copies.
          # ============================================================

          def find_m3u(base):
              if os.path.exists(base + '.m3u8'):
                  return base + '.m3u8'

              if os.path.exists(base + '.m3u'):
                  return base + '.m3u'

              return None

          # ============================================================
          # FIND ONE GUIDE PER SOURCE
          # Prefer normal XML, then .xml.gz.
          # ============================================================

          def find_xml(base):
              if os.path.exists(base + '.xml'):
                  return base + '.xml'

              if os.path.exists(base + '.xml.gz'):
                  return base + '.xml.gz'

              return None

          # ============================================================
          # LOAD M3U
          # ============================================================

          def load_m3u(path):
              channels = []

              try:
                  with open(
                      path,
                      encoding='utf-8',
                      errors='ignore'
                  ) as f:
                      lines = f.read().splitlines()

                  for i, line in enumerate(lines):
                      if line.startswith('#EXTINF') and i + 1 < len(lines):
                          url = lines[i + 1].strip()

                          if url.startswith('http'):
                              channels.append((line, url))

                  print(
                      f"M3U: {path} -> "
                      f"{len(channels)} channels"
                  )

              except Exception as e:
                  print(f"M3U ERROR: {path}: {e}")

              return channels

          # ============================================================
          # LOAD XML
          #
          # Handles both normal XML and XML.GZ.
          # Plex CA can therefore still be used while its guide remains
          # compressed.
          # ============================================================

          def load_xml(path):
              try:
                  if path.endswith('.gz'):
                      print(f"Decompressing: {path}")

                      with gzip.open(
                          path,
                          'rt',
                          encoding='utf-8',
                          errors='ignore'
                      ) as f:
                          text = f.read()
                  else:
                      with open(
                          path,
                          encoding='utf-8',
                          errors='ignore'
                      ) as f:
                          text = f.read()

                  # Remove XML declaration.
                  text = re.sub(
                      r'<\?xml[^?]*\?>',
                      '',
                      text,
                      flags=re.I
                  )

                  # Remove DOCTYPE.
                  text = re.sub(
                      r'<!DOCTYPE[^>]*>',
                      '',
                      text,
                      flags=re.I
                  )

                  # Extract contents inside <tv>...</tv>.
                  start = re.search(
                      r'<tv[^>]*>',
                      text,
                      flags=re.I
                  )

                  end = re.search(
                      r'</tv\s*>',
                      text,
                      flags=re.I
                  )

                  if start and end:
                      text = text[
                          start.end():end.start()
                      ]

                  # Fix bare ampersands so the final combined XML
                  # remains valid.
                  text = re.sub(
                      r'&(?!amp;|lt;|gt;|quot;|apos;|#\d+;|#x[0-9a-fA-F]+;)',
                      '&amp;',
                      text
                  )

                  print(
                      f"XML: {path} -> "
                      f"{len(text)} chars, "
                      f"{text.count('<channel ')} channels, "
                      f"{text.count('<programme')} programmes"
                  )

                  return text

              except Exception as e:
                  print(f"XML ERROR: {path}: {e}")
                  return ''

          # ============================================================
          # BUILD M3U
          #
          # IMPORTANT:
          # NO CHANNEL DEDUPLICATION.
          # DCCATALOG handles the replacement/drop logic.
          # ============================================================

          merged = []

          for source in [
              'dcfull',
              'plex-ca',
              'tubiroku'
          ]:

              path = find_m3u(source)

              if not path:
                  print(
                      f"WARNING: No M3U found for {source}"
                  )
                  continue

              merged.extend(
                  load_m3u(path)
              )

          print(
              f"TOTAL M3U CHANNELS: {len(merged)}"
          )

          # ============================================================
          # DCMaster EPG URL
          #
          # IMPORTANT:
          # Use normal XML, NOT .xml.gz.
          # ============================================================

          m3u_content = (
              '#EXTM3U url-tvg="https://motel.deecee.ca/dcmaster.xml"\n'
              +
              '\n'.join(
                  f'{extinf}\n{url}'
                  for extinf, url in merged
              )
              +
              '\n'
          )

          with open(
              'dcmaster.m3u8',
              'w',
              encoding='utf-8'
          ) as f:
              f.write(m3u_content)

          with open(
              'dcmaster.m3u',
              'w',
              encoding='utf-8'
          ) as f:
              f.write(m3u_content)

          # ============================================================
          # BUILD COMBINED XML
          #
          # NO CHANNEL DEDUPLICATION.
          # NO PROGRAMME DEDUPLICATION.
          #
          # Each source guide is included once.
          # ============================================================

          xml_parts = []

          for source in [
              'dcfull',
              'plex-ca',
              'tubiroku'
          ]:

              path = find_xml(source)

              if not path:
                  print(
                      f"WARNING: No XML guide found for {source}"
                  )
                  continue

              part = load_xml(path)

              if part:
                  xml_parts.append(part)

          final_xml = (
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<tv>\n'
              +
              ''.join(xml_parts)
              +
              '\n</tv>\n'
          )

          with open(
              'dcmaster.xml',
              'w',
              encoding='utf-8'
          ) as f:
              f.write(final_xml)

          # ============================================================
          # CREATE COMPRESSED COPY
          # ============================================================

          with open(
              'dcmaster.xml',
              'rb'
          ) as source_file:

              with gzip.open(
                  'dcmaster.xml.gz',
                  'wb'
              ) as gzip_file:

                  shutil.copyfileobj(
                      source_file,
                      gzip_file
                  )

          # ============================================================
          # FINAL REPORT
          # ============================================================

          print('')
          print('==========================================')
          print('DCMASTER BUILD COMPLETE')
          print('==========================================')
          print(
              f'M3U channels:   {len(merged)}'
          )
          print(
              f'XML channels:   {final_xml.count("<channel ")}'
          )
          print(
              f'XML programmes: {final_xml.count("<programme ")}'
          )
          print(
              f'XML size:       {len(final_xml)} bytes'
          )
          print(
              'EPG URL:        https://motel.deecee.ca/dcmaster.xml'
          )
          print('==========================================')
          PY

      - name: Validate
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxml2-utils

          echo "===== VALIDATING DCMaster XML ====="
          xmllint --noout dcmaster.xml
          echo "dcmaster.xml OK"

          echo "===== VALIDATING GZIP COPY ====="
          gzip -t dcmaster.xml.gz
          echo "dcmaster.xml.gz OK"

          echo "===== FINAL COUNTS ====="
          echo "M3U channels: $(grep -c '^#EXTINF' dcmaster.m3u8)"
          echo "XML channels: $(grep -c '<channel ' dcmaster.xml)"
          echo "XML programmes: $(grep -c '<programme ' dcmaster.xml)"

      - name: Push to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            dcmaster.m3u8 \
            dcmaster.m3u \
            dcmaster.xml \
            dcmaster.xml.gz \
            -f

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "fix dcmaster EPG handling"
          git push
