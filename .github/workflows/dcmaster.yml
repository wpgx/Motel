name: Build DCMASTER
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build DCMASTER CA ONLY - Samsung ALL + Plex ALL
        run: |
          pip install requests -q
          python3 << 'PY'
          import re, os, requests
          h={'User-Agent':'Mozilla/5.0'}

          # 1. Your DCTV
          base=open("dctv.m3u8", encoding="utf-8", errors="ignore").read().splitlines()
          print(f"DCTV: {len([x for x in base if '#EXTINF' in x])}")

          # 2. Download both ALL files (we KNOW curl works, use requests now)
          urls=[
            "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/SamsungTVPlus-All.m3u",
            "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/Plex-All.m3u"
          ]

          extra=[]
          for url in urls:
              r=requests.get(url, headers=h, timeout=60)
              print(f"{url} -> {r.status_code} INF:{r.text.count('#EXTINF')}")
              lines=r.text.splitlines()
              for i in range(len(lines)):
                  line=lines[i]
                  if not line.startswith("#EXTINF"):
                      continue
                  # *** THIS IS THE KEY - Canada = channel-id="CA ***
                  if 'channel-id="CA' in line:
                      extra.append(line)
                      if i+1 < len(lines) and "http" in lines[i+1]:
                          extra.append(lines[i+1].strip())

          print(f"Canada extracted (channel-id=\"CA): {len([x for x in extra if '#EXTINF' in x])}")

          # 3. Merge with DCTV
          out=[]
          seen=set()
          for l in base:
              if l.startswith("#EXTINF"):
                  seen.add(l.split(",")[-1].lower().strip())
              if l.strip() and not l.startswith("#EXTM3U"):
                  out.append(l)

          added=0
          for i in range(0, len(extra), 2):
              if i+1 >= len(extra): break
              inf=extra[i]
              u=extra[i+1]
              name=inf.split(",")[-1].lower().strip()
              if name in seen or not name:
                  continue
              seen.add(name)
              out.append(inf)
              out.append(u)
              added+=1

          # Renumber and save as dcmaster.m3u8 + xml
          final=["#EXTM3U"]
          c=1
          for x in out:
              if x.startswith("#EXTINF"):
                  x=re.sub(r'tvg-chno="[^"]*"', '', x)
                  x=x.replace("#EXTINF:", f'#EXTINF: tvg-chno="{c}" ')
                  c+=1
              final.append(x)

          open("dcmaster.m3u8","w",encoding="utf-8").write("\n".join(final))
          import shutil
          if os.path.exists("dctv.xml"):
              shutil.copy("dctv.xml","dcmaster.xml")

          total=len([x for x in final if '#EXTINF' in x])
          print(f"FINAL dcmaster.m3u8 + dcmaster.xml: {total} = {len([x for x in base if '#EXTINF' in x])} DCTV + {added} Samsung+Plex CA")
          PY

      - name: Push
        run: |
          git config user.name "dc-bot"
          git config user.email "bot@github.com"
          git add dcmaster.m3u8 dcmaster.xml
          git commit -m "DCMASTER CA - channel-id CA filter" || echo "no change"
          git push
