          def get_ca(inp, out):
              try:
                  txt=open(inp,encoding="utf-8",errors="ignore").read().splitlines()
              except:
                  return 0
              res=[]
              for i,l in enumerate(txt):
                  if not l.startswith("#EXTINF"): continue
                  low=l.lower()
                  if 'channel-id="ca' in low or 'group-title="canada"' in low:
                      res.append(l)
                      if i+1 < len(txt) and txt[i+1].strip().startswith("http"):
                          res.append(txt[i+1].strip())
              open(out,"w",encoding="utf-8").write("\n".join(res))
              c=len([x for x in res if "#EXTINF" in x])
              print(f"{inp} CA={c}")
              return c

          s=get_ca("/tmp/s.m3u","/tmp/s-ca.m3u")
          p=get_ca("/tmp/p.m3u","/tmp/p-ca.m3u")
          print(f"Extra CA total {s+p}")

