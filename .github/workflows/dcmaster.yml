name: Build DCMASTER
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Pluto + Samsung + Plex locally
        run: |
          # --- PLUTO CA with your IP mapping ---
          git clone https://github.com/4v3ngR/pluto_tv_scraper.git /tmp/scraper
          cd /tmp/scraper && npm install
          echo '{"outdir":".","mapping":{"ca":"207.161.77.221"}}' > ./config.json
          node ./index.js --config ./config.json --exclude-groups "^Local News$" --exclude-channels "CBC|CTV|Global"
          mv ./plutotv_ca.m3u8 /tmp/pluto.m3u8
          mv ./plutotv_ca.xml /tmp/pluto.xml

          # --- SAMSUNG CA + PLEX CA - built locally using iptv-org database (never blocked) ---
          pip install requests
          python3 << 'PY'
          import requests
          # Samsung CA and Plex CA from iptv-org (raw github, always works in Actions)
          samsung_url = "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ca_samsung.m3u"
          plex_url = "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ca_plex.m3u"
          # Fallbacks if those exact files moved
          fallback_samsung = "https://iptv-org.github.io/iptv/countries/ca.m3u"
          try:
              r = requests.get(samsung_url, timeout=20)
              if r.status_code != 200 or len(r.text) < 100:
                  raise Exception("no ca_samsung")
              open('/tmp/samsung.m3u8','w',encoding='utf-8').write(r.text)
          except:
              # use Free-TV list filtered for samsung
              r = requests.get("https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8", timeout=20)
              open('/tmp/samsung.m3u8','w',encoding='utf-8').write(r.text)
          try:
              r = requests.get(plex_url, timeout=20)
              if r.status_code != 200 or len(r.text) < 100:
                  raise Exception("no ca_plex")
              open('/tmp/plex.m3u8','w',encoding='utf-8').write(r.text)
          except:
              r = requests.get("https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8", timeout=20)
              open('/tmp/plex.m3u8','w',encoding='utf-8').write(r.text)
          print("Samsung + Plex fetched")
          PY
          
          echo "Pluto:" && wc -l /tmp/pluto.m3u8
          echo "Samsung:" && wc -l /tmp/samsung.m3u8
          echo "Plex:" && wc -l /tmp/plex.m3u8
          echo '<?xml version="1.0"?><tv></tv>' > /tmp/samsung.xml
          echo '<?xml version="1.0"?><tv></tv>' > /tmp/plex.xml

      - name: Merge to DCMASTER
        run: |
          python3 << 'PY'
          import re
          def load_m3u(path):
              txt = open(path,encoding='utf-8',errors='ignore').read().splitlines()
              return [l for l in txt if l.strip() and not l.startswith('#EXTM3U')]
          pluto = load_m3u('/tmp/pluto.m3u8')
          samsung = load_m3u('/tmp/samsung.m3u8')
          plex = load_m3u('/tmp/plex.m3u8')
          out = ['#EXTM3U']
          out += pluto
          def add_with_offset(lines, start_chno, group_name):
              chno = start_chno
              for line in lines:
                  if line.startswith('#EXTINF'):
                      if 'tvg-chno' in line:
                          line = re.sub(r'tvg-chno="[^"]+"', f'tvg-chno="{chno}"', line)
                      else:
                          line = line.replace('#EXTINF:', f'#EXTINF: tvg-chno="{chno}" ',1)
                      if 'group-title' not in line:
                          line = line.replace(',', f' group-title="{group_name}",',1)
                      chno+=1
                  out.append(line)
              return chno
          add_with_offset(samsung, 1000, "Samsung Plus CA")
          add_with_offset(plex, 2000, "Plex CA")
          open('dcmaster.m3u8','w',encoding='utf-8').write('\n'.join(out))
          def inner(path):
              txt = open(path,encoding='utf-8',errors='ignore').read()
              m = re.search(r'<tv[^>]*>(.*)</tv>', txt, re.DOTALL)
              return m.group(1) if m else ""
          combined = f'<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n{inner("/tmp/pluto.xml")}\n</tv>'
          open('dcmaster.xml','w',encoding='utf-8').write(combined)
          open('.nojekyll','w').write('')
          print(f"Built with {len(out)} lines total")
          PY

      - name: Push files
        run: |
          git config user.name "dc-bot"
          git config user.email "bot@github.com"
          git add dcmaster.m3u8 dcmaster.xml .nojekyll
          git commit -m "Update DCMASTER" || true
          git push
