name: Build DCMaster
on:
  workflow_dispatch:
  schedule:
    - cron: '20 2,5,8,11,14,17,20,23 * * *'
concurrency:
  group: dcmaster
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build dcmaster
        run: |
          python3 - << 'PY'
          import re, requests, shutil, gzip
          from pathlib import Path

          m3u = ['#EXTM3U url-tvg="https://motel.deecee.ca/dcmaster.xml"']
          seen_urls = set()
          cnum = 1

          def add_playlist(url, source_name):
              global cnum
              print(f"Fetching {source_name}...", flush=True)
              try:
                  r = requests.get(url, timeout=90, headers={"User-Agent":"Mozilla/5.0"})
                  r.raise_for_status()
                  lines = r.text.splitlines()
                  added = 0
                  for i, line in enumerate(lines):
                      if not line.startswith("#EXTINF"):
                          continue
                      next_url = lines[i+1].strip() if i+1 < len(lines) else ""
                      if not next_url.startswith("http") or next_url in seen_urls:
                          continue
                      # Keep original group-title, don't overwrite!
                      if 'tvg-chno=' in line:
                          line = re.sub(r'tvg-chno="[^"]+"', f'tvg-chno="{cnum}"', line)
                      else:
                          line = line.replace('#EXTINF:-1', f'#EXTINF:-1 tvg-chno="{cnum}"', 1)

                      # keep tvg-id if missing
                      if 'tvg-id=' not in line:
                          clean = re.sub(r'[^a-z0-9]', '', line.rsplit(',',1)[-1].lower())[:20]
                          line = line.replace('#EXTINF:-1', f'#EXTINF:-1 tvg-id="{source_name}.{clean}"', 1)

                      m3u.append(line)
                      m3u.append(next_url)
                      seen_urls.add(next_url)
                      cnum+=1
                      added+=1
                  print(f" -> {source_name} added {added}", flush=True)
              except Exception as e:
                  print(f" -> {source_name} FAILED: {e}", flush=True)

          # === SOURCES - REAL CATEGORIES KEPT ===
          add_playlist("https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/PlutoTV/US.m3u8", "pluto")
          add_playlist("https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/SamsungTVPlus/US.m3u8", "samsung")
          add_playlist("https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/Plex/US.m3u8", "plex")
          add_playlist("https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/Tubi/US.m3u8", "tubi")
          add_playlist("https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/Roku/US.m3u8", "roku")
          add_playlist("https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/Stirr/US.m3u8", "stirr")

          # Optional: add your other sources here if you had them
          # add_playlist("https://raw.githubusercontent.com/Drewski2222/... ", "other")

          text = "\n".join(m3u)
          Path("dcmaster.m3u8").write_text(text, encoding='utf-8')
          Path("dcmaster.m3u").write_text(text, encoding='utf-8')
          print(f"\nDCMaster built: {len(seen_urls)} channels", flush=True)

          # Build a combined EPG from matthuisman if you don't have your own
          # You had dcmaster.xml before, we will just merge the 3 main xmltvs
          epg_urls = [
              "https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/PlutoTV/xmltv.xml",
              "https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/SamsungTVPlus/xmltv.xml",
              "https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/Tubi/xmltv.xml",
              "https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/Roku/xmltv.xml",
          ]
          # For now just keep your existing dcmaster.xml if it exists, or fetch one as placeholder
          # so your DCcatalog xml step doesn't break
          if not Path("dcmaster.xml").exists():
              try:
                  r = requests.get(epg_urls[0], timeout=90)
                  Path("dcmaster.xml").write_bytes(r.content)
              except:
                  Path("dcmaster.xml").write_text("<tv></tv>", encoding='utf-8')

          # gzip
          with open("dcmaster.xml","rb") as f_in:
              with gzip.open("dcmaster.xml.gz","wb") as f_out:
                  shutil.copyfileobj(f_in, f_out)

          PY
          ls -lh dcmaster.*

      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add dcmaster.m3u8 dcmaster.m3u dcmaster.xml dcmaster.xml.gz -f
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "dcmaster: keep real Tubi/Roku categories"
          git push
