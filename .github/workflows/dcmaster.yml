name: Build DCMASTER

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build DCMASTER
        run: |
          python3 << 'PY'
          import os, re, requests, shutil

          def load(f):
              if not os.path.exists(f): return []
              lines=open(f,encoding='utf-8',errors='ignore').read().splitlines()
              pairs=[]
              for i,l in enumerate(lines):
                  if l.startswith('#EXTINF'):
                      url=lines[i+1] if i+1 < len(lines) else ""
                      if url.startswith('http'):
                          pairs.append((l,url))
              return pairs

          def safe_inner(path):
              if not os.path.exists(path): return ""
              txt=open(path,encoding='utf-8',errors='ignore').read()
              if "<tv>" in txt:
                  txt=txt.split("<tv>")[-1].split("</tv>")[0]
              return re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;|#\d+;)','&amp;',txt)

          # M3U - keep your exact structure
          dcfull = load('dcfull.m3u8') or load('dcfull.m3u')
          plex = load('plex-ca.m3u8') or load('plex-ca.m3u')
          tubi = load('tubiroku.m3u8') or load('tubiroku.m3u')

          # remote roku optional
          roku=[]
          try:
              r=requests.get("https://raw.githubusercontent.com/iptv-org/iptv/master/streams/us_roku.m3u",timeout=20)
              if r.ok:
                  open("_roku.m3u","w",encoding="utf-8").write(r.text)
                  roku=load('_roku.m3u')
          except: pass

          merged = dcfull + plex + tubi + roku
          print(f"DCFULL {len(dcfull)} + PLEX {len(plex)} + TUBI {len(tubi)} + ROKU {len(roku)} = {len(merged)}")

          out=['#EXTM3U url-tvg="https://motel.deecee.ca/dcmaster.xml"']
          for inf,url in merged:
              out.append(inf)
              out.append(url)
          content="\n".join(out)+"\n"
          open('dcmaster.m3u8','w',encoding='utf-8').write(content)
          open('dcmaster.m3u','w',encoding='utf-8').write(content)

          # XML - SAFE MERGE
          dcfull_xml=safe_inner('dcfull.xml')
          plex_xml=safe_inner('plex-ca.xml')
          tubi_xml=safe_inner('tubiroku.xml')

          # roku extra channels from m3u
          roku_extra=""
          seen_xml = dcfull_xml+plex_xml+tubi_xml
          for inf,url in roku:
              m=re.search(r'tvg-id="([^"]+)"',inf)
              if not m: continue
              tid=m.group(1)
              if tid in seen_xml: continue
              dname=re.search(r',(.+)$',inf)
              dname=dname.group(1) if dname else tid
              dname=re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;|#\d+;)','&amp;',dname)
              roku_extra+=f'<channel id="{tid}"><display-name>{dname}</display-name></channel>\n'

          open('dcmaster.xml','w',encoding='utf-8').write(
            f'<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n{dcfull_xml}\n{plex_xml}\n{tubi_xml}\n{roku_extra}\n</tv>\n'
          )

          print(f"XML written - dcfull:{len(dcfull_xml)} plex:{len(plex_xml)} tubi:{len(tubi_xml)}")
          PY

      - name: Check
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxml2-utils
          echo "M3U channels:"
          grep -c '^#EXTINF:' dcmaster.m3u8 || echo 0
          echo "XML channels:"
          grep -c '<channel ' dcmaster.xml || echo 0
          echo "XML programmes:"
          grep -c '<programme ' dcmaster.xml || echo 0
          xmllint --noout dcmaster.xml && echo "dcmaster.xml OK" || (echo "BROKEN" && exit 1)

      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add dcmaster.m3u8 dcmaster.m3u dcmaster.xml -f
          git diff --cached --quiet && exit 0
          git commit -m "dcmaster: dcfull+plex+tubi+roku safe merge"
          git push
