          def extract_ca(input_path, output_path):
              try:
                  with open(input_path, encoding="utf-8", errors="ignore") as f:
                      lines=f.read().splitlines()
              except:
                  return 0
              out=[]
              for i in range(len(lines)):
                  line=lines[i]
                  if not line.startswith("#EXTINF"):
                      continue
                  low=line.lower()
                  is_ca = (
                      'channel-id="ca' in low or
                      'tvg-id="ca' in low or
                      'group-title="canada"' in low or
                      'tvg-country="ca' in low
                  )
                  if is_ca:
                      out.append(line)
                      if i+1 < len(lines) and lines[i+1].strip().startswith("http"):
                          out.append(lines[i+1].strip())
              open(output_path,"w",encoding="utf-8").write("\n".join(out))
              c=len([x for x in out if '#EXTINF' in x])
              print(f"{input_path} -> CA: {c}")
              return c

          s=extract_ca("/tmp/samsung.m3u", "/tmp/samsung-ca.m3u")
          p=extract_ca("/tmp/plex.m3u", "/tmp/plex-ca.m3u")
          print(f"Total CA extra: {s+p}")

          # Build m3u8
