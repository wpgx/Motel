name: dcmaster
on:
  schedule: [{ cron: '30 */6 * * *' }]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 << 'PY'
          import re, requests, shutil
          def load_blocks(text):
              blocks=[]; cur=[]
              for l in text.replace("\r","").split("\n"):
                  l=l.strip()
                  if not l: continue
                  if l.startswith("#EXTINF"):
                      if cur: blocks.append(cur)
                      cur=[l]
                  elif l.startswith("http"):
                      cur.append(l); blocks.append(cur); cur=[]
              return blocks

          dcfull_raw = open("dcfull.m3u8",encoding='utf-8',errors='ignore').read()
          m = re.search(r'#EXTM3U[^\n]*url-tvg="([^"]+)"', dcfull_raw)
          dcfull_epgs = m.group(1) if m else "https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/PlutoTV/us.xml"
          dcfull_blocks = load_blocks(dcfull_raw)

          tubi_txt = requests.get("https://tubiroku.donxman.workers.dev/", headers={"User-Agent":"Mozilla/5.0"}, timeout=30).text
          tubi_blocks = load_blocks(tubi_txt)

          # Roku on Git - GitHub IP not blocked in Actions
          roku_blocks=[]
          for src in [
            "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/us_roku.m3u",
            "https://raw.githubusercontent.com/Drewski2423/onlineTV/master/Roku/RokuChannel.m3u8"
          ]:
              try:
                  r=requests.get(src, headers={"User-Agent":"Mozilla/5.0"}, timeout=20)
                  if r.ok and "#EXTINF" in r.text:
                      tmp = load_blocks(r.text)
                      if len(tmp)>10:
                          roku_blocks = tmp
                          break
              except: pass

          final=[]
          final.extend(dcfull_blocks)

          chno=5000
          for b in tubi_blocks:
              b[0]=re.sub(r'tvg-chno="[^"]*"','',b[0])
              if 'group-title="Tubi"' not in b[0]:
                  b[0]=re.sub(r'group-title="[^"]*"','',b[0])
                  b[0]=b[0].replace("#EXTINF:-1", '#EXTINF:-1 group-title="Tubi"',1)
              b[0]=b[0].replace("#EXTINF:-1", f'#EXTINF:-1 tvg-chno="{chno}"',1)
              final.append(b); chno+=1

          chno=6000
          for b in roku_blocks:
              orig_match = re.search(r'tvg-id="([^"]+)"', b[0])
              orig_id = orig_match.group(1) if orig_match and orig_match.group(1) else ""
              if not orig_id:
                  name = b[0].split(",")[-1].strip()
                  orig_id = "roku." + re.sub(r'[^a-z0-9]+','-', name.lower()).strip("-")
                  b[0]=re.sub(r'tvg-id="[^"]*"','',b[0])
                  b[0]=b[0].replace("#EXTINF:-1", f'#EXTINF:-1 tvg-id="{orig_id}"',1)
              b[0]=re.sub(r'tvg-chno="[^"]*"','',b[0])
              b[0]=re.sub(r'group-title="[^"]*"','',b[0])
              b[0]=b[0].replace("#EXTINF:-1", f'#EXTINF:-1 group-title="Roku" tvg-chno="{chno}"',1)
              final.append(b); chno+=1

          # Keep dcfull original EPGs + add tubiroku
          full_epg_list = dcfull_epgs
          if "tubiroku.donxman.workers.dev/tubiroku.xml" not in full_epg_list:
              full_epg_list += ",https://tubiroku.donxman.workers.dev/tubiroku.xml"
          if "tubiroku.donxman.workers.dev/epg.xml" not in full_epg_list:
              full_epg_list += ",https://tubiroku.donxman.workers.dev/epg.xml"

          with open("dcmaster.m3u8","w",encoding="utf-8") as o:
              o.write(f'#EXTM3U url-tvg="{full_epg_list}"\n')
              for b in final:
                  o.write(b[0]+"\n"+b[-1]+"\n")
          shutil.copy("dcmaster.m3u8","dcmaster.m3u")

          # BUILD dcmaster.xml with Roku guide
          try:
              pluto = requests.get("https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/PlutoTV/us.xml", timeout=30).text
              try:
                  tubi_epg = requests.get("https://tubiroku.donxman.workers.dev/tubiroku.xml", headers={"User-Agent":"Mozilla/5.0"}, timeout=30).text
              except:
                  tubi_epg = ""
              if "<tv" not in tubi_epg:
                  tubi_epg = requests.get("https://tubiroku.donxman.workers.dev/epg.xml", headers={"User-Agent":"Mozilla/5.0"}, timeout=30).text

              extra=""
              for b in roku_blocks:
                  m=re.search(r'tvg-id="([^"]+)"',b[0])
                  tid=m.group(1) if m else ""
                  name=b[0].split(",")[-1].strip()
                  if tid and tid not in tubi_epg and tid not in pluto:
                      extra+=f'<channel id="{tid}"><display-name>{name}</display-name></channel><programme start="20260101000000 +0000" stop="20261231235959 +0000" channel="{tid}"><title>{name}</title><desc>Live on Roku Channel</desc></programme>'

              inner = tubi_epg.split("<tv>")[-1].split("</tv>")[0] if "<tv>" in tubi_epg else ""
              inner = inner.replace('<?xml version="1.0" encoding="UTF-8"?>','')
              merged = pluto.replace("</tv>", inner + extra + "</tv>")
              open("dcmaster.xml","w",encoding="utf-8").write(merged)
              print("dcmaster.xml built with Roku guide")
          except Exception as e:
              print(f"epg failed {e}")
              try:
                  open("dcmaster.xml","w",encoding="utf-8").write(tubi_epg)
              except: pass

          print(f"built {len(final)}: dcfull {len(dcfull_blocks)}, Tubi {len(tubi_blocks)}, Roku {len(roku_blocks)}")
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "dcmaster: preserve dcfull EPGs + Roku guide in dcmaster.xml"
          file_pattern: "dcmaster.m3u8 dcmaster.m3u dcmaster.xml"
