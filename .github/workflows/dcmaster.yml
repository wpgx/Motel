name: Build DCMASTER
on:
  workflow_dispatch:
  schedule:
    - cron: '35 2,5,8,11,14,17,20,23 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build DCMASTER
        run: |
          python3 << 'PY'
          import re, os
          def load(f):
              if not os.path.exists(f): return []
              lines=open(f,encoding='utf-8',errors='ignore').read().splitlines()
              pairs=[]
              for i,l in enumerate(lines):
                  if l.startswith('#EXTINF'):
                      nxt=lines[i+1] if i+1 < len(lines) else ""
                      if nxt.startswith('http'):
                          pairs.append((l,nxt))
              print(f"{f}: {len(pairs)} ch")
              return pairs

          def get_group(inf):
              m=re.search(r'group-title=["\']([^"\']+)["\']',inf,re.I)
              return m.group(1).lower() if m else ""

          # MASTER = DCFULL + anything else you want
          # DCFULL already is pluto + samsung-ca
          # Add more here if you have them: samsung-us.m3u8, etc
          sources = ['dcfull.m3u8']
          # optional extras - will be added if they exist
          for extra in ['samsung-us.m3u8','roku.m3u8','plex.m3u8']:
              if os.path.exists(extra):
                  sources.append(extra)

          seen=set()
          merged=[]
          for f in sources:
              for inf,url in load(f):
                  if url not in seen:
                      seen.add(url)
                      merged.append((inf,url))

          # keep All -> Fav -> rest order from dcfull
          all_ch = [p for p in merged if 'all channel' in get_group(p[0])]
          favs = [p for p in merged if 'favor' in get_group(p[0])]
          rest = [p for p in merged if p not in all_ch and p not in favs]
          ordered = all_ch + favs + rest

          out=['#EXTM3U url-tvg="https://motel.deecee.ca/dcmaster.xml"']
          for inf,url in ordered:
              out.append(inf)
              out.append(url)

          open('dcmaster.m3u8','w',encoding='utf-8').write("\n".join(out)+"\n")
          open('dcmaster.m3u','w',encoding='utf-8').write("\n".join(out)+"\n")
          print(f"DCMASTER: {len(ordered)} ch")

          # xml merge all
          channels={}
          progs=[]
          for xf in ['dcfull.xml','pluto.xml','samsung-ca.xml','samsung-us.xml','roku.xml','plex.xml']:
              if not os.path.exists(xf): continue
              txt=open(xf,encoding='utf-8',errors='ignore').read()
              for m in re.finditer(r'<channel id="([^"]+)".*?</channel>', txt, re.DOTALL):
                  channels[m.group(1)]=m.group(0)
              for m in re.finditer(r'<programme.*?</programme>', txt, re.DOTALL):
                  progs.append(m.group(0))
          with open('dcmaster.xml','w',encoding='utf-8') as o:
              o.write('<?xml version="1.0"?>\n<tv>\n')
              for c in channels.values(): o.write(c+"\n")
              for p in progs: o.write(p+"\n")
              o.write('</tv>\n')
          PY
      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add dcmaster.m3u8 dcmaster.m3u dcmaster.xml -f
          git diff --cached --quiet && exit 0
          git commit -m "dcmaster $(grep -c "#EXTINF" dcmaster.m3u8) ch"
          git push
