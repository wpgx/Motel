name: Build DCMASTER
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Build dcmaster.m3u8 + dcmaster.xml - CANADA ONLY
        run: |
          set +e
          echo "=== DCTV ==="
          echo "DCTV INF: $(grep -c "#EXTINF" dctv.m3u8)"

          # 1. Download ALL m3u with curl (works)
          curl -L -s -A "Mozilla/5.0" -o /tmp/samsung.m3u "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/SamsungTVPlus-All.m3u"
          curl -L -s -A "Mozilla/5.0" -o /tmp/plex.m3u "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/Plex-All.m3u"

          # 2. Download EPGs with curl
          curl -L -s -A "Mozilla/5.0" -o /tmp/samsung.xml "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/SamsungTVPlus-All.xml"
          curl -L -s -A "Mozilla/5.0" -o /tmp/plex.xml "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/Plex-All.xml"
          # Fallback EPGs if his xml doesn't exist
          if [! -s /tmp/samsung.xml ]; then curl -L -s -A "Mozilla/5.0" -o /tmp/samsung.xml "https://i.mjh.nz/SamsungTVPlus/all.xml"; fi
          if [! -s /tmp/plex.xml ]; then curl -L -s -A "Mozilla/5.0" -o /tmp/plex.xml "https://i.mjh.nz/Plex/all.xml"; fi

          python3 << 'PY'
