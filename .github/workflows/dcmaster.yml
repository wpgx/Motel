name: Build DCMASTER
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download BOTH files (no filter yet)
        run: |
          curl -L -A "Mozilla/5.0" -o /tmp/samsung.m3u "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/SamsungTVPlus-All.m3u"
          curl -L -A "Mozilla/5.0" -o /tmp/plex.m3u "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/Plex-All.m3u"
          
          echo "Samsung size:" $(wc -l < /tmp/samsung.m3u) "INF:" $(grep -c "#EXTINF" /tmp/samsung.m3u)
          echo "Plex size:" $(wc -l < /tmp/plex.m3u) "INF:" $(grep -c "#EXTINF" /tmp/plex.m3u)
          echo "First 3 Canada lines in Samsung:"
          grep -i "canada" /tmp/samsung.m3u | head -3
          echo "First 3 INF lines in Samsung:"
          grep "#EXTINF" /tmp/samsung.m3u | head -3

          # Merge DCTV + both files (NO filter)
          cat dctv.m3u8 > dcmaster.m3u8
          cat /tmp/samsung.m3u | grep -v "#EXTM3U" >> dcmaster.m3u8
          cat /tmp/plex.m3u | grep -v "#EXTM3U" >> dcmaster.m3u8
          
          echo "FINAL dcmaster.m3u8 INF:" $(grep -c "#EXTINF" dcmaster.m3u8)
          
          cp dctv.xml dcmaster.xml || echo "no xml"

      - name: Push
        run: |
          git config user.name "dc-bot"
          git config user.email "bot@github.com"
          git add dcmaster.m3u8 dcmaster.xml
          git commit -m "TEST NO FILTER - 5000+ channels" || echo "no change"
          git push
