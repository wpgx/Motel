name: Build DCMASTER
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        run: |
          pip install requests
          git clone https://github.com/4v3ngR/pluto_tv_scraper.git /tmp/scraper
          cd /tmp/scraper && npm install
          echo '{"outdir":".","mapping":{"ca":"207.161.77.221"}}' >./config.json
          node./index.js --config./config.json --exclude-groups "News|Local|Weather" --exclude-channels "CBC|CTV|Global|CBS News|NBC News|ABC News|Newsmax|Court TV"
          mv./plutotv_ca.m3u8 /tmp/pluto.m3u8
          mv./plutotv_ca.xml /tmp/pluto.xml
          cp /tmp/pluto.m3u8 $GITHUB_WORKSPACE/motel.m3u8
          cp /tmp/pluto.xml $GITHUB_WORKSPACE/motel.xml
          echo "Motel: $(grep -c EXTINF /tmp/pluto.m3u8) channels"

          python3 << 'PY'
          import requests
          headers={"User-Agent":"Mozilla/5.0"}
          urls = [
              "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/SamsungTVPlus-All.m3u",
              "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/Plex-All.m3u"
          ]
          combined=[]
          for u in urls:
              r=requests.get(u,headers=headers,timeout=30)
              if r.status_code==200:
                  combined+=r.text.splitlines()
                  print(f"OK {u} {len(r.text.splitlines())} lines")
              else:
                  print(f"FAIL {u} {r.status_code}")

          clean=[]
          keep=False
          for line in combined:
              if not line.strip(): continue
              if line.startswith('#EXTINF'):
                  low=line.lower()
                  is_us_ca = False
                  if 'tvg-country=' in low:
                      if '"us"' in low or "'us'" in low or '"ca"' in low or "'ca'" in low or 'us;ca' in low or 'ca;us' in low or 'us,ca' in low or 'ca,us' in low:
                          is_us_ca=True
                  if not is_us_ca:
                      if any(x in low for x in ['(us)', '(ca)', '[us]', '[ca]', ' usa ', ' canada ', 'united states']):
                          is_us_ca=True
                  # If no country tag at all, keep it (most Samsung All entries have no tag but are US)
                  if not is_us_ca and 'tvg-country=' not in low:
                      is_us_ca=True

                  if is_us_ca:
                      clean.append(line)
                      keep=True
                  else:
                      keep=False
              else:
                  if not keep: continue
                  if line.startswith('#'):
                      clean.append(line)
                  else:
                      if 'http' not in line.lower():
                          keep=False
                          continue
                      clean.append(line)
                      keep=False

          open('/tmp/samsungplex.m3u8','w',encoding='utf-8').write("\n".join(clean))
          print(f"Filtered USA+CA: {sum(1 for l in clean if 'EXTINF' in l)} channels")
          PY

      - name: Merge
        run: |
          python3 << 'PY'
          import re
          def load(p):
              try:
                  t=open(p,
