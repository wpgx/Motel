name: FIX NESTED FOLDERS
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Fix nested bomb
        run: |
          mkdir -p /tmp/save
          # save the 4 real yml files if they exist
          cp .github/workflows/*.yml /tmp/save/ 2>/dev/null || true
          # find and save from nested if top level was empty
          find .github -name "*.yml" -exec cp {} /tmp/save/ \; 2>/dev/null || true
          # NUKE everything nested
          rm -rf .github/workflows
          rm -rf .github
          mkdir -p .github/workflows
          # restore only the 4 clean files
          cp /tmp/save/dcmaster.yml .github/workflows/ 2>/dev/null || true
          cp /tmp/save/motel-check.yml .github/workflows/ 2>/dev/null || true
          cp /tmp/save/pluto.yml .github/workflows/ 2>/dev/null || true
          cp /tmp/save/restore.yml .github/workflows/ 2>/dev/null || true
          ls -R .github
          git config user.name "fix-bot"
          git config user.email "bot@github.com"
          git add -A
          git commit -m "FIX nested workflows" || true
          git push
