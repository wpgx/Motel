name: dcmaster
on:
  schedule:
    - cron: '45 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pull latest
        run: git pull origin main

      - name: Build dcmaster
        shell: python
        run: |
          import re, requests, shutil, os, gzip

          def load_blocks(text):
              blocks=[]; cur=[]
              for l in text.replace("\r","").split("\n"):
                  l=l.strip()
                  if not l: continue
                  if l.startswith("#EXTINF"):
                      if cur: blocks.append(cur)
                      cur=[l]
                  elif l.startswith("http"):
                      cur.append(l); blocks.append(cur); cur=[]
              return blocks

          def fix_xml_text(txt):
              return re.sub(r'&(?!(?:amp|lt|gt|quot|apos);)', '&amp;', txt)

          def get_inner(path):
              if not os.path.exists(path): return ""
              raw=open(path,encoding='utf-8',errors='ignore').read()
              txt=fix_xml_text(raw)
              return txt.split("<tv>")[-1].split("</tv>")[0] if "<tv>" in txt else txt

          dcfull_blocks = load_blocks(open("dcfull.m3u8",encoding='utf-8',errors='ignore').read()) if os.path.exists("dcfull.m3u8") else []
          tubi_blocks = load_blocks(open("tubiroku.m3u",encoding='utf-8',errors='ignore').read()) if os.path.exists("tubiroku.m3u") else []

          roku_blocks=[]
          for src in ["https://raw.githubusercontent.com/iptv-org/iptv/master/streams/us_roku.m3u","https://raw.githubusercontent.com/Drewski2423/onlineTV/master/Roku/RokuChannel.m3u8"]:
              try:
                  r=requests.get(src, timeout=20)
                  if r.ok and "#EXTINF" in r.text:
                      tmp=load_blocks(r.text)
                      if len(tmp)>10:
                          roku_blocks=tmp; break
              except: pass

          final=[]; final.extend(dcfull_blocks)
          chno=5000
          for b in tubi_blocks:
              b[0]=re.sub(r'tvg-chno="[^"]*"','',b[0]); b[0]=re.sub(r'group-title="[^"]*"','',b[0])
              b[0]=b[0].replace("#EXTINF:-1", f'#EXTINF:-1 group-title="Tubi" tvg-chno="{chno}"',1)
              final.append(b); chno+=1
          chno=6000
          for b in roku_blocks:
              m=re.search(r'tvg-id="([^"]+)"',b[0]); tid=m.group(1) if m else ""
              if not tid:
                  name=b[0].split(",")[-1].strip(); tid="roku."+re.sub(r'[^a-z0-9]+','-',name.lower()).strip("-")
                  b[0]=re.sub(r'tvg-id="[^"]*"','',b[0]); b[0]=b[0].replace("#EXTINF:-1", f'#EXTINF:-1 tvg-id="{tid}"',1)
              b[0]=re.sub(r'tvg-chno="[^"]*"','',b[0]); b[0]=re.sub(r'group-title="[^"]*"','',b[0])
              b[0]=b[0].replace("#EXTINF:-1", f'#EXTINF:-1 group-title="Roku" tvg-chno="{chno}"',1)
              final.append(b); chno+=1

          with open("dcmaster.m3u8","w",encoding="utf-8") as o:
              o.write('#EXTM3U url-tvg="https://motel.deecee.ca/dcmaster.xml"\n')
              for b in final: o.write(b[0]+"\n"+b[-1]+"\n")
          shutil.copy("dcmaster.m3u8","dcmaster.m3u")

          dcfull_xml = get_inner("dcfull.xml")
          tubi_xml = get_inner("tubiroku.xml")
          roku_extra=""
          all_so_far = dcfull_xml + tubi_xml
          for b in roku_blocks:
              mm=re.search(r'tvg-id="([^"]+)"',b[0]); tid=mm.group(1) if mm else ""; name=b[0].split(",")[-1].strip()
              safe_name = fix_xml_text(name)
              if tid and tid not in all_so_far:
                  roku_extra+=f'<channel id="{tid}"><display-name>{safe_name}</display-name></channel>\n<programme start="20260101000000 +0000" stop="20261231235959 +0000" channel="{tid}"><title>{safe_name}</title><desc>Live on Roku Channel</desc></programme>\n'

          open("dcmaster.xml","w",encoding="utf-8").write(f'<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n{dcfull_xml}\n{tubi_xml}\n{roku_extra}\n</tv>')

          with open("dcmaster.xml","rb") as f_in:
              with gzip.open("dcmaster.xml.gz","wb") as f_out:
                  shutil.copyfileobj(f_in, f_out)

          print(f"DONE: dcfull {len(dcfull_blocks)} + Tubi {len(tubi_blocks)} + Roku {len(roku_blocks)} = {len(final)}")

      - name: Finalize files
        run: |
          touch.nojekyll
          ls -lh dcmaster.*

      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add dcmaster.m3u8 dcmaster.m3u dcmaster.xml dcmaster.xml.gz.nojekyll -f
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "dcmaster: dcfull + tubi + roku"
          git push
