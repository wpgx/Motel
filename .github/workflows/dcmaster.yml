name: dcmaster
on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dcmaster.m3u8 keep headers
        run: |
          python3 << 'PY'
          def parse_full(path):
              try:
                  lines=open(path,encoding='utf-8',errors='ignore').read().splitlines()
              except:
                  return []
              blocks=[];cur=[]
              for l in lines:
                  if l.startswith("#EXTINF"):
                      if cur:
                          blocks.append(cur)
                      cur=[l]
                  elif l.startswith("http"):
                      cur.append(l)
                      blocks.append(cur)
                      cur=[]
                  else:
                      if cur:
                          cur.append(l)
              return blocks

          seen=set();merged=[]
          for f in ["dcfull.m3u8","tubiroku.m3u"]:
              for block in parse_full(f):
                  url=block[-1]
                  if url not in seen and url.startswith("http"):
                      seen.add(url)
                      merged.append(block)

          with open("dcmaster.m3u8","w",encoding="utf-8") as o:
              o.write("#EXTM3U\n")
              for block in merged:
                  for line in block:
                      o.write(line+"\n")

          import shutil
          shutil.copy("dcmaster.m3u8", "dcmaster.m3u")

          def get_content(f):
              try:
                  txt=open(f,encoding='utf-8',errors='ignore').read()
                  txt=txt.replace('<?xml version="1.0" encoding="UTF-8"?>','')
                  txt=txt.replace('<?xml version="1.0"?>','')
                  s=txt.find("<tv")
                  if s!=-1:
                      s=txt.find(">",s)+1
                      e=txt.rfind("</tv>")
                      return txt[s:e]
                  return txt
              except:
                  return ""

          c1=get_content("dcfull.xml")
          c2=get_content("tubiroku.xml")
          open("dcmaster.xml","w",encoding="utf-8").write(f'<?xml version="1.0" encoding="UTF-8"?><tv>\n{c1}\n{c2}\n</tv>')
          print(f"Unique: {len(seen)} dcfull xml len: {len(c1)} tubi len: {len(c2)}")
          PY

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build dcmaster.m3u8 with headers"
          file_pattern: "dcmaster.m3u8 dcmaster.m3u dcmaster.xml"
