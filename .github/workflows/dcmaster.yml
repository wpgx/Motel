name: Build DCMASTER
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build all 3 from official APIs (Docker method - no public lists)
        run: |
          # --- PLUTO CA ---
          git clone https://github.com/4v3ngR/pluto_tv_scraper.git /tmp/scraper
          cd /tmp/scraper && npm install
          echo '{"outdir":".","mapping":{"ca":"207.161.77.221"}}' > ./config.json
          node ./index.js --config ./config.json --exclude-groups "^Local News$" --exclude-channels "CBC|CTV|Global"
          mv ./plutotv_ca.m3u8 /tmp/pluto.m3u8
          mv ./plutotv_ca.xml /tmp/pluto.xml
          echo "Pluto done: $(wc -l < /tmp/pluto.m3u8)"

          # --- SAMSUNG CA via official docker scraper ---
          docker run -d --name samsung -p 8182:8080 matthuisman/samsung-tvplus-for-channels:latest
          sleep 15
          curl -s "http://localhost:8182/playlist.m3u8?regions=ca" -o /tmp/samsung.m3u8 || echo "#EXTM3U" > /tmp/samsung.m3u8
          curl -s "http://localhost:8182/epg.xml?regions=ca" -o /tmp/samsung.xml || echo "<tv></tv>" > /tmp/samsung.xml
          echo "Samsung done: $(wc -l < /tmp/samsung.m3u8)"
          docker rm -f samsung

          # --- PLEX CA via official docker scraper ---
          docker run -d --name plex -p 8183:8080 matthuisman/plex-tv-for-channels:latest
          sleep 15
          curl -s "http://localhost:8183/playlist.m3u8?regions=ca" -o /tmp/plex.m3u8 || echo "#EXTM3U" > /tmp/plex.m3u8
          curl -s "http://localhost:8183/epg.xml?regions=ca" -o /tmp/plex.xml || echo "<tv></tv>" > /tmp/plex.xml
          echo "Plex done: $(wc -l < /tmp/plex.m3u8)"
          docker rm -f plex

      - name: Merge to DCMASTER
        run: |
          python3 << 'PY'
          import re
          def load(p):
              try:
                  t=open(p,encoding='utf-8',errors='ignore').read().splitlines()
                  return [l for l in t if l.strip() and not l.startswith('#EXTM3U')]
              except: return []
          out=['#EXTM3U']+load('/tmp/pluto.m3u8')
          def add(path,start,group):
              chno=start
              for l in load(path):
                  if l.startswith('#EXTINF'):
                      if 'tvg-chno' in l:
                          l=re.sub(r'tvg-chno="[^"]+"',f'tvg-chno="{chno}"',l)
                      else:
                          l=l.replace('#EXTINF:',f'#EXTINF: tvg-chno="{chno}" ',1)
                      if 'group-title' not in l:
                          l=l.replace(',',f' group-title="{group}",',1)
                      chno+=1
                  out.append(l)
          add('/tmp/samsung.m3u8',1000,'Samsung Plus CA')
          add('/tmp/plex.m3u8',2000,'Plex CA')
          open('dcmaster.m3u8','w',encoding='utf-8').write('\n'.join(out))
          def inner(p):
              try:
                  txt=open(p,encoding='utf-8',errors='ignore').read()
                  m=re.search(r'<tv[^>]*>(.*)</tv>',txt,re.DOTALL)
                  return m.group(1) if m else ""
              except: return ""
          combined=f'<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n{inner("/tmp/pluto.xml")}\n{inner("/tmp/samsung.xml")}\n{inner("/tmp/plex.xml")}\n</tv>'
          open('dcmaster.xml','w',encoding='utf-8').write(combined)
          open('.nojekyll','w').write('')
          print(f"FINAL: {len(out)} lines")
          PY

      - name: Push
        run: |
          git config user.name "dc-bot"
          git config user.email "bot@github.com"
          git add dcmaster.m3u8 dcmaster.xml .nojekyll
          git commit -m "Update DCMASTER direct from APIs" || true
          git push
