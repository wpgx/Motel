name: Build DCMASTER
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Fetch all 3 sources
        run: |
          git clone https://github.com/4v3ngR/pluto_tv_scraper.git /tmp/scraper
          cd /tmp/scraper && npm install
          echo '{"outdir":".","mapping":{"ca":"207.161.77.221"}}' > ./config.json
          node /tmp/scraper/index.js --config ./config.json --exclude-groups "^Local News$" --exclude-channels "CBC|CTV|Global"
          mv ./plutotv_ca.m3u8 /tmp/pluto.m3u8
          mv ./plutotv_ca.xml /tmp/pluto.xml
          
          curl -A "Mozilla/5.0" -L https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/SamsungTVPlus/ca.m3u8 -o /tmp/samsung.m3u8
          curl -A "Mozilla/5.0" -L https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/SamsungTVPlus/ca.xml -o /tmp/samsung.xml
          
          curl -A "Mozilla/5.0" -L https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/Plex/ca.m3u8 -o /tmp/plex.m3u8
          curl -A "Mozilla/5.0" -L https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/Plex/ca.xml -o /tmp/plex.xml
          
          wc -l /tmp/*.m3u8
          ls -lh /tmp/*.m3u8 /tmp/*.xml

      - name: Merge to DCMASTER
        run: |
          python3 << 'PY'
          import re
          def load_m3u(path):
              try:
                  txt = open(path,encoding='utf-8',errors='ignore').read().splitlines()
                  return [l for l in txt if l.strip() and not l.startswith('#EXTM3U')]
              except:
                  return []
          pluto = load_m3u('/tmp/pluto.m3u8')
          samsung = load_m3u('/tmp/samsung.m3u8')
          plex = load_m3u('/tmp/plex.m3u8')
          print(f"Pluto: {len(pluto)} lines, Samsung: {len(samsung)} lines, Plex: {len(plex)} lines")
          out = ['#EXTM3U']
          out += pluto
          def add_with_offset(lines, start_chno, group_name):
              chno = start_chno
              for line in lines:
                  if line.startswith('#EXTINF'):
                      if 'tvg-chno' in line:
                          line = re.sub(r'tvg-chno="[^"]+"', f'tvg-chno="{chno}"', line)
                      else:
                          line = line.replace('#EXTINF:', f'#EXTINF: tvg-chno="{chno}" ',1)
                      if 'group-title' not in line:
                          line = line.replace(',', f' group-title="{group_name}",',1)
                      chno+=1
                  out.append(line)
              return chno
          add_with_offset(samsung, 1000, "Samsung Plus CA")
          add_with_offset(plex, 2000, "Plex CA")
          open('dcmaster.m3u8','w',encoding='utf-8').write('\n'.join(out))
          def inner(path):
              try:
                  txt = open(path,encoding='utf-8',errors='ignore').read()
                  m = re.search(r'<tv[^>]*>(.*)</tv>', txt, re.DOTALL)
                  return m.group(1) if m else ""
              except:
                  return ""
          combined = f'<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n{inner("/tmp/pluto.xml")}\n{inner("/tmp/samsung.xml")}\n{inner("/tmp/plex.xml")}\n</tv>'
          open('dcmaster.xml','w',encoding='utf-8').write(combined)
          open('dcmaster.m3u','w',encoding='utf-8').write('\n'.join(out))
          open('.nojekyll','w').write('')
          PY

      - name: Push files
        run: |
