name: Build DCMASTER
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Pluto CA
        run: |
          pip install requests
          git clone https://github.com/4v3ngR/pluto_tv_scraper.git /tmp/scraper
          cd /tmp/scraper
          npm install
          echo '{"outdir":".","mapping":{"ca":"207.161.77.221"}}' >./config.json
          node./index.js --config./config.json --exclude-groups "News|Local|Weather" --exclude-channels "CBC|CTV|Global|CBS News|NBC News|ABC News|Newsmax|Court TV"
          mv./plutotv_ca.m3u8 /tmp/pluto.m3u8
          mv./plutotv_ca.xml /tmp/pluto.xml
          cp /tmp/pluto.m3u8 $GITHUB_WORKSPACE/motel.m3u8
          cp /tmp/pluto.xml $GITHUB_WORKSPACE/motel.xml

      - name: Fetch Samsung Plex USA CA Strict + Dedup
        run: |
          cat > /tmp/fetch.py << 'PYEOF'
          import requests, re
          headers={"User-Agent":"Mozilla/5.0"}
          urls=[
            "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/SamsungTVPlus-All.m3u",
            "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/Plex-All.m3u"
          ]
          all_lines=[]
          for u in urls:
            r=requests.get(u,headers=headers,timeout=30)
            print(f"{u} {r.status_code}")
            if r.status_code==200:
              all_lines+=r.text.splitlines()

          clean=[]
          seen_urls=set()
          seen_names=set()
          keep=False
          cur_extinf=""
          for line in all_lines:
            if not line.strip(): continue
            if line.startswith('#EXTINF'):
              low=line.lower()
              # STRICT USA+CA
              is_ok=False
              m=re.search(r'tvg-country="([^"]+)"',low)
              if m:
                countries=[c.strip() for c in m.group(1).lower().replace(',',';').split(';')]
                if 'us' in countries or 'ca' in countries:
                  is_ok=True
              else:
                # no country tag - only allow if explicit US/CA in title
                if any(x in low for x in ['(us)', '(ca)', '[us]', '[ca]', ' usa ', ' canada ']):
                  is_ok=True

              if not is_ok:
                keep=False
                continue
              # dead filter
              if any(k in low for k in ['fishing','hunt channel','example.com']):
                keep=False
                continue
              cur_extinf=line
              # extract channel name for dedup
              name_match=re.search(r',([^,]+)$',line)
              ch_name=name_match.group(1).strip().lower() if name_match else low
              # skip if name already seen
              if ch_name in seen_names:
                keep=False
                continue
              keep=True
            else:
              if not keep: continue
              if line.startswith('#'):
                continue
              url=line.strip()
              if 'http' not in url.lower():
                keep=False
                continue
              if url in seen_urls:
                keep=False
                continue
              # dedup pass
              name_match=re.search(r',([^,]+)$',cur_extinf)
              ch_name=name_match.group(1).strip().lower() if name_match else ""
              seen_urls.add(url)
              if ch_name:
                seen_names.add(ch_name)
              clean.append(cur_extinf)
              clean.append(url)
              keep=False

          open('/tmp/samsungplex.m3u8','w',encoding='utf-8').write("\n".join(clean))
          print(f"STRICT DEDUPED USA+CA: {len(clean)//2} channels")
          PYEOF
          python3 /tmp/fetch.py

      - name: Merge + EPG
        run: |
          cat > /tmp/merge.py << 'PYEOF'
          import re
          def load(p):
            try:
              t=open(p,encoding='utf-8',errors='ignore').read().splitlines()
              return [l for l in t if l.strip() and not l.startswith('#EXTM3U')]
            except:
              return []
          out=['#EXTM3U']+load('/tmp/pluto.m3u8')
          chno=1000
          for line in load('/tmp/samsungplex.m3u8'):
            if line.startswith('#EXTINF'):
              if 'tvg-chno=' in line:
                line=re.sub(r'tvg-chno="[^"]+"',f'tvg-chno="{chno}"',line)
              else:
                line=line.replace('#EXTINF:',f'#EXTINF: tvg-chno="{chno}" ',1)
              chno+=1
            out.append(line)
          open('dcmaster.m3u8','w',encoding='utf-8').write('\n'.join(out))
          # EPG - for now just Pluto, Samsung/Plex EPG often missing, keep Pluto guide
          open('dcmaster.xml','w',encoding='utf-8').write(open('/tmp/pluto.xml',encoding='utf-8',errors='ignore').read())
          open('.nojekyll','w').write('')
          print(f"MASTER FINAL: {sum(1 for l in out if 'EXTINF' in l)} channels = Pluto 207 + SamsungPlex {sum(1 for l in out if 'EXTINF' in l)-207}")
          PYEOF
          python3 /tmp/merge.py

      - name: Push
        run: |
          git config user.name "dc-bot"
          git config user.email "bot@github.com"
          git add dcmaster.m3u8 dcmaster.xml motel.m3u8 motel.xml.nojekyll
          git commit -m "Update motel 207 + master USA+CA deduped fresh" || true
          git push
