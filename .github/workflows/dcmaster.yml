name: Build DCMASTER

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build DCMASTER (dcfull + plex + tubi) with.gz support
        run: |
          python3 << 'PY'
          import re, glob, gzip, shutil

          def get_inner(path):
              # read.xml or.xml.gz
              if path.endswith('.gz'):
                  with gzip.open(path, 'rt', encoding='utf-8', errors='ignore') as f:
                      t = f.read()
              else:
                  t = open(path, encoding='utf-8', errors='ignore').read()

              t = re.sub(r'<\?xml[^?]*\?>', '', t, flags=re.I)
              t = re.sub(r'<!DOCTYPE[^>]*>', '', t, flags=re.I)
              m1 = re.search(r'<tv[^>]*>', t, re.I)
              m2 = re.search(r'</tv\s*>', t, re.I)
              if m1 and m2:
                  t = t[m1.end():m2.start()]
              # fix stray &
              t = re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;|#\d+;|#x[0-9a-fA-F]+;)', '&amp;', t)
              return t

          def load_m3u(patterns):
              out = []
              for pat in patterns:
                  for f in glob.glob(pat):
                      if 'dcmaster' in f or 'dccatalog' in f:
                          continue
                      try:
                          lines = open(f, encoding='utf-8', errors='ignore').read().splitlines()
                          for i, l in enumerate(lines):
                              if l.startswith('#EXTINF') and i + 1 < len(lines):
                                  url = lines[i + 1].strip()
                                  if url.startswith('http'):
                                      out.append((l, url))
                      except Exception as e:
                          print(f"skip {f} {e}")
              return out

          # ---- M3U ----
          # dcfull is your motel playlist (samsung+pluto+lg) - keep it
          merged = load_m3u(['dcfull.m3u*', 'plex-ca.m3u*', 'tubiroku.m3u*'])
          print(f"MERGED: {len(merged)} channels")

          m3u_content = '#EXTM3U url-tvg="https://motel.deecee.ca/dcmaster.xml.gz"\n' + "\n".join([f"{a}\n{b}" for a, b in merged]) + "\n"
          open('dcmaster.m3u8', 'w', encoding='utf-8').write(m3u_content)
          open('dcmaster.m3u', 'w', encoding='utf-8').write(m3u_content)

          # ---- XML ----
          xml_parts = []
          for pat in ['dcfull.xml*', 'plex-ca.xml*', 'tubiroku.xml*']:
              for f in glob.glob(pat):
                  if 'dcmaster' in f or 'dccatalog' in f:
                      continue
                  if f.endswith('.m3u') or f.endswith('.m3u8'):
                      continue
                  part = get_inner(f)
                  xml_parts.append(part)
                  print(f"added {f} -> {len(part)} chars, channels {part.count('<channel ')} prog {part.count('<programme')}")

          final_xml = f'<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n{"".join(xml_parts)}\n</tv>\n'
          open('dcmaster.xml', 'w', encoding='utf-8').write(final_xml)

          # also write gz version
          with open('dcmaster.xml', 'rb') as fin:
              with gzip.open('dcmaster.xml.gz', 'wb') as fout:
                  shutil.copyfileobj(fin, fout)

          print(f"FINAL: {final_xml.count('<channel ')} channels, {final_xml.count('<programme ')} programmes, {len(final_xml)} bytes")
          PY

      - name: Validate
        run: |
          sudo apt-get update -y && sudo apt-get install -y libxml2-utils
          echo "--- dcmaster.xml ---"
          xmllint --noout dcmaster.xml && echo "dcmaster.xml OK"
          echo "--- dcmaster.xml.gz ---"
          gzip -t dcmaster.xml.gz && echo "dcmaster.xml.gz OK"
          echo "M3U: $(grep -c EXTINF dcmaster.m3u8) / XML ch: $(grep -c '<channel ' dcmaster.xml) / prog: $(grep -c '<programme ' dcmaster.xml)"

      - name: Push to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dcmaster.m3u8 dcmaster.m3u dcmaster.xml dcmaster.xml.gz -f
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "fix: dcmaster include plex-ca.xml.gz"
          git push
