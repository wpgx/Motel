name: dcmaster
on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dcmaster.m3u8 keep headers
        run: |
          python3 << 'PY'
          def parse_full(path):
              lines=open(path,encoding='utf-8',errors='ignore').read().splitlines()
              blocks=[];cur=[]
              for l in lines:
                  if l.startswith("#EXTINF"):
                      if cur: blocks.append(cur)
                      cur=[l]
                  elif l.startswith("http"):
                      cur.append(l); blocks.append(cur); cur=[]
                  else:
                      if cur: cur.append(l)
              return blocks

          merged=[]
          for f in ["dcfull.m3u8","tubiroku.m3u"]:
              merged.extend(parse_full(f))

          with open("dcmaster.m3u8","w",encoding="utf-8") as o:
              o.write("#EXTM3U\n")
              for block in merged:
                  for line in block:
                      o.write(line+"\n")

          import shutil
          shutil.copy("dcmaster.m3u8","dcmaster.m3u")

          def get_content(f):
              try:
                  txt=open(f,encoding='utf-8',errors='ignore').read()
                  txt=txt.replace('<?xml version="1.0" encoding="UTF-8"?>','')
                  s=txt.find("<tv")
                  s=txt.find(">",s)+1 if s!=-1 else 0
                  e=txt.rfind("</tv>")
                  return txt[s:e] if e!=-1 else ""
              except: return ""
          c1=get_content("dcfull.xml")
          c2=get_content("tubiroku.xml")
          open("dcmaster.xml","w",encoding="utf-8").write(f'<?xml version="1.0" encoding="UTF-8"?><tv>\n{c1}\n{c2}\n</tv>')
          print(f"Total with dupes kept: {len(merged)}")
          PY

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build dcmaster keep dupes for ALL CHANNELS"
          file_pattern: "dcmaster.m3u8 dcmaster.m3u dcmaster.xml"
