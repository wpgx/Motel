name: Build DCMASTER
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build DCMASTER from DCTV + Samsung CA + Plex CA
        run: |
          pip install requests -q
          python3 << 'PY'
          import requests, re, os
          headers={'User-Agent':'Mozilla/5.0'}

          # 1. YOUR motel file is dctv.m3u8 - CANADA ONLY
          pluto_file="dctv.m3u8"
          if not os.path.exists(pluto_file):
              print(f"ERROR {pluto_file} not found!")
              exit(1)
          base = open(pluto_file, encoding="utf-8", errors="ignore").read().splitlines()
          print(f"Base {pluto_file}: {len([x for x in base if '#EXTINF' in x])} channels")

          # 2. Samsung CA + Plex CA - both are CA ONLY already
          urls = {
            "Samsung-CA": "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/SamsungTVPlus-CA.m3u",
            "Plex-CA": "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/Plex-CA.m3u"
          }
          extra_text=""
          for name, url in urls.items():
              r=requests.get(url, headers=headers, timeout=30)
              print(f"{name}: {r.status_code} - {r.text.count('#EXTINF')} channels")
              extra_text+=r.text+"\n"

          # 3. Merge dedup
          seen=set()
          out=[]
          for line in base:
              if line.startswith("#EXTINF"):
                  key=line.lower().split(",")[-1].strip()
                  seen.add(key)
                  out.append(line)
              elif "http" in line:
                  out.append(line.strip())

          pluto_count=len([x for x in out if "http" in x])
          cur=""
          add=0
          for line in extra_text.splitlines():
              if line.startswith("#EXTINF"):
                  key=line.lower().split(",")[-1].strip()
                  if not key or key in seen:
                      cur=""
                      continue
                  seen.add(key)
                  cur=line
              else:
                  if not cur or "http" not in line:
                      cur=""
                      continue
                  out.append(cur)
                  out.append(line.strip())
                  cur=""
                  add+=1

          # renumber
          final=["#EXTM3U"]
          c=1
          for x in out:
              if x.startswith("#EXTINF"):
                  x=re.sub(r'tvg-chno="[^"]*"', f'tvg-chno="{c}"', x) if 'tvg-chno=' in x else x.replace("#EXTINF:", f'#EXTINF: tvg-chno="{c}" ', 1)
                  c+=1
              final.append(x)

          open("dcmaster.m3u8","w",encoding="utf-8").write("\n".join(final))
          # use dctv.xml as guide
          if os.path.exists("dctv.xml"):
              import shutil
              shutil.copy("dctv.xml","dcmaster.xml")
          print(f"DONE: {len([x for x in final if '#EXTINF' in x])} total = {pluto_count} DCTV + {add} Samsung+Plex CA ONLY")
          PY

      - name: Push
        run: |
          git config user.name "dc-bot"
          git config user.email "bot@github.com"
          git add dcmaster.m3u8 dcmaster.xml
          git commit -m "DCMASTER CA" || echo "no change"
          git push
