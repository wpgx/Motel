name: Build DCmaster
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get sources
        run: |
          curl -L -A "Mozilla/5.0" -o plex-ca.m3u8 https://i.mjh.nz/Plex/ca.m3u8
          curl -L -A "Mozilla/5.0" -o plex-ca.xml https://i.mjh.nz/Plex/ca.xml
          curl -L -A "Mozilla/5.0" -o roku.m3u8 https://i.mjh.nz/Roku/us.m3u8
          curl -L -A "Mozilla/5.0" -o roku2.m3u https://raw.githubusercontent.com/iptv-org/iptv/master/streams/us_roku.m3u
          if [ ! -s roku.m3u8 ] || [ $(grep -c EXTINF roku.m3u8 || echo 0) -lt 10 ]; then
            echo "roku.m3u8 empty, trying roku2"
            cp roku2.m3u roku.m3u8
          fi
          curl -L -A "Mozilla/5.0" -o tubi.m3u8 https://i.mjh.nz/Tubi/us.m3u8
          echo "plex=$(grep -c EXTINF plex-ca.m3u8 2>/dev/null || echo 0) dcfull=$(grep -c EXTINF dcfull.m3u8 2>/dev/null || echo 0) tubi=$(grep -c EXTINF tubi.m3u8 2>/dev/null || echo 0) roku=$(grep -c EXTINF roku.m3u8 2>/dev/null || echo 0) tubiroku=$(grep -c EXTINF tubiroku.m3u 2>/dev/null; echo 0)"

      - name: Build
        run: |
          python3 << 'PY'
          import os, re
          def load_m3u(path):
              if not os.path.exists(path) or os.path.getsize(path)==0: return []
              lines=open(path,encoding='utf-8',errors='ignore').read().splitlines()
              out=[]
              for i,l in enumerate(lines):
                  if l.startswith('#EXTINF') and i+1 < len(lines):
                      u=lines[i+1].strip()
                      if u.startswith('http'): out.append((l,u))
              return out
          def extract_xml_body(path):
              import gzip, re
              if not os.path.exists(path) or os.path.getsize(path)==0: return ''
              txt=gzip.open(path,'rt',encoding='utf-8',errors='ignore').read() if path.endswith('.gz') else open(path,encoding='utf-8',errors='ignore').read()
              m=re.search(r'<tv[^>]*>(.*)</tv>',txt,flags=re.I|re.S)
              return m.group(1) if m else txt

          merged=[]; xml_body=''

          # PLEX 6500 untouched
          plex_data = load_m3u('plex-ca.m3u8')
          if len(plex_data)<10:
              print("FATAL NO PLEX"); exit(1)
          merged.extend(plex_data)
          print(f"PLEX: {len(plex_data)}")

          for f in ['plex-ca.xml','plex.xml']:
              if os.path.exists(f):
                  xml_body+=extract_xml_body(f)+'\n'; break

          # DCFULL
          dcfull=load_m3u('dcfull.m3u8') or load_m3u('dcfull.m3u')
          for extinf,url in dcfull:
              if any(url==u for _,u in merged): continue
              merged.append((extinf,url))
          print(f"DCFULL added {len(dcfull)}")

          # TUBI 5000
          tubi_raw = load_m3u('tubiroku.m3u') or load_m3u('tubiroku.m3u8') or load_m3u('tubi.m3u8')
          chno=5000
          for extinf,url in tubi_raw:
              if any(url==u for _,u in merged): continue
              extinf=re.sub(r'tvg-chno="[^"]*"','',extinf)
              extinf=extinf.replace('#EXTINF:-1',f'#EXTINF:-1 group-title="Tubi" tvg-chno="{chno}"',1)
              merged.append((extinf,url)); chno+=1
          print(f"TUBI 5000: {len(tubi_raw)} -> final chno {chno-1}")

          # ROKU - 6000 to 6499 (your old way)
          roku_raw = load_m3u('roku.m3u8')
          chno=6000
          for extinf,url in roku_raw:
              if any(url==u for _,u in merged): continue
              if chno>=6500: break # stop before Plex
              extinf=re.sub(r'tvg-chno="[^"]*"','',extinf)
              extinf=extinf.replace('#EXTINF:-1',f'#EXTINF:-1 group-title="Roku" tvg-chno="{chno}"',1)
              merged.append((extinf,url)); chno+=1
          print(f"ROKU 6000-6499: {len(roku_raw)} added {chno-6000}")

          # xml
          for base in ['dcfull','tubiroku']:
              for ext in ['.xml','.xml.gz']:
                  if os.path.exists(base+ext):
                      xml_body+=extract_xml_body(base+ext)+'\n'; break

          xml_body=re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;|#\d+;)','&amp;',xml_body)

          print(f"FINAL {len(merged)} total")
          if len(merged)<800:
              print("Too small, abort"); exit(1)

          m3u_text='#EXTM3U url-tvg="https://motel.deecee.ca/dcmaster.xml"\n'+'\n'.join(f"{a}\n{b}" for a,b in merged)+'\n'
          open('dcmaster.m3u8','w',encoding='utf-8').write(m3u_text)
          open('dcmaster.m3u','w',encoding='utf-8').write(m3u_text)
          open('dcmaster.xml','w',encoding='utf-8').write(f'<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n{xml_body}\n</tv>\n')
          PY

      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add dcmaster.m3u8 dcmaster.m3u dcmaster.xml -f
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "dcmaster: plex 6500 + tubi 5000 + roku 6000-6499 fix"
          git push
