name: Build DCMASTER
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        run: |
          pip install requests
          # --- PLUTO CA - PURE SELF BUILT ---
          git clone https://github.com/4v3ngR/pluto_tv_scraper.git /tmp/scraper
          cd /tmp/scraper && npm install
          echo '{"outdir":".","mapping":{"ca":"207.161.77.221"}}' > ./config.json
          node ./index.js --config ./config.json --exclude-groups "News|Local|Weather" --exclude-channels "CBC|CTV|Global|CBS News|NBC News|ABC News|Newsmax|Court TV"
          mv ./plutotv_ca.m3u8 /tmp/pluto.m3u8
          mv ./plutotv_ca.xml /tmp/pluto.xml
          cp /tmp/pluto.m3u8 motel.m3u8
          cp /tmp/pluto.xml motel.xml
          echo "Motel (Pluto only): $(wc -l < /tmp/pluto.m3u8) lines"

          # --- SAMSUNG + PLEX from raw github (with dead host filter) ---
          python3 << 'PY'
          import requests
          headers={"User-Agent":"Mozilla/5.0"}
          # These 2 raw github files ALWAYS work inside Actions
          urls = [
              "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8",
              "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ca_samsung.m3u",
              "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ca_plex.m3u"
          ]
          combined=[]
          for u in urls:
              try:
                  r=requests.get(u,headers=headers,timeout=20)
                  if r.status_code==200:
                      combined+=r.text.splitlines()
                      print(f"Fetched {u}: {len(r.text.splitlines())} lines")
              except Exception as e:
                  print(f"Failed {u}: {e}")

          # Filter out obvious dead domains (fishing etc)
          clean=[]
          dead_keywords=["fishing","hunt","unknown","example.com","localhost"]
          for line in combined:
              if line.startswith('#'):
                  clean.append(line)
              else:
                  # keep only if not containing dead keywords
                  if any(k in line.lower() for k in dead_keywords):
                      continue
                  # skip if line has no http
                  if 'http' not in line.lower():
                      continue
                  clean.append(line)

          open('/tmp/samsungplex.m3u8','w',encoding='utf-8').write("\n".join(clean))
          print(f"Samsung+Plex cleaned: {len(clean)} lines")
          PY

      - name: Merge to DCMASTER
        run: |
          python3 << 'PY'
          import re
          def load(p):
              try:
                  t=open(p,encoding='utf-8',errors='ignore').read().splitlines()
                  return [l for l in t if l.strip() and not l.startswith('#EXTM3U')]
              except: return []
          out=['#EXTM3U']+load('/tmp/pluto.m3u8')
          chno=1000
          for line in load('/tmp/samsungplex.m3u8'):
              if line.startswith('#EXTINF'):
                  if 'tvg-chno' in line:
                      line=re.sub(r'tvg-chno="[^"]+"',f'tvg-chno="{chno}"',line)
                  else:
                      line=line.replace('#EXTINF:',f'#EXTINF: tvg-chno="{chno}" ',1)
                  chno+=1
              out.append(line)
          open('dcmaster.m3u8','w',encoding='utf-8').write('\n'.join(out))
          open('dcmaster.xml','w',encoding='utf-8').write(open('/tmp/pluto.xml',encoding='utf-8',errors='ignore').read())
          open('motel.m3u8','w',encoding='utf-8').write(open('motel.m3u8',encoding='utf-8',errors='ignore').read())
          open('motel.xml','w',encoding='utf-8').write(open('motel.xml',encoding='utf-8',errors='ignore').read())
          open('.nojekyll','w').write('')
          print(f"MASTER FINAL: {len(out)} lines = {len(out)//2} channels")
          PY

      - name: Push
        run: |
          git config user.name "dc-bot"
          git config user.email "bot@github.com"
          git add dcmaster.m3u8 dcmaster.xml motel.m3u8 motel.xml .nojekyll
          git commit -m "Update motel + master" || true
          git push
