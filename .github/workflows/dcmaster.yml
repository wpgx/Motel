name: Build DCmaster

on:
  workflow_dispatch:
  schedule:
    - cron: '20 2,5,8,11,14,17,20,23 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build DCmaster - Plex gz + FAST xml
        run: |
          python3 - << 'PY'
          import os, re, gzip
          from pathlib import Path

          def find_xml(base):
              candidates = [
                  f"{base}.xml",
                  f"{base}.xml.gz",
                  f"{base}.m3u8.xml",
                  f"{base.capitalize()}.xml",
                  f"{base.capitalize()}.xml.gz",
                  f"{base.upper()}.xml",
              ]
              for name in candidates:
                  if os.path.exists(name):
                      print(f"FOUND XML {base} -> {name}")
                      return name
              print(f"NOT FOUND XML {base}")
              return None

          def find_m3u(base):
              for name in [f"{base}.m3u8", f"{base}.m3u", f"{base.capitalize()}.m3u8", f"{base.upper()}.m3u8"]:
                  if os.path.exists(name):
                      print(f"FOUND M3U {base} -> {name}")
                      return name
              print(f"NOT FOUND M3U {base}")
              return None

          def load_m3u(path):
              ch=[]
              if not path or not os.path.exists(path):
                  return ch
              with open(path,encoding='utf-8',errors='ignore') as f:
                  lines=f.read().splitlines()
              for i,l in enumerate(lines):
                  if l.startswith('#EXTINF') and i+1 < len(lines):
                      url=lines[i+1].strip()
                      if url.startswith('http'):
                          ch.append((l,url))
              print(f"  {path} = {len(ch)} channels")
              return ch

          def extract_tv(path):
              if not path or not os.path.exists(path):
                  return ''
              try:
                  if path.endswith('.gz'):
                      txt = gzip.open(path,'rt',encoding='utf-8',errors='ignore').read()
                  else:
                      txt = open(path,encoding='utf-8',errors='ignore').read()
              except Exception as e:
                  print(f"  READ FAIL {path}: {e}")
                  return ''
              low = txt.lower()
              s = low.find('<tv')
              e = low.rfind('</tv>')
              if s==-1 or e==-1:
                  print(f"  {path} NO <tv> TAG len={len(txt)}")
                  return ''
              s = txt.find('>', s)+1
              body = txt[s:e]
              print(f"  {path} -> {body.count('<channel')} ch / {body.count('<programme')} prog / {len(body)} chars")
              return body

          # 1. PLEX - only .gz in your setup
          plex_m3u=[]
          plex_xml=''
          for src in ['plex-ca','plex']:
              mp=find_m3u(src)
              if mp:
                  plex_m3u.extend(load_m3u(mp))
              xp=find_xml(src)
              if xp:
                  plex_xml+=extract_tv(xp)+'\n'
          print(f"\nPLEX TOTAL M3U: {len(plex_m3u)}")

          # 2. FAST - .xml only in your setup
          base_m3u_raw=[]
          base_xml_raw=''
          for src in ['dcfull','tubiroku','tubi','us','ca','roku']:
              mp=find_m3u(src)
              if mp:
                  base_m3u_raw.extend(load_m3u(mp))
              xp=find_xml(src)
              if xp:
                  base_xml_raw+=extract_tv(xp)+'\n'

          print(f"FAST RAW M3U: {len(base_m3u_raw)}")
          print(f"FAST RAW XML len: {len(base_xml_raw)}")

          # Prefix FAST ids with dc- to avoid collision with Plex numeric ids
          base_m3u=[]
          for ext,url in base_m3u_raw:
              def repl(m):
                  tid=m.group(1)
                  if tid.startswith('dc-') or tid.startswith('roku.'):
                      return m.group(0)
                  return f'tvg-id="dc-{tid}"'
              new_ext=re.sub(r'tvg-id="([^"]+)"', repl, ext, flags=re.I)
              new_ext=new_ext.replace('dc-dc-','dc-')
              base_m3u.append((new_ext,url))

          base_xml=base_xml_raw.replace('<channel id="', '<channel id="dc-').replace(' channel="', ' channel="dc-')
          base_xml=base_xml.replace('dc-dc-','dc-').replace('dc-roku.','roku.')

          # Merge - Plex first wins dedup
          seen=set()
          merged=[]
          for ext,url in plex_m3u + base_m3u:
              m=re.search(r'tvg-id="([^"]+)"',ext,re.I)
              tid=m.group(1) if m else url
              if tid in seen:
                  continue
              seen.add(tid)
              merged.append((ext,url))

          print(f"FINAL MERGED: {len(merged)} channels")

          final_body = plex_xml + '\n' + base_xml
          final_body = re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;|#\d+;|#x[0-9a-fA-F]+;)','&amp;',final_body)
          final_xml = '<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n' + final_body + '\n</tv>\n'

          m3u_text = '#EXTM3U url-tvg="https://motel.deecee.ca/dcmaster.xml"\n' + '\n'.join(f"{e}\n{u}" for e,u in merged) + '\n'

          Path("dcmaster.m3u8").write_text(m3u_text,encoding='utf-8')
          Path("dcmaster.m3u").write_text(m3u_text,encoding='utf-8')
          Path("dcmaster.xml").write_text(final_xml,encoding='utf-8')
          Path("DCmaster.m3u8").write_text(m3u_text,encoding='utf-8')
          Path("DCmaster.m3u").write_text(m3u_text,encoding='utf-8')
          Path("DCmaster.xml").write_text(final_xml,encoding='utf-8')

          # write gz too for clients that want it - you said you use xml but we write both
          with gzip.open("dcmaster.xml.gz",'wb') as f:
              f.write(final_xml.encode('utf-8'))
          with gzip.open("DCmaster.xml.gz",'wb') as f:
              f.write(final_xml.encode('utf-8'))

          print(f"DONE: wrote dcmaster.xml {len(final_xml)} bytes / {len(merged)} ch")
          PY

      - name: Commit and push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add dcmaster.m3u8 dcmaster.m3u dcmaster.xml dcmaster.xml.gz DCmaster.m3u8 DCmaster.m3u DCmaster.xml DCmaster.xml.gz -f
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "DCmaster: fix Plex gz + FAST xml guide, dc- prefix"
          git push
