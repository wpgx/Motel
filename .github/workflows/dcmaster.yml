name: dcmaster
on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge to dcmaster.m3u8
        run: |
          python3 merge.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build dcmaster.m3u8"
          file_pattern: "dcmaster.m3u8 dcmaster.m3u dcmaster.xml"
