name: dcmaster
on: workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Build DCMASTER
        run: |
          python3 << 'PY'
          import os, gzip, shutil, re
          def find_m3u(base):
              if os.path.exists(base + '.m3u8'): return base + '.m3u8'
              if os.path.exists(base + '.m3u'): return base + '.m3u'
              return None
          def find_xml(base):
              if os.path.exists(base + '.xml'): return base + '.xml'
              if os.path.exists(base + '.xml.gz'): return base + '.xml.gz'
              return None
          def load_m3u(path):
              ch=[]
              try:
                lines=open(path,encoding='utf-8',errors='ignore').read().splitlines()
                for i,l in enumerate(lines):
                  if l.startswith('#EXTINF') and i+1 < len(lines):
                    u=lines[i+1].strip()
                    if u.startswith('http'): ch.append((l,u))
              except Exception as e: print(e)
              return ch
          def load_xml(path):
              try:
                if path.endswith('.gz'):
                  text=gzip.open(path,'rt',encoding='utf-8',errors='ignore').read()
                else:
                  text=open(path,encoding='utf-8',errors='ignore').read()
                text=re.sub(r'<\?xml[^?]*\?>','',text,flags=re.I)
                text=re.sub(r'<!DOCTYPE[^>]*>','',text,flags=re.I)
                s=re.search(r'<tv[^>]*>',text,flags=re.I); e=re.search(r'</tv\s*>',text,flags=re.I)
                if s and e: text=text[s.end():e.start()]
                text=re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;|#\d+;|#x[0-9a-fA-F]+;)','&amp;',text)
                return text
              except Exception as e:
                print(e); return ''
          merged=[]
          for src in ['dcfull','plex-ca','tubiroku']:
            p=find_m3u(src)
            if p: merged.extend(load_m3u(p))
          m3u='#EXTM3U url-tvg="https://motel.deecee.ca/dcmaster.xml"\n' + '\n'.join(f'{a}\n{b}' for a,b in merged) + '\n'
          open('dcmaster.m3u8','w',encoding='utf-8').write(m3u)
          open('dcmaster.m3u','w',encoding='utf-8').write(m3u)
          parts=[]
          for src in ['dcfull','plex-ca','tubiroku']:
            p=find_xml(src)
            if p:
              t=load_xml(p)
              if t: parts.append(t)
          final='<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n'+''.join(parts)+'\n</tv>\n'
          open('dcmaster.xml','w',encoding='utf-8').write(final)
          with open('dcmaster.xml','rb') as f_in, gzip.open('dcmaster.xml.gz','wb') as f_out:
            shutil.copyfileobj(f_in,f_out)
          PY
      - name: Validate
        run: |
          sudo apt-get update -y && sudo apt-get install -y libxml2-utils
          xmllint --noout dcmaster.xml
          gzip -t dcmaster.xml.gz
      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dcmaster.m3u8 dcmaster.m3u dcmaster.xml dcmaster.xml.gz -f
          git diff --cached --quiet || (git commit -m "DCmaster: fix Plex gz + FAST xml guide" && git push)
