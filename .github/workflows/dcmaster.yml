name: Build DCMASTER
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build from YOUR links
        run: |
          pip install requests -q
          python3 << 'PY'
          import requests, re

          h={'User-Agent':'Mozilla/5.0'}

          # YOUR LINKS - EXACTLY what you sent
          urls=[
            "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/SamsungTVPlus-All.m3u",
            "https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/Plex-All.m3u"
          ]

          # 1. Load your DCTV (192 Pluto CA)
          base=open("dctv.m3u8", encoding="utf-8", errors="ignore").read().splitlines()
          print(f"DCTV: {len([x for x in base if '#EXTINF' in x])}")

          ca_extracted=""
          for url in urls:
              r=requests.get(url, headers=h, timeout=60)
              print(f"{url} -> {r.status_code} total channels: {r.text.count('#EXTINF')}")
              # Save first 3 lines to see format
              print("Sample:", r.text.splitlines()[1][:200] if len(r.text.splitlines())>1 else "no sample")

              # EXTRACT CANADA ONLY
              # His format is group-title="Canada" - let's catch it
              lines=r.text.splitlines()
              for i in range(len(lines)):
                  line=lines[i]
                  if not line.startswith("#EXTINF"):
                      continue
                  low=line.lower()
                  # This is how he tags Canada in ALL files
                  if 'canada' in low or 'tvg-country="ca"' in low or 'tvg-country="us;ca"' in low or 'group-title="ca"' in low:
                      # keep this + next line (url)
                      ca_extracted+=line+"\n"
                      if i+1 < len(lines) and "http" in lines[i+1]:
                          ca_extracted+=lines[i+1].strip()+"\n"

          print(f"Canada extracted from ALL files: {ca_extracted.count('#EXTINF')}")

          # Merge
          out=[]
          seen=set()
          for l in base:
              if l.startswith("#EXTINF"):
                  seen.add(l.split(",")[-1].lower().strip())
              if l.strip() and not l.startswith("#EXTM3U"):
                  out.append(l)

          added=0
          cur=""
          for l in ca_extracted.splitlines():
              if l.startswith("#EXTINF"):
                  name=l.split(",")[-1].lower().strip()
                  if name in seen or not name:
                      cur=""
                      continue
                  seen.add(name)
                  cur=l
              elif cur and "http" in l:
                  out.append(cur)
                  out.append(l.strip())
                  added+=1
                  cur=""

          final=["#EXTM3U"]
          c=1
          for x in out:
              if x.startswith("#EXTINF"):
                  x=re.sub(r'tvg-chno="[^"]*"', '', x)
                  x=x.replace("#EXTINF:", f'#EXTINF: tvg-chno="{c}" ')
                  c+=1
              final.append(x)

          open("dcmaster.m3u8","w",encoding="utf-8").write("\n".join(final))
          import shutil, os
          if os.path.exists("dctv.xml"):
              shutil.copy("dctv.xml","dcmaster.xml")

          print(f"FINAL DCMASTER: {len([x for x in final if '#EXTINF' in x])} = {len([x for x in base if '#EXTINF' in x])} DCTV + {added} from your Samsung/Plex ALL->CA")
          PY

      - name: Push
        run: |
          git config user.name "dc-bot"
          git config user.email "bot@github.com"
          git add dcmaster.m3u8 dcmaster.xml
          git commit -m "DCMASTER from ALL->CA" || echo "no change"
          git push
