name: dcmaster
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build DCMASTER for Sparkle - Plex guide fix
        run: |
          python3 << 'PY'
          import os, gzip, re

          def load_m3u(path):
              lines=open(path,encoding='utf-8',errors='ignore').read().splitlines()
              out=[]
              for i,l in enumerate(lines):
                  if l.startswith('#EXTINF') and i+1 < len(lines):
                      u=lines[i+1].strip()
                      if u.startswith('http'): out.append((l,u))
              return out

          def extract_tv(path):
              if not os.path.exists(path): return ''
              txt=gzip.open(path,'rt',encoding='utf-8',errors='ignore').read() if path.endswith('.gz') else open(path,encoding='utf-8',errors='ignore').read()
              m=re.search(r'<tv[^>]*>(.*)</tv>',txt,flags=re.I|re.S)
              return m.group(1) if m else txt

          # --- PLEX ---
          plex_m3u = 'plex-ca.m3u8' if os.path.exists('plex-ca.m3u8') else 'plex-ca.m3u'
          plex_xml = 'plex-ca.xml.gz' if os.path.exists('plex-ca.xml.gz') else 'plex-ca.xml'

          plex_m3u_list = load_m3u(plex_m3u) if os.path.exists(plex_m3u) else []
          plex_xml_body = extract_tv(plex_xml) if os.path.exists(plex_xml) else ''

          # FIX 2: Plex XML sometimes has id without plex- prefix, m3u has it
          # Normalize: make sure XML ids match M3U tvg-id
          # We keep plex- prefix in both

          # --- DCFULL + TUBI with dc- prefix to avoid collision ---
          merged = plex_m3u_list
          xml_body = plex_xml_body + '\n'

          for base in ['dcfull','tubiroku']:
              mp = base+'.m3u8' if os.path.exists(base+'.m3u8') else (base+'.m3u' if os.path.exists(base+'.m3u') else None)
              xp = base+'.xml' if os.path.exists(base+'.xml') else (base+'.xml.gz' if os.path.exists(base+'.xml.gz') else None)
              if mp:
                  raw = load_m3u(mp)
                  fixed=[]
                  for extinf,url in raw:
                      if 'tvg-id="' in extinf:
                          if 'tvg-id="dc-' not in extinf and 'tvg-id="plex-' not in extinf:
                              extinf = extinf.replace('tvg-id="','tvg-id="dc-')
                      else:
                          # add id if missing
                          extinf = extinf.replace('#EXTINF:','#EXTINF: tvg-id="dc-'+str(len(merged)+len(fixed))+'" ')
                      fixed.append((extinf,url))
                  merged.extend(fixed)
              if xp:
                  t = extract_tv(xp)
                  t = re.sub(r'<channel id="(?!dc-|plex-)', '<channel id="dc-', t)
                  t = re.sub(r' channel="(?!dc-|plex-)', ' channel="dc-', t)
                  t = t.replace('dc-dc-','dc-')
                  xml_body += t + '\n'

          # Escape &
          xml_body = re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;|#\d+;|#x[0-9a-fA-F]+;)','&amp;',xml_body)

          m3u_out = '#EXTM3U url-tvg="https://motel.deecee.ca/dcmaster.xml"\n' + '\n'.join(f"{a}\n{b}" for a,b in merged) + '\n'
          open('dcmaster.m3u8','w',encoding='utf-8').write(m3u_out)
          open('dcmaster.m3u','w',encoding='utf-8').write(m3u_out)
          open('dcmaster.xml','w',encoding='utf-8').write(f'<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n{xml_body}\n</tv>\n')

          print(f"SPARKLE -> dcmaster.xml | {len(merged)} channels | {xml_body.count('<channel ')} xml channels | {xml_body.count('<programme')} programmes")
          PY
      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f dcmaster2.* DCmaster.* dcmaster.xml.gz DCmaster.xml.gz -f || true
          git add dcmaster.m3u8 dcmaster.m3u dcmaster.xml -f
          git diff --cached --quiet || (git commit -m "dcmaster for sparkle - plex guide fix - xml only" && git push)
