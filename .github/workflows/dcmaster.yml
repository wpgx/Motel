name: Build DCMASTER

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build DCMASTER direct
        run: |
          python3 << 'PY'
          import os, re, glob, requests

          def fix_amp(t):
              return re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;|#\d+;|#x[0-9a-fA-F]+;)','&amp;',t)

          def load(patterns):
              pairs=[]
              for pat in patterns:
                  for f in glob.glob(pat):
                      if 'dcfull' in f or 'dcmaster' in f or 'dccatalog' in f: continue
                      try:
                          lines=open(f,encoding='utf-8',errors='ignore').read().splitlines()
                          for i,l in enumerate(lines):
                              if l.startswith('#EXTINF'):
                                  url=lines[i+1].strip() if i+1 < len(lines) else ""
                                  if url.startswith('http'):
                                      pairs.append((fix_amp(l), url))
                      except: pass
              return pairs

          def safe_inner(patterns):
              txt=""
              for pat in patterns:
                  for f in glob.glob(pat):
                      if 'dcfull' in f or 'dcmaster' in f or 'dccatalog' in f: continue
                      try:
                          t=open(f,encoding='utf-8',errors='ignore').read()
                          if "<tv>" in t:
                              t=t.split("<tv>",1)[-1].rsplit("</tv>",1)[0]
                          t=fix_amp(t)
                          txt+=t+"\n"
                      except: pass
              return txt

          samsung = load(['samsung*.m3u*'])
          pluto = load(['pluto*.m3u*'])
          lg = load(['lg*.m3u*'])
          plex = load(['plex-ca.m3u*'])
          tubi = load(['tubiroku.m3u*'])

          roku=[]
          try:
              r=requests.get("https://raw.githubusercontent.com/iptv-org/iptv/master/streams/us_roku.m3u",timeout=20)
              if r.ok:
                  open("_roku.m3u","w",encoding="utf-8").write(r.text)
                  lines=r.text.splitlines()
                  for i,l in enumerate(lines):
                      if l.startswith('#EXTINF'):
                          url=lines[i+1].strip() if i+1 < len(lines) else ""
                          if url.startswith('http'):
                              roku.append((fix_amp(l), url))
          except: pass

          merged = samsung + pluto + lg + plex + tubi + roku
          print(f"SAMS {len(samsung)} + PLUTO {len(pluto)} + LG {len(lg)} + PLEX {len(plex)} + TUBI {len(tubi)} + ROKU {len(roku)} = TOTAL {len(merged)}")

          m3u = ['#EXTM3U url-tvg="https://motel.deecee.ca/dcmaster.xml"']
          for inf,url in merged:
              m3u.append(inf)
              m3u.append(url)
          content="\n".join(m3u)+"\n"
          open('dcmaster.m3u8','w',encoding='utf-8').write(content)
          open('dcmaster.m3u','w',encoding='utf-8').write(content)

          xml_inner = safe_inner(['samsung*.xml','pluto*.xml','lg*.xml','plex-ca.xml','tubiroku.xml'])

          roku_extra=""
          for inf,url in roku:
              m=re.search(r'tvg-id="([^"]+)"',inf)
              if not m: continue
              tid=m.group(1)
              if tid in xml_inner: continue
              dname=re.search(r',(.+)$',inf)
              dname=fix_amp(dname.group(1) if dname else tid)
              roku_extra+=f'<channel id="{tid}"><display-name>{dname}</display-name></channel>\n'

          final=f'<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n{xml_inner}\n{roku_extra}\n</tv>\n'
          final=fix_amp(final)
          open('dcmaster.xml','w',encoding='utf-8').write(final)
          print(f"dcmaster.xml {len(final)} bytes")
          PY

      - name: Check
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxml2-utils
          echo "M3U:"; grep -c '^#EXTINF:' dcmaster.m3u8
          echo "XML channels:"; grep -c '<channel ' dcmaster.xml
          echo "XML programmes:"; grep -c '<programme ' dcmaster.xml
          xmllint --noout dcmaster.xml && echo "dcmaster.xml OK" || (xmllint --noout dcmaster.xml 2>&1 | head -20 && exit 1)

      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add dcmaster.m3u8 dcmaster.m3u dcmaster.xml -f
          git diff --cached --quiet && exit 0
          git commit -m "dcmaster direct: samsung+pluto+lg+plex+tubi+roku no dcfull"
          git push
