name: Build DCMASTER
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build from official APIs (no public lists)
        run: |
          pip install requests
          # --- PLUTO CA ---
          git clone https://github.com/4v3ngR/pluto_tv_scraper.git /tmp/scraper
          cd /tmp/scraper && npm install
          echo '{"outdir":".","mapping":{"ca":"207.161.77.221"}}' > ./config.json
          node ./index.js --config ./config.json --exclude-groups "^Local News$" --exclude-channels "CBC|CTV|Global"
          mv ./plutotv_ca.m3u8 /tmp/pluto.m3u8
          mv ./plutotv_ca.xml /tmp/pluto.xml
          echo "Pluto: $(wc -l < /tmp/pluto.m3u8) lines"

          # --- SAMSUNG CA direct from Samsung ---
          python3 << 'PY'
          import requests
          try:
              # Samsung TV Plus official API - Canada
              headers = {"User-Agent":"Mozilla/5.0"}
              # This is Samsung's own endpoint
              r = requests.get("https://search.samsungtvplus.com/api/channel/list?region=CA", headers=headers, timeout=20)
              if r.status_code != 200:
                  # fallback 2
                  r = requests.get("https://api.samsungtvplus.com/api/v1/channel/list?region=CA", headers=headers, timeout=20)
              data = r.json()
              m3u = ["#EXTM3U"]
              count=0
              # handle different json formats
              channels = data.get('data', {}).get('channels', []) or data.get('channels', []) or data.get('result', [])
              if not channels:
                  # try another official endpoint
                  r = requests.get("https://www.samsungtvplus.com/api/channels?region=CA", headers=headers, timeout=20)
                  channels = r.json()
              for ch in channels:
                  try:
                      title = ch.get('title') or ch.get('name') or ch.get('chName') or 'Samsung'
                      url = ch.get('streamUrl') or ch.get('url') or ch.get('playbackUrl') or ch.get('m3u8') or ''
                      if not url: continue
                      logo = ch.get('logo') or ch.get('thumbnail') or ''
                      cid = ch.get('id') or ch.get('channelId') or count
                      m3u.append(f'#EXTINF:-1 tvg-id="{cid}" tvg-logo="{logo}" group-title="Samsung Plus CA",{title}')
                      m3u.append(url)
                      count+=1
                  except: continue
              open('/tmp/samsung.m3u8','w',encoding='utf-8').write("\n".join(m3u))
              print(f"Samsung CA self-built: {count} channels")
          except Exception as e:
              print(f"Samsung error: {e}")
              open('/tmp/samsung.m3u8','w').write("#EXTM3U\n")
          PY

          # --- PLEX CA direct from Plex ---
          python3 << 'PY'
          import requests
          try:
              headers={"User-Agent":"Mozilla/5.0"}
              # Plex official EPG - all CA live channels
              r = requests.get("https://discover.provider.plex.tv/library/sections/watchonplex/lineup?X-Plex-Token=&region=CA", headers=headers, timeout=20)
              # Alternative endpoint
              if r.status_code != 200:
                  r = requests.get("https://epg.provider.plex.tv/api/v2/lineups/plex/channels?region=CA", headers=headers, timeout=20)
              # If both fail, use plex.tv API list
              data = r.json() if r.text.startswith('{') else {}
              m3u = ["#EXTM3U"]
              count=0
              # Try parse
              for ch in data.get('MediaContainer',{}).get('Metadata',[])[:300]:
                  title = ch.get('title','Plex')
                  # Plex needs special handling - use provider endpoint
                  key = ch.get('key','')
                  if key:
                      m3u.append(f'#EXTINF:-1 group-title="Plex CA",{title}')
                      m3u.append(f"https://epg.provider.plex.tv{key}?X-Plex-Token=")
                      count+=1
              open('/tmp/plex.m3u8','w',encoding='utf-8').write("\n".join(m3u))
              print(f"Plex CA self-built: {count} channels")
          except Exception as e:
              print(f"Plex error: {e}")
              open('/tmp/plex.m3u8','w').write("#EXTM3U\n")
          PY

          echo "Samsung: $(wc -l < /tmp/samsung.m3u8) lines"
          echo "Plex: $(wc -l < /tmp/plex.m3u8) lines"
          echo '<?xml version="1.0"?><tv></tv>' > /tmp/samsung.xml
          echo '<?xml version="1.0"?><tv></tv>' > /tmp/plex.xml

      - name: Merge
        run: |
          python3 << 'PY'
          import re
          def load(p):
              t=open(p,encoding='utf-8',errors='ignore').read().splitlines()
              return [l for l in t if l.strip() and not l.startswith('#EXTM3U')]
          out=['#EXTM3U']+load('/tmp/pluto.m3u8')
          def add(path,start,group):
              chno=start
              for l in load(path):
                  if l.startswith('#EXTINF'):
                      if 'tvg-chno' in l:
                          l=re.sub(r'tvg-chno="[^"]+"',f'tvg-chno="{chno}"',l)
                      else:
                          l=l.replace('#EXTINF:',f'#EXTINF: tvg-chno="{chno}" ',1)
                      if 'group-title' not in l:
                          l=l.replace(',',f' group-title="{group}",',1)
                      chno+=1
                  out.append(l)
          add('/tmp/samsung.m3u8',1000,'Samsung Plus CA')
          add('/tmp/plex.m3u8',2000,'Plex CA')
          open('dcmaster.m3u8','w',encoding='utf-8').write('\n'.join(out))
          import pathlib
          open('dcmaster.xml','w').write(open('/tmp/pluto.xml',encoding='utf-8',errors='ignore').read())
          open('.nojekyll','w').write('')
          print(f"FINAL: {len(out)} lines = {len(out)//2} channels")
          PY

      - name: Push
        run: |
          git config user.name "dc-bot"
          git config user.email "bot@github.com"
          git add dcmaster.m3u8 dcmaster.xml .nojekyll
          git commit -m "Update DCMASTER self-built direct" || true
          git push
