name: dcmaster

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build DCMASTER
        run: |
          python3 << 'PY'
          import re
          import gzip
          import shutil
          import os

          # ============================================================
          # FIND ONE SOURCE FILE
          # Prefer .m3u8 / .xml.
          # Fall back to .m3u / .xml.gz.
          # NEVER load both versions.
          # ============================================================

          def find_m3u(base):
              for path in (base + '.m3u8', base + '.m3u'):
                  if os.path.exists(path):
                      return path
              return None

          def find_xml(base):
              for path in (base + '.xml', base + '.xml.gz'):
                  if os.path.exists(path):
                      return path
              return None

          # ============================================================
          # LOAD M3U
          # ============================================================

          def load_m3u(path):
              out = []

              try:
                  with open(
                      path,
                      encoding='utf-8',
                      errors='ignore'
                  ) as f:
                      lines = f.read().splitlines()

                  for i, line in enumerate(lines):
                      if line.startswith('#EXTINF') and i + 1 < len(lines):
                          url = lines[i + 1].strip()

                          if url.startswith('http'):
                              out.append((line, url))

                  print(f"M3U added: {path} -> {len(out)} channels")

              except Exception as e:
                  print(f"M3U ERROR {path}: {e}")

              return out

          # ============================================================
          # LOAD XML / XML.GZ
          #
          # Plex CA currently supplies plex-ca.xml.gz.
          # Decompress it here and use its XML contents.
          # ============================================================

          def get_inner(path):
              if path.endswith('.gz'):
                  print(f"Decompressing guide: {path}")

                  with gzip.open(
                      path,
                      'rt',
                      encoding='utf-8',
                      errors='ignore'
                  ) as f:
                      t = f.read()
              else:
                  with open(
                      path,
                      encoding='utf-8',
                      errors='ignore'
                  ) as f:
                      t = f.read()

              # Remove XML declaration.
              t = re.sub(
                  r'<\?xml[^?]*\?>',
                  '',
                  t,
                  flags=re.I
              )

              # Remove DOCTYPE if present.
              t = re.sub(
                  r'<!DOCTYPE[^>]*>',
                  '',
                  t,
                  flags=re.I
              )

              # Extract everything inside <tv>...</tv>.
              m1 = re.search(
                  r'<tv[^>]*>',
                  t,
                  flags=re.I
              )

              m2 = re.search(
                  r'</tv\s*>',
                  t,
                  flags=re.I
              )

              if m1 and m2:
                  t = t[m1.end():m2.start()]

              # Escape bare ampersands without damaging valid XML entities.
              t = re.sub(
                  r'&(?!amp;|lt;|gt;|quot;|apos;|#\d+;|#x[0-9a-fA-F]+;)',
                  '&amp;',
                  t
              )

              return t

          # ============================================================
          # BUILD M3U
          #
          # NO CHANNEL DEDUPLICATION.
          # DCCATALOG handles channel replacement/drop logic.
          # ============================================================

          merged = []

          for base in ['dcfull', 'plex-ca', 'tubiroku']:
              path = find_m3u(base)

              if not path:
                  print(f"WARNING: No M3U found for {base}")
                  continue

              merged.extend(load_m3u(path))

          print(f"MERGED M3U: {len(merged)} channels")

          # IMPORTANT:
          # Sparkle receives normal XML, not the compressed XML.
          m3u_content = (
              '#EXTM3U url-tvg="https://motel.deecee.ca/dcmaster.xml"\n'
              + '\n'.join(
                  f"{extinf}\n{url}"
                  for extinf, url in merged
              )
              + '\n'
          )

          with open(
              'dcmaster.m3u8',
              'w',
              encoding='utf-8'
          ) as f:
              f.write(m3u_content)

          with open(
              'dcmaster.m3u',
              'w',
              encoding='utf-8'
          ) as f:
              f.write(m3u_content)

          # ============================================================
          # BUILD XML
          #
          # ONE GUIDE FILE PER SOURCE.
          #
          # Plex CA:
          #   plex-ca.xml.gz
          #
          # is automatically decompressed by get_inner().
          #
          # NO CHANNEL OR PROGRAMME DEDUPLICATION.
          # ============================================================

          xml_parts = []

          for base in ['dcfull', 'plex-ca', 'tubiroku']:
              path = find_xml(base)

              if not path:
                  print(f"WARNING: No XML guide found for {base}")
                  continue

              try:
                  part = get_inner(path)
                  xml_parts.append(part)

                  print(
                      f"XML added: {path} | "
                      f"chars={len(part)} | "
                      f"channels={part.count('<channel ')} | "
                      f"programmes={part.count('<programme')}"
                  )

              except Exception as e:
                  print(f"XML ERROR {path}: {e}")

          final_xml = (
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<tv>\n'
              + ''.join(xml_parts)
              + '\n</tv>\n'
          )

          with open(
              'dcmaster.xml',
              'w',
              encoding='utf-8'
          ) as f:
              f.write(final_xml)

          # ============================================================
          # CREATE GZIP COPY
          #
          # Kept for later use.
          # Sparkle currently points to dcmaster.xml.
          # ============================================================

          with open('dcmaster.xml', 'rb') as fin:
              with gzip.open('dcmaster.xml.gz', 'wb') as fout:
                  shutil.copyfileobj(fin, fout)

          # ============================================================
          # FINAL REPORT
          # ============================================================

          print('========================================')
          print('DCMASTER COMPLETE')
          print(f"M3U channels:     {len(merged)}")
          print(f"XML channels:     {final_xml.count('<channel ')}")
          print(f"XML programmes:   {final_xml.count('<programme ')}")
          print(f"XML bytes:        {len(final_xml)}")
          print('EPG URL:')
          print('https://motel.deecee.ca/dcmaster.xml')
          print('========================================')
          PY

      - name: Validate
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxml2-utils

          echo "===== XML VALIDATION ====="
          xmllint --noout dcmaster.xml
          echo "dcmaster.xml OK"

          echo "===== GZIP VALIDATION ====="
          gzip -t dcmaster.xml.gz
          echo "dcmaster.xml.gz OK"

          echo "===== COUNTS ====="
          echo "M3U channels: $(grep -c '^#EXTINF' dcmaster.m3u8)"
          echo "XML channels: $(grep -c '<channel ' dcmaster.xml)"
          echo "XML programmes: $(grep -c '<programme ' dcmaster.xml)"

      - name: Push to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            dcmaster.m3u8 \
            dcmaster.m3u \
            dcmaster.xml \
            dcmaster.xml.gz \
            -f

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "fix dcmaster guide sources"
          git push
