name: Update IPTVORG USA

on:
  workflow_dispatch:
  schedule:
    - cron: '50 1 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build IPTVORG USA
        run: |
          python3 - << 'PY'
          import re
          import requests
          from pathlib import Path

          SOURCE = "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/us.m3u"

          WANTED = [
              "ABC West",
              "AMC",
              "AMC East",
              "CBS",
              "NBC",
              "NBC 5 Chicago",
              "FOX",
              "FX",
              "ION PLUS",
              "ION",
              "National Geographic",
              "WFXT-DT2",
              "WGN-DT1",
              "WNBC-DT1",
              "FX Movie Channel",
              "A&E",
          ]

          wanted = {name.lower(): name for name in WANTED}

          print("Downloading current iptv-org US playlist...")

          r = requests.get(
              SOURCE,
              timeout=60,
              headers={"User-Agent": "Mozilla/5.0"}
          )
          r.raise_for_status()

          lines = r.text.replace("\r", "").split("\n")

          output = [
              '#EXTM3U url-tvg="https://motel.deecee.ca/iptvorg_usa.xml"'
          ]

          found = set()

          for i, line in enumerate(lines):

              if not line.startswith("#EXTINF"):
                  continue

              if i + 1 >= len(lines):
                  continue

              url = lines[i + 1].strip()

              if not url.startswith("http"):
                  continue

              name = line.rsplit(",", 1)[-1].strip()
              name_low = name.lower()

              if name_low not in wanted:
                  continue

              clean_name = wanted[name_low]

              if clean_name.lower() in found:
                  continue

              found.add(clean_name.lower())

              ext = line

              # Force category to USA
              ext = re.sub(
                  r'group-title="[^"]*"',
                  'group-title="USA"',
                  ext,
                  flags=re.IGNORECASE
              )

              if "group-title=" not in ext.lower():
                  ext = ext.replace(
                      "#EXTINF:-1",
                      '#EXTINF:-1 group-title="USA"',
                      1
                  )

              # Clean resolution from display name
              ext = re.sub(
                  r'\s*\(?[0-9]{3,4}p\)?\s*$',
                  '',
                  ext,
                  flags=re.IGNORECASE
              )

              # Force our clean display name
              ext = ext.rsplit(",", 1)[0] + "," + clean_name

              output.append(ext)
              output.append(url)

          Path("iptvorg_usa.m3u").write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          print()
          print("======================================")
          print("       IPTVORG USA RESULT")
          print("======================================")
          print(f"Requested: {len(WANTED)}")
          print(f"Found:     {len(found)}")
          print()

          for name in WANTED:
              if name.lower() in found:
                  print(f"OK       {name}")
              else:
                  print(f"MISSING  {name}")

          print("======================================")
          PY

      - name: Download IPTVORG Guide
        run: |
          curl -L --fail --retry 3 \
            -o iptvorg_usa.xml.gz \
            "https://raw.githubusercontent.com/StrangeDrVN/epg/public/guide.xml.gz"

          gunzip -f iptvorg_usa.xml.gz
          mv guide.xml iptvorg_usa.xml

      - name: Show results
        run: |
          echo "===== IPTVORG USA ====="
          grep -c '^#EXTINF:' iptvorg_usa.m3u || true
          echo
          cat iptvorg_usa.m3u
          echo
          ls -lh iptvorg_usa.m3u iptvorg_usa.xml

      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"

          git add iptvorg_usa.m3u iptvorg_usa.xml -f

          git diff --cached --quiet && \
            echo "No change" && \
            exit 0

          git commit -m "iptvorg: update USA channels"

          git push
