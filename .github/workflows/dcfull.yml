name: Build DCFULL
on:
  workflow_dispatch:
  schedule:
    - cron: '15 2,8,14,20 * * *'  # 2:15, 8:15, 14:15, 20:15 - 7 mins after Samsung pull

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build DCFULL m3u8 + xml
        run: |
          pip install -q requests
          python3 << 'PY'
          import glob, os, re

          # --- M3U8 ---
          out_m3u = ['#EXTM3U']
          for f in ['samsung-ca.m3u8', 'pluto-ca.m3u8', 'pluto.m3u8', 'samsung.m3u8']:
              if os.path.exists(f):
                  txt = open(f, encoding='utf-8', errors='ignore').read().splitlines()
                  for line in txt[1:]:  # skip #EXTM3U
                      if line.strip():
                          out_m3u.append(line)
                  print(f"Added {f}: {len(txt)} lines")

          open('dcfull.m3u8','w',encoding='utf-8').write("\n".join(out_m3u))
          print(f"DCFULL: {len(out_m3u)} lines")

          # --- XML GUIDE - merge ---
          xml_files = []
          for f in ['samsung-ca.xml','pluto-ca.xml','pluto.xml','samsung.xml']:
              if os.path.exists(f) and os.path.getsize(f) > 1000:
                  xml_files.append(f)

          if xml_files:
              # simple merge - keep all channels and programmes
              channels = {}
              progs = []
              for xf in xml_files:
                  txt = open(xf, encoding='utf-8', errors='ignore').read()
                  for m in re.finditer(r'<channel id="([^"]+)".*?</channel>', txt, re.DOTALL):
                      channels[m.group(1)] = m.group(0)
                  for m in re.finditer(r'<programme.*?</programme>', txt, re.DOTALL):
                      progs.append(m.group(0))
                  print(f"Parsed {xf}: {len(channels)} ch so far, {len(progs)} progs")

              with open('dcfull.xml','w',encoding='utf-8') as out:
                  out.write('<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n')
                  for c in channels.values():
                      out.write(c + "\n")
                  for p in progs:
                      out.write(p + "\n")
                  out.write('</tv>\n')
              print(f"DCFULL XML: {len(channels)} channels, {len(progs)} programmes")
          else:
              print("No XML files found to merge")
          PY

      - name: Push
        run: |
          ls -lh dcfull.* samsung-ca.* pluto* || true
          COUNT=$(grep -c "#EXTINF" dcfull.m3u8 || echo 0)
          echo "DCFULL $COUNT channels"
          if [ "$COUNT" -lt 20 ]; then
            echo "DCFULL too small, not pushing"
            exit 1
          fi
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add dcfull.m3u8 dcfull.xml -f
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "dcfull $COUNT ch"
          git push
