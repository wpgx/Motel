name: Build DCFULL
on:
  workflow_dispatch:
  schedule:
    - cron: '25 */3 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build DCFULL from DCTV + Samsung-CA
        run: |
          python3 << 'PY'
          import os, re

          # --- M3U8 MERGE - keep original order/numbers ---
          out = ['#EXTM3U url-tvg="https://motel.deecee.ca/dcfull.xml"']
          for f in ['dctv.m3u8', 'pluto.m3u8', 'samsung-ca.m3u8']:
              if os.path.exists(f):
                  lines = open(f, encoding='utf-8', errors='ignore').read().splitlines()
                  add = [l for l in lines if l.strip() and not l.startswith('#EXTM3U')]
                  out.extend(add)
                  print(f"{f}: {len([l for l in add if '#EXTINF' in l])} ch")
              else:
                  print(f"skip {f}")

          open('dcfull.m3u8','w',encoding='utf-8').write("\n".join(out) + "\n")
          open('dcfull.m3u','w',encoding='utf-8').write("\n".join(out) + "\n")
          print(f"DCFULL M3U: {len([l for l in out if '#EXTINF' in l])} channels")

          # --- XMLTV MERGE ---
          xml_files = [f for f in ['dctv.xml', 'pluto.xml', 'samsung-ca.xml'] if os.path.exists(f) and os.path.getsize(f) > 1000]
          if xml_files:
              channels = {}
              progs = []
              for xf in xml_files:
                  txt = open(xf, encoding='utf-8', errors='ignore').read()
                  for m in re.finditer(r'<channel id="([^"]+)".*?</channel>', txt, re.DOTALL):
                      channels[m.group(1)] = m.group(0)
                  for m in re.finditer(r'<programme.*?</programme>', txt, re.DOTALL):
                      progs.append(m.group(0))
                  print(f"{xf} -> {len(channels)} ch")

              with open('dcfull.xml','w',encoding='utf-8') as o:
                  o.write('<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n')
                  for c in channels.values():
                      o.write(c + "\n")
                  for p in progs:
                      o.write(p + "\n")
                  o.write('</tv>\n')
          PY

      - name: Push DCFULL
        run: |
          ls -lh dcfull.* || true
          COUNT=$(grep -c "#EXTINF" dcfull.m3u8 || echo 0)
          echo "DCFULL = $COUNT channels"
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add dcfull.m3u8 dcfull.m3u dcfull.xml -f
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "dcfull $COUNT ch restore old merge"
          git push
