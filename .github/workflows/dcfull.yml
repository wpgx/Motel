name: Build DCFULL

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build DCFULL
        run: |
          python3 - << 'PY'
          import re, gzip, shutil, xml.etree.ElementTree as ET
          from pathlib import Path

          def load_m3u(path):
              kept = []
              dropped = 0
              if not Path(path).exists():
                  print(f"{path} missing")
                  return kept, dropped
              text = Path(path).read_text(encoding='utf-8', errors='ignore')
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if not line.startswith("#EXTINF"):
                      continue
                  nxt = lines[i+1].strip() if i+1 < len(lines) else ""
                  name = line.rsplit(',',1)[-1].lower()
                  if "welcome" in name:
                      dropped+=1
                      continue
                  kept.append((line, nxt))
              print(f"{path}: {len(kept)} kept, {dropped} welcome dropped")
              return kept, dropped

          pluto, _ = load_m3u("pluto.m3u8")
          sams, _ = load_m3u("samsung-ca.m3u8")

          all_ch = pluto + sams

          m3u = ['#EXTM3U url-tvg="https://motel.deecee.ca/dcfull.xml"']
          for idx, (inf, url) in enumerate(all_ch, start=1):
              # force chno sequential
              if 'tvg-chno=' in inf:
                  inf = re.sub(r'tvg-chno="[^"]+"', f'tvg-chno="{idx}"', inf)
              else:
                  inf = inf.replace('#EXTINF:-1', f'#EXTINF:-1 tvg-chno="{idx}"', 1)
              m3u.append(inf)
              m3u.append(url)

          Path("dcfull.m3u8").write_text("\n".join(m3u), encoding='utf-8')
          Path("dcfull.m3u").write_text("\n".join(m3u), encoding='utf-8')
          print(f"DCFULL M3U: {len(all_ch)} ch")

          # XML merge
          xml_files = [p for p in ["pluto.xml", "samsung-ca.xml"] if Path(p).exists()]
          print(f"XML files to merge: {xml_files}")

          channels = {}
          progs = []
          for xf in xml_files:
              try:
                  tree = ET.parse(xf)
                  root = tree.getroot()
                  for ch in root.findall('channel'):
                      cid = ch.get('id')
                      if cid not in channels:
                          channels[cid] = ch
                  for pr in root.findall('programme'):
                      progs.append(pr)
                  print(f" {xf} -> {len(channels)} ch so far / {len(progs)} prog so far")
              except Exception as e:
                  print(f" {xf} failed: {e}")

          tv = ET.Element('tv')
          for ch in channels.values():
              tv.append(ch)
          for pr in progs:
              tv.append(pr)

          ET.ElementTree(tv).write("dcfull.xml", encoding='utf-8', xml_declaration=True)
          print(f"DCFULL XML FINAL: {len(channels)} ch, {len(progs)} progs")

          with open("dcfull.xml","rb") as f_in:
              with gzip.open("dcfull.xml.gz","wb") as f_out:
                  shutil.copyfileobj(f_in, f_out)
          PY

          touch.nojekyll
          ls -lh dcfull.*

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add dcfull.m3u8 dcfull.m3u dcfull.xml.gz.nojekyll -f
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "dcfull: no welcome"
          git push
