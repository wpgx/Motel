name: Build DCFULL
on:
  workflow_dispatch:
  schedule:
    - cron: '25 2,5,8,11,14,17,20,23 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build DCFULL from DCTV + Samsung-CA (+TubiRoku if present)
        run: |
          pip install -q requests
          python3 << 'PY'
          import os, re

          def fix_xml_text(txt):
              # Fix lone & that breaks Formuler - but don't double-escape
              txt = re.sub(r'&(?!(?:amp|lt|gt|quot|apos);)', '&amp;', txt)
              return txt

          # --- M3U8 MERGE - with url-tvg so Formuler auto-finds guide ---
          out = ['#EXTM3U url-tvg="https://motel.deecee.ca/dcfull.xml"']
          for f in ['dctv.m3u8', 'samsung-ca.m3u8', 'tubiroku.m3u']:
              if os.path.exists(f):
                  lines = open(f, encoding='utf-8', errors='ignore').read().splitlines()
                  add = [l for l in lines if l.strip() and not l.startswith('#EXTM3U')]
                  out.extend(add)
                  print(f"{f}: {len(add)} lines")
              else:
                  print(f"Skipping {f} - not found")

          open('dcfull.m3u8','w',encoding='utf-8').write("\n".join(out) + "\n")
          print(f"DCFULL M3U: {len([l for l in out if '#EXTINF' in l])} channels")

          # --- XMLTV MERGE - with Formuler-safe escaping ---
          xml_files = [f for f in ['dctv.xml', 'samsung-ca.xml', 'tubiroku.xml'] if os.path.exists(f) and os.path.getsize(f) > 1000]
          if xml_files:
              channels = {}
              progs = []
              for xf in xml_files:
                  raw = open(xf, encoding='utf-8', errors='ignore').read()
                  txt = fix_xml_text(raw)  # <-- this fixes the & bug from Cloudflare/Render
                  for m in re.finditer(r'<channel id="([^"]+)".*?</channel>', txt, re.DOTALL):
                      channels[m.group(1)] = m.group(0)
                  for m in re.finditer(r'<programme.*?</programme>', txt, re.DOTALL):
                      progs.append(m.group(0))
                  print(f"{xf} -> {len(channels)} ch so far, {len(progs)} progs so far")

              with open('dcfull.xml','w',encoding='utf-8') as o:
                  o.write('<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n')
                  for c in channels.values():
                      o.write(c + "\n")
                  for p in progs:
                      o.write(p + "\n")
                  o.write('</tv>\n')
              print(f"DCFULL XML done: {len(channels)} channels, {len(progs)} programmes")
          else:
              print("No XML to merge")
          PY

      - name: Push DCFULL
        run: |
          ls -lh dcfull.* || true
          COUNT=$(grep -c "#EXTINF" dcfull.m3u8 || echo 0)
          echo "DCFULL = $COUNT channels"
          if [ "$COUNT" -lt 10 ]; then echo "Too small"; exit 1; fi
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add dcfull.m3u8 dcfull.xml -f
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "dcfull $COUNT ch fixed for Formuler"
          git push
