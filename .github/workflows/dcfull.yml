name: Build DCFULL
on:
  workflow_dispatch:
  schedule:
    - cron: '25 2,5,8,11,14,17,20,23 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build DCFULL
        run: |
          python3 << 'PY'
          import os, re

          def load(f):
              lines = open(f, encoding='utf-8', errors='ignore').read().splitlines()
              pairs = []
              for i,l in enumerate(lines):
                  if l.startswith('#EXTINF'):
                      nxt = lines[i+1] if i+1 < len(lines) else ""
                      if nxt.startswith('http'):
                          pairs.append((l,nxt))
              return pairs

          pluto = load('pluto.m3u8') if os.path.exists('pluto.m3u8') else []
          samsung = load('samsung-ca.m3u8') if os.path.exists('samsung-ca.m3u8') else []

          # force favorites first, everything else after, keep original chno
          favs = [p for p in pluto if 'favor' in p[0].lower()]
          rest = [p for p in pluto if p not in favs]
          pluto_sorted = favs + rest
          print(f"Pluto: {len(favs)} favs top + {len(rest)} rest = {len(pluto_sorted)}")
          print(f"Samsung: {len(samsung)}")

          out = ['#EXTM3U url-tvg="https://motel.deecee.ca/dcfull.xml"']
          for inf, url in pluto_sorted + samsung:
              out.append(inf)
              out.append(url)

          open('dcfull.m3u8','w',encoding='utf-8').write("\n".join(out)+"\n")
          open('dcfull.m3u','w',encoding='utf-8').write("\n".join(out)+"\n")
          print(f"DCFULL TOTAL: {len(pluto_sorted)+len(samsung)} ch")

          # xml
          channels = {}
          progs = []
          for xf in ['pluto.xml','samsung-ca.xml']:
              if not os.path.exists(xf): continue
              txt = open(xf, encoding='utf-8', errors='ignore').read()
              for m in re.finditer(r'<channel id="([^"]+)".*?</channel>', txt, re.DOTALL):
                  channels[m.group(1)] = m.group(0)
              for m in re.finditer(r'<programme.*?</programme>', txt, re.DOTALL):
                  progs.append(m.group(0))
          with open('dcfull.xml','w',encoding='utf-8') as o:
              o.write('<?xml version="1.0"?>\n<tv>\n')
              for c in channels.values(): o.write(c+"\n")
              for p in progs: o.write(p+"\n")
              o.write('</tv>\n')
          PY
      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add dcfull.m3u8 dcfull.m3u dcfull.xml -f
          git diff --cached --quiet && exit 0
          git commit -m "dcfull: pluto+samsung no dupes favs top"
          git push
