name: Build DCFULL
on:
  workflow_dispatch:
  schedule:
    - cron: '25 1,4,7,10,13,16,19,22 * * *'  # 15 mins after Samsung 3hr pull

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build DCFULL from DCTV + Samsung-CA
        run: |
          pip install -q requests
          python3 << 'PY'
          import os, re

          # --- M3U8 MERGE ---
          out = ['#EXTM3U']
          for f in ['dctv.m3u8', 'samsung-ca.m3u8']:
              if os.path.exists(f):
                  lines = open(f, encoding='utf-8', errors='ignore').read().splitlines()
                  # drop first #EXTM3U line
                  add = [l for l in lines if l.strip() and not l.startswith('#EXTM3U')]
                  out.extend(add)
                  print(f"{f}: {len(add)} lines")
              else:
                  print(f"MISSING {f}")

          open('dcfull.m3u8','w',encoding='utf-8').write("\n".join(out) + "\n")
          print(f"DCFULL M3U: {len([l for l in out if '#EXTINF' in l])} channels")

          # --- XMLTV MERGE ---
          xml_files = [f for f in ['dctv.xml', 'samsung-ca.xml'] if os.path.exists(f) and os.path.getsize(f) > 1000]
          if xml_files:
              channels = {}
              progs = []
              for xf in xml_files:
                  txt = open(xf, encoding='utf-8', errors='ignore').read()
                  for m in re.finditer(r'<channel id="([^"]+)".*?</channel>', txt, re.DOTALL):
                      channels[m.group(1)] = m.group(0)
                  for m in re.finditer(r'<programme.*?</programme>', txt, re.DOTALL):
                      progs.append(m.group(0))
                  print(f"{xf} -> {len(channels)} ch, {len(progs)} progs")

              with open('dcfull.xml','w',encoding='utf-8') as o:
                  o.write('<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n')
                  for c in channels.values():
                      o.write(c + "\n")
                  for p in progs:
                      o.write(p + "\n")
                  o.write('</tv>\n')
              print(f"DCFULL XML done: {len(channels)} channels")
          else:
              print("No XML to merge")
          PY

      - name: Push DCFULL
        run: |
          ls -lh dcfull.* dctv.* samsung-ca.* || true
          COUNT=$(grep -c "#EXTINF" dcfull.m3u8 || echo 0)
          echo "DCFULL = $COUNT channels"
          if [ "$COUNT" -lt 10 ]; then echo "Too small"; exit 1; fi
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add dcfull.m3u8 dcfull.xml -f
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "dcfull $COUNT ch (dctv+samsung)"
          git push
