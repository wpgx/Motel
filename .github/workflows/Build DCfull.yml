name: Build DCFULL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build DCFULL
        run: |
          python3 << 'PY'
          import os
          import re

          def load(f):
              if not os.path.exists(f):
                  print(f"M3U missing: {f}")
                  return []
              lines = open(f, encoding='utf-8', errors='ignore').read().splitlines()
              pairs = []
              for i, line in enumerate(lines):
                  if line.startswith('#EXTINF'):
                      url = lines[i + 1] if i + 1 < len(lines) else ""
                      if url.startswith('http'):
                          pairs.append((line, url))
              return pairs

          def fix_stray_amp(s):
              # Fix only stray & not already &amp; &lt; etc
              return re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;|#\d+;)', '&amp;', s)

          # --------------------------------------------------
          # LOAD PLAYLISTS
          # --------------------------------------------------
          pluto = load('pluto.m3u8')
          samsung = load('samsung-ca.m3u8')
          lg = load('lg.m3u8')

          favs = [p for p in pluto if 'favor' in p[0].lower()]
          rest = [p for p in pluto if p not in favs]
          pluto_sorted = favs + rest

          print(f"Pluto: {len(pluto_sorted)}")
          print(f"Samsung: {len(samsung)}")
          print(f"LG: {len(lg)}")

          merged = pluto_sorted + samsung + lg
          print(f"DCFULL TOTAL: {len(merged)}")

          # --------------------------------------------------
          # WRITE M3U
          # --------------------------------------------------
          out = ['#EXTM3U url-tvg="https://motel.deecee.ca/dcfull.xml"']
          for inf, url in merged:
              out.append(inf)
              out.append(url)

          content = "\n".join(out) + "\n"
          open('dcfull.m3u8','w',encoding='utf-8').write(content)
          open('dcfull.m3u','w',encoding='utf-8').write(content)

          # --------------------------------------------------
          # COMBINE XML - SAFE VERSION
          # --------------------------------------------------
          xml_files = ['pluto.xml','samsung-ca.xml','lg.xml']
          channels = {}
          programmes = []

          for filename in xml_files:
              if not os.path.exists(filename):
                  print(f"XML missing: {filename}")
                  continue
              print(f"Reading {filename}")
              text = open(filename, encoding='utf-8', errors='ignore').read()
              text = fix_stray_amp(text)

              for match in re.finditer(r'<channel\b[^>]*\bid="([^"]+)"[^>]*>.*?</channel>', text, re.DOTALL):
                  channel_id = match.group(1).strip()
                  block = match.group(0).strip()
                  if channel_id not in channels:
                      channels[channel_id] = block

              for match in re.finditer(r'<programme\b[^>]*>.*?</programme>', text, re.DOTALL):
                  programmes.append(match.group(0).strip())

          unique_programmes = []
          seen = set()
          for program in programmes:
              key = re.sub(r'\s+',' ',program).strip()
              if key in seen: continue
              seen.add(key)
              unique_programmes.append(program)

          with open('dcfull.xml','w',encoding='utf-8') as f:
              f.write('<?xml version="1.0" encoding="UTF-8"?>\n')
              f.write('<tv>\n')
              for block in channels.values():
                  f.write(block + '\n')
              for block in unique_programmes:
                  f.write(block + '\n')
              f.write('</tv>\n')

          print()
          print("========== DCFULL RESULT ==========")
          print(f"M3U channels: {len(merged)}")
          print(f"XML channels: {len(channels)}")
          print(f"XML programmes: {len(unique_programmes)}")
          print("===================================")
          PY

      - name: Show results
        run: |
          echo "===== DCFULL ====="
          grep -c '^#EXTINF:' dcfull.m3u8 || true
          ls -lh dcfull.m3u8 dcfull.m3u dcfull.xml
          grep -c '<channel ' dcfull.xml || true
          grep -c '<programme ' dcfull.xml || true
          echo "XML lint check:"
          xmllint --noout dcfull.xml && echo "dcfull.xml OK" || echo "dcfull.xml STILL BROKEN"

      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add dcfull.m3u8 dcfull.m3u dcfull.xml -f
          git diff --cached --quiet && exit 0
          git commit -m "dcfull: fixed stray & in guide"
          git push
