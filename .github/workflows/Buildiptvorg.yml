name: Update IPTVORG USA

on:
  workflow_dispatch:
  schedule:
    - cron: '50 1 * * *'

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPTVORG USA playlist
        run: |
          curl -L "https://iptv-org.github.io/iptv/countries/us.m3u" -o "USA.m3u"

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add USA.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update IPTVORG USA playlist"
            git push
          fi
