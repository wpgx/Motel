name: LG Channels

on:
  workflow_dispatch:
#  schedule:
#   - cron: '15 2,5,8,11,14,17,20,23 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download LG M3U8
        run: |
          curl -fL \
            "https://scraper.donxman.workers.dev/lg.m3u8" \
            -o lg.m3u8

          test -s lg.m3u8

      - name: Download LG XML
        run: |
          curl -fL \
            "https://scraper.donxman.workers.dev/lg.xml" \
            -o lg.xml

          test -s lg.xml

      - name: Check files
        run: |
          echo "LG channels:"
          grep -c '^#EXTINF:' lg.m3u8 || true

          echo "M3U:"
          ls -lh lg.m3u8

          echo "XML:"
          ls -lh lg.xml

          echo "EPG programs:"
          grep -c '<programme ' lg.xml || true

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"

          git add -f lg.m3u8 lg.xml

          git diff --cached --quiet || \
            git commit -m "update LG channels"

          git push
