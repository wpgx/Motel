#!/usr/bin/env python3
import re, yaml
from pathlib import Path
import xml.sax.saxutils as sax

cfg = yaml.safe_load(open('pluto_sort.yml'))
src_m3u = Path(cfg['source_m3u'])
out_m3u = Path(cfg['output_m3u'])
out_xml = Path(cfg['output_xml'])
order = cfg['category_order']
maps = cfg['mappings']
rev = {o:k for k,v in maps.items() for o in v}

entries=[]
lines = src_m3u.read_text().splitlines()
for i,l in enumerate(lines):
  if l.startswith('#EXTINF'):
    url = lines[i+1] if i+1 < len(lines) else ""
    g = re.search(r'group-title="([^"]+)"',l)
    orig = g.group(1) if g else 'Other'
    entries.append({'cat':rev.get(orig,orig),'extinf':l,'url':url,'name':l.rsplit(',',1)[-1]})

idx={c:i for i,c in enumerate(order)}
entries=sorted(entries,key=lambda e:(idx.get(e['cat'],999),e['name'].lower()))

out=[f'#EXTM3U url-tvg="{out_xml.name}"']
ch=1
for e in entries:
  ext=re.sub(r'group-title="[^"]+"',f'group-title="{e["cat"]}"',e['extinf'])
  ext=re.sub(r'tvg-chno="[^"]+"',f'tvg-chno="{ch}"',ext)
  out.append(ext); out.append(e['url']); ch+=1
open(out_m3u,'w').write('\n'.join(out))
