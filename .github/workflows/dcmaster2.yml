name: dcmaster2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build DCMASTER2
        run: |
          set -e

          # ============================================================
          # DCMaster2 - TRUE COMBINER TEST
          #
          # Plex is already prepared upstream.
          #
          # DO NOT:
          # - parse the Plex M3U
          # - rebuild the Plex M3U
          # - sort it
          # - renumber it
          # - change categories
          # - change tvg-id
          # - deduplicate it
          #
          # Plex files are copied exactly as they exist.
          # ============================================================

          echo "===== SOURCE FILES ====="

          if [ -f plex-ca.m3u8 ]; then
            PLEX_M3U="plex-ca.m3u8"
          elif [ -f plex-ca.m3u ]; then
            PLEX_M3U="plex-ca.m3u"
          else
            echo "ERROR: Plex M3U not found"
            exit 1
          fi

          if [ -f plex-ca.xml.gz ]; then
            PLEX_XML="plex-ca.xml.gz"
          elif [ -f plex-ca.xml ]; then
            PLEX_XML="plex-ca.xml"
          else
            echo "ERROR: Plex guide not found"
            exit 1
          fi

          echo "Plex M3U : $PLEX_M3U"
          echo "Plex guide: $PLEX_XML"

          # ============================================================
          # PLAYLIST
          #
          # Copy the Plex playlist entries exactly.
          # Only replace the top-level #EXTM3U line so the combined
          # playlist points at the DCMaster2 guide.
          #
          # Every #EXTINF line and URL remains byte-for-byte unchanged.
          # ============================================================

          tail -n +2 "$PLEX_M3U" > plex-entries.tmp

          {
            echo '#EXTM3U url-tvg="https://motel.deecee.ca/dcmaster2.xml.gz"'
            cat plex-entries.tmp
          } > dcmaster2.m3u8

          cp dcmaster2.m3u8 dcmaster2.m3u

          # ============================================================
          # GUIDE
          #
          # Plex guide is copied byte-for-byte.
          # No decompression.
          # No parsing.
          # No XML rewriting.
          # ============================================================

          if [ "$PLEX_XML" = "plex-ca.xml.gz" ]; then
            cp plex-ca.xml.gz dcmaster2.xml.gz
          else
            cp plex-ca.xml dcmaster2.xml

            gzip -c plex-ca.xml > dcmaster2.xml.gz
          fi

          # ============================================================
          # REPORT
          # ============================================================

          echo ""
          echo "=========================================="
          echo "DCMASTER2 TRUE COMBINER TEST COMPLETE"
          echo "=========================================="

          echo "M3U channels:"
          grep -c '^#EXTINF' dcmaster2.m3u8 || true

          echo ""
          echo "M3U first line:"
          head -1 dcmaster2.m3u8

          echo ""
          echo "Playlist size:"
          wc -c "$PLEX_M3U"
          wc -c dcmaster2.m3u8

          echo ""
          echo "Guide:"
          ls -lh "$PLEX_XML" dcmaster2.xml.gz

          echo ""
          echo "Guide SHA256:"
          sha256sum "$PLEX_XML" dcmaster2.xml.gz

          echo "=========================================="

      - name: Validate
        run: |
          set -e

          echo "===== VERIFY GZIP ====="
          gzip -t dcmaster2.xml.gz
          echo "dcmaster2.xml.gz OK"

          echo ""
          echo "===== VERIFY PLAYLIST ====="
          echo "M3U channels: $(grep -c '^#EXTINF' dcmaster2.m3u8 || true)"

          echo ""
          echo "===== CHECK DUPLICATES IN M3U ====="
          grep '^#EXTINF' dcmaster2.m3u8 \
            | sed -n 's/.*tvg-id="\([^"]*\)".*/\1/p' \
            | sort \
            | uniq -d \
            | head -50 || true

          echo ""
          echo "===== FILES ====="
          ls -lh dcmaster2.*

      - name: Push to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            dcmaster2.m3u8 \
            dcmaster2.m3u \
            dcmaster2.xml.gz \
            -f

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "dcmaster2 true Plex combiner test"
          git push
