name: dcmaster2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build DCMASTER2
        run: |
          python3 << 'PY'
          import os
          import gzip
          import re

          # ============================================================
          # DCMaster2 - TEST VERSION
          #
          # CURRENT TEST:
          # Plex CA ONLY
          #
          # Original DCMaster is NOT changed.
          # ============================================================

          # ============================================================
          # FIND ONE PLAYLIST
          # ============================================================

          def find_m3u(base):
              if os.path.exists(base + '.m3u8'):
                  return base + '.m3u8'

              if os.path.exists(base + '.m3u'):
                  return base + '.m3u'

              return None

          # ============================================================
          # FIND ONE GUIDE
          #
          # Plex CA is normally plex-ca.xml.gz.
          # It is read directly and decompressed in memory.
          # ============================================================

          def find_xml(base):
              if os.path.exists(base + '.xml'):
                  return base + '.xml'

              if os.path.exists(base + '.xml.gz'):
                  return base + '.xml.gz'

              return None

          # ============================================================
          # LOAD M3U
          # ============================================================

          def load_m3u(path):
              channels = []

              try:
                  with open(
                      path,
                      encoding='utf-8',
                      errors='ignore'
                  ) as f:
                      lines = f.read().splitlines()

                  for i, line in enumerate(lines):

                      if (
                          line.startswith('#EXTINF')
                          and i + 1 < len(lines)
                      ):
                          url = lines[i + 1].strip()

                          if url.startswith('http'):
                              channels.append((line, url))

                  print(
                      f"M3U: {path} -> "
                      f"{len(channels)} channels"
                  )

              except Exception as e:
                  print(
                      f"M3U ERROR: {path}: {e}"
                  )

              return channels

          # ============================================================
          # LOAD XML
          # ============================================================

          def load_xml(path):

              try:

                  if path.endswith('.gz'):

                      print(
                          f"Reading compressed guide: {path}"
                      )

                      with gzip.open(
                          path,
                          'rt',
                          encoding='utf-8',
                          errors='ignore'
                      ) as f:
                          text = f.read()

                  else:

                      with open(
                          path,
                          encoding='utf-8',
                          errors='ignore'
                      ) as f:
                          text = f.read()

                  text = re.sub(
                      r'<\?xml[^?]*\?>',
                      '',
                      text,
                      flags=re.I
                  )

                  text = re.sub(
                      r'<!DOCTYPE[^>]*>',
                      '',
                      text,
                      flags=re.I
                  )

                  start = re.search(
                      r'<tv[^>]*>',
                      text,
                      flags=re.I
                  )

                  end = re.search(
                      r'</tv\s*>',
                      text,
                      flags=re.I
                  )

                  if start and end:
                      text = text[
                          start.end():end.start()
                      ]

                  print(
                      f"XML: {path} -> "
                      f"{len(text)} chars, "
                      f"{text.count('<channel ')} channels, "
                      f"{text.count('<programme')} programmes"
                  )

                  return text

              except Exception as e:

                  print(
                      f"XML ERROR: {path}: {e}"
                  )

                  return ''

          # ============================================================
          # BUILD M3U
          #
          # PLEX CA ONLY FOR THIS TEST.
          #
          # NO DEDUPLICATION.
          # NO SORTING.
          # NO MODIFICATION.
          # ============================================================

          merged = []

          for source in [
              'plex-ca'
          ]:

              path = find_m3u(source)

              if not path:
                  print(
                      f"WARNING: No M3U found for {source}"
                  )
                  continue

              merged.extend(
                  load_m3u(path)
              )

          print(
              f"TOTAL M3U CHANNELS: {len(merged)}"
          )

          m3u_content = (
              '#EXTM3U url-tvg="https://motel.deecee.ca/dcmaster2.xml"\n'
              +
              '\n'.join(
                  f'{extinf}\n{url}'
                  for extinf, url in merged
              )
              +
              '\n'
          )

          with open(
              'dcmaster2.m3u8',
              'w',
              encoding='utf-8'
          ) as f:
              f.write(m3u_content)

          with open(
              'dcmaster2.m3u',
              'w',
              encoding='utf-8'
          ) as f:
              f.write(m3u_content)

          # ============================================================
          # BUILD XML
          #
          # PLEX CA ONLY FOR THIS TEST.
          #
          # The complete Plex guide is copied into the final XML.
          # ============================================================

          path = find_xml('plex-ca')

          if not path:

              print(
                  "ERROR: No Plex CA guide found"
              )

              raise SystemExit(1)

          plex_xml = load_xml(path)

          if not plex_xml:

              print(
                  "ERROR: Plex CA guide is empty"
              )

              raise SystemExit(1)

          final_xml = (
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<tv>\n'
              +
              plex_xml
              +
              '\n</tv>\n'
          )

          with open(
              'dcmaster2.xml',
              'w',
              encoding='utf-8'
          ) as f:
              f.write(final_xml)

          # ============================================================
          # FINAL REPORT
          # ============================================================

          print('')
          print('==========================================')
          print('DCMASTER2 PLEX-ONLY TEST COMPLETE')
          print('==========================================')

          print(
              f'M3U channels: '
              f'{len(merged)}'
          )

          print(
              f'XML channels: '
              f'{final_xml.count("<channel ")}'
          )

          print(
              f'XML programmes: '
              f'{final_xml.count("<programme ")}'
          )

          print(
              f'XML size: '
              f'{len(final_xml)} bytes'
          )

          print(
              'EPG URL: '
              'https://motel.deecee.ca/dcmaster2.xml'
          )

          print('==========================================')
          PY

      - name: Validate
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxml2-utils

          echo "===== VALIDATING DCMaster2 XML ====="
          xmllint --noout dcmaster2.xml
          echo "dcmaster2.xml OK"

          echo "===== FINAL COUNTS ====="
          echo "M3U channels: $(grep -c '^#EXTINF' dcmaster2.m3u8)"
          echo "XML channels: $(grep -c '<channel ' dcmaster2.xml)"
          echo "XML programmes: $(grep -c '<programme ' dcmaster2.xml)"

      - name: Push to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            dcmaster2.m3u8 \
            dcmaster2.m3u \
            dcmaster2.xml \
            -f

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "dcmaster2 Plex-only guide test"
          git push
