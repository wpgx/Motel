name: dcmaster2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build DCMASTER2
        run: |
          python3 << 'PY'
          import os
          import gzip
          import re

          # ============================================================
          # DCMaster2 - PLEX + DCFULL
          #
          # Plex M3U:
          #   Copy exactly as supplied.
          #
          # Plex guide:
          #   Import exactly as before.
          #
          # dcfull:
          #   Added to the combined playlist and guide.
          #
          # Tubi/Roku is NOT included in this test.
          # ============================================================

          # ============================================================
          # FIND PLEX PLAYLIST
          # ============================================================

          if os.path.exists('plex-ca.m3u8'):
              plex_playlist_path = 'plex-ca.m3u8'
          elif os.path.exists('plex-ca.m3u'):
              plex_playlist_path = 'plex-ca.m3u'
          else:
              print("ERROR: No Plex CA playlist found")
              raise SystemExit(1)

          print(f"Plex M3U: {plex_playlist_path}")

          # ============================================================
          # COPY PLEX PLAYLIST EXACTLY
          # ============================================================

          with open(
              plex_playlist_path,
              'rb'
          ) as f:
              plex_playlist_data = f.read()

          # ============================================================
          # FIND DCFULL PLAYLIST
          # ============================================================

          if os.path.exists('dcfull.m3u8'):
              dcfull_playlist_path = 'dcfull.m3u8'
          elif os.path.exists('dcfull.m3u'):
              dcfull_playlist_path = 'dcfull.m3u'
          else:
              print("ERROR: No dcfull playlist found")
              raise SystemExit(1)

          print(f"dcfull M3U: {dcfull_playlist_path}")

          with open(
              dcfull_playlist_path,
              'rb'
          ) as f:
              dcfull_playlist_data = f.read()

          # ============================================================
          # COMBINE PLAYLISTS
          #
          # Plex remains byte-for-byte unchanged.
          # Only the dcfull entries are appended.
          # ============================================================

          plex_lines = plex_playlist_data.splitlines()

          if not plex_lines:
              print("ERROR: Plex playlist is empty")
              raise SystemExit(1)

          plex_header = plex_lines[0]

          dcfull_lines = dcfull_playlist_data.splitlines()

          if dcfull_lines and dcfull_lines[0].startswith(b'#EXTM3U'):
              dcfull_lines = dcfull_lines[1:]

          combined_playlist = (
              b'\n'.join(
                  [plex_header] +
                  plex_lines[1:] +
                  dcfull_lines
              )
              +
              b'\n'
          )

          with open(
              'dcmaster2.m3u8',
              'wb'
          ) as f:
              f.write(combined_playlist)

          with open(
              'dcmaster2.m3u',
              'wb'
          ) as f:
              f.write(combined_playlist)

          # ============================================================
          # FIND PLEX GUIDE
          # ============================================================

          if not os.path.exists('plex-ca.xml.gz'):
              print("ERROR: plex-ca.xml.gz not found")
              raise SystemExit(1)

          print("Plex guide: plex-ca.xml.gz")

          # ============================================================
          # IMPORT PLEX GUIDE EXACTLY AS BEFORE
          # ============================================================

          with gzip.open(
              'plex-ca.xml.gz',
              'rb'
          ) as source_file:
              plex_guide_data = source_file.read()

          # ============================================================
          # FIND DCFULL GUIDE
          # ============================================================

          if os.path.exists('dcfull.xml'):
              dcfull_guide_path = 'dcfull.xml'

          elif os.path.exists('dcfull.xml.gz'):
              dcfull_guide_path = 'dcfull.xml.gz'

          else:
              print("ERROR: No dcfull guide found")
              raise SystemExit(1)

          print(f"dcfull guide: {dcfull_guide_path}")

          # ============================================================
          # LOAD DCFULL GUIDE
          # ============================================================

          if dcfull_guide_path.endswith('.gz'):

              with gzip.open(
                  dcfull_guide_path,
                  'rb'
              ) as source_file:
                  dcfull_guide_data = source_file.read()

          else:

              with open(
                  dcfull_guide_path,
                  'rb'
              ) as source_file:
                  dcfull_guide_data = source_file.read()

          # ============================================================
          # COMBINE GUIDES
          #
          # Keep the actual Plex guide content intact.
          # Keep the dcfull guide content intact.
          # Remove only the outer XML declaration/DOCTYPE/tv wrapper
          # required to place both guides under one <tv> root.
          # ============================================================

          def extract_tv_contents(data):

              text = data.decode(
                  'utf-8',
                  errors='ignore'
              )

              text = re.sub(
                  r'<\?xml[^?]*\?>',
                  '',
                  text,
                  flags=re.I
              )

              text = re.sub(
                  r'<!DOCTYPE[^>]*>',
                  '',
                  text,
                  flags=re.I
              )

              match = re.search(
                  r'<tv\b[^>]*>(.*?)</tv\s*>',
                  text,
                  flags=re.I | re.S
              )

              if match:
                  return match.group(1)

              return text

          plex_content = extract_tv_contents(
              plex_guide_data
          )

          dcfull_content = extract_tv_contents(
              dcfull_guide_data
          )

          final_xml = (
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<tv>\n'
              +
              plex_content
              +
              '\n'
              +
              dcfull_content
              +
              '\n</tv>\n'
          )

          with open(
              'dcmaster2.xml',
              'w',
              encoding='utf-8'
          ) as f:
              f.write(final_xml)

          # ============================================================
          # REPORT
          # ============================================================

          print('')
          print('==========================================')
          print('DCMASTER2 PLEX + DCFULL')
          print('==========================================')

          print(
              f'Plex M3U channels: '
              f'{plex_playlist_data.count(b"#EXTINF")}'
          )

          print(
              f'dcfull M3U channels: '
              f'{dcfull_playlist_data.count(b"#EXTINF")}'
          )

          print(
              f'Total M3U channels: '
              f'{combined_playlist.count(b"#EXTINF")}'
          )

          print(
              f'Plex XML channels: '
              f'{plex_guide_data.count(b"<channel ")}'
          )

          print(
              f'dcfull XML channels: '
              f'{dcfull_guide_data.count(b"<channel ")}'
          )

          print(
              f'Combined XML channels: '
              f'{final_xml.count("<channel ")}'
          )

          print(
              f'Combined XML programmes: '
              f'{final_xml.count("<programme ")}'
          )

          print(
              f'XML size: '
              f'{len(final_xml)} bytes'
          )

          print('==========================================')
          PY

      - name: Validate
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxml2-utils

          echo "===== VALIDATING DCMaster2 XML ====="
          xmllint --noout dcmaster2.xml
          echo "dcmaster2.xml OK"

          echo "===== FINAL COUNTS ====="
          echo "M3U channels: $(grep -c '^#EXTINF' dcmaster2.m3u8 || true)"
          echo "XML channels: $(grep -c '<channel ' dcmaster2.xml || true)"
          echo "XML programmes: $(grep -c '<programme ' dcmaster2.xml || true)"

          echo "===== M3U HEADER ====="
          head -1 dcmaster2.m3u8

      - name: Push to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            dcmaster2.m3u8 \
            dcmaster2.m3u \
            dcmaster2.xml \
            -f

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "dcmaster2 add dcfull"
          git push
