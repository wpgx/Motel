name: dcmaster2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build DCMASTER2
        run: |
          python3 << 'PY'
          import os
          import shutil

          # ============================================================
          # DCMaster2 - PLEX ONLY / GZIP TEST
          #
          # Plex playlist is copied in unchanged.
          #
          # Plex guide:
          #     plex-ca.xml.gz
          #          ↓
          #     dcmaster2.xml.gz
          #
          # The guide is NEVER decompressed.
          # The guide is NEVER parsed.
          # The guide is NEVER rebuilt.
          # ============================================================

          PLEX_GUIDE_URL = "https://motel.deecee.ca/dcmaster2.xml.gz"

          # ============================================================
          # FIND PLEX PLAYLIST
          # ============================================================

          def find_m3u(base):
              if os.path.exists(base + '.m3u8'):
                  return base + '.m3u8'

              if os.path.exists(base + '.m3u'):
                  return base + '.m3u'

              return None

          # ============================================================
          # FIND PLEX GUIDE
          # ============================================================

          def find_xml_gz(base):
              path = base + '.xml.gz'

              if os.path.exists(path):
                  return path

              return None

          # ============================================================
          # LOAD PLEX M3U
          # ============================================================

          playlist_path = find_m3u('plex-ca')

          if not playlist_path:
              print("ERROR: No Plex CA playlist found")
              raise SystemExit(1)

          with open(
              playlist_path,
              'r',
              encoding='utf-8',
              errors='ignore'
          ) as f:
              playlist_data = f.read()

          # ============================================================
          # WRITE DCMaster2 M3U
          #
          # Keep every EXTINF and URL exactly as supplied by Plex.
          # Only change the top-level EPG URL for this test.
          # ============================================================

          lines = playlist_data.splitlines()

          if lines and lines[0].startswith('#EXTM3U'):

              lines[0] = (
                  f'#EXTM3U url-tvg="{PLEX_GUIDE_URL}"'
              )

          else:

              lines.insert(
                  0,
                  f'#EXTM3U url-tvg="{PLEX_GUIDE_URL}"'
              )

          m3u_content = '\n'.join(lines) + '\n'

          with open(
              'dcmaster2.m3u8',
              'w',
              encoding='utf-8'
          ) as f:
              f.write(m3u_content)

          with open(
              'dcmaster2.m3u',
              'w',
              encoding='utf-8'
          ) as f:
              f.write(m3u_content)

          # ============================================================
          # COPY PLEX GZ DIRECTLY
          #
          # NO GUNZIP.
          # NO XML PROCESSING.
          # NO REBUILD.
          # ============================================================

          guide_path = find_xml_gz('plex-ca')

          if not guide_path:

              print(
                  "ERROR: plex-ca.xml.gz not found"
              )

              raise SystemExit(1)

          print(
              f"Plex guide source: {guide_path}"
          )

          shutil.copyfile(
              guide_path,
              'dcmaster2.xml.gz'
          )

          # ============================================================
          # REPORT
          # ============================================================

          source_size = os.path.getsize(
              guide_path
          )

          output_size = os.path.getsize(
              'dcmaster2.xml.gz'
          )

          print('')
          print('==========================================')
          print('DCMASTER2 GZIP TEST COMPLETE')
          print('==========================================')
          print(
              f'Playlist: {playlist_path}'
          )
          print(
              f'Playlist size: '
              f'{len(m3u_content)} bytes'
          )
          print(
              f'Guide source size: '
              f'{source_size} bytes'
          )
          print(
              f'Guide output size: '
              f'{output_size} bytes'
          )
          print(
              f'Guide URL: '
              f'{PLEX_GUIDE_URL}'
          )
          print('Guide copied WITHOUT decompression')
          print('==========================================')
          PY

      - name: Validate
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gzip

          echo "===== VALIDATING GZIP GUIDE ====="
          gzip -t dcmaster2.xml.gz
          echo "dcmaster2.xml.gz OK"

          echo "===== FILE SIZES ====="
          ls -lh plex-ca.xml.gz dcmaster2.xml.gz

          echo "===== SHA256 ====="
          sha256sum plex-ca.xml.gz
          sha256sum dcmaster2.xml.gz

          echo "===== M3U ====="
          echo "M3U channels: $(grep -c '^#EXTINF' dcmaster2.m3u8)"
          head -1 dcmaster2.m3u8

      - name: Push to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            dcmaster2.m3u8 \
            dcmaster2.m3u \
            dcmaster2.xml.gz \
            -f

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "dcmaster2 keep Plex guide compressed"
          git push
