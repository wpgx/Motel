name: dcmaster2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build DCMASTER2
        run: |
          python3 << 'PY'
          import os
          import gzip

          # ============================================================
          # DCMaster2 - PLEX ONLY
          #
          # TESTING THE M3U IMPORT ONLY
          #
          # Plex M3U:
          #   Copy the playlist entries without parsing/rebuilding them.
          #
          # Plex guide:
          #   Import plex-ca.xml.gz exactly as before.
          #
          # NO filtering
          # NO sorting
          # NO deduplication
          # NO category changes
          # NO channel ID changes
          # ============================================================

          # ============================================================
          # FIND PLEX PLAYLIST
          # ============================================================

          if os.path.exists('plex-ca.m3u8'):
              playlist_path = 'plex-ca.m3u8'
          elif os.path.exists('plex-ca.m3u'):
              playlist_path = 'plex-ca.m3u'
          else:
              print("ERROR: No Plex CA playlist found")
              raise SystemExit(1)

          print(f"Plex M3U: {playlist_path}")

          # ============================================================
          # COPY PLEX PLAYLIST
          #
          # Do NOT parse or rebuild the EXTINF entries.
          # Keep the existing Plex playlist exactly as supplied.
          # ============================================================

          with open(
              playlist_path,
              'rb'
          ) as f:
              playlist_data = f.read()

          with open(
              'dcmaster2.m3u8',
              'wb'
          ) as f:
              f.write(playlist_data)

          with open(
              'dcmaster2.m3u',
              'wb'
          ) as f:
              f.write(playlist_data)

          # ============================================================
          # FIND PLEX GUIDE
          # ============================================================

          if not os.path.exists('plex-ca.xml.gz'):
              print("ERROR: plex-ca.xml.gz not found")
              raise SystemExit(1)

          print("Plex guide: plex-ca.xml.gz")

          # ============================================================
          # IMPORT PLEX XML.GZ
          #
          # THIS IS THE ORIGINAL XML IMPORT METHOD.
          #
          # Decompress the Plex guide into dcmaster2.xml.
          # No filtering or XML rebuilding.
          # ============================================================

          with gzip.open(
              'plex-ca.xml.gz',
              'rb'
          ) as source_file:

              guide_data = source_file.read()

          with open(
              'dcmaster2.xml',
              'wb'
          ) as output_file:

              output_file.write(guide_data)

          # ============================================================
          # REPORT
          # ============================================================

          print('')
          print('==========================================')
          print('DCMASTER2 PLEX-ONLY M3U IMPORT TEST')
          print('==========================================')

          print(
              f'M3U channels: '
              f'{playlist_data.count(b"#EXTINF")}'
          )

          print(
              f'XML channels: '
              f'{guide_data.count(b"<channel ")}'
          )

          print(
              f'XML programmes: '
              f'{guide_data.count(b"<programme ")}'
          )

          print(
              f'XML size: '
              f'{len(guide_data)} bytes'
          )

          print('==========================================')
          PY

      - name: Validate
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxml2-utils

          echo "===== VALIDATING DCMaster2 XML ====="
          xmllint --noout dcmaster2.xml
          echo "dcmaster2.xml OK"

          echo "===== FINAL COUNTS ====="
          echo "M3U channels: $(grep -c '^#EXTINF' dcmaster2.m3u8 || true)"
          echo "XML channels: $(grep -c '<channel ' dcmaster2.xml || true)"
          echo "XML programmes: $(grep -c '<programme ' dcmaster2.xml || true)"

          echo "===== M3U HEADER ====="
          head -1 dcmaster2.m3u8

      - name: Push to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            dcmaster2.m3u8 \
            dcmaster2.m3u \
            dcmaster2.xml \
            -f

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "dcmaster2 test Plex M3U import"
          git push
