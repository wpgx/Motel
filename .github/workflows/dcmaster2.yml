name: dcmaster2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build DCMASTER2
        run: |
          python3 << 'PY'
          import os
          import gzip

          # ============================================================
          # DCMaster2 - PLEX ONLY TEST
          #
          # plex-ca.xml.gz is decompressed and copied directly to
          # dcmaster2.xml.
          #
          # NO XML parsing
          # NO XML rebuilding
          # NO filtering
          # NO deduplication
          # ============================================================

          def find_m3u(base):
              if os.path.exists(base + '.m3u8'):
                  return base + '.m3u8'
              if os.path.exists(base + '.m3u'):
                  return base + '.m3u'
              return None

          def find_xml(base):
              if os.path.exists(base + '.xml'):
                  return base + '.xml'
              if os.path.exists(base + '.xml.gz'):
                  return base + '.xml.gz'
              return None

          # ============================================================
          # LOAD PLEX M3U
          # ============================================================

          playlist_path = find_m3u('plex-ca')

          if not playlist_path:
              print("ERROR: No Plex CA playlist found")
              raise SystemExit(1)

          channels = []

          with open(
              playlist_path,
              encoding='utf-8',
              errors='ignore'
          ) as f:
              lines = f.read().splitlines()

          for i, line in enumerate(lines):

              if (
                  line.startswith('#EXTINF')
                  and i + 1 < len(lines)
              ):

                  url = lines[i + 1].strip()

                  if url.startswith('http'):
                      channels.append(
                          (line, url)
                      )

          print(
              f"M3U: {playlist_path} -> "
              f"{len(channels)} channels"
          )

          # ============================================================
          # WRITE PLEX M3U
          # ============================================================

          m3u_content = (
              '#EXTM3U url-tvg="https://motel.deecee.ca/dcmaster2.xml"\n'
              +
              '\n'.join(
                  f'{extinf}\n{url}'
                  for extinf, url in channels
              )
              +
              '\n'
          )

          with open(
              'dcmaster2.m3u8',
              'w',
              encoding='utf-8'
          ) as f:
              f.write(m3u_content)

          with open(
              'dcmaster2.m3u',
              'w',
              encoding='utf-8'
          ) as f:
              f.write(m3u_content)

          # ============================================================
          # DIRECT PLEX GUIDE IMPORT
          # ============================================================

          guide_path = find_xml('plex-ca')

          if not guide_path:
              print("ERROR: No Plex CA guide found")
              raise SystemExit(1)

          print(
              f"Guide source: {guide_path}"
          )

          if guide_path.endswith('.gz'):

              print(
                  "Decompressing Plex guide directly..."
              )

              with gzip.open(
                  guide_path,
                  'rb'
              ) as source_file:
                  guide_data = source_file.read()

          else:

              with open(
                  guide_path,
                  'rb'
              ) as source_file:
                  guide_data = source_file.read()

          print(
              f"Guide size: {len(guide_data)} bytes"
          )

          # DIRECT COPY - NOTHING ELSE
          with open(
              'dcmaster2.xml',
              'wb'
          ) as output_file:
              output_file.write(guide_data)

          print("Plex guide copied directly")

          # ============================================================
          # REPORT
          # ============================================================

          print('')
          print('==========================================')
          print('DCMASTER2 BUILD COMPLETE')
          print('==========================================')
          print(
              f'M3U channels: '
              f'{len(channels)}'
          )
          print(
              f'XML channels: '
              f'{guide_data.count(b"<channel ")}'
          )
          print(
              f'XML programmes: '
              f'{guide_data.count(b"<programme ")}'
          )
          print(
              f'XML size: '
              f'{len(guide_data)} bytes'
          )
          print('==========================================')
          PY

      - name: Validate
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxml2-utils

          echo "===== VALIDATING DCMaster2 XML ====="
          xmllint --noout dcmaster2.xml
          echo "dcmaster2.xml OK"

          echo "===== FINAL COUNTS ====="
          echo "M3U channels: $(grep -c '^#EXTINF' dcmaster2.m3u8)"
          echo "XML channels: $(grep -c '<channel ' dcmaster2.xml)"
          echo "XML programmes: $(grep -c '<programme ' dcmaster2.xml)"

      - name: Push to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            dcmaster2.m3u8 \
            dcmaster2.m3u \
            dcmaster2.xml \
            -f

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "dcmaster2 direct Plex guide import test"
          git push
