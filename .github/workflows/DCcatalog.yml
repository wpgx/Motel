name: Sort DCcatalog
on:
  workflow_dispatch:
  schedule:
    - cron: '50 2,5,8,11,14,17,20,23 * * *'
concurrency:
  group: dccatalog
  cancel-in-progress: true
jobs:
  sort:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build DCcatalog
        run: |
          python3 - << 'PY'
          import re, shutil, gzip
          from pathlib import Path
          from collections import Counter

          # Add more here as you spot them in Sparkle
          MERGE = {
              # ---- NEWS -> all to "News" ----
              "news & opinion": "News",
              "news and opinion": "News",
              "local news": "News",
              "national news": "News",
              "business news": "News",
              "global news": "News",
              "news & weather": "News",
              "news and weather": "News",
              "live news": "News",

              # ---- CRIME ----
              "true crime": "Crime",
              "crime": "Crime",
              "crime scenes": "Crime",
              "crime thrillher": "Crime",
              "crime cults killers": "Crime",
              "chasing criminals": "Crime",
              "cold case files": "Crime",
              "a&e crime 360": "Crime",
              "crime & mystery": "Crime",

              # ---- COMEDY ----
              "always funny": "Comedy",
              "comedy dynamics": "Comedy",
              "comedy": "Comedy",

              # ---- SCI-FI / DRAMA ----
              "sci-fi & supernatural": "Drama & Sci-Fi",
              "sci-fi and supernatural": "Drama & Sci-Fi",
              "classic doctor who": "Drama & Sci-Fi",
              "alien nation by dust": "Drama & Sci-Fi",
              "dust": "Drama & Sci-Fi",
              "drama & sci-fi": "Drama & Sci-Fi",
              "drama and sci-fi": "Drama & Sci-Fi",

              # ---- MOVIES ----
              "movie channels": "Movies",
              "classic cinema": "Movies",
              "at the movies": "Movies",
              "cinevault": "Movies",
              "movies": "Movies",

              # ---- SPORTS ----
              "sports on now": "Sports",
              "games & competition": "Sports",
              "sports": "Sports",

              # ---- REALITY ----
              "pop culture": "Entertainment",
              "reality": "Entertainment",
              "black entertainment": "Entertainment",
              "entertainment & reality": "Entertainment",
              "entertainment and reality": "Entertainment",
              "entertainment": "Entertainment",

              # ---- HOME / FOOD ----
              "good eats": "Home & Food",
              "lifestyle": "Home & Food",
              "home & food": "Home & Food",

              # ---- DOCS / NATURE ----
              "science & nature": "Nature",
              "documentaries": "Nature",
              "nature & science": "Nature",
              "nature": "Nature",
              "science": "Nature",
              "documentary": "Nature",

              # ---- KIDS ----
              "kids": "Kids",
              "family": "Kids",

              # ---- SPANISH ----
              "español": "Español",
              "spanish": "Español",

              # ---- MUSIC ----
              "music": "Music",
          }

          def clean_cat(g):
              if not g: return "Other"
              gl = g.lower().strip()
              if gl in MERGE:
                  return MERGE[gl]
              for k,v in MERGE.items():
                  if k in gl:
                      return v
              return g.strip().title()

          src=Path("dcmaster.m3u8")
          lines=src.read_text(encoding='utf-8', errors='ignore').splitlines()

          seen_urls=set()
          entries=[]
          for i,l in enumerate(lines):
              if not l.startswith("#EXTINF"): continue
              url=lines[i+1].strip() if i+1 < len(lines) else ""
              if not url.startswith("http"): continue
              name=l.rsplit(",",1)[-1].strip()
              if "welcome" in name.lower() and "motel" in name.lower(): continue

              m=re.search(r'group-title="([^"]+)"',l)
              orig=m.group(1) if m else "Other"
              if orig.lower() in ("tubi","roku"): orig="Other"

              cat = clean_cat(orig)

              if url in seen_urls: continue
              seen_urls.add(url)
              entries.append((cat, name.lower(), l, url))

          entries.sort(key=lambda x:(x[0].lower(), x[1]))

          out=['#EXTM3U url-tvg="https://motel.deecee.ca/dccatalog.xml"']
          for cat,_,ext,url in entries:
              ext=re.sub(r'group-title="[^"]+"',f'group-title="{cat}"',ext)
              if 'group-title=' not in ext:
                  ext=ext.replace('#EXTINF:-1', f'#EXTINF:-1 group-title="{cat}"',1)
              # KEEP ORIGINAL tvg-chno
              out.append(ext)
              out.append(url)

          text="\n".join(out)
          Path("dccatalog.m3u8").write_text(text, encoding='utf-8')
          Path("DCcatalog.m3u8").write_text(text, encoding='utf-8')
          Path("dccatalog.m3u").write_text(text, encoding='utf-8')
          Path("DCcatalog.m3u").write_text(text, encoding='utf-8')

          c=Counter([cat for cat,_,_,_ in entries])
          for k,v in sorted(c.items()):
              print(f"{k}: {v}")
          print(f"\nBuilt {len(entries)} channels, {len(c)} categories")

          if Path("dcmaster.xml").exists():
              shutil.copy("dcmaster.xml","dccatalog.xml")
              shutil.copy("dcmaster.xml","DCcatalog.xml")
              for gz_name in ["dccatalog.xml.gz","DCcatalog.xml.gz"]:
                  with open("dcmaster.xml","rb") as f_in:
                      with gzip.open(gz_name,"wb") as f_out:
                          shutil.copyfileobj(f_in, f_out)
          PY

      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add DCcatalog.m3u8 DCcatalog.m3u DCcatalog.xml DCcatalog.xml.gz dccatalog.m3u8 dccatalog.m3u dccatalog.xml dccatalog.xml.gz -f
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "DCcatalog: keep chno + merge duplicate categories"
          git push
