name: Sort DCcatalog

on:
  workflow_dispatch:
  schedule:
    - cron: '50 2,5,8,11,14,17,20,23 * * *'

concurrency:
  group: dccatalog
  cancel-in-progress: true

jobs:
  sort:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build DCcatalog
        run: |
          python3 - << 'PY'
          import re
          import gzip
          from pathlib import Path
          from collections import Counter, defaultdict
          import xml.etree.ElementTree as ET

          # ============================================================
          # CATEGORY MERGES
          # ============================================================

          MERGE = {

              # ---------------- HOME & FOOD ----------------
              "home & food": "Home & Food",
              "home + food": "Home & Food",
              "home and food": "Home & Food",
              "good eats": "Home & Food",
              "lifestyle": "Home & Food",

              # ---------------- CRIME ----------------
              "true crime": "Crime",
              "crime": "Crime",
              "crime scenes": "Crime",
              "crime thrillher": "Crime",
              "crime cults killers": "Crime",
              "chasing criminals": "Crime",
              "cold case files": "Crime",
              "a&e crime 360": "Crime",
              "crime & mystery": "Crime",

              # ---------------- COMEDY ----------------
              "always funny": "Comedy",
              "comedy dynamics": "Comedy",

              # ---------------- DRAMA ----------------
              "tv dramas": "Drama",
              "tv drama": "Drama",
              "drama": "Drama",

              # ---------------- SCI-FI & HORROR ----------------
              "horror": "Sci-Fi & Horror",
              "sci-fi": "Sci-Fi & Horror",
              "scifi": "Sci-Fi & Horror",
              "sci-fi & supernatural": "Sci-Fi & Horror",
              "sci-fi + supernatural": "Sci-Fi & Horror",
              "sci-fi and supernatural": "Sci-Fi & Horror",
              "classic doctor who": "Sci-Fi & Horror",
              "alien nation by dust": "Sci-Fi & Horror",
              "dust": "Sci-Fi & Horror",
              "supernatural": "Sci-Fi & Horror",
              "drama & sci-fi": "Sci-Fi & Horror",
              "paranormal": "Sci-Fi & Horror",
              "out of this world": "Sci-Fi & Horror",

              # ---------------- MOVIES ----------------
              "movies": "Movies",
              "movie channels": "Movies",
              "classic cinema": "Movies",
              "at the movies": "Movies",
              "cinevault": "Movies",
              "tv & movies": "Movies",

              # ---------------- SPORTS ----------------
              "sports": "Sports",
              "sports on now": "Sports",
              "sports & outdoors": "Sports",
              "sports and outdoors": "Sports",
              "games & competition": "Sports",
              "games + competition": "Sports",

              # ---------------- ENTERTAINMENT ----------------
              "pop culture": "Entertainment",
              "reality": "Entertainment",
              "black entertainment": "Entertainment",
              "entertainment & reality": "Entertainment",
              "entertainment + reality": "Entertainment",

              # ---------------- KIDS ----------------
              "kids": "Kids",
              "kids & family": "Kids",
              "kids + family": "Kids",
              "kids and family": "Kids",
              "family": "Kids",

              # ---------------- DOCUMENTARY ----------------
              "documentary": "Documentary",
              "documentaries": "Documentary",
              "documentary & science": "Documentary",
              "documentary and science": "Documentary",

              # ---------------- NATURE & SCIENCE ----------------
              "nature": "Nature & Science",
              "nature history": "Nature & Science",
              "nature & history": "Nature & Science",
              "nature history and science": "Nature & Science",
              "nature history & science": "Nature & Science",
              "science": "Nature & Science",
              "science & nature": "Nature & Science",
              "nature & science": "Nature & Science",
              "nature and science": "Nature & Science",
          }

          # Categories to remove completely.
          REMOVE_CATEGORIES = {
              "espanol",
              "español",
              "latin",
              "spanish",
              "spanish language",
              "spanish-language",
          }

          # ============================================================
          # CANADA / USA NEWS CLASSIFICATION
          # ============================================================

          CANADA_NEWS = (
              "cbc",
              "cbc news",
              "cbc news network",
              "ctv",
              "ctv news",
              "ctv news channel",
              "global news",
              "global national",
              "cp24",
              "bnn bloomberg",
              "bnn",
              "citynews",
              "city news",
              "chek news",
              "canada news",
              "canadian news",
              "manitoba news",
              "ontario news",
              "alberta news",
              "saskatchewan news",
              "british columbia news",
              "atlantic news",
          )

          USA_NEWS = (
              "cnn",
              "cnn news",
              "cnn us",
              "fox news",
              "fox news channel",
              "msnbc",
              "newsmax",
              "newsmax tv",
              "newsnation",
              "abc news",
              "cbs news",
              "nbc news",
              "nbc news now",
              "newsnow from fox",
              "one america news",
              "oan",
              "american news",
              "america's news",
          )

          def normalize_category(raw):
              if not raw:
                  return "Other"

              g = raw.strip()

              # Fix HTML entities and the exact source spelling
              # "TV &Amp; Movies".
              g = re.sub(
                  r'&amp;',
                  '&',
                  g,
                  flags=re.IGNORECASE
              )

              g = re.sub(
                  r'\s+',
                  ' ',
                  g
              ).strip()

              gl = g.lower()

              # Explicitly catch TV & Movies.
              if gl == "tv & movies":
                  return "Movies"

              # Normalize + and "and".
              lookup = (
                  gl
                  .replace("+", "&")
                  .replace(" and ", " & ")
              )

              lookup = re.sub(
                  r'\s+',
                  ' ',
                  lookup
              ).strip()

              if lookup in MERGE:
                  return MERGE[lookup]

              for key, value in MERGE.items():
                  if key in lookup:
                      return value

              return g.title()

          def classify_news(name, category):
              """
              Split generic News into Canada / USA / International.
              International is the safe fallback.
              """

              if category not in (
                  "News",
                  "International"
              ):
                  return category

              n = name.lower().strip()

              # Canadian news
              for item in CANADA_NEWS:
                  if n == item or n.startswith(item + " "):
                      return "Canada"

              # U.S. news
              for item in USA_NEWS:
                  if n == item or n.startswith(item + " "):
                      return "USA"

              # Everything else formerly considered News
              # becomes International.
              return "International"

          # ============================================================
          # EPG DATA
          # ============================================================

          good_ids = set()

          if Path("dcmaster.xml").exists():
              try:
                  tree = ET.parse("dcmaster.xml")
                  root = tree.getroot()

                  for prog in root.findall("programme"):
                      title = prog.findtext(
                          "title",
                          ""
                      ).lower()

                      if (
                          title
                          and "no information" not in title
                          and "to be announced" not in title
                      ):
                          good_ids.add(
                              prog.get("channel", "")
                          )

              except Exception as e:
                  print(f"EPG parse warning: {e}")

          # ============================================================
          # CATEGORY ORDER
          # ============================================================

          TOP = [
              "Canada",
              "USA",
              "International",
              "Sports",
              "Movies"
          ]

          BOTTOM = [
              "Ambiance",
              "Anime & Gaming",
              "Anime"
          ]

          def sort_key(item):
              category = item[0]

              if category in TOP:
                  return (
                      0,
                      TOP.index(category),
                      item[1]
                  )

              if (
                  category in BOTTOM
                  or "ambiance" in category.lower()
                  or "anime" in category.lower()
              ):
                  return (
                      2,
                      category.lower(),
                      item[1]
                  )

              return (
                  1,
                  category.lower(),
                  item[1]
              )

          # ============================================================
          # READ MASTER PLAYLIST
          # ============================================================

          src = Path("dcmaster.m3u8")

          lines = src.read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines()

          # ============================================================
          # GROUP CHANNELS
          # ============================================================

          by_name = defaultdict(list)

          removed_categories = Counter()
          removed_channels = []

          for i, line in enumerate(lines):

              if not line.startswith("#EXTINF"):
                  continue

              url = (
                  lines[i + 1].strip()
                  if i + 1 < len(lines)
                  else ""
              )

              if not url.startswith("http"):
                  continue

              name = line.rsplit(
                  ",",
                  1
              )[-1].strip()

              # Remove motel welcome channels.
              if (
                  "welcome" in name.lower()
                  and "motel" in name.lower()
              ):
                  removed_channels.append(
                      f"{name} [welcome]"
                  )
                  continue

              # --------------------------------------------------------
              # DO NOT REMOVE THE MYSTERY CHANNEL 1 YET.
              #
              # Its display name changes, so we don't want to delete a
              # legitimate channel accidentally. We will identify the
              # actual 500/slot field separately.
              # --------------------------------------------------------

              match = re.search(
                  r'group-title="([^"]+)"',
                  line,
                  flags=re.IGNORECASE
              )

              original_category = (
                  match.group(1)
                  if match
                  else "Other"
              )

              original_lower = (
                  original_category
                  .strip()
                  .lower()
              )

              # Remove Spanish categories entirely.
              if original_lower in REMOVE_CATEGORIES:

                  removed_categories[
                      original_category
                  ] += 1

                  removed_channels.append(
                      name
                  )

                  continue

              # Tubi/Roku stay available but remain Other.
              if original_lower in (
                  "tubi",
                  "roku"
              ):
                  original_category = "Other"

              category = normalize_category(
                  original_category
              )

              # All News gets split into Canada / USA /
              # International.
              category = classify_news(
                  name,
                  category
              )

              tvg_match = re.search(
                  r'tvg-id="([^"]+)"',
                  line,
                  flags=re.IGNORECASE
              )

              tvg_id = (
                  tvg_match.group(1)
                  if tvg_match
                  else ""
              )

              by_name[
                  name.lower()
              ].append(
                  (
                      category,
                      name,
                      line,
                      url,
                      tvg_id
                  )
              )

          # ============================================================
          # DEDUPE
          # ============================================================

          entries = []
          dupes_removed = 0

          for name_low, channels in by_name.items():

              if len(channels) == 1:

                  category, _, ext, url, _ = channels[0]

                  entries.append(
                      (
                          category,
                          name_low,
                          ext,
                          url
                      )
                  )

              else:

                  # Prefer the copy with actual guide data.
                  channels_sorted = sorted(
                      channels,
                      key=lambda x: (
                          x[4] not in good_ids,
                          x[0]
                      )
                  )

                  category, _, ext, url, _ = (
                      channels_sorted[0]
                  )

                  entries.append(
                      (
                          category,
                          name_low,
                          ext,
                          url
                      )
                  )

                  dupes_removed += (
                      len(channels) - 1
                  )

          # ============================================================
          # SORT
          # ============================================================

          entries.sort(
              key=sort_key
          )

          # ============================================================
          # WRITE CATALOG
          # ============================================================

          out = [
              '#EXTM3U url-tvg="https://motel.deecee.ca/dccatalog.xml"'
          ]

          for category, _, ext, url in entries:

              ext = re.sub(
                  r'group-title="[^"]+"',
                  f'group-title="{category}"',
                  ext,
                  flags=re.IGNORECASE
              )

              if "group-title=" not in ext.lower():

                  ext = ext.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 group-title="{category}"',
                      1
                  )

              out.append(ext)
              out.append(url)

          text = "\n".join(out)

          for filename in [
              "dccatalog.m3u8",
              "DCcatalog.m3u8",
              "dccatalog.m3u",
              "DCcatalog.m3u"
          ]:
              Path(filename).write_text(
                  text,
                  encoding="utf-8"
              )

          # ============================================================
          # REPORT
          # ============================================================

          counts = Counter(
              category
              for category, _, _, _ in entries
          )

          ordered_categories = (
              TOP
              +
              [
                  x
                  for x in sorted(counts)
                  if x not in TOP
                  and x not in BOTTOM
                  and "ambiance" not in x.lower()
                  and "anime" not in x.lower()
              ]
              +
              [
                  x
                  for x in sorted(counts)
                  if (
                      x in BOTTOM
                      or "ambiance" in x.lower()
                      or "anime" in x.lower()
                  )
              ]
          )

          print()
          print("========================================")
          print("        DCcatalog CATEGORY REPORT")
          print("========================================")

          for category in ordered_categories:
              print(
                  f"{category:<25} {counts[category]:>4}"
              )

          print("----------------------------------------")
          print(
              f"TOTAL CHANNELS:          {len(entries)}"
          )
          print(
              f"DUPLICATES REMOVED:      {dupes_removed}"
          )
          print(
              f"CATEGORIES:              {len(counts)}"
          )
          print("========================================")

          if removed_categories:

              print()
              print(
                  "REMOVED SPANISH CATEGORIES:"
              )

              for category, count in (
                  removed_categories.items()
              ):
                  print(
                      f"  {category}: {count}"
                  )

          if removed_channels:

              print()
              print(
                  "OTHER REMOVED CHANNELS:"
              )

              for channel in removed_channels:
                  print(
                      f"  {channel}"
                  )

          # ============================================================
          # EPG
          # ============================================================

          if Path("dcmaster.xml").exists():

              xml_text = Path(
                  "dcmaster.xml"
              ).read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              xml_text = xml_text.replace(
                  "No Information",
                  "To Be Announced"
              )

              xml_text = xml_text.replace(
                  "No information",
                  "To Be Announced"
              )

              Path(
                  "dccatalog.xml"
              ).write_text(
                  xml_text,
                  encoding="utf-8"
              )

              Path(
                  "DCcatalog.xml"
              ).write_text(
                  xml_text,
                  encoding="utf-8"
              )

              for filename in [
                  "dccatalog.xml.gz",
                  "DCcatalog.xml.gz"
              ]:

                  Path(filename).write_bytes(
                      gzip.compress(
                          xml_text.encode("utf-8")
                      )
                  )

          PY

      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"

          git add \
            DCcatalog.m3u8 \
            DCcatalog.m3u \
            DCcatalog.xml \
            DCcatalog.xml.gz \
            dccatalog.m3u8 \
            dccatalog.m3u \
            dccatalog.xml \
            dccatalog.xml.gz \
            -f

          git diff --cached --quiet && \
            echo "No change" && \
            exit 0

          git commit \
            -m "DCcatalog: organize categories"

          git push
