name: Sort DCcatalog
on:
  workflow_dispatch:
  schedule:
    - cron: '50 2,5,8,11,14,17,20,23 * * *'
concurrency:
  group: dccatalog
  cancel-in-progress: true
jobs:
  sort:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build DCcatalog
        run: |
          python3 - << 'PY'
          import re, shutil, gzip
          from pathlib import Path

          # Just rename categories here - add more as you see them
          MERGE = {
              # News
              "news & opinion": "News",
              "local news": "News",
              "national news": "News",
              "business news": "News",
              "global news": "News",
              "news & weather": "News",

              # Crime
              "true crime": "Crime & Mystery",
              "crime": "Crime & Mystery",
              "crime scenes": "Crime & Mystery",
              "crime thrillher": "Crime & Mystery",
              "crime cults killers": "Crime & Mystery",
              "chasing criminals": "Crime & Mystery",
              "cold case files": "Crime & Mystery",
              "a&e crime 360": "Crime & Mystery",

              # Comedy
              "always funny": "Comedy",
              "comedy dynamics": "Comedy",

              # Sci-Fi / Drama
              "sci-fi & supernatural": "Drama & Sci-Fi",
              "classic doctor who": "Drama & Sci-Fi",
              "alien nation by dust": "Drama & Sci-Fi",
              "dust": "Drama & Sci-Fi",

              # Movies
              "movie channels": "Movies",
              "classic cinema": "Movies",
              "at the movies": "Movies",
              "cinevault": "Movies",

              # Sports
              "sports on now": "Sports",
              "games & competition": "Sports",

              # Reality / Entertainment
              "pop culture": "Entertainment & Reality",
              "reality": "Entertainment & Reality",
              "black entertainment": "Entertainment & Reality",

              # Home / Food
              "good eats": "Home & Food",
              "lifestyle": "Home & Food",

              # Docs
              "science & nature": "Nature & Science",
              "documentaries": "Nature & Science",

              # Spanish
              "español": "Español",
          }

          def clean_cat(g):
              gl = g.lower().strip()
              # direct match
              if gl in MERGE:
                  return MERGE[gl]
              # contains match (so "News & Opinion" still hits)
              for k,v in MERGE.items():
                  if k in gl:
                      return v
              return g.strip()

          src=Path("dcmaster.m3u8")
          lines=src.read_text(encoding='utf-8', errors='ignore').splitlines()

          seen=set()
          entries=[]
          for i,l in enumerate(lines):
              if not l.startswith("#EXTINF"): continue
              url=lines[i+1].strip() if i+1 < len(lines) else ""
              if not url.startswith("http"): continue
              name=l.rsplit(",",1)[-1].strip()
              if "welcome" in name.lower() and "motel" in name.lower(): continue

              m=re.search(r'group-title="([^"]+)"',l)
              orig=m.group(1) if m else "Other"
              if orig in ("Tubi","Roku"): orig="Other"

              cat = clean_cat(orig)

              key=(url) # dedupe by URL only
              if key in seen: continue
              seen.add(key)
              entries.append((cat, name.lower(), l, url))

          # sort by category then name
          entries.sort(key=lambda x:(x[0].lower(), x[1]))

          out=['#EXTM3U url-tvg="https://motel.deecee.ca/dccatalog.xml"']
          for cnum,(cat,_,ext,url) in enumerate(entries,1):
              ext=re.sub(r'group-title="[^"]+"',f'group-title="{cat}"',ext)
              if 'group-title=' not in ext:
                  ext=ext.replace('#EXTINF:-1', f'#EXTINF:-1 group-title="{cat}"',1)
              ext=re.sub(r'tvg-chno="[^"]+"',f'tvg-chno="{cnum}"',ext) if 'tvg-chno=' in ext else ext.replace('#EXTINF:-1', f'#EXTINF:-1 tvg-chno="{cnum}"',1)
              out.append(ext)
              out.append(url)

          text="\n".join(out)
          Path("dccatalog.m3u8").write_text(text, encoding='utf-8')
          Path("DCcatalog.m3u8").write_text(text, encoding='utf-8')
          Path("dccatalog.m3u").write_text(text, encoding='utf-8')
          Path("DCcatalog.m3u").write_text(text, encoding='utf-8')
          print(f"Built {len(entries)} channels")
          # show final categories
          from collections import Counter
          print(Counter([c for c,_,_,_ in entries]))

          if Path("dcmaster.xml").exists():
              shutil.copy("dcmaster.xml","dccatalog.xml")
              shutil.copy("dcmaster.xml","DCcatalog.xml")
              for gz_name in ["dccatalog.xml.gz","DCcatalog.xml.gz"]:
                  with open("dcmaster.xml","rb") as f_in:
                      with gzip.open(gz_name,"wb") as f_out:
                          shutil.copyfileobj(f_in, f_out)
          PY

      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add DCcatalog.m3u8 DCcatalog.m3u DCcatalog.xml DCcatalog.xml.gz dccatalog.m3u8 dccatalog.m3u dccatalog.xml dccatalog.xml.gz -f
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "DCcatalog: simple category merge by renaming"
          git push
