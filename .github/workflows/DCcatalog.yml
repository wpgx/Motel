name: Sort DCcatalog
on:
  workflow_dispatch:
  schedule:
    - cron: '50 2,5,8,11,14,17,20,23 * * *'
concurrency:
  group: dccatalog
  cancel-in-progress: true
jobs:
  sort:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build DCcatalog
        run: |
          python3 - << 'PY'
          import re, shutil, gzip
          from pathlib import Path
          from collections import Counter

          MERGE = {
              # NEWS - includes Weather
              "news & opinion": "News",
              "news and opinion": "News",
              "news & weather": "News",
              "news and weather": "News",
              "local news": "News",
              "national news": "News",
              "business news": "News",
              "global news": "News",
              "live news": "News",
              "weather": "News",
              "news": "News",

              # HOME & FOOD - fix & vs + dupes
              "home & food": "Home & Food",
              "home + food": "Home & Food",
              "home and food": "Home & Food",
              "home food": "Home & Food",
              "good eats": "Home & Food",
              "lifestyle": "Home & Food",

              # CRIME
              "true crime": "Crime",
              "crime": "Crime",
              "crime scenes": "Crime",
              "crime thrillher": "Crime",
              "crime cults killers": "Crime",
              "chasing criminals": "Crime",
              "cold case files": "Crime",
              "a&e crime 360": "Crime",
              "crime & mystery": "Crime",

              # COMEDY
              "always funny": "Comedy",
              "comedy dynamics": "Comedy",

              # DRAMA
              "tv dramas": "Drama",
              "tv drama": "Drama",
              "drama": "Drama",

              # SCI-FI & HORROR
              "horror": "Sci-Fi & Horror",
              "sci-fi & supernatural": "Sci-Fi & Horror",
              "sci-fi + supernatural": "Sci-Fi & Horror",
              "sci-fi and supernatural": "Sci-Fi & Horror",
              "classic doctor who": "Sci-Fi & Horror",
              "alien nation by dust": "Sci-Fi & Horror",
              "dust": "Sci-Fi & Horror",
              "sci-fi": "Sci-Fi & Horror",
              "scifi": "Sci-Fi & Horror",
              "supernatural": "Sci-Fi & Horror",
              "drama & sci-fi": "Sci-Fi & Horror",
              "drama + sci-fi": "Sci-Fi & Horror",
              "drama and sci-fi": "Sci-Fi & Horror",

              # MOVIES
              "movie channels": "Movies",
              "classic cinema": "Movies",
              "at the movies": "Movies",
              "cinevault": "Movies",

              # SPORTS
              "sports on now": "Sports",
              "games & competition": "Sports",
              "games + competition": "Sports",
              "games and competition": "Sports",

              # ENTERTAINMENT
              "pop culture": "Entertainment",
              "reality": "Entertainment",
              "black entertainment": "Entertainment",
              "entertainment & reality": "Entertainment",
              "entertainment + reality": "Entertainment",
              "entertainment and reality": "Entertainment",

              # KIDS - includes Kids and Family
              "kids & family": "Kids",
              "kids + family": "Kids",
              "kids and family": "Kids",
              "family": "Kids",
              "kids": "Kids",

              # NATURE - Nature History and Science removed/merged
              "nature history and science": "Nature",
              "nature history & science": "Nature",
              "history & science": "Nature",
              "science & nature": "Nature",
              "science + nature": "Nature",
              "science and nature": "Nature",
              "documentaries": "Nature",
              "nature & science": "Nature",
              "nature + science": "Nature",
              "nature and science": "Nature",
              "nature": "Nature",
              "science": "Nature",
              "documentary": "Nature",
              "history": "Nature",
          }

          def clean_cat(g):
              if not g: return "Other"
              gl = g.lower().strip()
              gl = gl.replace("+", "&")
              gl = gl.replace(" and ", " & ")
              gl = re.sub(r'\s+', ' ', gl)
              if gl in MERGE:
                  return MERGE[gl]
              for k,v in MERGE.items():
                  if k in gl:
                      return v
              return g.strip().title()

          # Order: News, Sports, Movies on top - Ambiance/Anime on bottom
          TOP = ["News", "Sports", "Movies"]
          BOTTOM = ["Ambiance", "Anime & Gaming", "Anime", "Ambiance & Anime"]

          def sort_key(item):
              cat = item[0]
              if cat in TOP:
                  return (0, TOP.index(cat), item[1])
              if cat in BOTTOM or "ambiance" in cat.lower() or "anime" in cat.lower():
                  return (2, cat.lower(), item[1])
              return (1, cat.lower(), item[1])

          src=Path("dcmaster.m3u8")
          lines=src.read_text(encoding='utf-8', errors='ignore').splitlines()

          seen_urls=set()
          entries=[]
          for i,l in enumerate(lines):
              if not l.startswith("#EXTINF"): continue
              url=lines[i+1].strip() if i+1 < len(lines) else ""
              if not url.startswith("http"): continue
              name=l.rsplit(",",1)[-1].strip()
              if "welcome" in name.lower() and "motel" in name.lower(): continue
              m=re.search(r'group-title="([^"]+)"',l)
              orig=m.group(1) if m else "Other"
              if orig.lower() in ("tubi","roku"): orig="Other"
              cat = clean_cat(orig)
              # skip empty Nature History and Science bucket if truly empty
              if url in seen_urls: continue
              seen_urls.add(url)
              entries.append((cat, name.lower(), l, url))

          entries.sort(key=sort_key)

          out=['#EXTM3U url-tvg="https://motel.deecee.ca/dccatalog.xml"']
          for cat,_,ext,url in entries:
              ext=re.sub(r'group-title="[^"]+"',f'group-title="{cat}"',ext)
              if 'group-title=' not in ext:
                  ext=ext.replace('#EXTINF:-1', f'#EXTINF:-1 group-title="{cat}"',1)
              out.append(ext)
              out.append(url)

          text="\n".join(out)
          Path("dccatalog.m3u8").write_text(text, encoding='utf-8')
          Path("DCcatalog.m3u8").write_text(text, encoding='utf-8')
          Path("dccatalog.m3u").write_text(text, encoding='utf-8')
          Path("DCcatalog.m3u").write_text(text, encoding='utf-8')

          c=Counter([cat for cat,_,_,_ in entries])
          # print in display order
          ordered_cats = TOP + [x for x in sorted(c) if x not in TOP and x not in BOTTOM and "ambiance" not in x.lower() and "anime" not in x.lower()] + [x for x in sorted(c) if x in BOTTOM or "ambiance" in x.lower() or "anime" in x.lower()]
          for k in ordered_cats:
              print(f"{k}: {c[k]}")
          print(f"\nBuilt {len(entries)} channels, {len(c)} categories")

          if Path("dcmaster.xml").exists():
              shutil.copy("dcmaster.xml","dccatalog.xml")
              shutil.copy("dcmaster.xml","DCcatalog.xml")
              for gz_name in ["dccatalog.xml.gz","DCcatalog.xml.gz"]:
                  with open("dcmaster.xml","rb") as f_in:
                      with gzip.open(gz_name,"wb") as f_out:
                          shutil.copyfileobj(f_in, f_out)
          PY

      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add DCcatalog.m3u8 DCcatalog.m3u DCcatalog.xml DCcatalog.xml.gz dccatalog.m3u8 dccatalog.m3u dccatalog.xml dccatalog.xml.gz -f
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "DCcatalog: horror->scifi, kids&family->kids, weather->news, movies up top"
          git push
