name: Sort DCcatalog

on:
  workflow_dispatch:
  schedule:
    - cron: '50 2,5,8,11,14,17,20,23 * * *'

jobs:
  sort:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build DCcatalog
        run: |
          python3 - << 'PY'
          import re
          import gzip
          from pathlib import Path
          from collections import Counter

          # ============================================================
          # CATEGORY MERGES
          # ============================================================

          MERGE = {
              "home & food": "Home & Food",
              "home + food": "Home & Food",
              "home and food": "Home & Food",
              "good eats": "Home & Food",
              "lifestyle": "Home & Food",

              "true crime": "Crime",
              "crime": "Crime",
              "crime scenes": "Crime",
              "crime thrillher": "Crime",
              "crime cults killers": "Crime",
              "chasing criminals": "Crime",
              "cold case files": "Crime",
              "a&e crime 360": "Crime",
              "crime & mystery": "Crime",

              "always funny": "Comedy",
              "comedy dynamics": "Comedy",

              "tv dramas": "Drama",
              "tv drama": "Drama",
              "drama": "Drama",

              "horror": "Sci-Fi & Horror",
              "sci-fi": "Sci-Fi & Horror",
              "scifi": "Sci-Fi & Horror",
              "sci-fi & supernatural": "Sci-Fi & Horror",
              "sci-fi + supernatural": "Sci-Fi & Horror",
              "sci-fi and supernatural": "Sci-Fi & Horror",
              "classic doctor who": "Sci-Fi & Horror",
              "alien nation by dust": "Sci-Fi & Horror",
              "dust": "Sci-Fi & Horror",
              "supernatural": "Sci-Fi & Horror",
              "drama & sci-fi": "Sci-Fi & Horror",
              "paranormal": "Sci-Fi & Horror",
              "out of this world": "Sci-Fi & Horror",

              "movies": "Movies",
              "movie channels": "Movies",
              "classic cinema": "Movies",
              "at the movies": "Movies",
              "cinevault": "Movies",
              "tv & movies": "Movies",

              "sports": "Sports",
              "sports on now": "Sports",
              "sports & outdoors": "Sports",
              "sports and outdoors": "Sports",
              "games & competition": "Sports",
              "games + competition": "Sports",

              "pop culture": "Entertainment",
              "reality": "Entertainment",
              "black entertainment": "Entertainment",
              "entertainment & reality": "Entertainment",
              "entertainment + reality": "Entertainment",

              "kids": "Kids",
              "kids & family": "Kids",
              "kids + family": "Kids",
              "kids and family": "Kids",
              "family": "Kids",

              "documentary": "Documentary",
              "documentaries": "Documentary",
              "documentary & science": "Documentary",
              "documentary and science": "Documentary",

              "nature": "Nature & Science",
              "nature history": "Nature & Science",
              "nature & history": "Nature & Science",
              "nature history and science": "Nature & Science",
              "nature history & science": "Nature & Science",
              "science": "Nature & Science",
              "science & nature": "Nature & Science",
              "nature & science": "Nature & Science",
              "nature and science": "Nature & Science",
          }

          # ============================================================
          # CATEGORIES WE NEVER WANT
          # ============================================================

          REMOVE_CATEGORIES = {
              "espanol",
              "español",
              "latin",
              "spanish",
              "spanish language",
              "spanish-language",
              "français",
              "francais",
              "french",
              "french language",
              "french-language",
              "français language",
              "français canadien",
              "french canadian",
          }

          # ============================================================
          # CATEGORY DETECTION
          # ============================================================

          def normalize_category(raw, name=""):
              if not raw:
                  raw = ""

              g = raw.strip()
              g = re.sub(r'&amp;', '&', g, flags=re.IGNORECASE)
              g = re.sub(r'\s+', ' ', g).strip()
              gl = g.lower()

              name_l = name.lower()

              # --------------------------------------------------------
              # NEVER create a Canada category.
              # Plex puts everything in "Canada".
              # We classify Plex by channel name instead.
              # --------------------------------------------------------

              if gl == "canada":
                  gl = ""

              # --------------------------------------------------------
              # NEWS / WEATHER
              # --------------------------------------------------------

              if any(x in name_l for x in (
                  "news",
                  "weather",
                  "cbs news",
                  "abc news",
                  "nbc news",
                  "fox weather"
              )):
                  return "News & Weather"

              if "news" in gl or "weather" in gl:
                  return "News & Weather"

              # --------------------------------------------------------
              # MOVIES
              # --------------------------------------------------------

              if any(x in name_l for x in (
                  "movie",
                  "movies",
                  "cinema",
                  "filmrise",
                  "moviesphere",
                  "cinevault",
                  "hollywood"
              )):
                  return "Movies"

              if gl == "tv & movies":
                  return "Movies"

              # --------------------------------------------------------
              # SPORTS
              # --------------------------------------------------------

              if any(x in name_l for x in (
                  "sport",
                  "sports",
                  "ufc",
                  "nfl",
                  "nba",
                  "nhl",
                  "mlb",
                  "nascar",
                  "formula 1",
                  "f1",
                  "golf",
                  "cornhole",
                  "billiard",
                  "billiards",
                  "dp world tour",
                  "fantasy life"
              )):
                  return "Sports"

              # --------------------------------------------------------
              # KIDS
              # --------------------------------------------------------

              if any(x in name_l for x in (
                  "kids",
                  "kid ",
                  "family",
                  "yu-gi-oh",
                  "yugi"
              )):
                  return "Kids"

              # --------------------------------------------------------
              # COMEDY
              # --------------------------------------------------------

              if any(x in name_l for x in (
                  "comedy",
                  "funny",
                  "conners",
                  "south park"
              )):
                  return "Comedy"

              # --------------------------------------------------------
              # CRIME
              # --------------------------------------------------------

              if any(x in name_l for x in (
                  "crime",
                  "criminal",
                  "killer",
                  "killers",
                  "murder",
                  "cold case",
                  "forensic",
                  "law & order"
              )):
                  return "Crime"

              # --------------------------------------------------------
              # DOCUMENTARY
              # --------------------------------------------------------

              if any(x in name_l for x in (
                  "documentary",
                  "documentaries"
              )):
                  return "Documentary"

              # --------------------------------------------------------
              # NATURE / SCIENCE
              # --------------------------------------------------------

              if any(x in name_l for x in (
                  "nature",
                  "science",
                  "earth",
                  "curiosity",
                  "history"
              )):
                  return "Nature & Science"

              # --------------------------------------------------------
              # SCI-FI / HORROR
              # --------------------------------------------------------

              if any(x in name_l for x in (
                  "horror",
                  "sci-fi",
                  "scifi",
                  "supernatural",
                  "paranormal",
                  "doctor who",
                  "alien nation"
              )):
                  return "Sci-Fi & Horror"

              # --------------------------------------------------------
              # HOME & FOOD
              # --------------------------------------------------------

              if any(x in name_l for x in (
                  "food",
                  "cooking",
                  "cooking channel",
                  "good eats",
                  "home & garden",
                  "lifestyle"
              )):
                  return "Home & Food"

              # --------------------------------------------------------
              # ENTERTAINMENT
              # --------------------------------------------------------

              if any(x in name_l for x in (
                  "reality",
                  "entertainment",
                  "celebrity",
                  "pop culture",
                  "dance moms",
                  "osbournes",
                  "fear factor",
                  "price is right",
                  "game show",
                  "game shows",
                  "game show network",
                  "nosey"
              )):
                  return "Entertainment"

              # --------------------------------------------------------
              # DRAMA
              # --------------------------------------------------------

              if any(x in name_l for x in (
                  "drama",
                  "murdoch mysteries"
              )):
                  return "Drama"

              # --------------------------------------------------------
              # MUSIC
              # --------------------------------------------------------

              if "music" in name_l:
                  return "Music"

              # --------------------------------------------------------
              # EXISTING SOURCE CATEGORY
              # --------------------------------------------------------

              lookup = gl.replace("+", "&")
              lookup = lookup.replace(" and ", " & ")
              lookup = re.sub(r'\s+', ' ', lookup).strip()

              if lookup in MERGE:
                  return MERGE[lookup]

              for key, value in MERGE.items():
                  if key in lookup:
                      return value

              # --------------------------------------------------------
              # Plex "Canada" must NOT survive.
              # If Plex cannot be classified, use Other.
              # --------------------------------------------------------

              if gl == "canada" or not gl:
                  return "Other"

              return g.title()

          # ============================================================
          # READ MASTER PLAYLIST
          # ============================================================

          src = Path("dcmaster.m3u8")

          lines = src.read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines()

          # ============================================================
          # FIRST PASS
          #
          # Build list while remembering which names came from
          # non-Plex sources.
          #
          # Plex channels are identified by:
          #   epg.provider.plex.tv
          #   provider-static.plex.tv
          #   group-title="Canada"
          #
          # If the same channel already exists outside Plex,
          # the Plex copy is discarded.
          # ============================================================

          entries = []

          existing_names = set()
          plex_entries = []

          removed_categories = Counter()
          duplicate_ids_removed = 0
          duplicate_plex_removed = 0
          removed_channels = []

          def is_plex(ext, url):
              text = (ext + " " + url).lower()

              return (
                  "epg.provider.plex.tv" in text
                  or "provider-static.plex.tv" in text
                  or 'group-title="canada"' in text
              )

          def extract_name(ext):
              return ext.rsplit(",", 1)[-1].strip()

          def extract_chno(ext):
              m = re.search(
                  r'tvg-chno="([^"]+)"',
                  ext,
                  re.I
              )

              return m.group(1).strip() if m else None

          def get_group(ext):
              m = re.search(
                  r'group-title="([^"]+)"',
                  ext,
                  re.I
              )

              return m.group(1).strip() if m else ""

          # ------------------------------------------------------------
          # FIRST PASS: collect non-Plex names
          # ------------------------------------------------------------

          for i, line in enumerate(lines):

              if not line.startswith("#EXTINF"):
                  continue

              url = (
                  lines[i + 1].strip()
                  if i + 1 < len(lines)
                  else ""
              )

              if not url.startswith("http"):
                  continue

              name = extract_name(line)
              name_key = re.sub(
                  r'\s+',
                  ' ',
                  name.lower()
              ).strip()

              group = get_group(line)
              group_lower = group.lower()

              if "welcome" in name_key and "motel" in name_key:
                  continue

              # Remove French / Spanish / Latin.
              if (
                  group_lower in REMOVE_CATEGORIES
                  or any(
                      term in group_lower
                      for term in (
                          "spanish",
                          "espanol",
                          "español",
                          "latin",
                          "french",
                          "français",
                          "francais"
                      )
                  )
              ):
                  removed_categories[group] += 1
                  removed_channels.append(name)
                  continue

              if not is_plex(line, url):
                  existing_names.add(name_key)

          # ============================================================
          # SECOND PASS
          # ============================================================

          seen_chno = set()

          for i, line in enumerate(lines):

              if not line.startswith("#EXTINF"):
                  continue

              url = (
                  lines[i + 1].strip()
                  if i + 1 < len(lines)
                  else ""
              )

              if not url.startswith("http"):
                  continue

              name = extract_name(line)

              name_key = re.sub(
                  r'\s+',
                  ' ',
                  name.lower()
              ).strip()

              group = get_group(line)
              group_lower = group.lower()

              if "welcome" in name_key and "motel" in name_key:
                  continue

              # Remove French / Spanish / Latin.
              if (
                  group_lower in REMOVE_CATEGORIES
                  or any(
                      term in group_lower
                      for term in (
                          "spanish",
                          "espanol",
                          "español",
                          "latin",
                          "french",
                          "français",
                          "francais"
                      )
                  )
              ):
                  continue

              plex = is_plex(line, url)

              # --------------------------------------------------------
              # If this is Plex and the same channel already exists
              # outside Plex, throw the Plex copy away.
              # --------------------------------------------------------

              if plex and name_key in existing_names:
                  duplicate_plex_removed += 1

                  print(
                      f"PLEX DUPLICATE REMOVED: {name}"
                  )

                  continue

              # --------------------------------------------------------
              # Plex gets categorized by channel name.
              # It does NOT retain Canada.
              # --------------------------------------------------------

              category = normalize_category(
                  group,
                  name
              )

              chno = extract_chno(line)

              # --------------------------------------------------------
              # Duplicate channel IDs:
              # keep the first one and remove the later one.
              #
              # NO renumbering.
              # --------------------------------------------------------

              if chno:

                  if chno in seen_chno:

                      duplicate_ids_removed += 1

                      print(
                          f"DUPLICATE CHANNEL ID REMOVED: "
                          f"{chno} - {name}"
                      )

                      continue

                  seen_chno.add(chno)

              entries.append(
                  (
                      category,
                      name_key,
                      name,
                      line,
                      url,
                      plex
                  )
              )

          # ============================================================
          # SORTING
          # ============================================================

          TOP = [
              "News & Weather",
              "Sports",
              "Movies"
          ]

          BOTTOM = [
              "Ambiance",
              "Anime & Gaming",
              "Anime"
          ]

          def sort_key(item):

              category = item[0]
              name = item[1]

              if category in TOP:
                  return (
                      0,
                      TOP.index(category),
                      name
                  )

              if (
                  category in BOTTOM
                  or "ambiance" in category.lower()
                  or "anime" in category.lower()
              ):
                  return (
                      2,
                      category.lower(),
                      name
                  )

              return (
                  1,
                  category.lower(),
                  name
              )

          entries.sort(key=sort_key)

          # ============================================================
          # WRITE PLAYLIST
          # ============================================================

          out = [
              '#EXTM3U url-tvg="https://motel.deecee.ca/dccatalog.xml"'
          ]

          for (
              category,
              _,
              name,
              ext,
              url,
              plex
          ) in entries:

              # Replace existing group-title.
              if re.search(
                  r'group-title="[^"]*"',
                  ext,
                  re.I
              ):

                  ext = re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{category}"',
                      ext,
                      flags=re.I
                  )

              else:

                  ext = ext.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 group-title="{category}"',
                      1
                  )

              out.append(ext)
              out.append(url)

          text = "\n".join(out)

          # ============================================================
          # WRITE ALL EXPECTED FILENAMES
          # ============================================================

          for filename in (
              "dccatalog.m3u8",
              "DCcatalog.m3u8",
              "dccatalog.m3u",
              "DCcatalog.m3u"
          ):

              Path(filename).write_text(
                  text,
                  encoding="utf-8"
              )

          # ============================================================
          # CATEGORY REPORT
          # ============================================================

          counts = Counter(
              item[0]
              for item in entries
          )

          ordered_categories = (
              TOP
              + [
                  x
                  for x in sorted(
                      counts,
                      key=str.lower
                  )
                  if (
                      x not in TOP
                      and x not in BOTTOM
                      and "ambiance" not in x.lower()
                      and "anime" not in x.lower()
                  )
              ]
              + [
                  x
                  for x in sorted(
                      counts,
                      key=str.lower
                  )
                  if (
                      x in BOTTOM
                      or "ambiance" in x.lower()
                      or "anime" in x.lower()
                  )
              ]
          )

          print()
          print("========================================")
          print("       DCcatalog CATEGORY REPORT")
          print("========================================")

          for category in ordered_categories:
              print(
                  f"{category:<25} "
                  f"{counts[category]:>4}"
              )

          print("----------------------------------------")
          print(
              f"TOTAL CHANNELS:          "
              f"{len(entries)}"
          )

          print(
              f"DUPLICATE IDS REMOVED:   "
              f"{duplicate_ids_removed}"
          )

          print(
              f"PLEX DUPLICATES REMOVED: "
              f"{duplicate_plex_removed}"
          )

          print(
              f"CATEGORIES:              "
              f"{len(counts)}"
          )

          print("========================================")

          if removed_categories:

              print()
              print(
                  "REMOVED FRENCH / SPANISH "
                  "CATEGORIES:"
              )

              for category, count in (
                  removed_categories.items()
              ):

                  print(
                      f"  {category}: {count}"
                  )

          # ============================================================
          # COPY EPG
          # ============================================================

          if Path("dcmaster.xml").exists():

              xml_text = Path(
                  "dcmaster.xml"
              ).read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              xml_text = (
                  xml_text
                  .replace(
                      "No Information",
                      "To Be Announced"
                  )
                  .replace(
                      "No information",
                      "To Be Announced"
                  )
              )

              Path(
                  "dccatalog.xml"
              ).write_text(
                  xml_text,
                  encoding="utf-8"
              )

              Path(
                  "DCcatalog.xml"
              ).write_text(
                  xml_text,
                  encoding="utf-8"
              )

              for filename in (
                  "dccatalog.xml.gz",
                  "DCcatalog.xml.gz"
              ):

                  Path(filename).write_bytes(
                      gzip.compress(
                          xml_text.encode("utf-8")
                      )
                  )

          PY

      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"

          git add \
            DCcatalog.m3u8 \
            DCcatalog.m3u \
            DCcatalog.xml \
            DCcatalog.xml.gz \
            dccatalog.m3u8 \
            dccatalog.m3u \
            dccatalog.xml \
            dccatalog.xml.gz \
            -f

          git diff --cached --quiet && echo "No change" && exit 0

          git commit -m "DCcatalog: remove Plex duplicates and categorize Plex channels"

          git push
