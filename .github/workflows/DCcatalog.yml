name: Sort DCcatalog
on:
  schedule:
    - cron: '50 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:
jobs:
  sort:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sort dcmaster -> DCcatalog
        run: |
          python3 << 'PY'
          import re, gzip, shutil
          from pathlib import Path
          def fix_xml_text(t): return re.sub(r'&(?!(?:amp|lt|gt|quot|apos);)', '&amp;', t)

          def guess_category(name):
              n=name.lower()
              if any(k in n for k in ["news","weather","cheddar","newsy","bloomberg","abc news"]): return "News & Weather"
              if any(k in n for k in ["espn","nfl","nba","mlb","sports","golf","racing","fishing","wrestling","bein"]): return "Sports"
              if any(k in n for k in ["kids","cartoon","nick","disney","paw patrol","spongebob","pokemon"]): return "Kids"
              if any(k in n for k in ["comedy","laugh","stand-up","south park","game show","funny","failarmy"]): return "Comedy"
              if any(k in n for k in ["crime","investigation","mystery","detective","police","a&e crime"]): return "Crime & Mystery"
              if any(k in n for k in ["drama","sci-fi","scifi","horror","thriller","space","alien","dust"]): return "Drama & Sci-Fi"
              if any(k in n for k in ["reality","housewives","love","home","food","lifestyle","cooking","kitchen","entertainment"]): return "Entertainment & Reality"
              if any(k in n for k in ["music","mtv","concert","bounce"]): return "Music"
              if any(k in n for k in ["nature","science","wild","history","documentary","animal","earth"]): return "Nature & Science"
              if any(k in n for k in ["classic","retro","western","baywatch","at the movies"]): return "Classic"
              return "Movies"

          src = Path("dcmaster.m3u8")
          lines = src.read_text(encoding='utf-8', errors='ignore').splitlines()

          order=["News & Weather","Sports","Movies","Classic","Ambiance","Anime & Gaming","Comedy","Crime & Mystery","Drama & Sci-Fi","Entertainment & Reality","Home & Food","Kids","Music","Nature & Science"]
          idx={c:i for i,c in enumerate(order)}

          entries=[]; seen=set()
          for i,l in enumerate(lines):
              if not l.startswith("#EXTINF"): continue
              url = lines[i+1].strip() if i+1 < len(lines) else ""
              if not url or url in seen: continue # keeps 855 unique, kills CBC/CBC twins
              seen.add(url)

              m=re.search(r'group-title="([^"]+)"',l)
              orig=m.group(1) if m else "Other"
              name=l.rsplit(",",1)[-1].strip()

              # KEEP dcmaster categories, only move Tubi and Roku
              if orig in ("Tubi","Roku"):
                  cat = guess_category(name)
              else:
                  cat = orig

              entries.append((cat, name.lower(), l, url))

          entries.sort(key=lambda x:(idx.get(x[0],999), x[1]))

          out=['#EXTM3U url-tvg="https://motel.deecee.ca/DCcatalog.xml"']
          ch=1
          for cat,_,ext,url in entries:
              ext=re.sub(r'group-title="[^"]+"',f'group-title="{cat}"',ext)
              if 'tvg-chno=' in ext: ext=re.sub(r'tvg-chno="[^"]+"',f'tvg-chno="{ch}"',ext)
              else: ext=ext.replace('#EXTINF:-1', f'#EXTINF:-1 tvg-chno="{ch}"',1)
              out.append(ext); out.append(url); ch+=1

          Path("DCcatalog.m3u8").write_text("\n".join(out), encoding='utf-8')
          print(f"Built {len(entries)} - kept dcmaster cats, moved Tubi/Roku, no doubles")

          if Path("dcmaster.xml").exists():
              raw=fix_xml_text(Path("dcmaster.xml").read_text(encoding='utf-8', errors='ignore'))
              Path("DCcatalog.xml").write_text(raw, encoding='utf-8')
              with open("DCcatalog.xml","rb") as f_in, gzip.open("DCcatalog.xml.gz","wb") as f_out:
                  shutil.copyfileobj(f_in, f_out)
          PY
      - name: Commit DCcatalog
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add DCcatalog.m3u8 DCcatalog.xml DCcatalog.xml.gz
          git diff --cached --quiet && exit 0
          git commit -m "DCcatalog: keep dcmaster categories, move Tubi/Roku, fix doubles"
          git push
