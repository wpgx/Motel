name: Sort DCcatalog

on:
  workflow_dispatch:
  schedule:
    - cron: '50 2,5,8,11,14,17,20,23 * * *'

jobs:
  sort:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build DCcatalog
        run: |
          python3 - << 'PY'
          import re
          import gzip
          from pathlib import Path
          from collections import Counter
          import xml.etree.ElementTree as ET

          MERGE = {
              "home & food": "Home & Food",
              "home + food": "Home & Food",
              "home and food": "Home & Food",
              "good eats": "Home & Food",
              "lifestyle": "Home & Food",

              "true crime": "Crime",
              "crime": "Crime",
              "crime scenes": "Crime",
              "crime thrillher": "Crime",
              "crime cults killers": "Crime",
              "chasing criminals": "Crime",
              "cold case files": "Crime",
              "a&e crime 360": "Crime",
              "crime & mystery": "Crime",

              "always funny": "Comedy",
              "comedy dynamics": "Comedy",

              "tv dramas": "Drama",
              "tv drama": "Drama",
              "drama": "Drama",

              "horror": "Sci-Fi & Horror",
              "sci-fi": "Sci-Fi & Horror",
              "scifi": "Sci-Fi & Horror",
              "sci-fi & supernatural": "Sci-Fi & Horror",
              "sci-fi + supernatural": "Sci-Fi & Horror",
              "sci-fi and supernatural": "Sci-Fi & Horror",
              "classic doctor who": "Sci-Fi & Horror",
              "alien nation by dust": "Sci-Fi & Horror",
              "dust": "Sci-Fi & Horror",
              "supernatural": "Sci-Fi & Horror",
              "drama & sci-fi": "Sci-Fi & Horror",
              "paranormal": "Sci-Fi & Horror",
              "out of this world": "Sci-Fi & Horror",

              "movies": "Movies",
              "movie channels": "Movies",
              "classic cinema": "Movies",
              "at the movies": "Movies",
              "cinevault": "Movies",
              "tv & movies": "Movies",

              "sports": "Sports",
              "sports on now": "Sports",
              "sports & outdoors": "Sports",
              "sports and outdoors": "Sports",
              "games & competition": "Sports",
              "games + competition": "Sports",

              "pop culture": "Entertainment",
              "reality": "Entertainment",
              "black entertainment": "Entertainment",
              "entertainment & reality": "Entertainment",
              "entertainment + reality": "Entertainment",

              "kids": "Kids",
              "kids & family": "Kids",
              "kids + family": "Kids",
              "kids and family": "Kids",
              "family": "Kids",

              "documentary": "Documentary",
              "documentaries": "Documentary",
              "documentary & science": "Documentary",
              "documentary and science": "Documentary",

              "nature": "Nature & Science",
              "nature history": "Nature & Science",
              "nature & history": "Nature & Science",
              "nature history and science": "Nature & Science",
              "nature history & science": "Nature & Science",
              "science": "Nature & Science",
              "science & nature": "Nature & Science",
              "nature & science": "Nature & Science",
              "nature and science": "Nature & Science",
          }

          REMOVE_CATEGORIES = {
              "espanol",
              "español",
              "latin",
              "spanish",
              "spanish language",
              "spanish-language",
              "français",
              "francais",
              "french",
              "french language",
              "french-language",
              "français language",
              "français canadien",
              "french canadian",
          }

          def normalize_category(raw):
              if not raw:
                  return "Other"

              g = raw.strip()
              g = re.sub(r'&amp;', '&', g, flags=re.IGNORECASE)
              g = re.sub(r'\s+', ' ', g).strip()
              gl = g.lower()

              if "news" in gl or "weather" in gl:
                  return "News & Weather"

              if gl == "tv & movies":
                  return "Movies"

              lookup = gl.replace("+", "&").replace(" and ", " & ")
              lookup = re.sub(r'\s+', ' ', lookup).strip()

              if lookup in MERGE:
                  return MERGE[lookup]

              for key, value in MERGE.items():
                  if key in lookup:
                      return value

              return g.title()

          def extract_chno(ext):
              m = re.search(
                  r'tvg-chno="([^"]+)"',
                  ext,
                  re.I
              )
              return m.group(1) if m else None

          # ============================================================
          # PLEX NAME -> EXISTING CATEGORY
          #
          # Plex gives every channel group-title="Canada".
          # We ignore that category and classify the channel name instead.
          # ============================================================

          PLEX_RULES = [

              # News / Weather
              (
                  "News & Weather",
                  [
                      "news",
                      "weather",
                      "cbs news",
                      "abc news",
                      "nbc news",
                      "fox weather",
                      "news 24",
                      "newsnow",
                      "headline news",
                      "breaking news",
                  ]
              ),

              # Sports
              (
                  "Sports",
                  [
                      "sport",
                      "sports",
                      "ufc",
                      "nfl",
                      "nba",
                      "nhl",
                      "mlb",
                      "nascar",
                      "motogp",
                      "formula 1",
                      "f1 ",
                      "golf",
                      "pga",
                      "dp world tour",
                      "tennis",
                      "billiard",
                      "cornhole",
                      "fubo sports",
                      "football",
                      "basketball",
                      "baseball",
                      "hockey",
                      "wrestling",
                      "wwe",
                      "wrestling",
                      "fight",
                      "boxing",
                  ]
              ),

              # Movies
              (
                  "Movies",
                  [
                      "movie",
                      "movies",
                      "filmrise free movies",
                      "moviesphere",
                      "action hollywood",
                      "cinevault",
                      "film vault",
                      "classic cinema",
                      "free movies",
                      "horror movies",
                      "western movies",
                      "black cinema",
                      "movieplex",
                      "redbox",
                  ]
              ),

              # Crime
              (
                  "Crime",
                  [
                      "true crime",
                      "crime",
                      "forensic",
                      "cold case",
                      "killer",
                      "killers",
                      "murder",
                      "murderer",
                      "criminal",
                      "police",
                      "court",
                      "law & order",
                      "law and order",
                      "detective",
                      "investigation",
                      "investigates",
                      "48 hours",
                  ]
              ),

              # Comedy
              (
                  "Comedy",
                  [
                      "comedy",
                      "funny",
                      "stand up",
                      "stand-up",
                      "failarmy",
                      "get comedy",
                      "conners",
                      "sitcom",
                  ]
              ),

              # Kids
              (
                  "Kids",
                  [
                      "kids",
                      "kid ",
                      "family",
                      "cartoon",
                      "nick",
                      "nickelodeon",
                      "disney",
                      "pbs kids",
                      "yu-gi-oh",
                      "pokemon",
                      "paw patrol",
                      "lego",
                      "baby",
                  ]
              ),

              # Documentary
              (
                  "Documentary",
                  [
                      "documentary",
                      "documentaries",
                      "history channel",
                      "history vault",
                      "smithsonian",
                      "biography",
                      "explore",
                      "explorer",
                      "curiosity",
                      "modern marvels",
                      "ancient aliens",
                  ]
              ),

              # Nature & Science
              (
                  "Nature & Science",
                  [
                      "nature",
                      "science",
                      "earth",
                      "animal planet",
                      "wild ",
                      "wildlife",
                      "ocean",
                      "planet earth",
                      "adventure earth",
                      "bbc earth",
                      "national geographic",
                      "nat geo",
                      "space",
                      "discovery science",
                  ]
              ),

              # Home & Food
              (
                  "Home & Food",
                  [
                      "food",
                      "cooking",
                      "cook ",
                      "cuisine",
                      "kitchen",
                      "recipe",
                      "recipes",
                      "good eats",
                      "home ",
                      "house ",
                      "garden",
                      "gardening",
                      "lifestyle",
                      "travel channel",
                  ]
              ),

              # Drama
              (
                  "Drama",
                  [
                      "drama",
                      "murdoch mysteries",
                      "detective drama",
                      "soap",
                      "soap opera",
                  ]
              ),

              # Sci-Fi & Horror
              (
                  "Sci-Fi & Horror",
                  [
                      "sci-fi",
                      "sci fi",
                      "science fiction",
                      "horror",
                      "supernatural",
                      "paranormal",
                      "alien",
                      "doctor who",
                      "twilight zone",
                      "outer limits",
                      "creature",
                  ]
              ),

              # Entertainment
              (
                  "Entertainment",
                  [
                      "reality",
                      "entertainment",
                      "celebrity",
                      "celebrity",
                      "pop culture",
                      "afro",
                      "music entertainment",
                      "fashion",
                      "addictatv",
                      "afv",
                      "america's funniest",
                      "funniest home videos",
                      "fear factor",
                      "dance moms",
                      "osbournes",
                      "price is right",
                      "game show",
                      "game shows",
                  ]
              ),

              # Music
              (
                  "Music",
                  [
                      "music",
                      "mtv",
                      "vevo",
                      "concert",
                      "concerts",
                      "country music",
                      "classic rock",
                      "rock music",
                      "hip hop",
                      "jazz",
                      "jams",
                  ]
              ),

              # Classic TV
              (
                  "Classic TV",
                  [
                      "classic tv",
                      "classic television",
                      "classic shows",
                      "retro tv",
                      "retro television",
                      "old tv",
                  ]
              ),

              # South Park
              (
                  "South Park",
                  [
                      "south park",
                  ]
              ),

              # Westerns
              (
                  "Westerns",
                  [
                      "western",
                      "westerns",
                      "cowboy",
                      "cowboys",
                  ]
              ),

              # Game Shows
              (
                  "Game Shows",
                  [
                      "game show",
                      "game shows",
                      "jeopardy",
                      "wheel of fortune",
                      "price is right",
                      "family feud",
                      "deal or no deal",
                  ]
              ),
          ]

          def classify_plex_channel(name):
              """
              Classify a Plex channel using its name.
              This deliberately ignores Plex's group-title="Canada".
              """

              n = re.sub(r'\s+', ' ', name.strip().lower())

              for category, keywords in PLEX_RULES:
                  for keyword in keywords:
                      if keyword in n:
                          return category

              return "Other"

          # ============================================================
          # EPG CHANNELS WITH REAL PROGRAM DATA
          # ============================================================

          good_ids = set()

          if Path("dcmaster.xml").exists():
              try:
                  tree = ET.parse("dcmaster.xml")
                  root = tree.getroot()

                  for prog in root.findall("programme"):
                      title = prog.findtext(
                          "title",
                          ""
                      ).lower()

                      if (
                          title
                          and "no information" not in title
                          and "to be announced" not in title
                      ):
                          good_ids.add(
                              prog.get("channel", "")
                          )

              except Exception as e:
                  print(
                      f"EPG parse warning: {e}"
                  )

          TOP = [
              "News & Weather",
              "Sports",
              "Movies"
          ]

          BOTTOM = [
              "Ambiance",
              "Anime & Gaming",
              "Anime"
          ]

          def sort_key(item):
              category = item[0]
              name = item[1]

              if category in TOP:
                  return (
                      0,
                      TOP.index(category),
                      name.lower()
                  )

              if (
                  category in BOTTOM
                  or "ambiance" in category.lower()
                  or "anime" in category.lower()
              ):
                  return (
                      2,
                      category.lower(),
                      name.lower()
                  )

              return (
                  1,
                  category.lower(),
                  name.lower()
              )

          src = Path("dcmaster.m3u8")

          lines = src.read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines()

          entries = []
          removed_categories = Counter()
          removed_channels = []

          seen_chno = set()
          duplicate_ids_removed = 0

          plex_recategorized = Counter()

          # ============================================================
          # READ SOURCE PLAYLIST
          # ============================================================

          for i, line in enumerate(lines):

              if not line.startswith("#EXTINF"):
                  continue

              url = (
                  lines[i + 1].strip()
                  if i + 1 < len(lines)
                  else ""
              )

              if not url.startswith("http"):
                  continue

              name = line.rsplit(
                  ",",
                  1
              )[-1].strip()

              # Remove motel welcome channel
              if (
                  "welcome" in name.lower()
                  and "motel" in name.lower()
              ):
                  removed_channels.append(
                      f"{name} [welcome]"
                  )
                  continue

              match = re.search(
                  r'group-title="([^"]+)"',
                  line,
                  flags=re.IGNORECASE
              )

              original_category = (
                  match.group(1)
                  if match
                  else "Other"
              )

              original_lower = (
                  original_category.strip().lower()
              )

              # ========================================================
              # REMOVE FRENCH / SPANISH / LATIN
              # ========================================================

              if original_lower in REMOVE_CATEGORIES:

                  removed_categories[
                      original_category
                  ] += 1

                  removed_channels.append(name)
                  continue

              if any(
                  term in original_lower
                  for term in (
                      "spanish",
                      "espanol",
                      "español",
                      "latin",
                      "french",
                      "français",
                      "francais"
                  )
              ):

                  removed_categories[
                      original_category
                  ] += 1

                  removed_channels.append(name)
                  continue

              # ========================================================
              # DETERMINE CATEGORY
              #
              # Plex supplies group-title="Canada".
              # DO NOT KEEP THAT CATEGORY.
              # ========================================================

              if original_lower == "canada":

                  category = classify_plex_channel(
                      name
                  )

                  plex_recategorized[
                      category
                  ] += 1

              else:

                  if original_lower in (
                      "tubi",
                      "roku"
                  ):
                      original_category = "Other"

                  category = normalize_category(
                      original_category
                  )

              # ========================================================
              # CHANNEL ID
              # ========================================================

              tvg_match = re.search(
                  r'tvg-id="([^"]+)"',
                  line,
                  flags=re.IGNORECASE
              )

              tvg_id = (
                  tvg_match.group(1)
                  if tvg_match
                  else ""
              )

              chno = extract_chno(line)

              # ========================================================
              # REMOVE ONLY DUPLICATE CHANNEL NUMBERS
              # ========================================================

              if chno:

                  if chno in seen_chno:

                      duplicate_ids_removed += 1

                      print(
                          "DUPLICATE CHANNEL ID REMOVED: "
                          f"{chno} - {name}"
                      )

                      continue

                  seen_chno.add(chno)

              entries.append(
                  (
                      category,
                      name.lower(),
                      name,
                      line,
                      url,
                      tvg_id,
                      chno
                  )
              )

          # ============================================================
          # SORT
          # ============================================================

          entries.sort(
              key=lambda item: sort_key(
                  (
                      item[0],
                      item[1]
                  )
              )
          )

          # ============================================================
          # BUILD OUTPUT
          # ============================================================

          out = [
              '#EXTM3U url-tvg="https://motel.deecee.ca/dccatalog.xml"'
          ]

          for (
              category,
              _,
              name,
              ext,
              url,
              _,
              _
          ) in entries:

              # Replace whatever group-title was supplied.
              # This is what makes Plex channels use our categories.

              if re.search(
                  r'group-title="[^"]*"',
                  ext,
                  re.IGNORECASE
              ):

                  ext = re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{category}"',
                      ext,
                      flags=re.IGNORECASE
                  )

              else:

                  ext = ext.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 group-title="{category}"',
                      1
                  )

              out.append(ext)
              out.append(url)

          text = "\n".join(out)

          # ============================================================
          # WRITE ALL PLAYLIST VARIANTS
          # ============================================================

          for filename in [
              "dccatalog.m3u8",
              "DCcatalog.m3u8",
              "dccatalog.m3u",
              "DCcatalog.m3u"
          ]:

              Path(filename).write_text(
                  text,
                  encoding="utf-8"
              )

          # ============================================================
          # CATEGORY REPORT
          # ============================================================

          counts = Counter(
              category
              for (
                  category,
                  _,
                  _,
                  _,
                  _,
                  _,
                  _
              ) in entries
          )

          ordered_categories = (
              TOP
              + [
                  x
                  for x in sorted(
                      counts,
                      key=str.lower
                  )
                  if x not in TOP
                  and x not in BOTTOM
                  and "ambiance" not in x.lower()
                  and "anime" not in x.lower()
              ]
              + [
                  x
                  for x in sorted(
                      counts,
                      key=str.lower
                  )
                  if x in BOTTOM
                  or "ambiance" in x.lower()
                  or "anime" in x.lower()
              ]
          )

          print()
          print("========================================")
          print("       DCcatalog CATEGORY REPORT")
          print("========================================")

          for category in ordered_categories:

              print(
                  f"{category:<25} "
                  f"{counts[category]:>4}"
              )

          print("----------------------------------------")

          print(
              f"TOTAL CHANNELS:          "
              f"{len(entries)}"
          )

          print(
              f"DUPLICATE IDS REMOVED:   "
              f"{duplicate_ids_removed}"
          )

          print(
              f"CATEGORIES:              "
              f"{len(counts)}"
          )

          print("========================================")

          if plex_recategorized:

              print()
              print(
                  "PLEX CHANNELS RECATEGORIZED:"
              )

              for category, count in sorted(
                  plex_recategorized.items(),
                  key=lambda x: (-x[1], x[0].lower())
              ):

                  print(
                      f"  {category:<25} "
                      f"{count:>4}"
                  )

          if removed_categories:

              print()
              print(
                  "REMOVED FRENCH / SPANISH "
                  "CATEGORIES:"
              )

              for category, count in (
                  removed_categories.items()
              ):

                  print(
                      f"  {category}: {count}"
                  )

          # ============================================================
          # EPG XML
          # ============================================================

          if Path("dcmaster.xml").exists():

              xml_text = Path(
                  "dcmaster.xml"
              ).read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              xml_text = (
                  xml_text
                  .replace(
                      "No Information",
                      "To Be Announced"
                  )
                  .replace(
                      "No information",
                      "To Be Announced"
                  )
              )

              Path(
                  "dccatalog.xml"
              ).write_text(
                  xml_text,
                  encoding="utf-8"
              )

              Path(
                  "DCcatalog.xml"
              ).write_text(
                  xml_text,
                  encoding="utf-8"
              )

              for filename in [
                  "dccatalog.xml.gz",
                  "DCcatalog.xml.gz"
              ]:

                  Path(filename).write_bytes(
                      gzip.compress(
                          xml_text.encode("utf-8")
                      )
                  )

          PY

      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"

          git add \
            DCcatalog.m3u8 \
            DCcatalog.m3u \
            DCcatalog.xml \
            DCcatalog.xml.gz \
            dccatalog.m3u8 \
            dccatalog.m3u \
            dccatalog.xml \
            dccatalog.xml.gz \
            -f

          git diff --cached --quiet && echo "No change" && exit 0

          git commit -m "DCcatalog: categorize Plex channels and remove duplicate IDs"

          git push
