name: Sort DCcatalog

on:
  workflow_dispatch:
  schedule:
    - cron: '50 2,5,8,11,14,17,20,23 * * *'

concurrency:
  group: dccatalog
  cancel-in-progress: true

jobs:
  sort:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build DCcatalog
        run: |
          python3 - << 'PY'
          import re
          import gzip
          from pathlib import Path
          from collections import Counter, defaultdict
          import xml.etree.ElementTree as ET

          # ============================================================
          # CATEGORY MERGES
          # ============================================================

          MERGE = {

              # ---------------- HOME & FOOD ----------------
              "home & food": "Home & Food",
              "home + food": "Home & Food",
              "home and food": "Home & Food",
              "good eats": "Home & Food",
              "lifestyle": "Home & Food",

              # ---------------- CRIME ----------------
              "true crime": "Crime",
              "crime": "Crime",
              "crime scenes": "Crime",
              "crime thrillher": "Crime",
              "crime cults killers": "Crime",
              "chasing criminals": "Crime",
              "cold case files": "Crime",
              "a&e crime 360": "Crime",
              "crime & mystery": "Crime",

              # ---------------- COMEDY ----------------
              "always funny": "Comedy",
              "comedy dynamics": "Comedy",

              # ---------------- DRAMA ----------------
              "tv dramas": "Drama",
              "tv drama": "Drama",
              "drama": "Drama",

              # ---------------- SCI-FI & HORROR ----------------
              "horror": "Sci-Fi & Horror",
              "sci-fi": "Sci-Fi & Horror",
              "scifi": "Sci-Fi & Horror",
              "sci-fi & supernatural": "Sci-Fi & Horror",
              "sci-fi + supernatural": "Sci-Fi & Horror",
              "sci-fi and supernatural": "Sci-Fi & Horror",
              "classic doctor who": "Sci-Fi & Horror",
              "alien nation by dust": "Sci-Fi & Horror",
              "dust": "Sci-Fi & Horror",
              "supernatural": "Sci-Fi & Horror",
              "drama & sci-fi": "Sci-Fi & Horror",
              "paranormal": "Sci-Fi & Horror",
              "out of this world": "Sci-Fi & Horror",

              # ---------------- MOVIES ----------------
              "movies": "Movies",
              "movie channels": "Movies",
              "classic cinema": "Movies",
              "at the movies": "Movies",
              "cinevault": "Movies",
              "tv & movies": "Movies",

              # ---------------- SPORTS ----------------
              "sports": "Sports",
              "sports on now": "Sports",
              "sports & outdoors": "Sports",
              "sports and outdoors": "Sports",
              "games & competition": "Sports",
              "games + competition": "Sports",

              # ---------------- ENTERTAINMENT ----------------
              "pop culture": "Entertainment",
              "reality": "Entertainment",
              "black entertainment": "Entertainment",
              "entertainment & reality": "Entertainment",
              "entertainment + reality": "Entertainment",

              # ---------------- KIDS ----------------
              "kids": "Kids",
              "kids & family": "Kids",
              "kids + family": "Kids",
              "kids and family": "Kids",
              "family": "Kids",

              # ---------------- DOCUMENTARY ----------------
              "documentary": "Documentary",
              "documentaries": "Documentary",
              "documentary & science": "Documentary",
              "documentary and science": "Documentary",

              # ---------------- NATURE & SCIENCE ----------------
              "nature": "Nature & Science",
              "nature history": "Nature & Science",
              "nature & history": "Nature & Science",
              "nature history and science": "Nature & Science",
              "nature history & science": "Nature & Science",
              "science": "Nature & Science",
              "science & nature": "Nature & Science",
              "nature & science": "Nature & Science",
              "nature and science": "Nature & Science",
          }

          # ============================================================
          # NEWS & WEATHER
          # EVERYTHING NEWS/WEATHER GOES INTO ONE CATEGORY
          # ============================================================

          NEWS_CATEGORIES = {
              "news",
              "news & opinion",
              "news and opinion",
              "news & weather",
              "news and weather",
              "local news",
              "national news",
              "business news",
              "global news",
              "live news",
              "weather",
              "global weather",
              "international",
              "international news",
              "international weather",
              "world news",
              "world weather",
              "news network",
              "news networks",
              "news & business",
              "business & news",
          }

          # ============================================================
          # SPANISH CATEGORIES TO REMOVE
          # ============================================================

          REMOVE_CATEGORIES = {
              "espanol",
              "español",
              "latin",
              "spanish",
              "spanish language",
              "spanish-language",
          }

          # ============================================================
          # CATEGORY NORMALIZATION
          # ============================================================

          def normalize_category(raw):

              if not raw:
                  return "Other"

              g = raw.strip()

              # Fix HTML entities, including TV &Amp; Movies.
              g = re.sub(
                  r'&amp;',
                  '&',
                  g,
                  flags=re.IGNORECASE
              )

              g = re.sub(
                  r'\s+',
                  ' ',
                  g
              ).strip()

              gl = g.lower()

              # --------------------------------------------------------
              # ALL NEWS AND WEATHER
              # --------------------------------------------------------

              if gl in NEWS_CATEGORIES:
                  return "News & Weather"

              # Catch variations such as:
              # News & Opinion
              # News & Weather
              # National News
              # Business News
              # Global News
              # Local News
              # Weather
              if (
                  "news" in gl
                  or "weather" in gl
              ):
                  return "News & Weather"

              # --------------------------------------------------------
              # MOVIES
              # --------------------------------------------------------

              if gl == "tv & movies":
                  return "Movies"

              # --------------------------------------------------------
              # NORMAL MERGES
              # --------------------------------------------------------

              lookup = (
                  gl
                  .replace("+", "&")
                  .replace(" and ", " & ")
              )

              lookup = re.sub(
                  r'\s+',
                  ' ',
                  lookup
              ).strip()

              if lookup in MERGE:
                  return MERGE[lookup]

              # Also handle partial matches.
              for key, value in MERGE.items():
                  if key in lookup:
                      return value

              return g.title()

          # ============================================================
          # EPG DATA
          # ============================================================

          good_ids = set()

          if Path("dcmaster.xml").exists():

              try:

                  tree = ET.parse(
                      "dcmaster.xml"
                  )

                  root = tree.getroot()

                  for prog in root.findall(
                      "programme"
                  ):

                      title = prog.findtext(
                          "title",
                          ""
                      ).lower()

                      if (
                          title
                          and "no information" not in title
                          and "to be announced" not in title
                      ):

                          good_ids.add(
                              prog.get("channel", "")
                          )

              except Exception as e:

                  print(
                      f"EPG parse warning: {e}"
                  )

          # ============================================================
          # CATEGORY ORDER
          # ============================================================

          TOP = [
              "News & Weather",
              "Sports",
              "Movies"
          ]

          BOTTOM = [
              "Ambiance",
              "Anime & Gaming",
              "Anime"
          ]

          def sort_key(item):

              category = item[0]

              if category in TOP:

                  return (
                      0,
                      TOP.index(category),
                      item[1]
                  )

              if (
                  category in BOTTOM
                  or "ambiance" in category.lower()
                  or "anime" in category.lower()
              ):

                  return (
                      2,
                      category.lower(),
                      item[1]
                  )

              return (
                  1,
                  category.lower(),
                  item[1]
              )

          # ============================================================
          # READ MASTER PLAYLIST
          # ============================================================

          src = Path(
              "dcmaster.m3u8"
          )

          lines = src.read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines()

          # ============================================================
          # GROUP CHANNELS
          # ============================================================

          by_name = defaultdict(list)

          removed_categories = Counter()
          removed_channels = []

          for i, line in enumerate(lines):

              if not line.startswith(
                  "#EXTINF"
              ):
                  continue

              url = (
                  lines[i + 1].strip()
                  if i + 1 < len(lines)
                  else ""
              )

              if not url.startswith(
                  "http"
              ):
                  continue

              name = line.rsplit(
                  ",",
                  1
              )[-1].strip()

              # Remove motel welcome channel.
              if (
                  "welcome" in name.lower()
                  and "motel" in name.lower()
              ):

                  removed_channels.append(
                      f"{name} [welcome]"
                  )

                  continue

              match = re.search(
                  r'group-title="([^"]+)"',
                  line,
                  flags=re.IGNORECASE
              )

              original_category = (
                  match.group(1)
                  if match
                  else "Other"
              )

              original_lower = (
                  original_category
                  .strip()
                  .lower()
              )

              # --------------------------------------------------------
              # REMOVE SPANISH / LATIN CATEGORIES
              # --------------------------------------------------------

              if original_lower in (
                  REMOVE_CATEGORIES
              ):

                  removed_categories[
                      original_category
                  ] += 1

                  removed_channels.append(
                      name
                  )

                  continue

              # Tubi/Roku remain available but are Other.
              if original_lower in (
                  "tubi",
                  "roku"
              ):

                  original_category = "Other"

              category = normalize_category(
                  original_category
              )

              tvg_match = re.search(
                  r'tvg-id="([^"]+)"',
                  line,
                  flags=re.IGNORECASE
              )

              tvg_id = (
                  tvg_match.group(1)
                  if tvg_match
                  else ""
              )

              by_name[
                  name.lower()
              ].append(
                  (
                      category,
                      name,
                      line,
                      url,
                      tvg_id
                  )
              )

          # ============================================================
          # DEDUPE
          # ============================================================

          entries = []
          dupes_removed = 0

          for name_low, channels in (
              by_name.items()
          ):

              if len(channels) == 1:

                  category, _, ext, url, _ = (
                      channels[0]
                  )

                  entries.append(
                      (
                          category,
                          name_low,
                          ext,
                          url
                      )
                  )

              else:

                  # Prefer copy with real EPG data.
                  channels_sorted = sorted(
                      channels,
                      key=lambda x: (
                          x[4] not in good_ids,
                          x[0]
                      )
                  )

                  category, _, ext, url, _ = (
                      channels_sorted[0]
                  )

                  entries.append(
                      (
                          category,
                          name_low,
                          ext,
                          url
                      )
                  )

                  dupes_removed += (
                      len(channels) - 1
                  )

          # ============================================================
          # SORT
          # ============================================================

          entries.sort(
              key=sort_key
          )

          # ============================================================
          # WRITE PLAYLISTS
          # ============================================================

          out = [
              '#EXTM3U url-tvg="https://motel.deecee.ca/dccatalog.xml"'
          ]

          for category, _, ext, url in (
              entries
          ):

              ext = re.sub(
                  r'group-title="[^"]+"',
                  f'group-title="{category}"',
                  ext,
                  flags=re.IGNORECASE
              )

              if (
                  "group-title=" not in
                  ext.lower()
              ):

                  ext = ext.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 group-title="{category}"',
                      1
                  )

              out.append(ext)
              out.append(url)

          text = "\n".join(out)

          for filename in [
              "dccatalog.m3u8",
              "DCcatalog.m3u8",
              "dccatalog.m3u",
              "DCcatalog.m3u"
          ]:

              Path(filename).write_text(
                  text,
                  encoding="utf-8"
              )

          # ============================================================
          # REPORT
          # ============================================================

          counts = Counter(
              category
              for category, _, _, _
              in entries
          )

          ordered_categories = (
              TOP
              +
              [
                  x
                  for x in sorted(counts)
                  if (
                      x not in TOP
                      and x not in BOTTOM
                      and "ambiance" not in x.lower()
                      and "anime" not in x.lower()
                  )
              ]
              +
              [
                  x
                  for x in sorted(counts)
                  if (
                      x in BOTTOM
                      or "ambiance" in x.lower()
                      or "anime" in x.lower()
                  )
              ]
          )

          print()
          print(
              "========================================"
          )
          print(
              "       DCcatalog CATEGORY REPORT"
          )
          print(
              "========================================"
          )

          for category in ordered_categories:

              print(
                  f"{category:<25} "
                  f"{counts[category]:>4}"
              )

          print(
              "----------------------------------------"
          )

          print(
              f"TOTAL CHANNELS:          "
              f"{len(entries)}"
          )

          print(
              f"DUPLICATES REMOVED:      "
              f"{dupes_removed}"
          )

          print(
              f"CATEGORIES:              "
              f"{len(counts)}"
          )

          print(
              "========================================"
          )

          if removed_categories:

              print()
              print(
                  "REMOVED SPANISH CATEGORIES:"
              )

              for category, count in (
                  removed_categories.items()
              ):

                  print(
                      f"  {category}: {count}"
                  )

          # ============================================================
          # EPG
          # ============================================================

          if Path(
              "dcmaster.xml"
          ).exists():

              xml_text = Path(
                  "dcmaster.xml"
              ).read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              xml_text = xml_text.replace(
                  "No Information",
                  "To Be Announced"
              )

              xml_text = xml_text.replace(
                  "No information",
                  "To Be Announced"
              )

              Path(
                  "dccatalog.xml"
              ).write_text(
                  xml_text,
                  encoding="utf-8"
              )

              Path(
                  "DCcatalog.xml"
              ).write_text(
                  xml_text,
                  encoding="utf-8"
              )

              for filename in [
                  "dccatalog.xml.gz",
                  "DCcatalog.xml.gz"
              ]:

                  Path(filename).write_bytes(
                      gzip.compress(
                          xml_text.encode("utf-8")
                      )
                  )

          PY

      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"

          git add \
            DCcatalog.m3u8 \
            DCcatalog.m3u \
            DCcatalog.xml \
            DCcatalog.xml.gz \
            dccatalog.m3u8 \
            dccatalog.m3u \
            dccatalog.xml \
            dccatalog.xml.gz \
            -f

          git diff --cached --quiet && \
            echo "No change" && \
            exit 0

          git commit \
            -m "DCcatalog: consolidate news and weather"

          git push
