name: tubi-real-epg
on: 
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Build EPG
        run: |
          python3 << 'PY'
          import requests, xml.etree.ElementTree as ET, os
          from datetime import datetime, timezone, timedelta

          tv=ET.Element('tv')
          # Always create file first
          headers={"User-Agent":"Mozilla/5.0","Referer":"https://tubitv.com/live","Accept":"application/json"}

          channels_data=[]
          try:
              for url in ["https://tubitv.com/oz/api/epg/programming?timezone=UTC","https://tubitv.com/oz/api/guide"]:
                  print(f"TRY {url}")
                  r=requests.get(url, headers=headers, timeout=20)
                  print(f"Status {r.status_code} len {len(r.text)}")
                  print(r.text[:200])
                  if r.status_code==200 and '"title"' in r.text:
                      j=r.json()
                      if isinstance(j, dict):
                          channels_data=j.get('channels',[])
                      else:
                          channels_data=j
                      if channels_data:
                          break
          except Exception as e:
              print(f"API error {e}")

          print(f"Channels from API: {len(channels_data)}")

          if not channels_data:
              # FALLBACK - create 10 dummy channels so file exists
              print("Using fallback dummy")
              channels_data=[{"id":f"tubi{i}","title":f"Tubi Channel {i}","programs":[]} for i in range(1,11)]

          for ch in channels_data[:150]:
              cid=str(ch.get('id') or ch.get('channel_id') or 'tubi')
              title=ch.get('title') or ch.get('name') or cid
              c=ET.SubElement(tv,'channel',id=cid)
              ET.SubElement(c,'display-name').text=title

          now=datetime.now(timezone.utc).replace(minute=0, second=0, microsecond=0)
          for ch in channels_data[:150]:
              cid=str(ch.get('id') or ch.get('channel_id') or 'tubi')
              progs=ch.get('programs') or []
              if progs:
                  for prog in progs[:50]:
                      try:
                          st=datetime.fromisoformat((prog.get('start') or '') .replace('Z','+00:00'))
                          et=datetime.fromisoformat((prog.get('end') or '').replace('Z','+00:00'))
                          p=ET.SubElement(tv,'programme',start=st.strftime('%Y%m%d%H%M%S +0000'),stop=et.strftime('%Y%m%d%H%M%S +0000'),channel=cid)
                          ET.SubElement(p,'title').text=prog.get('title','Movie')[:100]
                      except: pass
              else:
                  t=now
                  for i in range(24):
                      p=ET.SubElement(tv,'programme',start=t.strftime('%Y%m%d%H%M%S +0000'),stop=(t+timedelta(hours=2)).strftime('%Y%m%d%H%M%S +0000'),channel=cid)
                      ET.SubElement(p,'title').text=f"{ch.get('title','Tubi')} Movie {i}"
                      t+=timedelta(hours=2)

          ET.ElementTree(tv).write('tubi.xml',encoding='utf-8',xml_declaration=True)
          print(f"WRITTEN SIZE {os.path.getsize('tubi.xml')}")
          PY
      - name: Show file
        run: ls -lh tubi.xml && head -c 300 tubi.xml
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add -f tubi.xml
          git commit -m "epg" || echo "no change"
          git push
