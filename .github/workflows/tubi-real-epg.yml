name: tubi-real-epg
on:
  workflow_dispatch:
  schedule: [{ cron: '15 */6 * * *' }]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker pull ghcr.io/jgomez177/tubi-for-channels:latest
          docker run -d --name tubi -p 7777:7777 ghcr.io/jgomez177/tubi-for-channels:latest
          echo "Waiting 60s for EPG to generate..."
          sleep 60
          docker logs tubi --tail 100
          echo "=== FIND XML FILES INSIDE CONTAINER ==="
          docker exec tubi find /app -type f -name "*.xml" -o -name "*.gz" | head -20
          docker exec tubi ls -lh /app/
          docker exec tubi ls -lh /app/tubi_data/ || true
          # Copy any XML out
          docker cp tubi:/app/tubi_data/tubi.xml /tmp/tubi.xml || true
          docker cp tubi:/app/epg.xml /tmp/tubi.xml || true
          docker cp tubi:/app/tubi/epg.xml /tmp/tubi.xml || true
          docker cp tubi:/app/tubi_data/epg.xml /tmp/tubi.xml || true
          # Last ditch - try web again with bigger file
          curl -s "http://127.0.0.1:7777/tubi/epg.xml?gracenote=include" -o /tmp/web.xml || true
          ls -lh /tmp/*.xml || true
          # Pick biggest file
          ls -S /tmp/*.xml | head -1
          BIGGEST=$(ls -S /tmp/*.xml | head -1)
          echo "Biggest is $BIGGEST size $(wc -c < $BIGGEST)"
          head -20 $BIGGEST
          cp $BIGGEST ./tubi.xml
          echo "Final tubi.xml size $(wc -c < ./tubi.xml)"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update tubi.xml real Gracenote"
          file_pattern: "tubi.xml"
