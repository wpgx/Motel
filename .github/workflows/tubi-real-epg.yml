name: tubi-real-epg
on:
  workflow_dispatch:
  schedule: [{ cron: '15 */6 * * *' }]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker pull ghcr.io/jgomez177/tubi-for-channels:3.01
          docker run -d --name tubi -p 7777:7777 ghcr.io/jgomez177/tubi-for-channels:3.01
          sleep 15
          docker ps -a
          docker logs tubi --tail 100
          for i in {1..30}; do
            echo "Attempt $i"
            curl -sf http://127.0.0.1:7777/tubi/epg.xml -o /tmp/epg.xml && break
            sleep 10
          done
          cp /tmp/epg.xml ./tubireal.xml
          ls -lh ./tubireal.xml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "tubi real EPG"
          file_pattern: "tubireal.xml"
