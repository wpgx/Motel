name: tubi-real-epg
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker pull ghcr.io/jgomez177/tubi-for-channels:3.01
          docker run -d --name tubi -p 7777:7777 ghcr.io/jgomez177/tubi-for-channels:3.01
          sleep 20
          docker ps -a
          docker logs tubi
          echo "Trying endpoints..."
          curl -v http://127.0.0.1:7777/ || true
          curl -v http://127.0.0.1:7777/tubi/epg.xml -o /tmp/epg.xml || true
          curl -v http://127.0.0.1:7777/epg.xml -o /tmp/epg.xml || true
          ls -lh /tmp/
          cp /tmp/epg.xml ./tubi.xml || (docker exec tubi find / -name "*.xml" 2>/dev/null; exit 1)
          ls -lh ./tubi.xml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update tubi.xml real EPG"
          file_pattern: "tubi.xml"
