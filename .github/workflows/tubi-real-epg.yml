name: tubi-real-epg
on:
  schedule: [{ cron: '15 */6 * * *' }]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run tubi container
        run: |
          docker pull ghcr.io/jgomez177/tubi-for-channels:latest
          docker run -d --name t --network host ghcr.io/jgomez177/tubi-for-channels:latest
          sleep 10
          docker ps
          docker logs t || true
          for i in {1..30}; do
            echo "Attempt $i to get EPG..."
            if curl -sf http://127.0.0.1:7777/tubi/epg.xml -o /tmp/epg.xml; then
              echo "GOT IT"
              wc -l /tmp/epg.xml
              break
            fi
            sleep 10
            docker logs t --tail 50 || true
          done
          if [ -f /tmp/epg.xml ]; then
            cp /tmp/epg.xml ./tubireal.xml
          else
            echo "Failed to get EPG" && docker logs t && exit 1
          fi
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "tubi real EPG"
          file_pattern: "tubireal.xml"
