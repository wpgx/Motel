name: tubi-real-epg
on:
  workflow_dispatch:
  schedule: [{ cron: '15 */6 * * *' }]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker rm -f tubi || true
          docker pull ghcr.io/jgomez177/tubi-for-channels:latest
          docker run -d --name tubi -p 7777:7777 -e PYTHONUNBUFFERED=1 ghcr.io/jgomez177/tubi-for-channels:latest
          sleep 30
          docker logs tubi
          for i in {1..60}; do
            echo "Attempt $i - checking EPG..."
            if curl -sf "http://127.0.0.1:7777/tubi/epg.xml?gracenote=include" -o /tmp/epg.xml; then
              if [ $(wc -c < /tmp/epg.xml) -gt 10000 ]; then
                echo "Got real EPG $(wc -c < /tmp/epg.xml) bytes"
                break
              fi
            fi
            # also try without gracenote param as fallback
            curl -sf "http://127.0.0.1:7777/tubi/epg.xml" -o /tmp/epg.xml || true
            sleep 10
          done
          ls -lh /tmp/epg.xml
          head -5 /tmp/epg.xml
          cp /tmp/epg.xml ./tubi.xml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update tubi.xml real EPG"
          file_pattern: "tubi.xml"
