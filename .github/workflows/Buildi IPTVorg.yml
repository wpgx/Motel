name: Update IPTVORG USA

on:
  workflow_dispatch:
  schedule:
    - cron: '50 1 * * *'

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPTVORG USA playlist
        run: |
          curl -L --fail --retry 3 \
            -o source_us.m3u \
            "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/us.m3u"

      - name: Build selected USA playlist
        run: |
          python3 << 'PY'
          import re

          wanted = {
              "ABC.us@West": "ABC West",
              "AMC.us@EastHD": "AMC",
              "AMC.us@East": "AMC East",
              "CBS.us@East": "CBS",
              "NBC.us@East": "NBC",
              "WMAQTV51.us@HD": "NBC 5 Chicago",
              "Fox.us@East": "FOX",
              "FX.us@East": "FX",
              "IONPlus.us@East": "ION PLUS",
              "IONTV.us@East": "ION",
              "NationalGeographic.us@East": "National Geographic",
              "WFXT662.us@SD": "WFXT-DT2",
              "WGNDT1.us@SD": "WGN-DT1",
              "WNBC471.us@HD": "WNBC-DT1",
              "FXMovieChannel.us@HD": "FX Movie Channel",
              "AE.us@East": "A&E"
          }

          with open("source_us.m3u", "r", encoding="utf-8", errors="ignore") as f:
              lines = f.readlines()

          output = [
              '#EXTM3U x-tvg-url="https://raw.githubusercontent.com/StrangeDrVN/epg/public/guide.xml.gz"'
          ]

          found = set()

          for i, line in enumerate(lines):
              if not line.startswith("#EXTINF:"):
                  continue

              match = re.search(r'tvg-id="([^"]*)"', line)

              if not match:
                  continue

              tvg_id = match.group(1)

              if tvg_id not in wanted:
                  continue

              # Keep only ONE stream for each selected channel.
              if tvg_id in found:
                  continue

              if i + 1 >= len(lines):
                  continue

              url = lines[i + 1].strip()

              if not (url.startswith("http://") or url.startswith("https://")):
                  continue

              name = wanted[tvg_id]

              # Force category to USA.
              ext = re.sub(
                  r'group-title="[^"]*"',
                  'group-title="USA"',
                  line.strip(),
                  flags=re.IGNORECASE
              )

              if "group-title=" not in ext.lower():
                  ext = ext.replace(
                      "#EXTINF:-1",
                      '#EXTINF:-1 group-title="USA"',
                      1
                  )

              # Use our clean channel name.
              ext = ext.rsplit(",", 1)[0] + "," + name

              output.append(ext)
              output.append(url)

              found.add(tvg_id)

          if len(found) != len(wanted):
              print("ERROR: Not all selected channels were found.")
              print()
              print("Found:")
              for tvg_id in found:
                  print("  " + wanted[tvg_id])
              print()
              print("Missing:")
              for tvg_id, name in wanted.items():
                  if tvg_id not in found:
                      print("  " + name + " [" + tvg_id + "]")
              raise SystemExit(1)

          with open("iptvorg_usa.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")

          print()
          print("================================")
          print(" IPTVORG USA")
          print("================================")
          print("Channels created:", len(found))
          print()

          for tvg_id, name in wanted.items():
              print("OK:", name)

          print()
          print("Created: iptvorg_usa.m3u")
          print("================================")
          PY

      - name: Download EPG
        run: |
          curl -L --fail --retry 3 \
            -o guide.xml.gz \
            "https://raw.githubusercontent.com/StrangeDrVN/epg/public/guide.xml.gz"

          gzip -dc guide.xml.gz > guide.xml

          test -s guide.xml

          echo "EPG downloaded successfully:"
          ls -lh guide.xml

      - name: Filter EPG
        run: |
          python3 << 'PY'
          import xml.etree.ElementTree as ET

          wanted = {
              "ABC.us@West",
              "AMC.us@EastHD",
              "AMC.us@East",
              "CBS.us@East",
              "NBC.us@East",
              "WMAQTV51.us@HD",
              "Fox.us@East",
              "FX.us@East",
              "IONPlus.us@East",
              "IONTV.us@East",
              "NationalGeographic.us@East",
              "WFXT662.us@SD",
              "WGNDT1.us@SD",
              "WNBC471.us@HD",
              "FXMovieChannel.us@HD",
              "AE.us@East"
          }

          tree = ET.parse("guide.xml")
          root = tree.getroot()

          for channel in list(root.findall("channel")):
              if channel.get("id") not in wanted:
                  root.remove(channel)

          for program in list(root.findall("programme")):
              if program.get("channel") not in wanted:
                  root.remove(program)

          tree.write(
              "iptvorg_usa.xml",
              encoding="utf-8",
              xml_declaration=True
          )

          print("Filtered EPG created.")
          PY

          test -s iptvorg_usa.xml

          echo "Filtered XML:"
          ls -lh iptvorg_usa.xml

      - name: Verify files
        run: |
          echo
          echo "=============================="
          echo " FINAL FILES"
          echo "=============================="

          echo
          echo "M3U channel count:"
          grep -c '^#EXTINF:' iptvorg_usa.m3u

          echo
          echo "M3U contents:"
          grep '^#EXTINF:' iptvorg_usa.m3u

          echo
          echo "Files:"
          ls -lh iptvorg_usa.m3u iptvorg_usa.xml

          echo
          echo "=============================="

      - name: Commit files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add iptvorg_usa.m3u iptvorg_usa.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update IPTVORG USA"
            git push
          fi
