name: Update IPTVORG USA

on:
  workflow_dispatch:
  schedule:
    - cron: '50 1 * * *'

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPTVORG USA playlist
        run: |
          curl -L --fail --retry 3 \
            -o source_us.m3u \
            "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/us.m3u"

      - name: Build selected USA playlist
        run: |
          python3 << 'PY'
          import re

          wanted = {
              "ABC.us@West": "ABC West",
              "AMC.us@EastHD": "AMC",
              "AMC.us@East": "AMC East",
              "CBS.us@East": "CBS",
              "NBC.us@East": "NBC",
              "WMAQTV51.us@HD": "NBC 5 Chicago",
              "Fox.us@East": "FOX",
              "FX.us@East": "FX",
              "IONPlus.us@East": "ION PLUS",
              "IONTV.us@East": "ION",
              "NationalGeographic.us@East": "National Geographic",
              "WFXT662.us@SD": "WFXT-DT2",
              "WGNDT1.us@SD": "WGN-DT1",
              "WNBC471.us@HD": "WNBC-DT1",
              "FXMovieChannel.us@HD": "FX Movie Channel",
              "AE.us@East": "A&E"
          }

          with open("source_us.m3u", "r", encoding="utf-8", errors="ignore") as f:
              lines = f.readlines()

          output = [
              '#EXTM3U x-tvg-url="https://raw.githubusercontent.com/StrangeDrVN/epg/public/guide.xml.gz"'
          ]

          found = set()

          for i, line in enumerate(lines):
              if not line.startswith("#EXTINF:"):
                  continue

              match = re.search(r'tvg-id="([^"]*)"', line)

              if not match:
                  continue

              tvg_id = match.group(1)

              if tvg_id not in wanted:
                  continue

              if tvg_id in found:
                  continue

              if i + 1 >= len(lines):
                  continue

              url = lines[i + 1].strip()

              if not (
                  url.startswith("http://")
                  or url.startswith("https://")
              ):
                  continue

              name = wanted[tvg_id]

              ext = re.sub(
                  r'group-title="[^"]*"',
                  'group-title="USA"',
                  line.strip(),
                  flags=re.IGNORECASE
              )

              if "group-title=" not in ext.lower():
                  ext = ext.replace(
                      "#EXTINF:-1",
                      '#EXTINF:-1 group-title="USA"',
                      1
                  )

              ext = ext.rsplit(",", 1)[0] + "," + name

              output.append(ext)
              output.append(url)

              found.add(tvg_id)

          if len(found) != len(wanted):
              print("ERROR: Not all selected channels were found.")
              print()
              print("Found:")
              for tvg_id in found:
                  print("  " + wanted[tvg_id])

              print()
              print("Missing:")
              for tvg_id, name in wanted.items():
                  if tvg_id not in found:
                      print("  " + name + " [" + tvg_id + "]")

              raise SystemExit(1)

          with open("iptvorg_usa.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")

          print()
          print("================================")
          print(" IPTVORG USA")
          print("================================")
          print("Channels created:", len(found))
          print()

          for tvg_id, name in wanted.items():
              print("OK:", name)

          print("================================")
          PY

      - name: Download EPG
        run: |
          curl -L --fail --retry 3 \
            -o guide.xml.gz \
            "https://raw.githubusercontent.com/StrangeDrVN/epg/public/guide.xml.gz"

          gzip -dc guide.xml.gz > guide.xml

          test -s guide.xml

          echo "EPG downloaded successfully:"
          ls -lh guide.xml

      - name: Match and filter EPG
        run: |
          python3 << 'PY'
          import re
          import xml.etree.ElementTree as ET

          print("======================================")
          print(" READING SELECTED M3U CHANNELS")
          print("======================================")

          selected = {}

          with open("iptvorg_usa.m3u", "r", encoding="utf-8") as f:
              for line in f:
                  if not line.startswith("#EXTINF:"):
                      continue

                  id_match = re.search(r'tvg-id="([^"]*)"', line)

                  if not id_match:
                      continue

                  tvg_id = id_match.group(1)

                  name = line.rsplit(",", 1)[-1].strip()

                  selected[tvg_id] = name

          print("Selected channels:", len(selected))

          for tvg_id, name in selected.items():
              print(" ", name, "=>", tvg_id)

          print()
          print("======================================")
          print(" READING EPG")
          print("======================================")

          tree = ET.parse("guide.xml")
          root = tree.getroot()

          epg_channels = {}

          for channel in root.findall("channel"):
              cid = channel.get("id")

              if cid:
                  epg_channels[cid] = channel

          print("Total EPG channels:", len(epg_channels))

          # -------------------------------------------------
          # First try exact tvg-id matches.
          # -------------------------------------------------

          matches = {}

          for tvg_id, name in selected.items():

              if tvg_id in epg_channels:
                  matches[tvg_id] = tvg_id

          print()
          print("Exact matches:", len(matches))

          # -------------------------------------------------
          # Try matching by base ID.
          #
          # Example:
          # ABC.us@West -> ABC.us
          # -------------------------------------------------

          if len(matches) < len(selected):

              print()
              print("Searching unmatched channels by base ID...")

              for tvg_id, name in selected.items():

                  if tvg_id in matches:
                      continue

                  base = tvg_id.split("@")[0].lower()

                  candidates = []

                  for epg_id in epg_channels:
                      epg_base = epg_id.split("@")[0].lower()

                      if epg_base == base:
                          candidates.append(epg_id)

                  if len(candidates) == 1:
                      matches[tvg_id] = candidates[0]

                      print(
                          "MATCH:",
                          name,
                          "=>",
                          candidates[0]
                      )

          # -------------------------------------------------
          # Try matching the actual channel name.
          # -------------------------------------------------

          if len(matches) < len(selected):

              print()
              print("Searching remaining channels by display name...")

              epg_names = {}

              for channel in epg_channels.values():

                  cid = channel.get("id")

                  display = ""

                  for child in channel:
                      if child.tag == "display-name":
                          if child.text:
                              display = child.text.strip()
                              break

                  if display:
                      epg_names[cid] = display.lower()

              for tvg_id, name in selected.items():

                  if tvg_id in matches:
                      continue

                  wanted_name = name.lower()

                  candidates = []

                  for epg_id, display in epg_names.items():

                      if wanted_name == display:
                          candidates.append(epg_id)

                  if len(candidates) == 1:
                      matches[tvg_id] = candidates[0]

                      print(
                          "NAME MATCH:",
                          name,
                          "=>",
                          candidates[0]
                      )

          # -------------------------------------------------
          # Report anything still unmatched.
          # -------------------------------------------------

          unmatched = [
              (tvg_id, name)
              for tvg_id, name in selected.items()
              if tvg_id not in matches
          ]

          if unmatched:

              print()
              print("======================================")
              print(" UNMATCHED CHANNELS")
              print("======================================")

              for tvg_id, name in unmatched:
                  print(name, "=>", tvg_id)

              print()
              print("The EPG IDs containing related names are:")

              for tvg_id, name in unmatched:

                  base = tvg_id.split("@")[0].lower()

                  print()
                  print(name, "[" + tvg_id + "]")

                  shown = 0

                  for epg_id, channel in epg_channels.items():

                      display = ""

                      for child in channel:
                          if child.tag == "display-name":
                              if child.text:
                                  display = child.text.strip()
                                  break

                      if (
                          base in epg_id.lower()
                          or name.lower() in display.lower()
                          or display.lower() in name.lower()
                      ):
                          print(
                              "  EPG:",
                              epg_id,
                              "|",
                              display
                          )

                          shown += 1

                          if shown >= 10:
                              break

              print()
              print("======================================")
              print("EPG matching is incomplete.")
              print("Stopping instead of creating an empty guide.")
              print("======================================")

              raise SystemExit(1)

          # -------------------------------------------------
          # Build the final set of EPG IDs.
          # -------------------------------------------------

          matched_epg_ids = set(matches.values())

          print()
          print("======================================")
          print(" FINAL EPG MATCHES")
          print("======================================")

          for tvg_id, name in selected.items():
              print(
                  name,
                  "=>",
                  matches[tvg_id]
              )

          # -------------------------------------------------
          # Remove unwanted channels.
          # -------------------------------------------------

          for channel in list(root.findall("channel")):

              if channel.get("id") not in matched_epg_ids:
                  root.remove(channel)

          # -------------------------------------------------
          # Remove unwanted programmes.
          # -------------------------------------------------

          for programme in list(root.findall("programme")):

              if programme.get("channel") not in matched_epg_ids:
                  root.remove(programme)

          tree.write(
              "iptvorg_usa.xml",
              encoding="utf-8",
              xml_declaration=True
          )

          print()
          print("Filtered EPG created successfully.")

          PY

          test -s iptvorg_usa.xml

          echo
          echo "Filtered XML:"
          ls -lh iptvorg_usa.xml

      - name: Verify output
        run: |
          echo
          echo "======================================"
          echo " FINAL OUTPUT"
          echo "======================================"

          echo
          echo "M3U channel count:"
          grep -c '^#EXTINF:' iptvorg_usa.m3u

          echo
          echo "M3U channels:"
          grep '^#EXTINF:' iptvorg_usa.m3u

          echo
          echo "XML size:"
          ls -lh iptvorg_usa.xml

          echo
          echo "XML channels:"
          grep -c '<channel ' iptvorg_usa.xml || true

          echo
          echo "XML programmes:"
          grep -c '<programme ' iptvorg_usa.xml || true

          echo
          echo "======================================"

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add iptvorg_usa.m3u iptvorg_usa.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update IPTVORG USA channels and EPG"
            git push
          fi
