name: Update IPTVORG USA

on:
  workflow_dispatch:
  schedule:
    - cron: '50 1 * * *'

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPTVORG USA Pluto playlist
        run: |
          echo "======================================"
          echo " DOWNLOADING IPTVORG USA PLUTO"
          echo "======================================"

          curl -L --fail --retry 3 \
            -o iptvorg_usa.m3u \
            "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/us_pluto.m3u"

          test -s iptvorg_usa.m3u

          echo
          echo "Downloaded Pluto playlist:"
          ls -lh iptvorg_usa.m3u

          echo
          echo "Original Pluto channel count:"
          grep -c '^#EXTINF:' iptvorg_usa.m3u || true

      - name: Remove duplicate channels
        run: |
          echo
          echo "======================================"
          echo " REMOVING DUPLICATE CHANNELS"
          echo "======================================"

          python3 <<'PY'
          import re

          infile = "iptvorg_usa.m3u"
          outfile = "iptvorg_usa_clean.m3u"

          with open(infile, "r", encoding="utf-8", errors="replace") as f:
              lines = f.readlines()

          output = []
          seen = set()
          duplicates = 0
          entries = 0

          i = 0

          while i < len(lines):
              line = lines[i]

              if line.startswith("#EXTINF:"):
                  entries += 1

                  # Normally the URL is the next non-empty line.
                  url = ""
                  j = i + 1

                  while j < len(lines):
                      if lines[j].strip() and not lines[j].startswith("#"):
                          url = lines[j].strip()
                          break
                      j += 1

                  # Prefer tvg-id as the unique channel identity.
                  match = re.search(r'tvg-id="([^"]*)"', line)
                  tvg_id = match.group(1).strip() if match else ""

                  if tvg_id:
                      key = "tvg:" + tvg_id.lower()
                  else:
                      # Fall back to the channel name after the final comma.
                      name = line.split(",", 1)[1].strip() if "," in line else line
                      key = "name:" + name.lower()

                  if key in seen:
                      duplicates += 1

                      # Skip the complete M3U entry.
                      i = j + 1
                      continue

                  seen.add(key)

                  # Keep the complete entry exactly as supplied.
                  output.append(line)

                  k = i + 1
                  while k <= j:
                      output.append(lines[k])
                      k += 1

                  i = j + 1
                  continue

              # Preserve headers and any other lines.
              output.append(line)
              i += 1

          with open(outfile, "w", encoding="utf-8") as f:
              f.writelines(output)

          print(f"Original entries : {entries}")
          print(f"Duplicates removed: {duplicates}")
          print(f"Final entries    : {entries - duplicates}")

          if entries == 0:
              raise SystemExit("ERROR: No M3U channels found.")

          if entries - duplicates == 0:
              raise SystemExit("ERROR: Duplicate filtering removed everything.")

          PY

          mv iptvorg_usa_clean.m3u iptvorg_usa.m3u

          echo
          echo "Cleaned Pluto channel count:"
          grep -c '^#EXTINF:' iptvorg_usa.m3u || true

      - name: Verify Pluto playlist
        run: |
          echo
          echo "======================================"
          echo " VERIFYING PLUTO PLAYLIST"
          echo "======================================"

          COUNT=$(grep -c '^#EXTINF:' iptvorg_usa.m3u || true)

          echo "Channels found: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No Pluto channels found."
            exit 1
          fi

          echo
          echo "Sample channels:"
          grep '^#EXTINF:' iptvorg_usa.m3u | head -20

          echo
          echo "======================================"
          echo " PLUTO PLAYLIST OK"
          echo "======================================"

      - name: Download EPG
        run: |
          echo
          echo "======================================"
          echo " DOWNLOADING EPG"
          echo "======================================"

          curl -L --fail --retry 3 \
            -o guide.xml.gz \
            "https://raw.githubusercontent.com/StrangeDrVN/epg/public/guide.xml.gz"

          test -s guide.xml.gz

          echo
          echo "Compressed EPG:"
          ls -lh guide.xml.gz

          gzip -dc guide.xml.gz > iptvorg_usa.xml

          test -s iptvorg_usa.xml

          echo
          echo "Uncompressed EPG:"
          ls -lh iptvorg_usa.xml

      - name: Verify final files
        run: |
          echo
          echo "======================================"
          echo " FINAL RESULTS"
          echo "======================================"

          echo
          echo "M3U:"
          ls -lh iptvorg_usa.m3u

          echo
          echo "M3U channels:"
          grep -c '^#EXTINF:' iptvorg_usa.m3u || true

          echo
          echo "XML:"
          ls -lh iptvorg_usa.xml

          echo
          echo "XML channels:"
          grep -c '<channel ' iptvorg_usa.xml || true

          echo
          echo "XML programmes:"
          grep -c '<programme ' iptvorg_usa.xml || true

          echo
          echo "======================================"
          echo " IPTVORG USA PLUTO UPDATE COMPLETE"
          echo "======================================"

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add iptvorg_usa.m3u iptvorg_usa.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update USA Pluto channels"
            git push
          fi
