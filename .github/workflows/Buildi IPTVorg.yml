name: Update IPTVORG USA

on:
  workflow_dispatch:
  schedule:
    - cron: '50 1 * * *'

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPTVORG USA source
        run: |
          curl -L --fail --retry 3 \
            -o source_us.m3u \
            "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/us.m3u"

      - name: Build selected USA M3U
        run: |
          python3 << 'PY'
          import re

          SOURCE = "source_us.m3u"
          OUTPUT = "iptvorg_usa.m3u"

          # EXACT 16 channels selected from the working test M3U.
          WANTED = {
              "ABC.us@West": "ABC West",
              "AMC.us@EastHD": "AMC",
              "AMC.us@East": "AMC East",
              "CBS.us@East": "CBS",
              "NBC.us@East": "NBC",
              "WMAQTV51.us@HD": "NBC 5 Chicago",
              "Fox.us@East": "FOX",
              "FX.us@East": "FX",
              "IONPlus.us@East": "ION PLUS",
              "IONTV.us@East": "ION",
              "NationalGeographic.us@East": "National Geographic",
              "WFXT662.us@SD": "WFXT-DT2",
              "WGNDT1.us@SD": "WGN-DT1",
              "WNBC471.us@HD": "WNBC-DT1",
              "FXMovieChannel.us@HD": "FX Movie Channel",
              "AE.us@East": "A&E",
          }

          with open(SOURCE, "r", encoding="utf-8", errors="ignore") as f:
              lines = [x.rstrip("\n\r") for x in f]

          output = [
              '#EXTM3U x-tvg-url="https://raw.githubusercontent.com/StrangeDrVN/epg/public/output/guide.xml.gz"'
          ]

          found = set()
          i = 0

          while i < len(lines):
              line = lines[i]

              if line.startswith("#EXTINF:"):
                  match = re.search(r'tvg-id="([^"]*)"', line)

                  if match:
                      tvg_id = match.group(1)

                      if tvg_id in WANTED and tvg_id not in found:
                          j = i + 1
                          url = None

                          while j < len(lines):
                              candidate = lines[j].strip()

                              if candidate.startswith("http://") or candidate.startswith("https://"):
                                  url = candidate
                                  break

                              if candidate.startswith("#EXTINF:"):
                                  break

                              j += 1

                          if url:
                              name = WANTED[tvg_id]

                              # Force every selected channel into USA category.
                              ext = re.sub(
                                  r'group-title="[^"]*"',
                                  'group-title="USA"',
                                  line,
                                  flags=re.IGNORECASE
                              )

                              if "group-title=" not in ext.lower():
                                  ext = ext.replace(
                                      "#EXTINF:-1",
                                      '#EXTINF:-1 group-title="USA"',
                                      1
                                  )

                              # Use our clean channel name.
                              ext = ext.rsplit(",", 1)[0] + "," + name

                              output.append(ext)
                              output.append(url)

                              found.add(tvg_id)

              i += 1

          with open(OUTPUT, "w", encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")

          print()
          print("======================================")
          print(" SELECTED IPTVORG USA CHANNELS")
          print("======================================")
          print(f"Requested : {len(WANTED)}")
          print(f"Found     : {len(found)}")
          print()

          for tvg_id, name in WANTED.items():
              if tvg_id in found:
                  print(f"OK       {name} [{tvg_id}]")
              else:
                  print(f"MISSING  {name} [{tvg_id}]")

          print()
          print(f"M3U entries created: {len(found)}")
          print("======================================")

          if len(found) != len(WANTED):
              raise SystemExit("ERROR: One or more selected channels were not found.")

          PY

      - name: Download EPG
        run: |
          curl -L --fail --retry 3 \
            -o guide.xml.gz \
            "https://raw.githubusercontent.com/StrangeDrVN/epg/public/output/guide.xml.gz"

          gzip -dc guide.xml.gz > guide.xml

          test -s guide.xml

          echo "Full EPG downloaded:"
          ls -lh guide.xml

      - name: Filter EPG to selected channels
        run: |
          python3 << 'PY'
          import xml.etree.ElementTree as ET

          INPUT = "guide.xml"
          OUTPUT = "iptvorg_usa.xml"

          WANTED = {
              "ABC.us@West",
              "AMC.us@EastHD",
              "AMC.us@East",
              "CBS.us@East",
              "NBC.us@East",
              "WMAQTV51.us@HD",
              "Fox.us@East",
              "FX.us@East",
              "IONPlus.us@East",
              "IONTV.us@East",
              "NationalGeographic.us@East",
              "WFXT662.us@SD",
              "WGNDT1.us@SD",
              "WNBC471.us@HD",
              "FXMovieChannel.us@HD",
              "AE.us@East",
          }

          print("Parsing EPG...")

          tree = ET.parse(INPUT)
          root = tree.getroot()

          # Keep only selected channels.
          for channel in list(root.findall("channel")):
              if channel.get("id", "") not in WANTED:
                  root.remove(channel)

          # Keep only programs belonging to selected channels.
          for programme in list(root.findall("programme")):
              if programme.get("channel", "") not in WANTED:
                  root.remove(programme)

          tree.write(
              OUTPUT,
              encoding="utf-8",
              xml_declaration=True
          )

          print("Filtered EPG created:")
          print(OUTPUT)
          PY

          test -s iptvorg_usa.xml

          echo
          echo "Filtered EPG size:"
          ls -lh iptvorg_usa.xml

      - name: Verify output
        run: |
          echo "======================================"
          echo " FINAL OUTPUT"
          echo "======================================"

          echo
          echo "M3U channel count:"
          grep -c '^#EXTINF:' iptvorg_usa.m3u

          echo
          echo "USA category check:"
          grep '^#EXTINF:' iptvorg_usa.m3u

          echo
          echo "Files:"
          ls -lh iptvorg_usa.m3u iptvorg_usa.xml

          echo
          echo "======================================"

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add iptvorg_usa.m3u iptvorg_usa.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update IPTVORG USA channels and EPG"
            git push
          fi
