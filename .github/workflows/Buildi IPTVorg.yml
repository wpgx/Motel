name: Update IPTVORG USA

on:
  workflow_dispatch:
  schedule:
    - cron: '50 1 * * *'

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPTVORG USA playlist
        run: |
          curl -L --fail --retry 3 \
            -o source_us.m3u \
            "https://iptv-org.github.io/iptv/countries/us.m3u"

      - name: Build selected USA playlist
        run: |
          python3 << 'PY'
          import re

          wanted = {
              "ABC.us@West": "ABC West",
              "AMC.us@EastHD": "AMC",
              "AMC.us@East": "AMC East",
              "CBS.us@East": "CBS",
              "NBC.us@East": "NBC",
              "WMAQTV51.us@HD": "NBC 5 Chicago",
              "Fox.us@East": "FOX",
              "FX.us@East": "FX",
              "IONPlus.us@East": "ION PLUS",
              "IONTV.us@East": "ION",
              "NationalGeographic.us@East": "National Geographic",
              "WFXT662.us@SD": "WFXT-DT2",
              "WGNDT1.us@SD": "WGN-DT1",
              "WNBC471.us@HD": "WNBC-DT1",
              "FXMovieChannel.us@HD": "FX Movie Channel",
              "AE.us@East": "A&E"
          }

          with open("source_us.m3u", "r", encoding="utf-8", errors="ignore") as f:
              lines = f.readlines()

          output = [
              '#EXTM3U x-tvg-url="https://raw.githubusercontent.com/StrangeDrVN/epg/public/output/guide.xml.gz"'
          ]

          found = set()

          for i, line in enumerate(lines):
              if not line.startswith("#EXTINF:"):
                  continue

              match = re.search(r'tvg-id="([^"]*)"', line)

              if not match:
                  continue

              tvg_id = match.group(1)

              if tvg_id not in wanted:
                  continue

              if tvg_id in found:
                  continue

              if i + 1 >= len(lines):
                  continue

              url = lines[i + 1].strip()

              if not (
                  url.startswith("http://")
                  or url.startswith("https://")
              ):
                  continue

              name = wanted[tvg_id]

              ext = re.sub(
                  r'group-title="[^"]*"',
                  'group-title="USA"',
                  line.strip(),
                  flags=re.IGNORECASE
              )

              if "group-title=" not in ext.lower():
                  ext = ext.replace(
                      "#EXTINF:-1",
                      '#EXTINF:-1 group-title="USA"',
                      1
                  )

              ext = ext.rsplit(",", 1)[0] + "," + name

              output.append(ext)
              output.append(url)

              found.add(tvg_id)

          if len(found) != len(wanted):
              print("ERROR: Not all selected channels were found.")
              print()

              print("Found:")
              for tvg_id in found:
                  print("  " + wanted[tvg_id])

              print()
              print("Missing:")
              for tvg_id, name in wanted.items():
                  if tvg_id not in found:
                      print("  " + name + " [" + tvg_id + "]")

              raise SystemExit(1)

          with open("iptvorg_usa.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")

          print()
          print("================================")
          print(" IPTVORG USA PLAYLIST")
          print("================================")
          print("Channels created:", len(found))
          print()

          for tvg_id, name in wanted.items():
              print("OK:", name)

          print("================================")
          PY

      - name: Download EPG
        run: |
          curl -L --fail --retry 3 \
            -o guide.xml.gz \
            "https://raw.githubusercontent.com/StrangeDrVN/epg/public/output/guide.xml.gz"

          gzip -dc guide.xml.gz > guide.xml

          test -s guide.xml

          echo "EPG downloaded successfully:"
          ls -lh guide.xml

      - name: Filter EPG
        run: |
          python3 << 'PY'
          import re
          import xml.etree.ElementTree as ET

          print("======================================")
          print(" READING SELECTED CHANNELS")
          print("======================================")

          selected = {}

          with open("iptvorg_usa.m3u", "r", encoding="utf-8") as f:
              for line in f:
                  if not line.startswith("#EXTINF:"):
                      continue

                  match = re.search(r'tvg-id="([^"]*)"', line)

                  if not match:
                      continue

                  tvg_id = match.group(1)
                  name = line.rsplit(",", 1)[-1].strip()

                  selected[tvg_id] = name

          print("Selected channels:", len(selected))

          for tvg_id, name in selected.items():
              print(" ", name, "=>", tvg_id)

          print()
          print("======================================")
          print(" READING EPG")
          print("======================================")

          tree = ET.parse("guide.xml")
          root = tree.getroot()

          epg_channels = {}

          for channel in root.findall("channel"):
              cid = channel.get("id")

              if cid:
                  epg_channels[cid] = channel

          print("Total EPG channels:", len(epg_channels))

          # Exact matches are what we want.
          matched = {}

          for tvg_id in selected:
              if tvg_id in epg_channels:
                  matched[tvg_id] = tvg_id

          print()
          print("Exact EPG matches:", len(matched))

          # Some EPG versions may use case differences.
          if len(matched) < len(selected):

              lower_epg = {
                  cid.lower(): cid
                  for cid in epg_channels
              }

              for tvg_id in selected:
                  if tvg_id in matched:
                      continue

                  key = tvg_id.lower()

                  if key in lower_epg:
                      matched[tvg_id] = lower_epg[key]

          print("Matches after case-insensitive check:", len(matched))

          # If anything is still missing, show it and stop.
          # We do NOT create another empty XML.
          missing = [
              (tvg_id, name)
              for tvg_id, name in selected.items()
              if tvg_id not in matched
          ]

          if missing:
              print()
              print("======================================")
              print(" MISSING EPG CHANNELS")
              print("======================================")

              for tvg_id, name in missing:
                  print(name + " => " + tvg_id)

              print()
              print("First 50 EPG channel IDs:")
              for cid in list(epg_channels.keys())[:50]:
                  print(" ", cid)

              print()
              print("======================================")
              print("EPG IDs do not match the selected M3U.")
              print("Stopping before creating an empty guide.")
              print("======================================")

              raise SystemExit(1)

          matched_ids = set(matched.values())

          # Keep only selected channels.
          for channel in list(root.findall("channel")):
              if channel.get("id") not in matched_ids:
                  root.remove(channel)

          # Keep only programmes belonging to selected channels.
          for programme in list(root.findall("programme")):
              if programme.get("channel") not in matched_ids:
                  root.remove(programme)

          tree.write(
              "iptvorg_usa.xml",
              encoding="utf-8",
              xml_declaration=True
          )

          print()
          print("======================================")
          print(" EPG CREATED")
          print("======================================")

          for tvg_id, name in selected.items():
              print(
                  "OK:",
                  name,
                  "=>",
                  matched[tvg_id]
              )

          PY

          test -s iptvorg_usa.xml

      - name: Verify files
        run: |
          echo
          echo "======================================"
          echo " FINAL FILES"
          echo "======================================"

          echo
          echo "M3U channels:"
          grep -c '^#EXTINF:' iptvorg_usa.m3u

          echo
          echo "XML channels:"
          grep -c '<channel ' iptvorg_usa.xml || true

          echo
          echo "XML programmes:"
          grep -c '<programme ' iptvorg_usa.xml || true

          echo
          echo "File sizes:"
          ls -lh iptvorg_usa.m3u iptvorg_usa.xml

          echo
          echo "======================================"

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add iptvorg_usa.m3u iptvorg_usa.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update IPTVORG USA"
            git push
          fi
