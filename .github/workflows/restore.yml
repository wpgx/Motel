name: restore to Jul28 working
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          # Get the very first commit - Jul 28 original working
          FIRST=$(git rev-list --max-parents=0 HEAD)
          echo "First commit $FIRST"
          LAST_GOOD=$(git log --reverse --pretty=format:%H | head -2 | tail -1)
          # Try to find largest full_ca_us ever
          BEST=$(git log --all --pretty=format:%H -- full_ca_us.m3u | while read h; do c=$(git show $h:full_ca_us.m3u 2>/dev/null | wc -l); echo "$c $h"; done | sort -nr | head -1)
          echo "BEST $BEST"
          BEST_HASH=$(echo $BEST | awk '{print $2}')
          git show $BEST_HASH:full_ca_us.m3u > full_ca_us.m3u
          # Get first final_60 that was 65 channels
          FINAL_BEST=$(git log --all --pretty=format:%H -- final_60.m3u | while read h; do c=$(git show $h:final_60.m3u 2>/dev/null | wc -l); if [ "$c" -gt 120 ] && [ "$c" -lt 200 ]; then echo "$c $h"; fi; done | sort -nr | head -1)
          echo "FINAL $FINAL_BEST"
          FINAL_HASH=$(echo $FINAL_BEST | awk '{print $2}')
          if [ -n "$FINAL_HASH" ]; then git show $FINAL_HASH:final_60.m3u > final_60.m3u; fi
          wc -l full_ca_us.m3u final_60.m3u
          git config user.name "restore"
          git config user.email "restore@local"
          git add -f full_ca_us.m3u final_60.m3u
          git commit -m "restore Jul28 working - full 4000 final 65"
          git push -f
