name: Restore FULL
on: workflow_dispatch
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          # find last good full_ca_us with >1000 lines
          for c in $(git log --all --pretty=format:%H -- full_ca_us.m3u | head -20); do
            lines=$(git show $c:full_ca_us.m3u 2>/dev/null | wc -l)
            echo "$c $lines lines"
            if [ "$lines" -gt 1000 ]; then
              echo "RESTORING $c with $lines lines"
              git show $c:full_ca_us.m3u > full_ca_us.m3u
              git config user.name "restore"
              git config user.email "restore@local"
              git add full_ca_us.m3u
              git commit -m "restore full $lines lines from $c"
              git push -f
              exit 0
            fi
          done
          echo "NO GOOD FULL FOUND - need to rebuild from sources"
          exit 1
