name: Cleanup nested folders
on: workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "BEFORE:"
          ls -R .github || true
          # remove double nested
          rm -rf .github/workflows/.github || true
          rm -rf plex/ || true
          rm -f scrape_plex_ca.py scrape.py || true
          # keep only what should be in .github/workflows
          echo "AFTER:"
          ls -R .github
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add -A
          git commit -m "cleanup nested folders" || exit 0
          git push
