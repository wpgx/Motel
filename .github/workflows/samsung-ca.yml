name: Update Samsung CA - Direct Scrape
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Direct Samsung scrape as CA IP
        run: |
          python3 - << 'PY'
          import requests
          CANADA_IP = "207.161.77.221"  # your Winnipeg IP from pluto config
          headers = {
              "User-Agent": "Mozilla/5.0",
              "X-Forwarded-For": CANADA_IP,
              "X-Real-IP": CANADA_IP,
              "Referer": "https://www.samsungtvplus.com/",
              "Origin": "https://www.samsungtvplus.com"
          }
          # Samsung's real API with CA region
          url = "https://www.samsungtvplus.com/api/channel?region=ca"
          print(f"Fetching as {CANADA_IP} ...")
          r = requests.get(url, headers=headers, timeout=20)
          print(f"Status {r.status_code} len {len(r.text)}")
          print(r.text[:500])
          # then build m3u + xml like before...
          PY

      - name: Commit
        run: |
          git config user.name "samsung-bot"
          git config user.email "bot@deecee.ca"
          git add samsung-ca.m3u8 samsung-ca.xml || true
          git commit -m "Samsung CA direct $(date -u)" || true
          git push
