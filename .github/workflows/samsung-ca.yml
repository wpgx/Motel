name: Update Samsung CA - My Scrape
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python samsung-scrape.py
      - run: |
          echo "Channels: $(grep -c "#EXTINF" samsung-ca.m3u8)"
          ls -lh samsung-ca.*
      - name: Commit
        run: |
          git config user.name "samsung-bot"
          git config user.email "bot@deecee.ca"
          git add samsung-ca.m3u8 samsung-ca.xml
          git commit -m "Samsung CA my scrape $(date -u)" || true
          git push
