name: Update Plex CA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download Plex CA playlist from Cloudflare
        run: |
          set -e
          echo "Downloading Plex CA playlist..."
          curl -L --fail -A "Mozilla/5.0" \
            "https://plex-ca.donxman.workers.dev/plex-ca.m3u" \
            -o plex-ca.m3u

      - name: Download Plex CA guide from Matt
        run: |
          set -e
          echo "Downloading Plex CA EPG..."
          curl -L --fail -A "Mozilla/5.0" \
            "https://github.com/matthuisman/i.mjh.nz/raw/master/Plex/ca.xml.gz" \
            -o plex-ca.xml.gz

      - name: Check downloaded files
        run: |
          echo "===== PLAYLIST ====="
          ls -lh plex-ca.m3u
          echo "M3U channels:"
          grep -c '^#EXTINF:' plex-ca.m3u || true

          echo "===== EPG ====="
          ls -lh plex-ca.xml.gz
          echo "EPG compressed size:"
          du -h plex-ca.xml.gz

          echo "===== M3U HEADER ====="
          head -3 plex-ca.m3u

      - name: Commit Plex files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Plex CA playlist and EPG"
          file_pattern: "plex-ca.m3u plex-ca.xml.gz"
