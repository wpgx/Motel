              nature_science_terms = [
                  "discovery science","science channel","science","nasa","nature",
                  "wildlife","animal planet","earth","ocean","planet earth",
                  "deep sea","wild","outdoor","animals","fishing","fish","hunting"
              ]
              if any(x in n for x in nature_science_terms):
                  return "Nature & Science"

              scifi_horror_terms = [
                  "sci-fi","scifi","science fiction","horror","supernatural",
                  "paranormal","alien","aliens","twilight zone","doctor who",
                  "classic doctor who","dust","stargate","walking dead","z nation",
                  "teen wolf","outer limits","farscape","monster","haunt",
                  "scream","fright"
              ]
              if any(x in n for x in scifi_horror_terms):
                  return "Sci-Fi & Horror"

              western_terms = [
                  "western","westerns","cowboy","cowboys","wild west",
                  "western tv","western movies","bonanza","gunsmoke",
                  "rifleman","wanted: dead or alive"
              ]
              if any(x in n for x in western_terms):
                  return "Westerns"

              anime_terms = [
                  "anime","gaming","gamer","video game","videogame","esports",
                  "retro gaming","yu-gi-oh","yugioh","asiancrush","retrocrush"
              ]
              if any(x in n for x in anime_terms):
                  return "Anime & Gaming"

              music_terms = [
                  "mtv","vh1","vevo","music","music video","music videos","cmt",
                  "concert","live music","stingray","xite","rock","jazz","k-pop",
                  "hip-hop","r&b","hits"
              ]
              if any(x in n for x in music_terms):
                  return "Music"

              game_show_terms = [
                  "game show","game shows","game show network","family feud",
                  "jeopardy","wheel of fortune","deal or no deal","price is right",
                  "lets make a deal","match game","press your luck",
                  "supermarket sweep","quiz show"
              ]
              if any(x in n for x in game_show_terms):
                  return "Game Shows"

              daytime_terms = [
                  "talk show","talk shows","daytime","dr. phil","dr phil",
                  "judge judy","judge mathis","judge faith","rachael ray",
                  "the view","today show","morning show","kelly clarkson",
                  "ellen","carson","graham norton"
              ]
              if any(x in n for x in daytime_terms):
                  return "Daytime & Talk Shows"

              classic_comedy_terms = [
                  "i love lucy","andy griffith","three stooges","beverly hillbillies",
                  "gilligans island","leave it to beaver","bewitched","brady bunch",
                  "sanford and son","all in the family","classic comedy",
                  "dick van dyke","mr. bean","addams family","carol burnett",
                  "threes company"
              ]
              if any(x in n for x in classic_comedy_terms):
                  return "Classic TV Comedy"

              classic_tv_terms = [
                  "classic tv","classic television","classic movies & tv","m*a*s*h",
                  "mash","bonanza","gunsmoke","the rifleman","the waltons",
                  "little house","columbo","star trek","the lone ranger",
                  "dragnet","alfred hitchcock","that girl"
              ]
              if any(x in n for x in classic_tv_terms):
                  return "Classic TV"

              mystery_terms = [
                  "mystery","mysteries","murder mystery","detective","unsolved",
                  "unsolved mysteries","mystery channel","beyond belief",
                  "ghost hunters","most haunted","unidentified","unxplained"
              ]
              if any(x in n for x in mystery_terms):
                  return "Mystery"

              movie_terms = [
                  "movie","movies","film","films","cinema","cinevault","movieplex",
                  "filmrise","movie sphere","moviesphere","24 hour free movies",
                  "24hr free movies","hallmark movies","lifetime movies",
                  "great american pure flix","great american family",
                  "scream factory","screambox"
              ]
              if any(x in n for x in movie_terms):
                  return "Movies"

              drama_terms = [
                  "drama","soap","soap opera","law & order","law and order","ncis",
                  "criminal minds","blue bloods","chicago fire","chicago pd",
                  "chicago med","degrassi","heartland","continuum","mcleod",
                  "nip/tuck","nash bridges","silent witness","new tricks"
              ]
              if any(x in n for x in drama_terms):
                  return "Drama"

              ambiance_terms = [
                  "ambiance","ambience","relaxation","relaxing","fireplace",
                  "aquarium","scenic","scenery","nature sounds","sleep",
                  "meditation","spa"
              ]
              if any(x in n for x in ambiance_terms):
                  return "Ambiance"

              entertainment_terms = [
                  "entertainment","reality","celebrity","pop culture","reality tv",
                  "fashion","lifestyle","people","project runway","dance moms",
                  "duck dynasty","fear factor","hells kitchen"
              ]
              if any(x in n for x in entertainment_terms):
                  return "Entertainment"

              return "Other"

          lines = SOURCE.read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines()

          entries = []
          seen = set()
          category_counts = {}

          for i, line in enumerate(lines):
              if not line.startswith("#EXTINF"):
                  continue

              if i + 1 >= len(lines):
                  continue

              url = lines[i + 1].strip()

              if not url.startswith("http"):
                  continue

              name = get_name(line)
              nl = norm(name)

              if (
                  "judge nosey" in nl
                  or nl == "nosey"
                  or "novelisma" in nl
              ):
                  continue

              if any(
                  term in nl
                  for term in REMOVE_TERMS
              ):
                  continue

              plex_id = get_attr(
                  line,
                  "tvg-id"
              )

              key = plex_id or url

              if key in seen:
                  continue

              seen.add(key)

              category = category_for(name)

              category_counts[category] = (
                  category_counts.get(category, 0) + 1
              )

              if re.search(
                  r'group-title="[^"]*"',
                  line,
                  re.I
              ):
                  line = re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{category}"',
                      line,
                      flags=re.I
                  )
              else:
                  line = line.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 group-title="{category}"',
                      1
                  )

              entries.append(
                  (
                      category,
                      nl,
                      line,
                      url,
                      plex_id
                  )
              )

          category_order = {
              c: i
              for i, c in enumerate(CATEGORIES)
          }

          entries.sort(
              key=lambda x: (
                  category_order.get(
                      x[0],
                      999
                  ),
                  x[1]
              )
          )

          output = [
              '#EXTM3U url-tvg="https://motel.deecee.ca/plex-ca.xml"'
          ]

          chno = 6500

          for category, _, line, url, pid in entries:

              if re.search(
                  r'tvg-chno="[^"]*"',
                  line,
                  re.I
              ):
                  line = re.sub(
                      r'tvg-chno="[^"]*"',
                      f'tvg-chno="{chno}"',
                      line,
                      flags=re.I
                  )
              else:
                  line = line.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 tvg-chno="{chno}"',
                      1
                  )

              output.append(line)
              output.append(url)

              chno += 1

          OUTPUT_M3U.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          print("=== CATEGORY REPORT ===")

          for c in CATEGORIES:
              if category_counts.get(c):
                  print(
                      f"{c}: {category_counts[c]}"
                  )

          print(
              f"TOTAL: {len(entries)}"
          )

          other = [
              n
              for cat, n, _, _, _ in entries
              if cat == "Other"
          ]

          print(
              f"OTHER LEFT {len(other)}: {other}"
          )

          valid_ids = {
              pid
              for _, _, _, _, pid in entries
              if pid
          }

          try:
              tree = ET.parse(FULL_GUIDE)
              root = tree.getroot()

              guide_ids = {
                  e.get("id")
                  for e in root
                  if e.tag == "channel"
              }

              overlap = valid_ids & guide_ids

              print(
                  f"Guide overlap {len(overlap)}"
              )

              if len(overlap) < 10:
                  print(
                      "WARNING: Guide overlap is under 10."
                  )
                  print(
                      "Using full Luma guide unchanged."
                  )

                  tree.write(
                      OUTPUT_XML,
                      encoding="utf-8",
                      xml_declaration=True
                  )

              else:
                  for elem in list(root):

                      if (
                          elem.tag == "channel"
                          and elem.get("id")
                          not in valid_ids
                      ):
                          root.remove(elem)

                      elif (
                          elem.tag == "programme"
                          and elem.get("channel")
                          not in valid_ids
                      ):
                          root.remove(elem)

                  tree.write(
                      OUTPUT_XML,
                      encoding="utf-8",
                      xml_declaration=True
                  )

          except Exception as e:
              print(
                  f"Guide failed: {e}"
              )

              OUTPUT_XML.write_bytes(
                  FULL_GUIDE.read_bytes()
              )

      - name: Check final files
        run: |
          set -e

          rm -f plex-ca-source.m3u
          rm -f all.xml.gz

          echo "=== FINAL FILES ==="
          ls -lh plex-ca.* plexluma.xml

          echo "M3U: $(grep -c '^#EXTINF:' plex-ca.m3u)"

          echo "=== VERIFY NO GZ ==="
          if ls plex-ca.*.gz 2>/dev/null; then
            echo "ERROR: GZ file exists"
            exit 1
          else
            echo "No Plex CA GZ file"
          fi

      - name: Debug Plex XML
        run: |
          echo "=== FILE ==="
          ls -lah plex-ca.xml

          echo "=== LUMA FILE ==="
          ls -lah plexluma.xml

          echo "=== GIT STATUS ==="
          git status --short

          echo "=== GIT CHECK-IGNORE ==="
          git check-ignore -v plex-ca.xml || echo "NOT IGNORED"
          git check-ignore -v plexluma.xml || echo "NOT IGNORED"

          echo "=== GIT LS-FILES ==="
          git ls-files plex-ca.xml
          git ls-files plexluma.xml

      - name: Commit
        run: |
          set -e

          git add plex-ca.m3u plex-ca.xml

          echo "=== STAGED FILES ==="
          git status --short

          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Plex CA"

          git push
