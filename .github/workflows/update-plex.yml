              if any(x in n for x in entertainment_terms):
                  return "Entertainment"

              # --------------------------------------------------------
              # FINAL FALLBACK
              # --------------------------------------------------------

              return "Other"

          # ============================================================
          # LOAD SOURCE
          # ============================================================

          lines = SOURCE.read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines()

          entries = []
          seen = set()
          category_counts = {}

          for i, line in enumerate(lines):

              if not line.startswith("#EXTINF"):
                  continue

              if i + 1 >= len(lines):
                  continue

              url = lines[i + 1].strip()

              if not url.startswith("http"):
                  continue

              name = get_name(line)
              name_lower = name.lower()

              # ========================================================
              # EXPLICIT UNWANTED CHANNEL REMOVAL
              # ========================================================
              #
              # These are removed regardless of source group/category.
              # This catches alternate spellings and accented names.
              #

              if (
                  "judge nosey" in name_lower
                  or name_lower.strip() == "nosey"
                  or "novelisma" in name_lower
                  or "novelísima" in name_lower
              ):
                  print(f"REMOVED: {name}")
                  continue

              # ========================================================
              # FOREIGN LANGUAGE REMOVAL
              # ========================================================

              if any(
                  term in name_lower
                  for term in REMOVE_TERMS
              ):
                  print(f"REMOVED FOREIGN: {name}")
                  continue

              plex_id = get_attr(line, "tvg-id")

              key = plex_id or url

              if key in seen:
                  continue

              seen.add(key)

              category = category_for(name)

              category_counts[category] = (
                  category_counts.get(category, 0) + 1
              )

              # Replace existing group title.
              if re.search(
                  r'group-title="[^"]*"',
                  line,
                  re.I
              ):
                  line = re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{category}"',
                      line,
                      flags=re.I
                  )
              else:
                  line = line.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 group-title="{category}"',
                      1
                  )

              entries.append(
                  (
                      category,
                      name.lower(),
                      line,
                      url,
                      plex_id
                  )
              )

          # ============================================================
          # SORT BY MOTEL CATEGORY ORDER
          # ============================================================

          category_order = {
              category: i
              for i, category in enumerate(CATEGORIES)
          }

          entries.sort(
              key=lambda x: (
                  category_order.get(x[0], 999),
                  x[1]
              )
          )

          # ============================================================
          # PLEX NUMBERING 6500+
          # ============================================================

          output = [
              '#EXTM3U url-tvg="https://plex-ca.donxman.workers.dev/plex-ca.xml"'
          ]

          chno = 6500

          for category, _, line, url, plex_id in entries:

              if re.search(
                  r'tvg-chno="[^"]*"',
                  line,
                  re.I
              ):
                  line = re.sub(
                      r'tvg-chno="[^"]*"',
                      f'tvg-chno="{chno}"',
                      line,
                      flags=re.I
                  )
              else:
                  line = line.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 tvg-chno="{chno}"',
                      1
                  )

              output.append(line)
              output.append(url)

              chno += 1

          OUTPUT_M3U.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          # ============================================================
          # CATEGORY REPORT
          # ============================================================

          print()
          print("========================================")
          print("          PLEX CATEGORY REPORT")
          print("========================================")

          for category in CATEGORIES:
              count = category_counts.get(category, 0)

              if count:
                  print(
                      f"{category:<25} {count:>4}"
                  )

          print("----------------------------------------")
          print(f"TOTAL CHANNELS: {len(entries)}")
          print("NUMBERING: 6500+")
          print("========================================")

          # ============================================================
          # REPORT REMAINING OTHER CHANNELS
          # ============================================================

          other_channels = [
              name
              for category, name, _, _, _ in entries
              if category == "Other"
          ]

          print()
          print("========================================")
          print("             OTHER CHANNELS")
          print("========================================")

          for name in other_channels:
              print(name)

          print("----------------------------------------")
          print(f"OTHER COUNT: {len(other_channels)}")
          print("========================================")

          # ============================================================
          # GUIDE
          # ============================================================

          valid_ids = {
              pid
              for _, _, _, _, pid in entries
              if pid
          }

          try:

              tree = ET.parse(FULL_GUIDE)
              root = tree.getroot()

              guide_ids = {
                  e.get("id")
                  for e in root
                  if e.tag == "channel"
              }

              overlap = valid_ids & guide_ids

              print(
                  f"Guide has {len(guide_ids)}, "
                  f"wanted {len(valid_ids)}, "
                  f"overlap {len(overlap)}"
              )

              # Buddy Plex IDs and guide IDs can differ.
              # If they do, retain the complete guide.

              if len(overlap) < 10:

                  print(
                      "ID mismatch - keeping FULL guide"
                  )

                  tree.write(
                      OUTPUT_XML,
                      encoding="utf-8",
                      xml_declaration=True
                  )

              else:

                  for elem in list(root):

                      if (
                          elem.tag == "channel"
                          and elem.get("id") not in valid_ids
                      ):
                          root.remove(elem)

                      elif (
                          elem.tag == "programme"
                          and elem.get("channel") not in valid_ids
                      ):
                          root.remove(elem)

                  tree.write(
                      OUTPUT_XML,
                      encoding="utf-8",
                      xml_declaration=True
                  )

          except Exception as e:

              print(
                  f"Guide filter failed: {e}"
              )

              OUTPUT_XML.write_bytes(
                  FULL_GUIDE.read_bytes()
              )

          PY

      - name: Check final files
        run: |
          rm -f plex-ca-source.m3u full-guide.xml full-guide.xml.gz all.xml.gz

          ls -lh plex-ca.*

          echo "M3U: $(grep -c '^#EXTINF:' plex-ca.m3u)"
          echo "XML channels: $(grep -c '<channel' plex-ca.xml || true)"
          echo "XML programs: $(grep -c '<programme' plex-ca.xml || true)"

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Plex CA - improved Motel categorization"
          file_pattern: |
            plex-ca.m3u
            plex-ca.xml
