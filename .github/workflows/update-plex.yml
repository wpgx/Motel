on:
  workflow_dispatch:
  schedule:
    - cron: '0 12,0 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Plex CA playlist from Buddy
        run: |
          set -e
          curl -L --fail -A "Mozilla/5.0" \
            "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plex_ca.m3u" \
            -o plex-ca-source.m3u
          echo "Source: $(grep -c '^#EXTINF:' plex-ca-source.m3u)"

      - name: Build fresh Plex Luma guide
        env:
          PLEX_TOKEN: ${{ secrets.PLEX_TOKEN }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          TOKEN = os.environ["PLEX_TOKEN"]
          CACHE = Path("plexluma.xml")

          # If cache is fresh, don't hit Luma at all - 0 calls
          if CACHE.exists():
              age_hours = (time.time() - CACHE.stat().st_mtime) / 3600
              print(f"Cache age: {age_hours:.1f}h")
              if age_hours < 10:
                  print("Cache is fresh - skipping Luma entirely, 0 calls")
                  sys.exit(0)
          else:
              print("No cache - must fetch Luma")

          CATEGORY_URL = (
              "https://luma.plex.tv/api/fragment/live-tv/category"
              "?key=%2Flineups%2Fplex%2Fchannels"
              "&startDate="
              + datetime.datetime.now(
                  datetime.timezone.utc
              ).strftime("%Y-%m-%d")
          )

          HEADERS = {
              "X-Plex-Token": TOKEN,
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0"
          }

          def get_json_once(url):
              # ONE try only - no retry hammering. 503 = stop, use cache.
              req = urllib.request.Request(
                  url,
                  headers=HEADERS
              )
              with urllib.request.urlopen(
                  req,
                  timeout=60
              ) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          print("=== GETTING PLEX LUMA CHANNELS ===")

          try:
              channels_raw = get_json_once(CATEGORY_URL)
              if isinstance(channels_raw, dict):
                  channels = (
                      channels_raw.get("channels")
                      or channels_raw.get("items")
                      or channels_raw.get("data")
                      or []
                  )
                  print(f"Luma returned dict, extracted {len(channels)} channels")
              else:
                  channels = channels_raw
          except urllib.error.HTTPError as e:
              print(
                  f"Luma category -> {e.code} - STOPPING, reusing cache"
              )
              if CACHE.exists():
                  sys.exit(0)
              raise
          except Exception as e:
              print(
                  f"Luma category failed: {e} - reusing cache"
              )
              if CACHE.exists():
                  sys.exit(0)
              raise

          if not isinstance(channels, list):
              raise RuntimeError(
                  "Plex did not return a channel list."
              )

          print(
              f"Found {len(channels)} Plex channels."
          )

          def xmltv_time(timestamp):
              dt = datetime.datetime.fromtimestamp(
                  int(timestamp),
                  datetime.timezone.utc
              )
              return dt.strftime(
                  "%Y%m%d%H%M%S +0000"
              )

          def get_channel_key(channel):
              data = channel.get("data") or {}
              key = str(
                  data.get("key") or ""
              ).strip()
              match = re.search(
                  r"-([A-Za-z0-9]+)\.m3u8",
                  key
              )
              if match:
                  return match.group(1)
              url = str(
                  channel.get("url") or ""
              ).strip()
              match = re.search(
                  r"/airings/([^?]+)",
                  url
              )
              if match:
                  return match.group(1)
              return ""

          print("=== GETTING PLEX LUMA AIRINGS - 1 AT A TIME, SLOW ===")

          results = []
          failed_503 = False

          for index, channel in enumerate(channels, 1):
              title = str(
                  channel.get("title") or ""
              ).strip()
              key = get_channel_key(channel)
              if not key:
                  results.append((channel, []))
                  continue
              url = (
                  "https://luma.plex.tv/api/fragment/live-tv/airings/"
                  + urllib.parse.quote(
                      key,
                      safe=""
                  )
              )
              try:
                  data = get_json_once(url)
                  if isinstance(data, list):
                      airings = data
                  elif isinstance(data, dict):
                      airings = (
                          data.get("airings")
                          or data.get("items")
                          or data.get("data")
                          or []
                      )
                  else:
                      airings = []
                  results.append((channel, airings))
              except urllib.error.HTTPError as e:
                  print(
                      f"503 on {title} - STOPPING airings, "
                      f"will use what we have + cache fallback"
                  )
                  failed_503 = True
                  break
              except Exception as e:
                  print(
                      f"ERROR {title}: {e}"
                  )
                  results.append((channel, []))
              if index % 50 == 0:
                  print(
                      f"Processed {index}/{len(channels)} channels"
                  )
              time.sleep(1.0)

          if failed_503 and CACHE.exists() and len(results) < 50:
              print("Too little new data after 503 - reusing full cache")
              sys.exit(0)

          print("=== BUILDING PLEXLUMA.XML ===")

          tv = ET.Element(
              "tv",
              {
                  "generator-info-name": "Plex Luma",
                  "source-info-name": "Plex Canada"
              }
          )

          total_channels = 0
          total_programmes = 0

          for channel, airings in results:
              channel_id = str(
                  channel.get("id") or ""
              ).strip()
              title = str(
                  channel.get("title") or ""
              ).strip()
              logo = str(
                  channel.get("thumb") or ""
              ).strip()
              if not channel_id or not title:
                  continue
              channel_element = ET.SubElement(
                  tv,
                  "channel",
                  {
                      "id": channel_id
                  }
              )
              display_name = ET.SubElement(
                  channel_element,
                  "display-name"
              )
              display_name.text = title
              if logo:
                  ET.SubElement(
                      channel_element,
                      "icon",
                      {
                          "src": logo
                      }
                  )
              total_channels += 1
              for airing in airings:
                  data = airing.get("data") or {}
                  preview = (
                      airing.get("previewData")
                      or {}
                  )
                  begins = data.get(
                      "beginsAt"
                  )
                  ends = data.get(
                      "endsAt"
                  )
                  if not begins or not ends:
                      continue
                  programme = ET.SubElement(
                      tv,
                      "programme",
                      {
                          "channel": channel_id,
                          "start": xmltv_time(
                              begins
                          ),
                          "stop": xmltv_time(
                              ends
                          )
                      }
                  )
                  program_title = (
                      airing.get("title")
                      or preview.get("title")
                      or ""
                  )
                  title_element = ET.SubElement(
                      programme,
                      "title",
                      {
                          "lang": "en"
                      }
                  )
                  title_element.text = str(
                      program_title
                  )
                  subtitle = (
                      preview.get("subtitle")
                      or ""
                  )
                  if subtitle:
                      subtitle_element = ET.SubElement(
                          programme,
                          "sub-title",
                          {
                              "lang": "en"
                          }
                      )
                      subtitle_element.text = (
                          subtitle
                      )
                  summary = (
                      preview.get("summary")
                      or ""
                  )
                  if summary:
                      desc_element = ET.SubElement(
                          programme,
                          "desc",
                          {
                              "lang": "en"
                          }
                      )
                      desc_element.text = (
                          summary
                      )
                  guid = data.get(
                      "guid"
                  ) or ""
                  if guid:
                      episode_num = ET.SubElement(
                          programme,
                          "episode-num",
                          {
                              "system": "plex"
                          }
                      )
                      episode_num.text = str(
                          guid
                      )
                  total_programmes += 1

          tree = ET.ElementTree(tv)
          try:
              ET.indent(
                  tree,
                  space="  "
              )
          except AttributeError:
              pass
          tree.write(
              "plexluma.xml",
              encoding="UTF-8",
              xml_declaration=True
          )
          print("")
          print(
              f"Luma channels: {total_channels}"
          )
          print(
              f"Luma programmes: {total_programmes}"
          )
          print(
              f"Output: plexluma.xml"
          )
          if total_channels < 10 or total_programmes < 10:
              print("Too little data - keeping old cache instead")
              sys.exit(0)
          PY

