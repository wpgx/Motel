              ]
              if any(x in n for x in classic_comedy_terms):
                  return "Classic TV Comedy"

              classic_tv_terms = [
                  "classic tv","classic television","classic movies & tv","m*a*s*h",
                  "mash","bonanza","gunsmoke","the rifleman","the waltons",
                  "little house","columbo","star trek","the lone ranger",
                  "dragnet","alfred hitchcock","that girl"
              ]
              if any(x in n for x in classic_tv_terms):
                  return "Classic TV"

              mystery_terms = [
                  "mystery","mysteries","murder mystery","detective","unsolved",
                  "unsolved mysteries","mystery channel","beyond belief",
                  "ghost hunters","most haunted","unidentified","unxplained"
              ]
              if any(x in n for x in mystery_terms):
                  return "Mystery"

              movie_terms = [
                  "movie","movies","film","films","cinema","cinevault","movieplex",
                  "filmrise","movie sphere","moviesphere","24 hour free movies",
                  "24hr free movies","hallmark movies","lifetime movies",
                  "great american pure flix","great american family",
                  "scream factory","screambox"
              ]
              if any(x in n for x in movie_terms):
                  return "Movies"

              drama_terms = [
                  "drama","soap","soap opera","law & order","law and order","ncis",
                  "criminal minds","blue bloods","chicago fire","chicago pd",
                  "chicago med","degrassi","heartland","continuum","mcleod",
                  "nip/tuck","nash bridges","silent witness","new tricks"
              ]
              if any(x in n for x in drama_terms):
                  return "Drama"

              ambiance_terms = [
                  "ambiance","ambience","relaxation","relaxing","fireplace",
                  "aquarium","scenic","scenery","nature sounds","sleep",
                  "meditation","spa"
              ]
              if any(x in n for x in ambiance_terms):
                  return "Ambiance"

              entertainment_terms = [
                  "entertainment","reality","celebrity","pop culture","reality tv",
                  "fashion","lifestyle","people","project runway","dance moms",
                  "duck dynasty","fear factor","hells kitchen"
              ]
              if any(x in n for x in entertainment_terms):
                  return "Entertainment"

              return "Other"

          lines = SOURCE.read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines()

          entries = []
          seen = set()
          category_counts = {}

          for i, line in enumerate(lines):
              if not line.startswith("#EXTINF"):
                  continue

              if i + 1 >= len(lines):
                  continue

              url = lines[i + 1].strip()

              if not url.startswith("http"):
                  continue

              name = get_name(line)
              nl = norm(name)

              if (
                  "judge nosey" in nl
                  or nl == "nosey"
                  or "novelisma" in nl
              ):
                  continue

              if any(
                  term in nl
                  for term in REMOVE_TERMS
              ):
                  continue

              plex_id = get_attr(
                  line,
                  "tvg-id"
              )

              key = plex_id or url

              if key in seen:
                  continue

              seen.add(key)

              category = category_for(name)

              category_counts[category] = (
                  category_counts.get(category, 0) + 1
              )

              if re.search(
                  r'group-title="[^"]*"',
                  line,
                  re.I
              ):
                  line = re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{category}"',
                      line,
                      flags=re.I
                  )
              else:
                  line = line.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 group-title="{category}"',
                      1
                  )

              entries.append(
                  (
                      category,
                      nl,
                      line,
                      url,
                      plex_id
                  )
              )

          category_order = {
              c: i
              for i, c in enumerate(CATEGORIES)
          }

          entries.sort(
              key=lambda x: (
                  category_order.get(
                      x[0],
                      999
                  ),
                  x[1]
              )
          )

          output = [
              '#EXTM3U url-tvg="https://motel.deecee.ca/plex-ca.xml"'
          ]

          chno = 6500

          for category, _, line, url, pid in entries:

              if re.search(
                  r'tvg-chno="[^"]*"',
                  line,
                  re.I
              ):
                  line = re.sub(
                      r'tvg-chno="[^"]*"',
                      f'tvg-chno="{chno}"',
                      line,
                      flags=re.I
                  )
              else:
                  line = line.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 tvg-chno="{chno}"',
                      1
                  )

              output.append(line)
              output.append(url)

              chno += 1

          OUTPUT_M3U.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          print("=== CATEGORY REPORT ===")

          for c in CATEGORIES:
              if category_counts.get(c):
                  print(
                      f"{c}: {category_counts[c]}"
                  )

          print(
              f"TOTAL: {len(entries)}"
          )

          other = [
              n
              for cat, n, _, _, _ in entries
              if cat == "Other"
          ]

          print(
              f"OTHER LEFT {len(other)}: {other}"
          )

          # --- FIX: match guide to playlist by TITLE, not by ID - KEEP unmatched ---
          def norm_guide_title(s):
              s = norm(s)
              for suffix in [" hd", " tv", " channel"]:
                  if s.endswith(suffix):
                      s = s[:-len(suffix)].strip()
              return s

          title_to_buddy_id = {}
          title_to_buddy_id_guide = {}
          id_to_buddy = {}

          for _, nl, _, _, pid in entries:
              if pid:
                  id_to_buddy[pid] = pid
              if pid and nl:
                  title_to_buddy_id.setdefault(nl, pid)
                  title_to_buddy_id_guide.setdefault(
                      norm_guide_title(nl),
                      pid
                  )

          try:
              tree = ET.parse(FULL_GUIDE)
              root = tree.getroot()

              luma_to_buddy = {}
              matched = 0
              unmatched = []

              for elem in list(root):
                  if elem.tag != "channel":
                      continue

                  dn = elem.find("display-name")
                  luma_title = dn.text if dn is not None else ""
                  luma_id = elem.get("id") or ""

                  buddy_id = (
                      id_to_buddy.get(luma_id)
                      or title_to_buddy_id.get(norm(luma_title))
                      or title_to_buddy_id_guide.get(
                          norm_guide_title(luma_title)
                      )
                  )

                  if buddy_id:
                      luma_to_buddy[luma_id] = buddy_id
                      elem.set("id", buddy_id)
                      matched += 1
                  else:
                      # KEEP IT - don't delete, Sparkle needs it
                      luma_to_buddy[luma_id] = luma_id
                      unmatched.append(luma_title)

              kept_prog = 0

              for elem in list(root):
                  if elem.tag == "programme":
                      buddy_id = luma_to_buddy.get(
                          elem.get("channel")
                      )
                      if buddy_id:
                          elem.set("channel", buddy_id)
                          kept_prog += 1
                      else:
                          root.remove(elem)

              print(
                  f"Guide matched by title/id: {matched} channels, "
                  f"{kept_prog} programmes"
              )
              if unmatched:
                  print(
                      f"Guide UNMATCHED (kept anyway): {unmatched[:20]}"
                  )

              tree.write(
                  OUTPUT_XML,
                  encoding="utf-8",
                  xml_declaration=True
              )

          except Exception as e:
              print(
                  f"Guide failed: {e}"
              )

              OUTPUT_XML.write_bytes(
                  FULL_GUIDE.read_bytes()
              )

      - name: Check final files
        run: |
          set -e

          rm -f plex-ca-source.m3u
          rm -f all.xml.gz

          echo "=== FINAL FILES ==="
          ls -lh plex-ca.* plexluma.xml

          echo "M3U: $(grep -c '^#EXTINF:' plex-ca.m3u)"

          echo "=== VERIFY NO GZ ==="
          if ls plex-ca.*.gz 2>/dev/null; then
            echo "ERROR: GZ file exists"
            exit 1
          else
            echo "No Plex CA GZ file"
          fi

      - name: Debug Plex XML
        run: |
          echo "=== FILE ==="
          ls -lah plex-ca.xml

          echo "=== LUMA FILE ==="
          ls -lah plexluma.xml

          echo "=== GIT STATUS ==="
          git status --short

          echo "=== GIT CHECK-IGNORE ==="
          git check-ignore -v plex-ca.xml || echo "NOT IGNORED"
          git check-ignore -v plexluma.xml || echo "NOT IGNORED"

          echo "=== GIT LS-FILES ==="
          git ls-files plex-ca.xml
          git ls-files plexluma.xml

      - name: Commit
        run: |
          set -e

          git add plex-ca.m3u plex-ca.xml plexluma.xml

          echo "=== STAGED FILES ==="
          git status --short

          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Plex CA"

          git push
