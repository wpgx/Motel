name: Update Plex CA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Plex CA playlist from Buddy
        run: |
          set -e

          echo "Downloading Plex CA playlist from Buddy..."

          curl -L --fail -A "Mozilla/5.0" \
            "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plex_ca.m3u" \
            -o plex-ca-source.m3u

          echo "Downloaded:"
          ls -lh plex-ca-source.m3u

      - name: Build cleaned Plex CA playlist
        run: |
          python3 - << 'PY'
          import re
          from pathlib import Path
          from collections import Counter

          SOURCE = Path("plex-ca-source.m3u")
          OUTPUT = Path("plex-ca.m3u")

          # ============================================================
          # EXISTING DC CATEGORIES
          # ============================================================

          CATEGORIES = [
              "News & Weather",
              "Sports",
              "Movies",
              "Classic TV",
              "Classic TV Comedy",
              "Comedy",
              "Crime",
              "Daytime & Talk Shows",
              "Documentary",
              "Drama",
              "Entertainment",
              "Game Shows",
              "Home & Food",
              "Kids",
              "Music",
              "Mystery",
              "Nature & Science",
              "Other",
              "Sci-Fi & Horror",
              "South Park",
              "Westerns",
              "Ambiance",
              "Anime & Gaming",
          ]

          # ============================================================
          # LANGUAGE CHANNELS WE DO NOT WANT
          # ============================================================

          REMOVE_TERMS = [
              "spanish",
              "espanol",
              "español",
              "latin",
              "french",
              "français",
              "francais",
          ]

          def get_attr(ext, attr):
              m = re.search(
                  rf'{re.escape(attr)}="([^"]*)"',
                  ext,
                  re.I
              )
              return m.group(1) if m else ""

          def get_name(ext):
              return ext.rsplit(",", 1)[-1].strip()

          # ============================================================
          # CATEGORY DETECTION
          # ============================================================

          def category_for(name):
              n = name.lower()

              # --------------------------------------------------------
              # SOUTH PARK
              # --------------------------------------------------------

              if "south park" in n:
                  return "South Park"

              # --------------------------------------------------------
              # ANIME & GAMING
              # --------------------------------------------------------

              if any(x in n for x in [
                  "anime",
                  "gaming",
                  "gamer",
                  "video game",
                  "videogame",
              ]):
                  return "Anime & Gaming"

              # --------------------------------------------------------
              # AMBIANCE
              # --------------------------------------------------------

              if any(x in n for x in [
                  "ambiance",
                  "ambient",
                  "relaxation",
                  "relax",
                  "scenic",
                  "fireplace",
                  "aquarium",
                  "lofi",
                  "lo-fi",
              ]):
                  return "Ambiance"

              # --------------------------------------------------------
              # WESTERNS
              # --------------------------------------------------------

              if any(x in n for x in [
                  "western",
                  "westerns",
                  "cowboy",
                  "wild west",
              ]):
                  return "Westerns"

              # --------------------------------------------------------
              # CLASSIC TV COMEDY
              # --------------------------------------------------------

              if any(x in n for x in [
                  "classic comedy",
                  "classic sitcom",
                  "three stooges",
                  "andy griffith",
                  "beverly hillbillies",
                  "bewitched",
                  "i dream of jeannie",
                  "leave it to beaver",
                  "munsters",
                  "addams family",
                  "gilligan",
                  "honeymooners",
                  "sanford and son",
                  "jeffersons",
                  "good times",
                  "family ties",
                  "cheers",
                  "frasier",
                  "taxi",
                  "mash",
                  "classic tv comedy",
              ]):
                  return "Classic TV Comedy"

              # --------------------------------------------------------
              # CLASSIC TV
              # --------------------------------------------------------

              if any(x in n for x in [
                  "classic tv",
                  "classic television",
                  "retro tv",
                  "vintage tv",
                  "classic shows",
              ]):
                  return "Classic TV"

              # --------------------------------------------------------
              # GAME SHOWS
              # --------------------------------------------------------

              if any(x in n for x in [
                  "game show",
                  "game shows",
                  "gameshow",
                  "gameshows",
                  "family feud",
                  "price is right",
                  "wheel of fortune",
                  "deal or no deal",
                  "jeopardy",
                  "match game",
                  "supermarket sweep",
                  "buzzr",
              ]):
                  return "Game Shows"

              # --------------------------------------------------------
              # DAYTIME & TALK SHOWS
              # --------------------------------------------------------

              if any(x in n for x in [
                  "talk show",
                  "talk shows",
                  "daytime",
                  "court tv",
                  "court",
                  "judge",
                  "divorce court",
                  "people's court",
                  "peoples court",
                  "trutv",
              ]):
                  return "Daytime & Talk Shows"

              # --------------------------------------------------------
              # NEWS & WEATHER
              # --------------------------------------------------------

              if any(x in n for x in [
                  "news",
                  "weather",
                  "cnn",
                  "cnbc",
                  "msnbc",
                  "abc news",
                  "cbs news",
                  "nbc news",
                  "fox news",
                  "weather channel",
                  "headline news",
                  "newsmax",
                  "bloomberg",
              ]):
                  return "News & Weather"

              # --------------------------------------------------------
              # SPORTS
              # --------------------------------------------------------

              if any(x in n for x in [
                  "sports",
                  "nfl",
                  "nba",
                  "nhl",
                  "mlb",
                  "nascar",
                  "racing",
                  "golf",
                  "tennis",
                  "soccer",
                  "football",
                  "basketball",
                  "hockey",
                  "wrestling",
                  "ufc",
                  "fight",
                  "fishing",
                  "motor",
                  "motortrend",
              ]):
                  return "Sports"

              # --------------------------------------------------------
              # KIDS
              # --------------------------------------------------------

              if any(x in n for x in [
                  "kids",
                  "kid's",
                  "children",
                  "nick",
                  "nickelodeon",
                  "cartoon",
                  "cartoons",
                  "baby",
                  "junior",
                  "paw patrol",
                  "pbs kids",
                  "teletubbies",
              ]):
                  return "Kids"

              # --------------------------------------------------------
              # MUSIC
              # --------------------------------------------------------

              if any(x in n for x in [
                  "music",
                  "vevo",
                  "concert",
                  "mtv",
                  "vh1",
                  "country music",
                  "rock music",
                  "music videos",
              ]):
                  return "Music"

              # --------------------------------------------------------
              # HOME & FOOD
              # --------------------------------------------------------

              if any(x in n for x in [
                  "food",
                  "food network",
                  "cooking",
                  "cook",
                  "cuisine",
                  "home",
                  "garden",
                  "gardening",
                  "house",
                  "design",
                  "diy",
                  "hgtv",
                  "magnolia",
                  "taste",
              ]):
                  return "Home & Food"

              # --------------------------------------------------------
              # CRIME
              # --------------------------------------------------------

              if any(x in n for x in [
                  "crime",
                  "true crime",
                  "murder",
                  "killer",
                  "killers",
                  "forensic",
                  "cold case",
                  "investigation",
                  "investigative",
                  "law & order",
                  "law and order",
                  "unsolved",
                  "police",
                  "detective",
                  "criminal",
              ]):
                  return "Crime"

              # --------------------------------------------------------
              # MYSTERY
              # --------------------------------------------------------

              if any(x in n for x in [
                  "mystery",
                  "mysteries",
                  "mystery channel",
                  "mystery tv",
              ]):
                  return "Mystery"

              # --------------------------------------------------------
              # DOCUMENTARY
              # --------------------------------------------------------

              if any(x in n for x in [
                  "documentary",
                  "documentaries",
                  "biography",
                  "biographies",
                  "docuseries",
                  "documenting",
              ]):
                  return "Documentary"

              # --------------------------------------------------------
              # NATURE & SCIENCE
              # --------------------------------------------------------

              if any(x in n for x in [
                  "nature",
                  "science",
                  "animal planet",
                  "animals",
                  "wildlife",
                  "wild",
                  "earth",
                  "space",
                  "discovery science",
                  "history",
                  "history channel",
                  "natural world",
              ]):
                  return "Nature & Science"

              # --------------------------------------------------------
              # SCI-FI & HORROR
              # --------------------------------------------------------

              if any(x in n for x in [
                  "sci-fi",
                  "sci fi",
                  "scifi",
                  "science fiction",
                  "horror",
                  "paranormal",
                  "supernatural",
                  "twilight zone",
                  "monster",
                  "monsters",
              ]):
                  return "Sci-Fi & Horror"

              # --------------------------------------------------------
              # COMEDY
              # --------------------------------------------------------

              if any(x in n for x in [
                  "comedy",
                  "comedies",
                  "funny",
                  "laugh",
                  "always funny",
              ]):
                  return "Comedy"

              # --------------------------------------------------------
              # MOVIES
              # --------------------------------------------------------

              if any(x in n for x in [
                  "movie",
                  "movies",
                  "film",
                  "films",
                  "cinema",
                  "cinevault",
                  "hallmark movies",
                  "action movies",
                  "classic movies",
              ]):
                  return "Movies"

              # --------------------------------------------------------
              # DRAMA
              # --------------------------------------------------------

              if any(x in n for x in [
                  "drama",
                  "dramatic",
                  "soap",
                  "soap opera",
              ]):
                  return "Drama"

              # --------------------------------------------------------
              # ENTERTAINMENT
              # --------------------------------------------------------

              if any(x in n for x in [
                  "entertainment",
                  "reality",
                  "celebrity",
                  "lifestyle",
                  "pop culture",
                  "tyler perry",
                  "reality tv",
              ]):
                  return "Entertainment"

              # --------------------------------------------------------
              # DEFAULT
              # --------------------------------------------------------

              return "Other"

          # ============================================================
          # LOAD PLAYLIST
          # ============================================================

          lines = SOURCE.read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines()

          entries = []

          # Plex ID / URL dedupe
          seen = set()

          removed_language = 0
          duplicate_count = 0

          category_counts = Counter()

          for i, line in enumerate(lines):

              if not line.startswith("#EXTINF"):
                  continue

              if i + 1 >= len(lines):
                  continue

              url = lines[i + 1].strip()

              if not url.startswith("http"):
                  continue

              name = get_name(line)
              name_lower = name.lower()

              # --------------------------------------------------------
              # REMOVE LANGUAGE CHANNELS
              # --------------------------------------------------------

              if any(term in name_lower for term in REMOVE_TERMS):
                  removed_language += 1
                  continue

              # --------------------------------------------------------
              # DEDUPE
              #
              # Prefer Plex tvg-id.
              # Fall back to complete URL.
              # --------------------------------------------------------

              plex_id = get_attr(line, "tvg-id")

              key = plex_id or url

              if key in seen:
                  duplicate_count += 1
                  continue

              seen.add(key)

              # --------------------------------------------------------
              # CATEGORY
              # --------------------------------------------------------

              category = category_for(name)

              category_counts[category] += 1

              # --------------------------------------------------------
              # REMOVE OLD CATEGORY
              # AND INSERT OUR CATEGORY
              # --------------------------------------------------------

              if re.search(
                  r'group-title="[^"]*"',
                  line,
                  re.I
              ):
                  line = re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{category}"',
                      line,
                      flags=re.I
                  )
              else:
                  line = line.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 group-title="{category}"',
                      1
                  )

              # --------------------------------------------------------
              # REMOVE OLD CHANNEL NUMBER
              # --------------------------------------------------------

              line = re.sub(
                  r'\s+tvg-chno="[^"]*"',
                  "",
                  line,
                  flags=re.I
              )

              entries.append(
                  (
                      category,
                      name.lower(),
                      line,
                      url
                  )
              )

          # ============================================================
          # SORT INTO OUR EXISTING CATEGORY ORDER
          # ============================================================

          category_order = {
              category: i
              for i, category in enumerate(CATEGORIES)
          }

          entries.sort(
              key=lambda x: (
                  category_order.get(x[0], 999),
                  x[1]
              )
          )

          # ============================================================
          # WRITE FINAL PLAYLIST
          # ============================================================

          output = [
              '#EXTM3U url-tvg="https://motel.deecee.ca/dccatalog.xml"'
          ]

          channel_number = 6500

          for category, _, line, url in entries:

              line = re.sub(
                  r'tvg-chno="[^"]*"',
                  f'tvg-chno="{channel_number}"',
                  line,
                  flags=re.I
              )

              if "tvg-chno=" not in line.lower():

                  line = line.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 tvg-chno="{channel_number}"',
                      1
                  )

              output.append(line)
              output.append(url)

              channel_number += 1

          OUTPUT.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          # ============================================================
          # REPORT
          # ============================================================

          print()
          print("============================================")
          print("          PLEX CA BUILD REPORT")
          print("============================================")
          print(
              f"Final channels:        {len(entries)}"
          )
          print(
              f"Duplicates removed:    {duplicate_count}"
          )
          print(
              f"Language removed:      {removed_language}"
          )
          print(
              f"Number range:          6500-{channel_number - 1}"
          )
          print(
              f"Categories used:       {len(category_counts)}"
          )
          print("--------------------------------------------")

          for category in CATEGORIES:
              count = category_counts.get(category, 0)

              if count:
                  print(
                      f"{category:<25} {count:>4}"
                  )

          print("============================================")

          PY

      - name: Check final playlist
        run: |
          echo "============================================"
          echo "PLEX CA PLAYLIST"
          echo "============================================"

          ls -lh plex-ca.m3u

          echo
          echo "CHANNEL COUNT:"
          grep -c '^#EXTINF:' plex-ca.m3u || true

          echo
          echo "CATEGORIES:"
          grep '^#EXTINF:' plex-ca.m3u \
            | sed -n 's/.*group-title="\([^"]*\)".*/\1/p' \
            | sort \
            | uniq -c \
            | sort -k2

          echo
          echo "FIRST CHANNELS:"
          head -12 plex-ca.m3u

      - name: Commit Plex CA playlist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Plex CA playlist"
          file_pattern: "plex-ca.m3u"
