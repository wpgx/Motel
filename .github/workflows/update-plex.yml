name: Update Plex CA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Plex CA source
        run: |
          curl -L --fail -A "Mozilla/5.0" \
            "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plex_ca.m3u" \
            -o plex-ca-source.m3u
          ls -lh plex-ca-source.m3u

      - name: Download guide
        run: |
          curl -L -A "Mozilla/5.0" https://plex-ca.donxman.workers.dev/plex-ca.xml -o full-guide.xml || true
          if [! -s full-guide.xml ] || [ $(wc -c < full-guide.xml) -lt 100000 ]; then
            curl -L --fail -A "Mozilla/5.0" https://github.com/matthuisman/i.mjh.nz/raw/master/Plex/all.xml.gz -o all.xml.gz
            gunzip -c all.xml.gz > full-guide.xml
          fi
          ls -lh full-guide.xml

      - name: Build BOTH
        run: |
          python3 - << 'PY'
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          SRC = Path("plex-ca-source.m3u")
          OUT_SHORT = Path("plex-ca.m3u")
          OUT_LONG = Path("plex-ca-long.m3u")
          FULL = Path("full-guide.xml")
          OUT_XML = Path("plex-ca.xml")

          def get_attr(s,a):
            import re
            m=re.search(rf'{re.escape(a)}="([^"]*)"',s,re.I)
            return m.group(1) if m else ""
          def get_name(s): return s.rsplit(",",1)[-1].strip()

          lines=SRC.read_text(encoding="utf-8",errors="ignore").splitlines()
          entries=[]
          seen=set()
          for i,line in enumerate(lines):
            if not line.startswith("#EXTINF"): continue
            if i+1>=len(lines): continue
            url=lines[i+1].strip()
            if not url.startswith("http"): continue
            pid=get_attr(line,"tvg-id")
            key=pid or url
            if key in seen: continue
            seen.add(key)
            entries.append((get_name(line).lower(), line, url, pid))
          entries.sort(key=lambda x:x[0])

          long_out=[f'#EXTM3U url-tvg="https://plex-ca.donxman.workers.dev/plex-ca.xml"']
          short_out=[f'#EXTM3U url-tvg="https://plex-ca.donxman.workers.dev/plex-ca.xml"']
          chno=6500
          valid=set()
          for _,line,url,pid in entries:
            if pid: valid.add(pid)
            line=re.sub(r'\s+tvg-chno="[^"]*"',"",line,flags=re.I)
            line=line.replace("#EXTINF:-1",f'#EXTINF:-1 tvg-chno="{chno}"',1)
            long_out.append(line); long_out.append(url)
            short_out.append(line); short_out.append(f"https://plex-ca.donxman.workers.dev/p/{chno}")
            chno+=1

          OUT_LONG.write_text("\n".join(long_out)+"\n",encoding="utf-8")
          OUT_SHORT.write_text("\n".join(short_out)+"\n",encoding="utf-8")
          print(f"Built long {len(entries)} and short {len(entries)}")

          try:
            tree=ET.parse(FULL)
            root=tree.getroot()
            for e in list(root):
              if e.tag=="channel" and e.get("id") not in valid: root.remove(e)
              elif e.tag=="programme" and e.get("channel") not in valid: root.remove(e)
            tree.write(OUT_XML,encoding="utf-8",xml_declaration=True)
          except Exception as ex:
            print(f"guide filter fail {ex}")
            OUT_XML.write_bytes(FULL.read_bytes())
          PY
          ls -lh plex-ca.m3u plex-ca-long.m3u plex-ca.xml

      - name: Commit BOTH
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build plex-ca.m3u SHORT and plex-ca-long.m3u LONG"
          file_pattern: |
            plex-ca.m3u
            plex-ca-long.m3u
            plex-ca.xml
