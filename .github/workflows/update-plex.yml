name: update-plex
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Plex CA
        run: |
          docker run -d --name pfc -p 7777:7777 -e PLEX_CODE=ca ghcr.io/jgomez177/plex-for-channels:latest
          sleep 50
          docker logs pfc --tail 50
          curl -s http://127.0.0.1:7777/plex/playlist.m3u8 -o /tmp/plex.m3u8 || curl -s http://127.0.0.1:7777/playlist.m3u8 -o /tmp/plex.m3u8
          curl -s http://127.0.0.1:7777/plex/epg.xml -o /tmp/plex.xml || curl -s http://127.0.0.1:7777/epg.xml -o /tmp/plex.xml
          mkdir -p plex
          mv /tmp/plex.m3u8 plex/plex.m3u8
          mv /tmp/plex.xml plex/plex.xml
          wc -l plex/*

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add plex/plex.m3u8 plex/plex.xml
          git commit -m "update plex ca" || exit 0
          git push
