name: update-plex
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Plex CA
        run: |
          mkdir -p /tmp/plexdata
          docker run -d --name pfc -p 7777:7777 -v /tmp/plexdata:/app/data -e PLEX_CODE=ca ghcr.io/jgomez177/plex-for-channels:latest
          echo "Waiting 60s..."
          sleep 60
          docker logs pfc --tail 100
          ls -R /tmp/plexdata
          # New version writes to /app/data/plex/
          find /tmp/plexdata -type f
          # Copy to root with clear names
          cp /tmp/plexdata/plex/playlist.m3u8 ./plex.m3u8 2>/dev/null || cp /tmp/plexdata/playlist.m3u8 ./plex.m3u8 2>/dev/null || cp /tmp/plexdata/plex.m3u8 ./plex.m3u8
          cp /tmp/plexdata/plex/epg.xml ./plex.xml 2>/dev/null || cp /tmp/plexdata/epg.xml ./plex.xml 2>/dev/null || cp /tmp/plexdata/plex.xml ./plex.xml
          echo "=== RESULT ==="
          ls -lh plex.m3u8 plex.xml
          wc -l plex.m3u8
          head -3 plex.m3u8

      - name: Commit to main folder
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add plex.m3u8 plex.xml
          # remove old broken plex folder if exists
          git rm -r --cached plex/ 2>/dev/null || true
          rm -rf plex/
          git add -A
          git commit -m "update plex.m3u8 to main" || exit 0
          git push
