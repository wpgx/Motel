name: Update Plex CA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Plex CA playlist from Buddy
        run: |
          set -e
          curl -L --fail -A "Mozilla/5.0" \
            "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plex_ca.m3u" \
            -o plex-ca-source.m3u

          echo "Source: $(grep -c '^#EXTINF:' plex-ca-source.m3u)"

      - name: Download fresh Plex guide from Worker
        run: |
          set -e

          curl -L --compressed --fail -A "Mozilla/5.0" \
            "https://plex-ca.donxman.workers.dev/plex-ca.xml" \
            -o full-guide.xml

          if file full-guide.xml | grep -q gzip; then
            mv full-guide.xml full-guide.xml.gz
            gunzip -c full-guide.xml.gz > full-guide.xml
          fi

          echo "Channels: $(grep -c '<channel' full-guide.xml || true)"
          echo "Programs: $(grep -c '<programme' full-guide.xml || true)"

          if [ "$(grep -c '<channel' full-guide.xml || true)" -lt 10 ]; then
            echo "Worker empty, using Matt fallback"

            curl -L --fail -A "Mozilla/5.0" \
              "https://github.com/matthuisman/i.mjh.nz/raw/master/Plex/all.xml.gz" \
              -o all.xml.gz

            gunzip -c all.xml.gz > full-guide.xml
          fi

      - name: Build categorized Plex CA playlist + guide
        run: |
          python3 - << 'PY'
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          SOURCE = Path("plex-ca-source.m3u")
          OUTPUT_M3U = Path("plex-ca.m3u")
          FULL_GUIDE = Path("full-guide.xml")
          OUTPUT_XML = Path("plex-ca.xml")

          # ============================================================
          # EXISTING MOTEL CATEGORIES
          # ============================================================

          CATEGORIES = [
              "News & Weather",
              "Sports",
              "Movies",
              "Crime",
              "Classic TV",
              "Classic TV Comedy",
              "Comedy",
              "Drama",
              "Entertainment",
              "Game Shows",
              "Daytime & Talk Shows",
              "Documentary",
              "Home & Food",
              "Kids",
              "Music",
              "Mystery",
              "Nature & Science",
              "Sci-Fi & Horror",
              "Westerns",
              "South Park",
              "Ambiance",
              "Anime & Gaming",
              "Other"
          ]

          REMOVE_TERMS = [
              "spanish",
              "espanol",
              "español",
              "latin",
              "latino",
              "telemundo",
              "french",
              "français",
              "francais",
              "deutsch",
              "italiano",
              "portuguese",
              "brazuca"
          ]

          def get_attr(ext, attr):
              m = re.search(
                  rf'{re.escape(attr)}="([^"]*)"',
                  ext,
                  re.I
              )
              return m.group(1) if m else ""

          def get_name(ext):
              return ext.rsplit(",", 1)[-1].strip()

          # ============================================================
          # PLEX CATEGORY RULES
          #
          # Specific rules come first.
          # General Entertainment is the final fallback.
          # ============================================================

          def category_for(name):

              n = re.sub(r'\s+', ' ', name.lower()).strip()

              # --------------------------------------------------------
              # SOUTH PARK
              # --------------------------------------------------------

              if "south park" in n:
                  return "South Park"

              # --------------------------------------------------------
              # NEWS & WEATHER
              # --------------------------------------------------------

              news_terms = [
                  "cnn",
                  "msnbc",
                  "fox news",
                  "fox business",
                  "abc news",
                  "cbs news",
                  "nbc news",
                  "nbc now",
                  "newsnation",
                  "newsmax",
                  "weather channel",
                  "weather channel",
                  "accuweather",
                  "local now",
                  "cheddar news",
                  "cnbc",
                  "reuters",
                  "bloomberg",
                  "news 12",
                  "court tv"
              ]

              if any(x in n for x in news_terms):
                  return "News & Weather"

              # --------------------------------------------------------
              # SPORTS
              # --------------------------------------------------------

              sports_terms = [
                  "espn",
                  "fs1",
                  "fs2",
                  "fox sports",
                  "sportsnet",
                  "tsn",
                  "nfl",
                  "nhl",
                  "nba",
                  "mlb",
                  "nascar",
                  "motogp",
                  "motortrend",
                  "golf",
                  "pga",
                  "tennis",
                  "wimbledon",
                  "ufc",
                  "fight",
                  "boxing",
                  "wrestling",
                  "cornhole",
                  "pickleball",
                  "football",
                  "basketball",
                  "baseball",
                  "hockey",
                  "soccer",
                  "fubo sports",
                  "stadium",
                  "beinsports",
                  "bein sports"
              ]

              if any(x in n for x in sports_terms):
                  return "Sports"

              # --------------------------------------------------------
              # KIDS
              # --------------------------------------------------------

              kids_terms = [
                  "nickelodeon",
                  "nick jr",
                  "nick jr.",
                  "nicktoons",
                  "cartoon network",
                  "boomerang",
                  "pbs kids",
                  "disney junior",
                  "disney jr",
                  "disney channel",
                  "dreamworks",
                  "babyfirst",
                  "baby first",
                  "kabillion",
                  "moonbug",
                  "kidoodle",
                  "kids",
                  "family kids",
                  "lego"
              ]

              if any(x in n for x in kids_terms):
                  return "Kids"

              # --------------------------------------------------------
              # HOME & FOOD
              # --------------------------------------------------------

              home_food_terms = [
                  "food network",
                  "cooking",
                  "cook's",
                  "cooks",
                  "hgtv",
                  "home & garden",
                  "home and garden",
                  "tastemade",
                  "taste made",
                  "delish",
                  "bon appétit",
                  "bon appetit",
                  "garden",
                  "home",
                  "renovation",
                  "house hunters",
                  "property",
                  "travel kitchen",
                  "food",
                  "eats"
              ]

              if any(x in n for x in home_food_terms):
                  return "Home & Food"

              # --------------------------------------------------------
              # CRIME
              # --------------------------------------------------------

              crime_terms = [
                  "crime",
                  "true crime",
                  "investigation discovery",
                  "id channel",
                  "forensic files",
                  "cold case",
                  "killer",
                  "killers",
                  "murder",
                  "murderous",
                  "criminal",
                  "criminals",
                  "cops",
                  "court tv",
                  "crime 360",
                  "chasing criminals",
                  "cold case files",
                  "crime scenes"
              ]

              if any(x in n for x in crime_terms):
                  return "Crime"

              # --------------------------------------------------------
              # DOCUMENTARY
              # --------------------------------------------------------

              documentary_terms = [
                  "documentary",
                  "documentaries",
                  "history",
                  "biography",
                  "biographies",
                  "smithsonian",
                  "national geographic",
                  "nat geo",
                  "pbs",
                  "vice",
                  "magellan"
              ]

              if any(x in n for x in documentary_terms):
                  return "Documentary"

              # --------------------------------------------------------
              # NATURE & SCIENCE
              # --------------------------------------------------------

              nature_science_terms = [
                  "discovery science",
                  "science channel",
                  "science",
                  "nasa",
                  "nature",
                  "wildlife",
                  "animal planet",
                  "earth",
                  "ocean",
                  "planet earth",
                  "deep sea",
                  "wild",
                  "outdoor",
                  "animals"
              ]

              if any(x in n for x in nature_science_terms):
                  return "Nature & Science"

              # --------------------------------------------------------
              # SCI-FI & HORROR
              # --------------------------------------------------------

              scifi_horror_terms = [
                  "sci-fi",
                  "scifi",
                  "science fiction",
                  "horror",
                  "supernatural",
                  "paranormal",
                  "alien",
                  "aliens",
                  "twilight zone",
                  "doctor who",
                  "classic doctor who",
                  "dust"
              ]

              if any(x in n for x in scifi_horror_terms):
                  return "Sci-Fi & Horror"

              # --------------------------------------------------------
              # WESTERNS
              # --------------------------------------------------------

              western_terms = [
                  "western",
                  "westerns",
                  "cowboy",
                  "cowboys",
                  "wild west",
                  "western tv",
                  "western movies"
              ]

              if any(x in n for x in western_terms):
                  return "Westerns"

              # --------------------------------------------------------
              # ANIME & GAMING
              # --------------------------------------------------------

              anime_terms = [
                  "anime",
                  "gaming",
                  "gamer",
                  "video game",
                  "videogame",
                  "esports",
                  "retro gaming"
              ]

              if any(x in n for x in anime_terms):
                  return "Anime & Gaming"

              # --------------------------------------------------------
              # MUSIC
              # --------------------------------------------------------

              music_terms = [
                  "mtv",
                  "vh1",
                  "vevo",
                  "music",
                  "music video",
                  "music videos",
                  "cmt",
                  "concert",
                  "live music",
                  "stingray"
              ]

              if any(x in n for x in music_terms):
                  return "Music"

              # --------------------------------------------------------
              # GAME SHOWS
              # --------------------------------------------------------

              game_show_terms = [
                  "game show",
                  "game shows",
                  "game show network",
                  "family feud",
                  "jeopardy",
                  "wheel of fortune",
                  "deal or no deal",
                  "price is right",
                  "let's make a deal",
                  "lets make a deal",
                  "match game",
                  "press your luck",
                  "supermarket sweep"
              ]

              if any(x in n for x in game_show_terms):
                  return "Game Shows"

              # --------------------------------------------------------
              # DAYTIME & TALK
              # --------------------------------------------------------

              daytime_terms = [
                  "talk show",
                  "talk shows",
                  "daytime",
                  "dr. phil",
                  "dr phil",
                  "judge judy",
                  "judge mathis",
                  "court",
                  "rachael ray",
                  "the view",
                  "today show",
                  "morning show",
                  "kelly clarkson",
                  "ellen"
              ]

              if any(x in n for x in daytime_terms):
                  return "Daytime & Talk Shows"

              # --------------------------------------------------------
              # COMEDY
              # --------------------------------------------------------

              comedy_terms = [
                  "comedy",
                  "comedies",
                  "always funny",
                  "laugh",
                  "stand up",
                  "stand-up",
                  "funny",
                  "comedian",
                  "comedy dynamics"
              ]

              if any(x in n for x in comedy_terms):
                  return "Comedy"

              # --------------------------------------------------------
              # CLASSIC TV COMEDY
              # --------------------------------------------------------

              classic_comedy_terms = [
                  "i love lucy",
                  "andy griffith",
                  "three stooges",
                  "beverly hillbillies",
                  "gilligan's island",
                  "gilligans island",
                  "leave it to beaver",
                  "bewitched",
                  "brady bunch",
                  "sanford and son",
                  "all in the family",
                  "classic comedy"
              ]

              if any(x in n for x in classic_comedy_terms):
                  return "Classic TV Comedy"

              # --------------------------------------------------------
              # CLASSIC TV
              # --------------------------------------------------------

              classic_tv_terms = [
                  "classic tv",
                  "classic television",
                  "classic movies & tv",
                  "m*a*s*h",
                  "mash",
                  "bonanza",
                  "gunsmoke",
                  "the rifleman",
                  "the waltons",
                  "little house",
                  "columbo",
                  "the twilight zone",
                  "star trek",
                  "the lone ranger",
                  "dragnet",
                  "alfred hitchcock"
              ]

              if any(x in n for x in classic_tv_terms):
                  return "Classic TV"

              # --------------------------------------------------------
              # MYSTERY
              # --------------------------------------------------------

              mystery_terms = [
                  "mystery",
                  "mysteries",
                  "murder mystery",
                  "detective",
                  "unsolved",
                  "unsolved mysteries",
                  "mystery channel"
              ]

              if any(x in n for x in mystery_terms):
                  return "Mystery"

              # --------------------------------------------------------
              # MOVIES
              # --------------------------------------------------------

              movie_terms = [
                  "movie",
                  "movies",
                  "film",
                  "films",
                  "cinema",
                  "cinevault",
                  "movieplex",
                  "filmrise",
                  "movie sphere",
                  "moviesphere",
                  "24 hour free movies",
                  "24hr free movies",
                  "hallmark movies",
                  "lifetime movies",
                  "great american pure flix",
                  "great american family"
              ]

              if any(x in n for x in movie_terms):
                  return "Movies"

              # --------------------------------------------------------
              # DRAMA
              # --------------------------------------------------------

              drama_terms = [
                  "drama",
                  "soap",
                  "soap opera",
                  "law & order",
                  "law and order",
                  "ncis",
                  "criminal minds",
                  "blue bloods",
                  "chicago fire",
                  "chicago pd",
                  "chicago med"
              ]

              if any(x in n for x in drama_terms):
                  return "Drama"

              # --------------------------------------------------------
              # AMBIANCE
              # --------------------------------------------------------

              ambiance_terms = [
                  "ambiance",
                  "ambience",
                  "relaxation",
                  "relaxing",
                  "fireplace",
                  "aquarium",
                  "scenic",
                  "scenery",
                  "nature sounds",
                  "sleep",
                  "meditation"
              ]

              if any(x in n for x in ambiance_terms):
                  return "Ambiance"

              # --------------------------------------------------------
              # GENERAL ENTERTAINMENT
              # --------------------------------------------------------

              entertainment_terms = [
                  "entertainment",
                  "reality",
                  "celebrity",
                  "pop culture",
                  "reality tv"
              ]

              if any(x in n for x in entertainment_terms):
                  return "Entertainment"

              # --------------------------------------------------------
              # FINAL FALLBACK
              # --------------------------------------------------------

              return "Other"

          # ============================================================
          # LOAD SOURCE
          # ============================================================

          lines = SOURCE.read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines()

          entries = []
          seen = set()

          category_counts = {}

          for i, line in enumerate(lines):

              if not line.startswith("#EXTINF"):
                  continue

              if i + 1 >= len(lines):
                  continue

              url = lines[i + 1].strip()

              if not url.startswith("http"):
                  continue

              name = get_name(line)

              # Remove unwanted language channels.
              if any(
                  term in name.lower()
                  for term in REMOVE_TERMS
              ):
                  continue

              plex_id = get_attr(line, "tvg-id")

              key = plex_id or url

              if key in seen:
                  continue

              seen.add(key)

              category = category_for(name)

              category_counts[category] = (
                  category_counts.get(category, 0) + 1
              )

              # Replace existing group title.
              if re.search(
                  r'group-title="[^"]*"',
                  line,
                  re.I
              ):
                  line = re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{category}"',
                      line,
                      flags=re.I
                  )
              else:
                  line = line.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 group-title="{category}"',
                      1
                  )

              entries.append(
                  (
                      category,
                      name.lower(),
                      line,
                      url,
                      plex_id
                  )
              )

          # ============================================================
          # SORT BY CATEGORY, THEN CHANNEL NAME
          # ============================================================

          category_order = {
              category: i
              for i, category in enumerate(CATEGORIES)
          }

          entries.sort(
              key=lambda x: (
                  category_order.get(x[0], 999),
                  x[1]
              )
          )

          # ============================================================
          # NUMBER PLEX 6500+
          # ============================================================

          output = [
              '#EXTM3U url-tvg="https://plex-ca.donxman.workers.dev/plex-ca.xml"'
          ]

          chno = 6500

          for category, _, line, url, plex_id in entries:

              if re.search(
                  r'tvg-chno="[^"]*"',
                  line,
                  re.I
              ):
                  line = re.sub(
                      r'tvg-chno="[^"]*"',
                      f'tvg-chno="{chno}"',
                      line,
                      flags=re.I
                  )
              else:
                  line = line.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 tvg-chno="{chno}"',
                      1
                  )

              output.append(line)
              output.append(url)

              chno += 1

          OUTPUT_M3U.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          print()
          print("========================================")
          print("          PLEX CATEGORY REPORT")
          print("========================================")

          for category in CATEGORIES:
              count = category_counts.get(category, 0)

              if count:
                  print(
                      f"{category:<25} {count:>4}"
                  )

          print("----------------------------------------")
          print(f"TOTAL CHANNELS: {len(entries)}")
          print("NUMBERING: 6500+")
          print("========================================")

          # ============================================================
          # GUIDE
          # ============================================================

          valid_ids = {
              pid
              for _, _, _, _, pid in entries
              if pid
          }

          try:

              tree = ET.parse(FULL_GUIDE)
              root = tree.getroot()

              guide_ids = {
                  e.get("id")
                  for e in root
                  if e.tag == "channel"
              }

              overlap = valid_ids & guide_ids

              print(
                  f"Guide has {len(guide_ids)}, "
                  f"wanted {len(valid_ids)}, "
                  f"overlap {len(overlap)}"
              )

              # Keep the full guide if Buddy IDs and guide IDs
              # don't match.
              if len(overlap) < 10:

                  print(
                      "ID mismatch - keeping FULL guide"
                  )

                  tree.write(
                      OUTPUT_XML,
                      encoding="utf-8",
                      xml_declaration=True
                  )

              else:

                  for elem in list(root):

                      if (
                          elem.tag == "channel"
                          and elem.get("id") not in valid_ids
                      ):
                          root.remove(elem)

                      elif (
                          elem.tag == "programme"
                          and elem.get("channel") not in valid_ids
                      ):
                          root.remove(elem)

                  tree.write(
                      OUTPUT_XML,
                      encoding="utf-8",
                      xml_declaration=True
                  )

          except Exception as e:

              print(
                  f"Guide filter failed: {e}"
              )

              OUTPUT_XML.write_bytes(
                  FULL_GUIDE.read_bytes()
              )

          PY

      - name: Check final files
        run: |
          rm -f plex-ca-source.m3u full-guide.xml full-guide.xml.gz all.xml.gz

          ls -lh plex-ca.*

          echo "M3U: $(grep -c '^#EXTINF:' plex-ca.m3u)"
          echo "XML channels: $(grep -c '<channel' plex-ca.xml || true)"
          echo "XML programs: $(grep -c '<programme' plex-ca.xml || true)"

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Plex CA - categorized Plex channels"
          file_pattern: |
            plex-ca.m3u
            plex-ca.xml
