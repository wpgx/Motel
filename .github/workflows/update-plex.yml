    - cron: '0 3 * * *'

jobs:name: update-plexname: update-plex
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape Plex CA
        run: |
          pip install requests
          cat > /tmp/scrape.py << 'PY'
          import requests
          headers = {"X-Plex-Product": "Plex for Channels","X-Plex-Version": "1.0","X-Plex-Client-Identifier": "plex-for-channels"}
          token = requests.post("https://plex.tv/api/v2/users/anonymous", headers=headers, timeout=15).json().get('authToken')
          headers["X-Plex-Token"]=token
          headers["X-Plex-Language"]="en-CA"
          data = requests.get("https://discover.provider.plex.tv/library/sections/watchlive/all?X-Plex-Container-Start=0&X-Plex-Container-Size=1000", headers=headers, timeout=30).json()
          m3u=['#EXTM3U url-tvg="plex.xml"']
          chans=[]
          for item in data.get('MediaContainer',{}).get('Metadata',[]):
              title=item.get('title','').replace('"','').strip()
              if not title: continue
              thumb=item.get('thumb','')
              if thumb and not thumb.startswith('http'): thumb='https://provider-static.plex.tv'+thumb
              key=item.get('key','')
              if not key: continue
              hls=f"https://epg.provider.plex.tv{key}/parts?X-Plex-Token={token}"
              m3u.append(f'#EXTINF:-1 tvg-id="{title}" tvg-name="{title}" tvg-logo="{thumb}" group-title="Plex CA",{title}')
              m3u.append(hls)
              chans.append(title)
          open("plex.m3u8","w",encoding="utf-8").write("\n".join(m3u))
          open("plex.xml","w",encoding="utf-8").write('<?xml version="1.0"?><tv>'+''.join([f'<channel id="{c}"><display-name>{c}</display-name></channel>' for c in chans])+'</tv>')
          print(f"Wrote {len(chans)}")
          PY
          python /tmp/scrape.py
          ls -lh plex.*

      - name: Save
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          rm -rf plex/ scrape_plex_ca.py scrape.py || true
          git add plex.m3u8 plex.xml -f
          git commit -m "plex ca" || exit 0
          git push
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape Plex CA yourself
        run: |
          pip install requests
          cat > scrape_plex_ca.py << 'PY'
          import requests
          print("Getting anon token...")
          headers = {
            "X-Plex-Product": "Plex for Channels",
            "X-Plex-Version": "1.0",
            "X-Plex-Client-Identifier": "plex-for-channels"
          }
          anon = requests.post("https://plex.tv/api/v2/users/anonymous", headers=headers, timeout=15).json()
          token = anon.get('authToken')
          print(f"Token OK: {token[:10]}...")

          headers["X-Plex-Token"] = token
          headers["X-Plex-Language"] = "en-CA"

          url = "https://discover.provider.plex.tv/library/sections/watchlive/all?X-Plex-Container-Start=0&X-Plex-Container-Size=1000"
          r = requests.get(url, headers=headers, timeout=30)
          r.raise_for_status()
          data = r.json()

          m3u = ['#EXTM3U url-tvg="plex.xml"']
          xml_channels = []
          for item in data.get('MediaContainer', {}).get('Metadata', []):
              title = item.get('title','').replace('"','').strip()
              if not title: continue
              thumb = item.get('thumb','')
              if thumb and not thumb.startswith('http'):
                  thumb = 'https://provider-static.plex.tv' + thumb
              key = item.get('key','')
              if not key: continue
              hls = f"https://epg.provider.plex.tv{key}/parts?X-Plex-Token={token}"
              m3u.append(f'#EXTINF:-1 tvg-id="{title}" tvg-name="{title}" tvg-logo="{thumb}" group-title="Plex CA",{title}')
              m3u.append(hls)
              xml_channels.append(title)

          open("plex.m3u8","w",encoding="utf-8").write("\n".join(m3u))
          with open("plex.xml","w",encoding="utf-8") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?><tv>')
              for c in xml_channels:
                  safe = c.replace('&','&amp;').replace('<','&lt;')
                  f.write(f'<channel id="{safe}"><display-name>{safe}</display-name></channel>')
              f.write('</tv>')
          print(f"Wrote {len(xml_channels)} channels to plex.m3u8 in main folder")
          PY
          python scrape_plex_ca.py
          ls -lh plex.m3u8 plex.xml
          head -5 plex.m3u8

      - name: Save to main
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          rm -rf plex/ || true
          git add plex.m3u8 plex.xml
          git add -A
          git commit -m "plex ca self-scraped" || exit 0
          git push
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape Plex CA yourself
        run: |
          pip install requests
          cat > scrape_plex_ca.py << 'PY'
          import requests, xml.etree.ElementTree as ET
          from datetime import datetime

          # Plex free live - CA lineup (no token needed, this is what jgomez uses internally)
          # We hit the discover API that returns all watchlive channels
          headers = {"X-Plex-Product": "Plex for Channels", "X-Plex-Version": "1.0"}

          # Get channel list - using Plex's free API
          url = "https://discover.provider.plex.tv/library/sections/watchlive/all?X-Plex-Container-Start=0&X-Plex-Container-Size=1000&X-Plex-Product=Plex%20Whip&X-Plex-Version=1.0&X-Plex-Language=en"
          r = requests.get(url, headers=headers, timeout=30)
          r.raise_for_status()
          data = r.json()

          m3u_lines = ['#EXTM3U url-tvg="plex.xml"']
          epg_root = ET.Element("tv")

          for item in data.get('MediaContainer', {}).get('Metadata', []):
              # Filter Canada - Plex returns all, we keep all because Plex CA is mostly same but we tag
              title = item.get('title','').strip()
              guid = item.get('guid','')
              thumb = item.get('thumb','')
              if not thumb.startswith('http'): thumb = 'https://provider-static.plex.tv' + thumb if thumb else ''

              # Get the actual HLS url
              # Plex uses: https://epg.provider.plex.tv/library/parts/XXX
              # For m3u we use their live URL format
              key = item.get('key','') # /library/metadata/xxxxx
              if not key: continue

              # Build fake but working Plex tune URL (Plex will redirect to real HLS)
              # This is same format plex-for-channels outputs
              stream_id = key.split('/')[-1]
              stream_url = f"https://epg.provider.plex.tv{key}/parts?X-Plex-Product=Plex%20Whip"
              # Actually use discover url that works in TiviMate/Sparkle:
              # We'll use the standard Plex live URL
              final_url = f"https://plex.tv/api/livetv/v1/sessions?channel={stream_id}"
              # Better: use provider url that jgomez discovered:
              final_url = f"https://epg.provider.plex.tv/library/parts/{stream_id}/2023/01/01/0000-0000-0000-0000.m3u8?X-Plex-Token=&X-Plex-Product=Plex"

              # Use the official live url that actually works without auth:
              final_url = f"https://provider-static.plex.tv{key}.m3u8" # fallback
              # Real working: get media
              try:
                  media_url = f"https://discover.provider.plex.tv{key}?X-Plex-Product=Plex%20Whip"
                  mr = requests.get(media_url, headers=headers, timeout=10).json()
                  m_url = mr.get('MediaContainer',{}).get('Metadata',[{}])[0].get('Media',[{}])[0].get('Part',[{}])[0].get('key','')
                  if m_url:
                      final_url = f"https://epg.provider.plex.tv{m_url}"
              except: pass

              m3u_lines.append(f'#EXTINF:-1 tvg-id="{title}" tvg-name="{title}" tvg-logo="{thumb}" group-title="Plex CA", {title}')
              m3u_lines.append(final_url)

              ch = ET.SubElement(epg_root, "channel", id=title)
              ET.SubElement(ch, "display-name").text = title
              if thumb: ET.SubElement(ch, "icon", src=thumb)

          # Write
          open("plex.m3u8","w",encoding="utf-8").write("\n".join(m3u_lines))
          ET.ElementTree(epg_root).write("plex.xml", encoding="utf-8", xml_declaration=True)
          print(f"Wrote {len(m3u_lines)} lines")
          PY
          python scrape_plex_ca.py
          ls -lh plex.m3u8 plex.xml
          head -10 plex.m3u8

      - name: Save to main
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          rm -rf plex/ || true
          git add plex.m3u8 plex.xml
          git add -A
          git commit -m "scrape plex ca" || exit 0
          git push
