name: Update Plex CA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Plex CA playlist from Buddy
        run: |
          set -e
          echo "Downloading Plex CA playlist..."

          curl -L --fail -A "Mozilla/5.0" \
            "https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/Plex/ca.m3u8" \
            -o plex-ca-source.m3u8

      - name: Build cleaned Plex CA playlist
        run: |
          python3 - << 'PY'
          import re
          from pathlib import Path

          SOURCE = Path("plex-ca-source.m3u8")
          OUTPUT = Path("plex-ca.m3u")

          CATEGORIES = [
              "News & Weather",
              "Sports",
              "Movies",
              "Classic TV",
              "Classic TV Comedy",
              "Comedy",
              "Crime",
              "Daytime & Talk Shows",
              "Documentary",
              "Drama",
              "Entertainment",
              "Game Shows",
              "Home & Food",
              "Kids",
              "Music",
              "Mystery",
              "Nature & Science",
              "Other",
              "Sci-Fi & Horror",
              "South Park",
              "Westerns",
              "Ambiance",
              "Anime & Gaming",
          ]

          REMOVE_WORDS = (
              "spanish",
              "espanol",
              "español",
              "latin",
              "french",
              "français",
              "francais",
          )

          def channel_name(ext):
              return ext.rsplit(",", 1)[-1].strip()

          def get_attr(ext, attr):
              m = re.search(
                  rf'{re.escape(attr)}="([^"]*)"',
                  ext,
                  re.I
              )
              return m.group(1) if m else ""

          def category_for(name):
              n = name.lower()

              # -------------------------------
              # South Park
              # -------------------------------
              if "south park" in n:
                  return "South Park"

              # -------------------------------
              # Westerns
              # -------------------------------
              if any(x in n for x in (
                  "western",
                  "cowboy",
                  "wild west"
              )):
                  return "Westerns"

              # -------------------------------
              # Classic TV Comedy
              # -------------------------------
              if any(x in n for x in (
                  "three stooges",
                  "andy griffith",
                  "beverly hillbillies",
                  "bewitched",
                  "i dream of jeannie",
                  "leave it to beaver",
                  "munsters",
                  "addams family",
                  "gilligan",
                  "honeymooners",
                  "classic comedy"
              )):
                  return "Classic TV Comedy"

              # -------------------------------
              # Classic TV
              # -------------------------------
              if any(x in n for x in (
                  "classic tv",
                  "classic television",
                  "retro tv",
                  "vintage tv"
              )):
                  return "Classic TV"

              # -------------------------------
              # Game Shows
              # -------------------------------
              if any(x in n for x in (
                  "game show",
                  "game shows",
                  "deal or no deal",
                  "family feud",
                  "price is right",
                  "wheel of fortune"
              )):
                  return "Game Shows"

              # -------------------------------
              # Daytime / Talk
              # -------------------------------
              if any(x in n for x in (
                  "talk",
                  "daytime",
                  "court",
                  "judge",
                  "divorce court"
              )):
                  return "Daytime & Talk Shows"

              # -------------------------------
              # News / Weather
              # -------------------------------
              if any(x in n for x in (
                  "news",
                  "weather",
                  "headline",
                  "cnn",
                  "cnbc",
                  "msnbc",
                  "abc news",
                  "cbs news",
                  "nbc news",
                  "fox news"
              )):
                  return "News & Weather"

              # -------------------------------
              # Sports
              # -------------------------------
              if any(x in n for x in (
                  "sports",
                  "nfl",
                  "nba",
                  "nhl",
                  "mlb",
                  "nascar",
                  "golf",
                  "tennis",
                  "soccer",
                  "wrestling",
                  "ufc",
                  "fishing"
              )):
                  return "Sports"

              # -------------------------------
              # Kids
              # -------------------------------
              if any(x in n for x in (
                  "kids",
                  "nick",
                  "nickelodeon",
                  "cartoon",
                  "baby",
                  "junior",
                  "paw patrol"
              )):
                  return "Kids"

              # -------------------------------
              # Music
              # -------------------------------
              if any(x in n for x in (
                  "music",
                  "vevo",
                  "concert",
                  "mtv",
                  "vh1"
              )):
                  return "Music"

              # -------------------------------
              # Home & Food
              # -------------------------------
              if any(x in n for x in (
                  "food",
                  "cooking",
                  "cuisine",
                  "home",
                  "cooking channel",
                  "food network"
              )):
                  return "Home & Food"

              # -------------------------------
              # Crime
              # -------------------------------
              if any(x in n for x in (
                  "crime",
                  "forensic",
                  "murder",
                  "killer",
                  "cold case",
                  "investigation",
                  "law & order"
              )):
                  return "Crime"

              # -------------------------------
              # Documentary
              # -------------------------------
              if any(x in n for x in (
                  "documentary",
                  "documentaries",
                  "history",
                  "biography"
              )):
                  return "Documentary"

              # -------------------------------
              # Nature & Science
              # -------------------------------
              if any(x in n for x in (
                  "nature",
                  "science",
                  "discovery",
                  "animal planet",
                  "wild",
                  "earth"
              )):
                  return "Nature & Science"

              # -------------------------------
              # Sci-Fi & Horror
              # -------------------------------
              if any(x in n for x in (
                  "sci-fi",
                  "scifi",
                  "science fiction",
                  "horror",
                  "paranormal",
                  "supernatural"
              )):
                  return "Sci-Fi & Horror"

              # -------------------------------
              # Comedy
              # -------------------------------
              if any(x in n for x in (
                  "comedy",
                  "funny",
                  "laugh"
              )):
                  return "Comedy"

              # -------------------------------
              # Movies
              # -------------------------------
              if any(x in n for x in (
                  "movie",
                  "movies",
                  "film",
                  "cinema",
                  "cine"
              )):
                  return "Movies"

              # -------------------------------
              # Drama
              # -------------------------------
              if any(x in n for x in (
                  "drama",
                  "soap"
              )):
                  return "Drama"

              # -------------------------------
              # Entertainment
              # -------------------------------
              if any(x in n for x in (
                  "entertainment",
                  "reality",
                  "celebrity",
                  "lifestyle"
              )):
                  return "Entertainment"

              return "Other"

          lines = SOURCE.read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines()

          entries = []
          seen = set()

          for i, line in enumerate(lines):

              if not line.startswith("#EXTINF"):
                  continue

              if i + 1 >= len(lines):
                  continue

              url = lines[i + 1].strip()

              if not url.startswith("http"):
                  continue

              name = channel_name(line)

              # Remove unwanted language channels.
              low = name.lower()

              if any(word in low for word in REMOVE_WORDS):
                  continue

              plex_id = get_attr(line, "tvg-id")

              # Deduplicate using Plex ID first,
              # otherwise use the stream URL.
              duplicate_key = plex_id or url

              if duplicate_key in seen:
                  continue

              seen.add(duplicate_key)

              category = category_for(name)

              # Plex source currently uses "Canada".
              # Replace it with one of our real categories.
              line = re.sub(
                  r'group-title="[^"]*"',
                  f'group-title="{category}"',
                  line,
                  flags=re.I
              )

              if "group-title=" not in line.lower():
                  line = line.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 group-title="{category}"',
                      1
                  )

              entries.append((category, name.lower(), line, url))

          # Sort by our existing category order.
          category_order = {
              name: i for i, name in enumerate(CATEGORIES)
          }

          entries.sort(
              key=lambda x: (
                  category_order.get(x[0], 999),
                  x[1]
              )
          )

          # Plex channels get their own range.
          output = [
              '#EXTM3U url-tvg="https://motel.deecee.ca/dccatalog.xml"'
          ]

          number = 6500

          for category, _, line, url in entries:

              line = re.sub(
                  r'tvg-chno="[^"]*"',
                  f'tvg-chno="{number}"',
                  line,
                  flags=re.I
              )

              if "tvg-chno=" not in line.lower():
                  line = line.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 tvg-chno="{number}"',
                      1
                  )

              output.append(line)
              output.append(url)

              number += 1

          OUTPUT.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          print(f"Plex CA source entries: {len(lines)}")
          print(f"Plex CA final channels: {len(entries)}")
          print(f"Duplicates removed: {len(seen) - len(entries)}")
          print(f"Number range: 6500-{number - 1}")

          PY

      - name: Check playlist
        run: |
          echo "===== PLEX CA ====="
          ls -lh plex-ca.m3u

          echo "Channels:"
          grep -c '^#EXTINF:' plex-ca.m3u || true

          echo
          echo "Categories:"
          grep '^#EXTINF:' plex-ca.m3u \
            | sed -n 's/.*group-title="\([^"]*\)".*/\1/p' \
            | sort \
            | uniq -c \
            | sort -k2

          echo
          echo "First channels:"
          head -8 plex-ca.m3u

      - name: Commit Plex CA
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Plex CA playlist"
          file_pattern: "plex-ca.m3u"
