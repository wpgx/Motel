name: Update Plex CA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Plex CA playlist from Buddy
        run: |
          curl -L --fail -A "Mozilla/5.0" \
            "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plex_ca.m3u" \
            -o plex-ca-source.m3u

      - name: Download full Plex guide
        run: |
          curl -L -A "Mozilla/5.0" \
            "https://plex-ca.donxman.workers.dev/plex-ca.xml" -o full-guide.xml || true
          if [! -s full-guide.xml ] || [ $(wc -c < full-guide.xml) -lt 100000 ]; then
            curl -L --fail -A "Mozilla/5.0" \
              "https://github.com/matthuisman/i.mjh.nz/raw/master/Plex/all.xml.gz" -o all.xml.gz
            gunzip -c all.xml.gz > full-guide.xml
          fi

      - name: Build
        run: |
          python3 - << 'PY'
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          SOURCE = Path("plex-ca-source.m3u")
          OUT_SHORT = Path("plex-ca.m3u") # SHORT is now default
          OUT_LONG = Path("plex-ca-long.m3u") # LONG is backup
          FULL_GUIDE = Path("full-guide.xml")
          OUTPUT_XML = Path("plex-ca.xml")

          REMOVE_TERMS = ["spanish","espanol","español","latin","latino","españa","telemundo","novelisima","caracol","pitufo","pelimex","amor piel salvaje","historias de corazón","c4 en alerta","éxitos del momento","ideas en 5 minutos","wedotv amor","nosey escándalos","noticias telemundo","telemundo al dia","itv deportes","alerta","corazón","novela","piel salvaje","cinepride","bizaar","french","français","francais","ça c’est drôle","ca c'est drole","noovo cinéma","radio-canada info","france 24","deutsch","german","euronews deutsch","italiano","italian","euronews italiano","portuguese","português","euronews portuguese","brazuca","trace brazuca","inter 24/7","éxitos","amasiam","joysauce"]

          def get_attr(ext, attr):
              m = re.search(rf'{re.escape(attr)}="([^"]*)"', ext, re.I)
              return m.group(1) if m else ""
          def get_name(ext): return ext.rsplit(",", 1)[-1].strip()

          lines = SOURCE.read_text(encoding="utf-8", errors="ignore").splitlines()
          entries=[]
          seen=set()
          for i,line in enumerate(lines):
              if not line.startswith("#EXTINF"): continue
              if i+1>=len(lines): continue
              url=lines[i+1].strip()
              if not url.startswith("http"): continue
              name=get_name(line)
              if any(t in name.lower() for t in REMOVE_TERMS): continue
              plex_id=get_attr(line,"tvg-id")
              key=plex_id or url
              if key in seen: continue
              seen.add(key)
              entries.append((name.lower(), line, url, plex_id))
          entries.sort(key=lambda x: x[0])

          long_out=[f'#EXTM3U url-tvg="https://plex-ca.donxman.workers.dev/plex-ca.xml"']
          short_out=[f'#EXTM3U url-tvg="https://plex-ca.donxman.workers.dev/plex-ca.xml"']
          chno=6500
          valid_ids=set()
          for _,line,url,pid in entries:
              if pid: valid_ids.add(pid)
              line=re.sub(r'\s+tvg-chno="[^"]*"', "", line, flags=re.I)
              line=line.replace("#EXTINF:-1", f'#EXTINF:-1 tvg-chno="{chno}"', 1)

              long_out.append(line)
              long_out.append(url)

              short_out.append(line)
              short_out.append(f"https://plex-ca.donxman.workers.dev/p/{chno}")
              chno+=1

          OUT_LONG.write_text("\n".join(long_out)+"\n", encoding="utf-8")
          OUT_SHORT.write_text("\n".join(short_out)+"\n", encoding="utf-8")

          try:
              tree=ET.parse(FULL_GUIDE)
              root=tree.getroot()
              for elem in list(root):
                  if elem.tag=="channel" and elem.get("id") not in valid_ids:
                      root.remove(elem)
                  elif elem.tag=="programme" and elem.get("channel") not in valid_ids:
                      root.remove(elem)
              tree.write(OUTPUT_XML, encoding="utf-8", xml_declaration=True)
          except:
              OUTPUT_XML.write_bytes(FULL_GUIDE.read_bytes())
          PY

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Plex CA: plex-ca.m3u is now SHORT, plex-ca-long.m3u is LONG"
          file_pattern: |
            plex-ca.m3u
            plex-ca-long.m3u
            plex-ca.xml
