name: Update Plex CA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Plex CA playlist from Buddy
        run: |
          set -e
          curl -L --fail -A "Mozilla/5.0" \
            "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plex_ca.m3u" \
            -o plex-ca-source.m3u
          echo "Source: $(grep -c '^#EXTINF:' plex-ca-source.m3u) channels"

      - name: Download fresh Plex guide from your Worker
        run: |
          set -e
          # --compressed handles both plain XML and your old gz-with-Content-Encoding: gzip
          curl -L --compressed --fail -A "Mozilla/5.0" \
            "https://plex-ca.donxman.workers.dev/plex-ca.xml" \
            -o full-guide.xml
          ls -lh full-guide.xml
          # If it's still gz (magic bytes 1f 8b), gunzip it
          if file full-guide.xml | grep -q gzip; then
            echo "File is gz, decompressing"
            mv full-guide.xml full-guide.xml.gz
            gunzip -c full-guide.xml.gz > full-guide.xml
          fi
          ls -lh full-guide.xml
          echo "Channels: $(grep -c '<channel' full-guide.xml || true)"
          echo "Programs: $(grep -c '<programme' full-guide.xml || true)"
          # If still empty, fallback to Matt
          if [ $(grep -c '<channel' full-guide.xml || true) -lt 10 ]; then
            echo "Worker empty, pulling Matt fallback"
            curl -L --fail -A "Mozilla/5.0" \
              "https://github.com/matthuisman/i.mjh.nz/raw/master/Plex/all.xml.gz" \
              -o all.xml.gz
            gunzip -c all.xml.gz > full-guide.xml
          fi

      - name: Build cleaned Plex CA playlist + filtered guide
        run: |
          python3 - << 'PY'
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          SOURCE = Path("plex-ca-source.m3u")
          OUTPUT_M3U = Path("plex-ca.m3u")
          FULL_GUIDE = Path("full-guide.xml")
          OUTPUT_XML = Path("plex-ca.xml")

          CATEGORIES = ["News & Weather","Sports","Movies","Crime","Classic TV","Classic TV Comedy","Comedy","Drama","Entertainment","Game Shows","Daytime & Talk Shows","Documentary","Home & Food","Kids","Music","Mystery","Nature & Science","Sci-Fi & Horror","Westerns","South Park","Ambiance","Anime & Gaming","Other"]
          REMOVE_TERMS = ["spanish","espanol","español","latin","latino","telemundo","french","français","deutsch","italiano","portuguese","brazuca"]

          def get_attr(ext, attr):
              m = re.search(rf'{re.escape(attr)}="([^"]*)"', ext, re.I)
              return m.group(1) if m else ""
          def get_name(ext): return ext.rsplit(",", 1)[-1].strip()
          def category_for(name):
              n=name.lower()
              if "south park" in n: return "South Park"
              if "news" in n or "weather" in n: return "News & Weather"
              if "sport" in n: return "Sports"
              return "Entertainment"

          lines = SOURCE.read_text(encoding="utf-8", errors="ignore").splitlines()
          entries=[]; seen=set(); valid_ids=set()
          for i,line in enumerate(lines):
              if not line.startswith("#EXTINF"): continue
              if i+1>=len(lines): continue
              url=lines[i+1].strip()
              if not url.startswith("http"): continue
              name=get_name(line)
              if any(t in name.lower() for t in REMOVE_TERMS): continue
              plex_id=get_attr(line,"tvg-id")
              key=plex_id or url
              if key in seen: continue
              seen.add(key)
              if plex_id: valid_ids.add(plex_id)
              cat=category_for(name)
              if re.search(r'group-title="[^"]*"', line, re.I):
                  line=re.sub(r'group-title="[^"]*"', f'group-title="{cat}"', line, flags=re.I)
              else:
                  line=line.replace("#EXTINF:-1", f'#EXTINF:-1 group-title="{cat}"', 1)
              entries.append((cat, name.lower(), line, url, plex_id))

          entries.sort(key=lambda x: x[1])
          output=[f'#EXTM3U url-tvg="https://plex-ca.donxman.workers.dev/plex-ca.xml"']
          chno=6500
          for cat,_,line,url,pid in entries:
              line=re.sub(r'tvg-chno="[^"]*"', f'tvg-chno="{chno}"', line, flags=re.I)
              if "tvg-chno=" not in line.lower():
                  line=line.replace("#EXTINF:-1", f'#EXTINF:-1 tvg-chno="{chno}"', 1)
              output.append(line); output.append(url); chno+=1
          OUTPUT_M3U.write_text("\n".join(output)+"\n", encoding="utf-8")
          print(f"M3U: {len(entries)} channels")

          # Guide filter - keep FULL if no overlap (Buddy vs Matt IDs differ)
          try:
              tree=ET.parse(FULL_GUIDE)
              root=tree.getroot()
              guide_ids={e.get("id") for e in root if e.tag=="channel"}
              overlap=valid_ids & guide_ids
              print(f"Guide has {len(guide_ids)}, wanted {len(valid_ids)}, overlap {len(overlap)}")
              if len(overlap) < 10:
                  print("ID mismatch - keeping FULL guide unfiltered")
                  tree.write(OUTPUT_XML, encoding="utf-8", xml_declaration=True)
              else:
                  for elem in list(root):
                      if elem.tag=="channel" and elem.get("id") not in valid_ids:
                          root.remove(elem)
                      elif elem.tag=="programme" and elem.get("channel") not in valid_ids:
                          root.remove(elem)
                  tree.write(OUTPUT_XML, encoding="utf-8", xml_declaration=True)
          except Exception as e:
              print(f"Filter failed {e}, copying full guide")
              OUTPUT_XML.write_bytes(FULL_GUIDE.read_bytes())
          PY

      - name: Check final
        run: |
          rm -f plex-ca.xml.gz all.xml.gz plex-ca-source.m3u full-guide.xml full-guide.xml.gz
          ls -lh plex-ca.*
          echo "M3U: $(grep -c '^#EXTINF:' plex-ca.m3u)"
          echo "XML channels: $(grep -c '<channel' plex-ca.xml)"
          echo "XML progs: $(grep -c '<programme' plex-ca.xml)"

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Plex CA - fixed gz handling, keeps full guide"
          file_pattern: |
            plex-ca.m3u
            plex-ca.xml
