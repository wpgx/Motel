name: IPTV Database Debug

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download iptv-org database
        run: |
          mkdir work
          curl -L https://iptv-org.github.io/database/channels.csv \
          -o work/channels.csv


      - name: Search database
        run: |

          cat > work/debug.py <<'PY'

          from pathlib import Path
          import csv


          search = [
              "WABC",
              "KABC",
              "WCBS",
              "KCBS",
              "WNBC",
              "KNBC",
              "WNYW",
              "KTTV",
              "KTLA",
              "WGN",
              "WSBK"
          ]


          output = []


          with open(
              "work/channels.csv",
              errors="ignore"
          ) as f:

              reader = csv.DictReader(f)

              for row in reader:

                  text = " ".join(
                      str(v)
                      for v in row.values()
                  )

                  if any(
                      x.lower() in text.lower()
                      for x in search
                  ):

                      output.append(
                          str(row)
                      )


          Path(
              "database-debug.txt"
          ).write_text(
              "\n\n".join(output),
              encoding="utf-8"
          )


          print(
              "Found",
              len(output)
          )

          PY


          python work/debug.py


      - name: Commit results
        run: |

          git config --global user.name "github-actions"

          git config --global user.email "actions@github.com"

          git add database-debug.txt

          git commit -m "Add database debug" || echo "No changes"

          git push
