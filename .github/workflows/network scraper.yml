name: Network Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  build-playlist:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Download iptv-org files
        run: |
          mkdir work

          curl -L https://iptv-org.github.io/iptv/index.m3u \
          -o work/master.m3u

          curl -L https://iptv-org.github.io/epg/guides/us.xml \
          -o work/master.xml


      - name: Build playlist and guide
        run: |

          cat > work/build.py <<'PY'

          from pathlib import Path
          import re


          channels = {

              "WABCTV":  ("001 ABC New York"),
              "WCBSTV":  ("002 CBS New York"),
              "WNBC":    ("003 NBC New York"),
              "WNYW":    ("004 FOX New York"),

              "KABCTV":  ("005 ABC Los Angeles"),
              "KCBSTV":  ("006 CBS Los Angeles"),
              "KNBC":    ("007 NBC Los Angeles"),
              "KTTV":    ("008 FOX Los Angeles"),

              "KTLA":    ("009 CW Los Angeles"),

              "WGNDT":   ("010 WGN Chicago"),
              "WSBK":    ("011 WSBK Boston")

          }


          m3u = Path(
              "work/master.m3u"
          ).read_text(errors="ignore")


          entries = m3u.split("#EXTINF")

          found = []


          for entry in entries:

              if not entry.strip():
                  continue

              match = re.search(
                  r'tvg-id="([^"]+)"',
                  entry
              )

              if not match:
                  continue

              tvgid = match.group(1).upper()


              for key,name in channels.items():

                  if key in tvgid:

                      header = "#EXTINF" + entry

                      header = re.sub(
                          r'group-title="[^"]*"',
                          'group-title="Networks"',
                          header,
                          count=2
                      )

                      found.append(
                          (name, header)
                      )

                      break



          # sort by channel number

          found.sort(
              key=lambda x:int(x[0][:3])
          )


          playlist = [
              "#EXTM3U"
          ]

          epg_ids = []


          for name,block in found:

              playlist.append(block)

              mid = re.search(
                  r'tvg-id="([^"]+)"',
                  block
              )

              if mid:
                  epg_ids.append(
                      mid.group(1)
                  )


          Path(
              "networks.m3u8"
          ).write_text(
              "\n".join(playlist),
              encoding="utf-8"
          )


          # EPG

          xml = Path(
              "work/master.xml"
          ).read_text(errors="ignore")


          epg = "<tv>\n"


          for block in re.findall(
              r'<channel[\s\S]*?</channel>',
              xml
          ):

              for eid in epg_ids:

                  if eid in block:

                      epg += block + "\n"
                      break


          epg += "</tv>"


          Path(
              "networks.xml"
          ).write_text(
              epg,
              encoding="utf-8"
          )


          print(
              "Channels found:",
              len(found)
          )

          print(
              "EPG IDs:",
              epg_ids
          )

          PY


          python work/build.py


      - name: Commit files
        run: |

          git config --global user.name "github-actions"

          git config --global user.email "actions@github.com"

          git add networks.m3u8 networks.xml

          git commit -m "Update network pack" || echo "No changes"

          git push
