name: Network Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  build-playlist:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Download iptv-org playlist
        run: |
          mkdir work
          curl -L https://iptv-org.github.io/iptv/index.m3u \
          -o work/master.m3u


      - name: Download EPG
        run: |
          curl -L https://iptv-org.github.io/epg/guides/us.xml \
          -o work/master.xml


      - name: Build Network Playlist
        run: |

          cat > work/build.py <<'PY'

          from pathlib import Path
          import re


          channels = {

          # NEW YORK
          "WABCTV": "001 ABC New York",
          "WCBSTV": "002 CBS New York",
          "WNBC": "003 NBC New York",
          "WNYW": "004 FOX New York",

          # LOS ANGELES
          "KABCTV": "005 ABC Los Angeles",
          "KCBSTV": "006 CBS Los Angeles",
          "KNBC": "007 NBC Los Angeles",
          "KTTV": "008 FOX Los Angeles",

          # CW
          "KTLA": "009 CW Los Angeles",

          # FAVORITES
          "WGN": "010 WGN Chicago",
          "WSBK": "011 WSBK Boston"

          }


          source = Path("work/master.m3u").read_text(
              errors="ignore"
          )


          lines = source.splitlines()


          playlist = ["#EXTM3U"]

          keep = False


          for line in lines:

              if line.startswith("#EXTINF"):

                  keep = False

                  match = re.search(
                      r'tvg-id="([^"]+)"',
                      line
                  )

                  if match:

                      tvgid = match.group(1).upper()

                      for key,name in channels.items():

                          if key in tvgid:

                              keep = True

                              line = line.replace(
                                  ",",
                                  f' group-title="Networks",{name},',
                                  1
                              )

                              break


              if keep:

                  playlist.append(line)


          Path("networks.m3u8").write_text(
              "\n".join(playlist),
              encoding="utf-8"
          )


          # EPG matching

          xml = Path("work/master.xml").read_text(
              errors="ignore"
          )


          ids = []


          for c in channels:

              ids += re.findall(
                  r'id="([^"]*'+c+r'[^"]*)"',
                  xml,
                  re.I
              )


          result = "<tv>\n"


          for block in re.findall(
              r'<channel[\s\S]*?</channel>',
              xml
          ):

              if any(
                  i in block
                  for i in ids
              ):

                  result += block + "\n"


          result += "</tv>"


          Path("networks.xml").write_text(
              result,
              encoding="utf-8"
          )


          print("DONE")


          PY


          python work/build.py



      - name: Commit results
        run: |

          git config --global user.name "github-actions"

          git config --global user.email "actions@github.com"

          git add networks.m3u8 networks.xml

          git commit -m "Update network locals" || echo "No changes"

          git push
