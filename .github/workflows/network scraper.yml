name: Network Debug

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download iptv-org playlist
        run: |
          mkdir work
          curl -L https://iptv-org.github.io/iptv/index.m3u \
          -o work/master.m3u


      - name: Search stations
        run: |

          cat > work/debug.py <<'PY'

          from pathlib import Path
          import re


          search = [
              "ABC",
              "WABC",
              "KABC",
              "CBS",
              "KCBS",
              "NBC",
              "KNBC",
              "KTLA",
              "WSBK"
          ]


          text = Path(
              "work/master.m3u"
          ).read_text(
              errors="ignore"
          )


          entries = text.split("#EXTINF")


          output = []


          for entry in entries:

              if not entry.strip():
                  continue

              line = entry.split("\n")[0]

              if any(
                  x.lower() in line.lower()
                  for x in search
              ):

                  output.append(
                      "#EXTINF" + line
                  )


          Path(
              "debug-channels.txt"
          ).write_text(
              "\n\n".join(output),
              encoding="utf-8"
          )


          print(
              "Found",
              len(output),
              "matches"
          )

          PY


          python work/debug.py


      - name: Commit debug file
        run: |

          git config --global user.name "github-actions"

          git config --global user.email "actions@github.com"

          git add debug-channels.txt

          git commit -m "Add channel debug list" || echo "No changes"

          git push
