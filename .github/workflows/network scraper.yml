name: Network Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download iptv-org playlist
        run: |
          mkdir -p work output
          curl -L https://iptv-org.github.io/iptv/index.m3u \
            -o work/master.m3u

      - name: Download iptv-org database
        run: |
          curl -L https://iptv-org.github.io/database/streams.csv \
            -o work/streams.csv

      - name: Install tools
        run: |
          python -m pip install pyyaml

      - name: Create channel filter
        run: |
          cat > work/build.py <<'PY'
          import re
          from pathlib import Path

          wanted = [
              "WABC",
              "WCBS",
              "WNBC",
              "WNYW",
              "KABC",
              "KCBS",
              "KNBC",
              "KTTV",
              "KTLA",
              "WGN",
              "WSBK"
          ]

          src = Path("work/master.m3u").read_text(errors="ignore")

          lines = src.splitlines()

          output = []
          keep = False

          for line in lines:
              if line.startswith("#EXTINF"):
                  keep = any(x.lower() in line.lower() for x in wanted)

              if keep:
                  output.append(line)

          Path("output/networks.m3u8").write_text(
              "\n".join(output),
              encoding="utf-8"
          )

          print("Created", len(output), "lines")
          PY

          python work/build.py

      - name: Commit playlist
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add output/networks.m3u8

          git commit -m "Update network playlist" || echo "No changes"

          git push
