name: Network Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download iptv-org playlist
        run: |
          mkdir -p work
          curl -L https://iptv-org.github.io/iptv/index.m3u -o work/master.m3u

      - name: Download iptv-org EPG
        run: |
          curl -L https://iptv-org.github.io/epg/guides/us.xml -o work/master.xml

      - name: Build filtered playlist and guide
        run: |
          cat > work/build.py <<'PY'
          from pathlib import Path
          import re

          wanted = [
              "WABC",
              "WCBS",
              "WNBC",
              "WNYW",
              "KABC",
              "KCBS",
              "KNBC",
              "KTTV",
              "KTLA",
              "WGN",
              "WSBK"
          ]

          groups = {
              "WABC": "Network East",
              "WCBS": "Network East",
              "WNBC": "Network East",
              "WNYW": "Network East",

              "KABC": "Network West",
              "KCBS": "Network West",
              "KNBC": "Network West",
              "KTTV": "Network West",

              "KTLA": "CW",
              "WGN": "Favorites",
              "WSBK": "Favorites"
          }

          m3u = Path("work/master.m3u").read_text(errors="ignore")

          lines = m3u.splitlines()

          playlist = ["#EXTM3U"]
          keep = False

          for line in lines:
              if line.startswith("#EXTINF"):
                  keep = False

                  for station in wanted:
                      if station.lower() in line.lower():
                          keep = True
                          line = line.replace(
                              'group-title="',
                              f'group-title="{groups[station]},'
                          )
                          break

              if keep:
                  playlist.append(line)

          Path("networks.m3u8").write_text(
              "\n".join(playlist),
              encoding="utf-8"
          )


          # Simple EPG filter
          xml = Path("work/master.xml").read_text(errors="ignore")

          matches = []

          for station in wanted:
              matches += re.findall(
                  r'<channel[^>]*id="[^"]*' + station + r'[^"]*"[\s\S]*?</channel>',
                  xml,
                  re.IGNORECASE
              )

          epg = "<tv>\n" + "\n".join(matches) + "\n</tv>"

          Path("networks.xml").write_text(
              epg,
              encoding="utf-8"
          )

          print("Playlist and guide created")

          PY

          python work/build.py

      - name: Commit files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add networks.m3u8 networks.xml

          git commit -m "Update network playlist and guide" || echo "No changes"

          git push
