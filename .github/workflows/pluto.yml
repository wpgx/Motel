name: Update Pluto CA

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone scraper and install
        run: |
          git clone https://github.com/4v3ngR/pluto_tv_scraper.git /tmp/scraper
          cd /tmp/scraper
          npm install

      - name: Run scraper
        run: |
          mkdir -p ./pluto
          echo '{"outdir":"./pluto","mapping":{"ca":"207.161.77.221"}}' > ./config.json
          node /tmp/scraper/index.js --config ./config.json --exclude-groups "^Local News$"
          ls -lh ./pluto/
          wc -l ./pluto/plutotv_ca.m3u8

      - name: Commit
        run: |
          git config user.name "pluto-bot"
          git config user.email "bot@github.com"
          git add ./pluto/plutotv_ca.m3u8 ./pluto/plutotv_ca.xml
          git diff --staged --quiet || (git commit -m "Update Pluto CA $(date -u)" && git push)
