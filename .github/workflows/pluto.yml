name: Update Pluto CA

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper and add welcome - JWT FIXED
        run: |
          echo '{"outdir":".","mapping":{"ca":"207.161.77.221"}}' > ./config.json
          # FIX: Use #main branch which has the Jan 2026 JWT fix for 401 errors
          npx -y --package=github:4v3ngR/pluto_tv_scraper#main pluto_tv_scraper --config ./config.json --exclude-groups "^Local News$" --region ca
          
          cp ./plutotv_ca.m3u8 ./plutotv_ca.tmp
          cp ./plutotv_ca.xml ./dctv.xml
          rm -f ./plutotv_ca.m3u8 ./plutotv_ca.xml
          
          # FIX 404 - force GitHub to serve .ts files
          touch .nojekyll
          
          echo "#EXTM3U" > ./dctv.m3u8
          echo '#EXTINF:-1 tvg-id="welcome" tvg-chno="1" group-title="Motel", Welcome to our motel!' >> ./dctv.m3u8
          echo 'https://motel.deecee.ca/welcome.m3u8' >> ./dctv.m3u8
          echo '' >> ./dctv.m3u8
          grep -v "^#EXTM3U" ./plutotv_ca.tmp >> ./dctv.m3u8
          rm -f ./plutotv_ca.tmp
          echo "--- First 5 lines ---"
          head -5 ./dctv.m3u8

      - name: Commit
        run: |
          git config user.name "pluto-bot"
          git config user.email "bot@github.com"
          git add ./dctv.m3u8 ./dctv.xml .nojekyll
          git rm -f ./plutotv_ca.m3u8 ./plutotv_ca.xml ./pluto/plutotv_ca.m3u8 ./pluto/plutotv_ca.xml 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Update dctv $(date -u)" && git push)
