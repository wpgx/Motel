name: Update Pluto CA
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          git clone https://github.com/4v3ngR/pluto_tv_scraper.git /tmp/scraper
          cd /tmp/scraper && npm install
      - name: Build dctv.m3u8 with Welcome Ch1
        run: |
          echo '{"outdir":".","mapping":{"ca":"207.161.77.221"}}' > ./config.json
          node /tmp/scraper/index.js --config ./config.json --exclude-groups "^Local News$"
          # backup pluto
          cp ./plutotv_ca.m3u8 ./plutotv_ca.tmp
          cp ./plutotv_ca.xml ./dctv.xml
          rm -f ./plutotv_ca.m3u8 ./plutotv_ca.xml
          touch .nojekyll
          # ALWAYS create dctv.m3u8 with Welcome as Ch 1
          printf "#EXTM3U\n" > dctv.m3u8
          printf '#EXTINF:-1 tvg-id="welcome" tvg-chno="1" group-title="Motel" tvg-logo="https://motel.deecee.ca/welcome.jpg", Welcome to our motel!\n' >> dctv.m3u8
          printf 'https://motel.deecee.ca/welcome.mp4\n\n' >> dctv.m3u8
          # append pluto channels starting at Ch 2
          grep -v "^#EXTM3U" ./plutotv_ca.tmp >> dctv.m3u8
          rm -f ./plutotv_ca.tmp
          # also fix welcome.m3u8
          printf "#EXTM3U\n#EXTINF:-1,Welcome\nhttps://motel.deecee.ca/welcome.mp4\n" > welcome.m3u8
          ls -lh dctv.m3u8 welcome.m3u8 .nojekyll
      - name: Commit
        run: |
          git config user.name "pluto-bot"
          git config user.email "bot@github.com"
          git add -A
          git add .nojekyll -f
          git rm -f ./plutotv_ca.m3u8 ./plutotv_ca.xml 2>/dev/null || true
          git commit -m "Force Welcome Ch1 with mp4" || echo "no changes"
          git push
