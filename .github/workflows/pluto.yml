name: Update Pluto CA

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create config
        run: |
          mkdir -p ./pluto
          echo '{"outdir":"./pluto","mapping":{"ca":"207.161.77.221"}}' > ./config.json
          cat ./config.json

      - name: Run Pluto Scraper
        run: |
          npx -y github:4v3ngR/pluto_tv_scraper --config ./config.json --exclude-groups "^Local News$" --region ca
          ls -lh ./pluto

      - name: Commit and push
        run: |
          git config user.name "pluto-bot"
          git config user.email "bot@github.com"
          git add ./pluto/
          git diff --staged --quiet || git commit -m "Update Pluto CA $(date -u)"
          git push
