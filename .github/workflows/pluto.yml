name: Update Pluto CA

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone scraper and install
        run: |
          git clone https://github.com/4v3ngR/pluto_tv_scraper.git /tmp/scraper
          cd /tmp/scraper
          npm install

      - name: Run scraper and rename to dctv in root
        run: |
          echo '{"outdir":".","mapping":{"ca":"207.161.77.221"}}' > ./config.json
          node /tmp/scraper/index.js --config ./config.json --exclude-groups "^Local News$"
          cp ./plutotv_ca.m3u8 ./dctv.m3u8
          cp ./plutotv_ca.xml ./dctv.xml
          rm -f ./plutotv_ca.m3u8 ./plutotv_ca.xml
          sed -i 's|https://xman.deecee.ca.*plutotv_ca.xml|https://motel.deecee.ca/dctv.xml|g' ./dctv.m3u8
          sed -i 's|http://xman.deecee.ca.*plutotv_ca.xml|https://motel.deecee.ca/dctv.xml|g' ./dctv.m3u8
          head -5 ./dctv.m3u8

      - name: Commit
        run: |
          git config user.name "pluto-bot"
          git config user.email "bot@github.com"
          git add ./dctv.m3u8 ./dctv.xml
          git rm -f ./plutotv_ca.m3u8 ./plutotv_ca.xml ./pluto/plutotv_ca.m3u8 ./pluto/plutotv_ca.xml 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Update dctv $(date -u)" && git push)
