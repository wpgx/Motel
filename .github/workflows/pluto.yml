          touch .nojekyll
          # Build welcome.m3u8 with jsDelivr URLs so .ts files actually serve
          if compgen -G "welcome*.ts" > /dev/null; then
            echo "#EXTM3U" > welcome.m3u8
            echo "#EXT-X-VERSION:3" >> welcome.m3u8
            echo "#EXT-X-TARGETDURATION:8" >> welcome.m3u8
            echo "#EXT-X-MEDIA-SEQUENCE:0" >> welcome.m3u8
            echo "#EXT-X-PLAYLIST-TYPE:VOD" >> welcome.m3u8
            for f in $(ls welcome*.ts | sort -V); do
              echo "#EXTINF:4.0," >> welcome.m3u8
              echo "https://cdn.jsdelivr.net/gh/wpgx/Motel@main/$f" >> welcome.m3u8
            done
            echo "#EXT-X-ENDLIST" >> welcome.m3u8
          fi

          # --- BUILD DCTV.M3U8 WITH CHANNEL 1 - RELATIVE PATH ---
          echo "#EXTM3U" > ./dctv.m3u8
          echo '#EXTINF:-1 tvg-id="welcome" tvg-chno="1" group-title="Motel" tvg-logo="https://motel.deecee.ca/welcome.jpg", Welcome to our motel!' >> ./dctv.m3u8
          echo 'welcome.m3u8' >> ./dctv.m3u8
          echo '' >> ./dctv.m3u8
          grep -v "^#EXTM3U" ./plutotv_ca.tmp >> ./dctv.m3u8
          rm -f ./plutotv_ca.tmp
