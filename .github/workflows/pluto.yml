name: Update Pluto CA
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          git clone https://github.com/4v3ngR/pluto_tv_scraper.git /tmp/scraper
          cd /tmp/scraper && npm install
      - name: Build
        run: |
          echo '{"outdir":".","mapping":{"ca":"207.161.77.221"}}' > ./config.json
          node /tmp/scraper/index.js --config ./config.json --exclude-groups "^Local News$"
          cp ./plutotv_ca.m3u8 ./plutotv_ca.tmp
          cp ./plutotv_ca.xml ./dctv.xml
          rm -f ./plutotv_ca.m3u8 ./plutotv_ca.xml
          touch .nojekyll
          # Build valid HLS VOD for Sparkle - MUST be on motel.deecee.ca domain
          echo "#EXTM3U" > welcome.m3u8
          echo "#EXT-X-VERSION:3" >> welcome.m3u8
          echo "#EXT-X-TARGETDURATION:10" >> welcome.m3u8
          echo "#EXT-X-MEDIA-SEQUENCE:0" >> welcome.m3u8
          for f in $(ls welcome*.ts 2>/dev/null | sort -V); do
            echo "#EXTINF:8.0," >> welcome.m3u8
            echo "https://motel.deecee.ca/$f" >> welcome.m3u8
          done
          echo "#EXT-X-ENDLIST" >> welcome.m3u8
          # Build dctv.m3u8 with Welcome Ch1 as m3u8
          echo "#EXTM3U" > dctv.m3u8
          echo '#EXTINF:-1 tvg-id="welcome" tvg-chno="1" group-title="Motel" tvg-logo="https://motel.deecee.ca/welcome.jpg", Welcome to our motel!' >> dctv.m3u8
          echo 'https://motel.deecee.ca/welcome.m3u8' >> dctv.m3u8
          echo '' >> dctv.m3u8
          grep -v "^#EXTM3U" ./plutotv_ca.tmp >> dctv.m3u8
          rm -f ./plutotv_ca.tmp
          cat welcome.m3u8
          head -5 dctv.m3u8
      - name: Commit
        run: |
          git config user.name "pluto-bot"
          git config user.email "bot@github.com"
          git add -A
          git add .nojekyll -f
          git rm -f ./plutotv_ca.m3u8 ./plutotv_ca.xml 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Welcome HLS on motel.deecee.ca domain for Sparkle" && git push)
