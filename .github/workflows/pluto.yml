name: Update Pluto CA

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone scraper and install
        run: |
          git clone https://github.com/4v3ngR/pluto_tv_scraper.git /tmp/scraper
          cd /tmp/scraper
          npm install

      - name: Run scraper and rename to dctv in root
        run: |
          echo '{"outdir":"./tmp_pluto","mapping":{"ca":"207.161.77.221"}}' > ./config.json
          node /tmp
