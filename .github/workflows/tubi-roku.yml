name: tubi-roku
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests

      - name: Build Playlists + EPG
        run: |
          python - << 'PY'
          import re, requests, pathlib
          m3u = requests.get("https://raw.githubusercontent.com/BuddyChewChew/tubi-scraper/main/tubi.m3u", headers={"User-Agent":"Mozilla/5.0"}, timeout=30).text
          pat = re.compile(r'#EXTINF:-1.*?,(.*?)\n(https://live-manifest\.production-public\.tubi\.io/live/([a-f0-9-]{36})/playlist\.m3u8)', re.MULTILINE)
          seen=set(); out=['#EXTM3U url-tvg="tubi.xml"']
          for name, url, cid in pat.findall(m3u):
              if "español" in name.lower(): continue
              if cid in seen: continue
              seen.add(cid)
              out.append(f'#EXTINF:-1 tvg-id="tubi-{cid}" group-title="Tubi",{name.strip()}\n{url}')
          pathlib.Path("tubi.m3u").write_text("\n".join(out), encoding="utf-8")

          j=requests.get("https://therokuchannel.roku.com/api/v2/content/linear-channels?expand=liveFeed&limit=500", headers={"Origin":"https://therokuchannel.roku.com","User-Agent":"Mozilla/5.0"}, timeout=30).json()
          out2=['#EXTM3U url-tvg="roku.xml"']
          for c in j.get("items",[]):
              url=c.get("liveFeed",{}).get("hlsUrl")
              if not url: continue
              name=c.get("title","Roku")
              if "español" in name.lower(): continue
              out2.append(f'#EXTINF:-1 tvg-id="roku-{c["id"]}" group-title="Roku",{name}\n{url}')
          pathlib.Path("roku.m3u").write_text("\n".join(out2), encoding="utf-8")

          body = lambda p: pathlib.Path(p).read_text(encoding="utf-8").replace('#EXTM3U url-tvg="tubi.xml"\n',"").replace('#EXTM3U url-tvg="roku.xml"\n',"").replace("#EXTM3U\n","").strip()
          pathlib.Path("all.m3u").write_text('#EXTM3U url-tvg="all.xml"\n'+body("tubi.m3u")+"\n"+body("roku.m3u"), encoding="utf-8")

          try:
              epg = requests.get("https://raw.githubusercontent.com/BuddyChewChew/tubi-scraper/main/tubi_epg.xml", timeout=30).text
              pathlib.Path("tubi.xml").write_text(epg, encoding="utf-8")
              pathlib.Path("all.xml").write_text(epg, encoding="utf-8")
              pathlib.Path("roku.xml").write_text("<tv></tv>", encoding="utf-8")
          except Exception as e: print(e)
          PY

      - name: Publish
        run: |
          mkdir -p docs
          cp *.m3u docs/
          cp *.xml docs/ 2>/dev/null || true
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update"
          file_pattern: "docs/* *.m3u *.xml"
